<style>
:root{
  --paper:#F6F5F2; --card:#FFFFFF; --ink:#16181D; --ink2:#5C616A; --ink3:#8B9099;
  --rule:#DFDCD5; --rule2:#C9C5BC;
  --up:#17795E; --down:#B23A2E; --accent:#1F4E8C; --signal:#C0800C;
  --tint:#EFEDE7;
  --disp:"Segoe UI Variable Display",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#13141A; --card:#1B1D24; --ink:#E9E7E2; --ink2:#A0A5AE; --ink3:#767C86;
    --rule:#2B2E36; --rule2:#3A3E48;
    --up:#3BB68F; --down:#E0685A; --accent:#77AEEC; --signal:#E5A93A;
    --tint:#22242C;
  }
}
/* explicit overrides so the Theme button beats the OS setting both ways */
:root[data-theme="dark"]{
  --paper:#13141A; --card:#1B1D24; --ink:#E9E7E2; --ink2:#A0A5AE; --ink3:#767C86;
  --rule:#2B2E36; --rule2:#3A3E48;
  --up:#3BB68F; --down:#E0685A; --accent:#77AEEC; --signal:#E5A93A;
  --tint:#22242C;
}
:root[data-theme="light"]{
  --paper:#F6F5F2; --card:#FFFFFF; --ink:#16181D; --ink2:#5C616A; --ink3:#8B9099;
  --rule:#DFDCD5; --rule2:#C9C5BC;
  --up:#17795E; --down:#B23A2E; --accent:#1F4E8C; --signal:#C0800C;
  --tint:#EFEDE7;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;font-size:16px}
a{color:var(--accent)}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}

/* ---- masthead ---- */
header.top{border-bottom:1px solid var(--rule);padding:44px 0 28px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,6vw,50px);line-height:1.02;letter-spacing:-.025em;margin:0 0 14px}
h1 em{font-style:normal;color:var(--signal)}
.lede{max-width:56ch;color:var(--ink2);margin:0;font-size:16px}

/* ---- controls ---- */
.controls{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 0}
.searchrow{display:flex;gap:10px;align-items:center}
#q{flex:1;min-width:0;font-family:var(--mono);font-size:14px;padding:11px 13px;border:1px solid var(--rule2);border-radius:2px;background:var(--card);color:var(--ink)}
#q::placeholder{color:var(--ink3)}
#q:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.count{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:5px 10px;border:1px solid var(--rule2);background:transparent;color:var(--ink2);border-radius:2px;cursor:pointer}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---- sections ---- */
section{padding:34px 0 6px;border-bottom:1px solid var(--rule)}
.sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 4px}
.sechead h2{font-family:var(--disp);font-weight:500;font-size:21px;letter-spacing:-.01em;margin:0}
.sechead .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.secnote{color:var(--ink2);font-size:14px;margin:0 0 18px;max-width:62ch}

/* ---- entries ---- */
.entry{display:grid;grid-template-columns:1fr;gap:14px;padding:18px 0;border-top:1px solid var(--rule)}
.entry.haschart{grid-template-columns:minmax(0,1fr) 344px}
@media (max-width:760px){.entry.haschart{grid-template-columns:1fr}}
.term{font-family:var(--disp);font-weight:500;font-size:18px;letter-spacing:-.01em;margin:0 0 6px}
.term .abbr{font-family:var(--mono);font-size:12px;color:var(--ink3);font-weight:400;margin-left:7px}
.def{margin:0 0 9px;color:var(--ink)}
.ex{font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--ink2);border-left:2px solid var(--rule2);padding:2px 0 2px 11px;border-radius:0;margin:0}
.ex b{font-weight:500;color:var(--ink)}
.warn{border-left-color:var(--down)}
.warn b{color:var(--down)}
figure{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:9px 9px 7px}
figure svg{display:block;width:100%;height:auto}
figcaption{font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--ink3);margin-top:6px;text-align:center}

/* ---- svg text ---- */
.lb{font-family:var(--mono);font-size:9.5px;fill:var(--ink2)}
.lbk{font-family:var(--mono);font-size:9.5px;fill:var(--ink)}
.lba{font-family:var(--mono);font-size:9.5px;fill:var(--accent)}
.lbs{font-family:var(--mono);font-size:9.5px;fill:var(--signal)}
.lbd{font-family:var(--mono);font-size:9.5px;fill:var(--down)}
.lbu{font-family:var(--mono);font-size:9.5px;fill:var(--up)}

.empty{padding:60px 0;text-align:center;color:var(--ink2);font-family:var(--mono);font-size:13px}
footer{padding:30px 0 60px;color:var(--ink3);font-family:var(--mono);font-size:11.5px;line-height:1.7}

[hidden]{display:none!important}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule)}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:13px 2px;margin-right:26px;font-family:var(--disp);font-size:15px;font-weight:500;color:var(--ink3);cursor:pointer;letter-spacing:-.01em}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:7px;font-weight:400}

.btn{font-family:var(--mono);font-size:12px;padding:8px 12px;border:1px solid var(--rule2);background:var(--card);color:var(--ink);border-radius:2px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ink3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.dgr{color:var(--down);border-color:var(--down)}
.btn.ok{color:var(--up);border-color:var(--up)}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:16px 0 0}
.toolbar .sep{flex:1;min-width:0}
select.btn{padding:8px 8px}

.stats{font-family:var(--mono);font-size:11.5px;color:var(--ink3);padding:14px 0 2px;line-height:1.7;border-bottom:1px solid var(--rule)}
.stats b{color:var(--ink);font-weight:500}
.banner{border:1px solid var(--signal);background:var(--card);padding:13px 14px;margin:16px 0 0;border-radius:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner p{margin:0;flex:1;min-width:200px;font-size:14px}
.note{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin:10px 0 0}
.note.bad{color:var(--down)}

.scard{border-top:1px solid var(--rule);padding:16px 0}
.scard:first-child{border-top:0}
.shead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.shead h3{font-family:var(--disp);font-weight:500;font-size:17px;margin:0;letter-spacing:-.01em;flex:1;min-width:180px}
.by{font-family:var(--mono);font-size:12px;color:var(--ink3);display:block;margin-top:3px;font-weight:400}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:2px;border:1px solid;white-space:nowrap}
.ev-untested{color:var(--ink3);border-color:var(--rule2)}
.ev-backtested{color:var(--accent);border-color:var(--accent)}
.ev-forward{color:var(--signal);border-color:var(--signal)}
.ev-live{color:var(--up);border-color:var(--up)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--ink2);background:var(--tint);padding:3px 7px;border-radius:2px}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:9px;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.facts span b{color:var(--ink3);font-weight:400}
.sbody{margin-top:14px;border-left:2px solid var(--rule2);padding-left:13px}
.srow{margin:0 0 11px}
.srow:last-child{margin-bottom:0}
.srow dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.srow dd{margin:0;font-size:14.5px;white-space:pre-wrap}
.srow dd a.tref{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
.acts{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}

.form{border:1px solid var(--accent);background:var(--card);padding:16px;margin:18px 0 0;border-radius:2px}
.form h3{font-family:var(--disp);font-weight:500;font-size:16px;margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:680px){.fgrid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.f input,.f textarea,.f select{font-family:var(--body);font-size:14px;padding:8px 9px;border:1px solid var(--rule2);background:var(--paper);color:var(--ink);border-radius:2px;width:100%}
.f textarea{min-height:62px;resize:vertical;line-height:1.5}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.stable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:8px}
.stable th{text-align:left;font-weight:500;color:var(--ink3);border-bottom:1px solid var(--rule2);padding:8px 8px 8px 0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.stable td{border-bottom:1px solid var(--rule);padding:9px 8px 9px 0;vertical-align:top}
.stable tr{cursor:pointer}
.stable tr:hover td{background:var(--tint)}
</style>

<script>
var CAT = [
  ["basics","The basics","Price, the venue, and what you're actually paying to play."],
  ["orders","Order types","How you tell the market what you want. Getting these wrong is the most expensive beginner mistake."],
  ["pos","Positions","Direction, size, and how you get in and out."],
  ["lev","Leverage & products","Futures, options, FX, crypto perps — and the borrowed money that makes them dangerous."],
  ["risk","Risk management","The section that decides whether you're still here in a year."],
  ["pa","Price action","Reading the chart itself, without indicators."],
  ["ind","Indicators","Maths drawn on top of price. All of it is derived from price — none of it knows the future."],
  ["ict","ICT / smart money","The vocabulary from the ICT and SMC material. Useful language, unproven framework — see the note at the end of the section."],
  ["bt","Backtesting & stats","How you find out whether an edge is real or whether you just fooled yourself."],
  ["style","Trading styles","Timeframes and approaches, from microseconds to decades."],
  ["psy","Psychology","The failure modes that show up even when the strategy is fine."],
  ["macro","Macro & fundamentals","The scheduled events that move everything at once."],
  ["slang","Slang","What people actually say online."]
];
CAT.push(
["fut","Futures mechanics","The contract rules that decide what a point is worth, when you get forced out, and why your chart has a seam in it."],
["opt","Options & the greeks","Contracts on contracts. The greeks are just the five ways an option's price responds to the world changing."],
["fx","Forex","The biggest market and the one with the most retail wreckage. Different units, same maths."],
["cry","Crypto & DeFi","Twenty-four hours a day, no circuit breakers, and leverage available to anyone with a wallet."],
["exec","Execution & market structure","What happens between clicking buy and owning the thing. Where retail quietly pays."],
["port","Portfolio & allocation","Sizing across several positions at once. The one area where the maths reliably helps without needing a forecast."],
["stat","Statistics & evidence","The machinery for telling a real edge from a lucky one. The hardest and most valuable section here."],
["prop","Prop firms & funded accounts","The dominant retail on-ramp, and a business model worth understanding before you pay for an evaluation."],
["cost","Costs, tax & admin","The unglamorous drag that decides whether a small edge survives. Australian context where it differs."],
["data","Data & instruments","Where the numbers come from and the ways they quietly lie to a backtest."],
["auto","Algo & automation","Turning rules into code, and the failure modes that only appear once a machine is pressing the buttons."],
["scam","Red flags","Patterns that reliably precede losing money to someone else on purpose."],
["cpat","Candlestick patterns","Single and multi-bar shapes. Widely taught, weakly evidenced individually — useful as description, dangerous as a signal on their own."],
["chpat","Chart patterns","The larger formations. Same caveat, larger timeframe, and the measured-move targets are the testable part."],
["fib","Fibonacci, waves & harmonics","Ratio-based frameworks. Enormous following, thin evidence. Included because you will meet the vocabulary constantly."],
["ind2","Indicators in detail","The specific ones by name, what each actually computes, and where each breaks."],
["eq","Equities","Shares, the things that happen to them, and the mechanics of shorting."],
["rates","Bonds, rates & central banks","The instrument class that sets the price of everything else."],
["econ","Economic indicators","The scheduled numbers, what each measures, and which ones actually move markets."],
["etf","ETFs & funds","Wrappers. Cheap, convenient, and each with a structural quirk worth knowing before you hold one."],
["factor","Factors & portfolio theory","The academic layer. Where the documented risk premia actually live."],
["perf","Performance metrics","How a track record gets measured, and which measures are gameable."],
["part","Market participants","Who is on the other side, and what each of them is optimising for."],
["reg","Regulation & jurisdictions","The rules that decide what you are allowed to do and what protection you have."],
["au","Australian market","ASX mechanics, local tax vocabulary, and trading US hours from Perth."],
["ops","Trading operations","The unglamorous business of running this as a process rather than a hobby."],

<script>
/* ====================================================================
   STORAGE MIGRATION — tg.* keys become tape.*, read once and rewritten
   so nothing saved under the old name is lost.
   ==================================================================== */
(function(){
if(typeof window==="undefined") return;
try{
  if(localStorage.getItem("tape.migrated")) return;
  var moved=0;
  for(var i=localStorage.length-1;i>=0;i--){
    var k=localStorage.key(i);
    if(!k||k.indexOf("tg.")!==0) continue;
    var nk="tape."+k.slice(3);
    if(localStorage.getItem(nk)===null){ localStorage.setItem(nk, localStorage.getItem(k)); moved++; }
  }
  localStorage.setItem("tape.migrated","1");
  window.__migrated=moved;
}catch(e){}
})();
</script>


<script>
var W=320,H=150;
function svgFor(v){
  if(!v) return "";
  if(v.k==="raw") return v.svg;
  if(v.k==="e") return equitySvg(v);
  return candleSvg(v);
}
function col(c){
  return {a:"var(--accent)",s:"var(--signal)",u:"var(--up)",d:"var(--down)",k:"var(--ink)",g:"var(--ink3)",r:"var(--rule2)"}[c||"g"];
}
function cls(c){
  return {a:"lba",s:"lbs",u:"lbu",d:"lbd",k:"lbk"}[c||""]||"lb";
}
function candleSvg(v){
  var d=v.d,n=d.length,pad=8,top=10,vh=v.vol?26:0,bot=6+vh;
  var ps=[];
  d.forEach(function(c){ps.push(c[1],c[2]);});
  (v.hl||[]).forEach(function(o){ps.push(o.p);});
  (v.bx||[]).forEach(function(o){ps.push(o.p0,o.p1);});
  (v.zn||[]).forEach(function(o){ps.push(o.p0,o.p1);});
  (v.pl||[]).forEach(function(o){o.pts.forEach(function(p){ps.push(p[1]);});});
  (v.mk||[]).forEach(function(o){ps.push(o.p);});
  var lo=Math.min.apply(null,ps),hi=Math.max.apply(null,ps),rg=(hi-lo)||1;
  lo-=rg*0.14; hi+=rg*0.14; rg=hi-lo;
  var plotH=H-top-bot;
  function Y(p){return top+(hi-p)/rg*plotH;}
  var step=(W-pad*2)/n, cw=Math.min(step*0.62,13);
  function X(i){return pad+step*(i+0.5);}
  var s="";
  (v.zn||[]).forEach(function(o){
    s+='<rect x="'+pad+'" y="'+Y(Math.max(o.p0,o.p1)).toFixed(1)+'" width="'+(W-pad*2)+'" height="'+Math.abs(Y(o.p0)-Y(o.p1)).toFixed(1)+'" fill="'+col(o.c)+'" opacity="0.09"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+(W-pad-2)+'" y="'+(Y(Math.max(o.p0,o.p1))+10).toFixed(1)+'" text-anchor="end">'+o.t+'</text>';
  });
  (v.bx||[]).forEach(function(o){
    var x0=X(o.i0)-cw/2-2,x1=X(o.i1)+cw/2+2,y0=Y(Math.max(o.p0,o.p1)),y1=Y(Math.min(o.p0,o.p1));
    s+='<rect x="'+x0.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+(x1-x0).toFixed(1)+'" height="'+Math.max(y1-y0,2).toFixed(1)+'" fill="'+col(o.c)+'" opacity="0.15" stroke="'+col(o.c)+'" stroke-width="0.6"/>';
    if(o.t){
      var ty=o.below?y1+9:y0-3;
      s+='<text class="'+cls(o.c)+'" x="'+((x0+x1)/2).toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle">'+o.t+'</text>';
    }
  });
  (v.hl||[]).forEach(function(o){
    s+='<line x1="'+pad+'" y1="'+Y(o.p).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+Y(o.p).toFixed(1)+'" stroke="'+col(o.c)+'" stroke-width="0.8"'+(o.solid?"":' stroke-dasharray="3 3"')+'/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+(o.la?pad+2:W-pad-2)+'" y="'+(Y(o.p)+(o.below?9:-3)).toFixed(1)+'" text-anchor="'+(o.la?"start":"end")+'">'+o.t+'</text>';
  });
  if(v.vol){
    var mv=Math.max.apply(null,v.vol),vy=H-4;
    v.vol.forEach(function(u,i){
      var h=u/mv*(vh-6);
      s+='<rect x="'+(X(i)-cw/2).toFixed(1)+'" y="'+(vy-h).toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+(d[i][3]>=d[i][0]?col("u"):col("d"))+'" opacity="0.4"/>';
    });
  }
  d.forEach(function(c,i){
    var up=c[3]>=c[0],cc=up?col("u"):col("d"),x=X(i);
    s+='<line x1="'+x.toFixed(1)+'" y1="'+Y(c[1]).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+Y(c[2]).toFixed(1)+'" stroke="'+cc+'" stroke-width="1"/>';
    var y0=Y(Math.max(c[0],c[3])),hgt=Math.max(Math.abs(Y(c[0])-Y(c[3])),1.2);
    s+='<rect x="'+(x-cw/2).toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="'+(up?"none":cc)+'" stroke="'+cc+'" stroke-width="1"/>';
  });
  (v.pl||[]).forEach(function(o){
    var p=o.pts.map(function(q){return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1);}).join(" ");
    s+='<polyline points="'+p+'" fill="none" stroke="'+col(o.c)+'" stroke-width="'+(o.w||1.2)+'"'+(o.dash?' stroke-dasharray="3 3"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+X(o.pts[o.pts.length-1][0]).toFixed(1)+'" y="'+(Y(o.pts[o.pts.length-1][1])-4).toFixed(1)+'" text-anchor="end">'+o.t+'</text>';
  });
  (v.mk||[]).forEach(function(o){
    var x=X(o.i),y=Y(o.p);
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.4" fill="'+col(o.c)+'"/>';
    if(o.t){
      var ax=o.right?"start":(o.left?"end":"middle");
      var tx=o.right?x+5:(o.left?x-5:x);
      s+='<text class="'+cls(o.c)+'" x="'+tx.toFixed(1)+'" y="'+(y+(o.below?10:-6)).toFixed(1)+'" text-anchor="'+ax+'">'+o.t+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="chart">'+s+'</svg>';
}
function equitySvg(v){
  var pad=10,top=12,bot=10,ps=[];
  v.s.forEach(function(o){o.v.forEach(function(p){ps.push(p);});});
  var lo=Math.min.apply(null,ps),hi=Math.max.apply(null,ps),rg=(hi-lo)||1;
  lo-=rg*0.12;hi+=rg*0.16;rg=hi-lo;
  var plotH=H-top-bot,n=v.s[0].v.length;
  function Y(p){return top+(hi-p)/rg*plotH;}
  function X(i){return pad+(W-pad*2)*(i/(n-1));}
  var s='<line x1="'+pad+'" y1="'+Y(v.base||0).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+Y(v.base||0).toFixed(1)+'" stroke="var(--rule2)" stroke-width="0.7" stroke-dasharray="3 3"/>';
  (v.zn||[]).forEach(function(o){
    s+='<rect x="'+X(o.i0).toFixed(1)+'" y="'+top+'" width="'+(X(o.i1)-X(o.i0)).toFixed(1)+'" height="'+plotH+'" fill="'+col(o.c)+'" opacity="0.08"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+((X(o.i0)+X(o.i1))/2).toFixed(1)+'" y="'+(top+9)+'" text-anchor="middle">'+o.t+'</text>';
  });
  v.s.forEach(function(o){
    var p=o.v.map(function(q,i){return X(i).toFixed(1)+","+Y(q).toFixed(1);}).join(" ");
    s+='<polyline points="'+p+'" fill="none" stroke="'+col(o.c)+'" stroke-width="1.5"'+(o.dash?' stroke-dasharray="3 3"':'')+' stroke-linejoin="round"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+(W-pad-2)+'" y="'+(Y(o.v[o.v.length-1])+(o.below?9:-4)).toFixed(1)+'" text-anchor="end">'+o.t+'</text>';
  });
  (v.mk||[]).forEach(function(o){
    s+='<circle cx="'+X(o.i).toFixed(1)+'" cy="'+Y(o.p).toFixed(1)+'" r="2.4" fill="'+col(o.c)+'"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+X(o.i).toFixed(1)+'" y="'+(Y(o.p)+(o.below?10:-6)).toFixed(1)+'" text-anchor="middle">'+o.t+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="equity curve">'+s+'</svg>';
}
</script>

{t:"Margin call",c:"lev",d:"The broker demanding more funds because your equity fell below maintenance requirements.",e:"Add money or positions get closed — often at the worst possible price."},
{t:"Liquidation",c:"lev",d:"The broker force-closing your positions at market because you ran out of collateral. You don't get a say in the price.",e:"Standard in crypto perps at high leverage — a 2% wick can wipe a 50× position."},
{t:"Futures",c:"lev",d:"A standardised contract to buy or sell an asset at a set price on a set date. Traded on an exchange, centrally cleared.",e:"MNQ (Micro Nasdaq), ES (S&P), CL (crude oil), GC (gold)."},
{t:"Micro / mini",c:"lev",d:"Smaller-sized versions of a futures contract, built so smaller accounts can size properly.",e:"MNQ is one-tenth of NQ. $2 per point instead of $20."},
{t:"Rollover",c:"lev",d:"Moving from an expiring contract month into the next one.",e:"September rolls to December quarterly. Charts jump at the roll — mind your backtest data."},
{t:"Contango / backwardation",c:"lev",d:"Futures trading above spot (contango) or below it (backwardation). Storage and carry costs drive it.",e:"Oil futures go into steep contango when storage is scarce and nobody wants delivery."},
{t:"CFD",c:"lev",d:"Contract For Difference. You bet on the price move without owning anything. Banned for US retail; common in Australia and Europe.",e:"Convenient, heavily leveraged, and you're trading against the broker's book rather than an exchange."},
{t:"Perpetual (perp)",c:"lev",d:"A crypto futures contract with no expiry date, tethered to spot by a funding rate.",e:"BTCUSDT perp. No rollover, but you pay or receive funding continuously."},
{t:"Funding rate",c:"lev",d:"A periodic payment between longs and shorts on a perp that pulls its price back toward spot.",e:"When everyone is long, longs pay shorts every 8 hours. Crowded trades cost you rent."},
{t:"Options",c:"lev",d:"The right, but not the obligation, to buy (call) or sell (put) at a set strike price before expiry.",e:"Buy a $200 AAPL call for $3.50 ($350 per contract). Above $203.50 at expiry you profit; below $200 the contract expires worthless."},
{t:"Strike / premium",c:"lev",d:"The price the option converts at, and what you pay for the option itself.",e:"Strike $200, premium $3.50. The premium is your maximum loss as a buyer."},
{t:"Theta / IV",c:"lev",d:"Theta is time decay — options lose value every day price sits still. IV is implied volatility, the market's expectation of future movement priced into the option.",e:"Buying options before earnings often loses even when you get direction right, because IV collapses afterwards."},
{t:"Forex pair",c:"lev",d:"Two currencies quoted against each other. You're always long one and short the other.",e:"EURUSD, AUDUSD, GBPJPY."},
{t:"Pip",c:"lev",d:"The standard increment on most FX pairs — the fourth decimal place.",e:"1.0850 → 1.0851 is one pip. On a standard lot that's $10."},
{t:"Lot",c:"lev",d:"FX position size. Standard = 100,000 units, mini = 10,000, micro = 1,000.",e:"Micro lots exist so a $500 account can risk 1% properly instead of 40%."},
{t:"Swap",c:"lev",d:"The overnight financing charge for holding a leveraged position past the daily rollover.",e:"Small per night, meaningful over a three-week swing trade."}
);
</script>

<script>
D.push(
{t:"R",c:"risk",d:"One unit of risk — what you lose if the stop hits. Everything else gets measured in multiples of it, so results compare across instruments and account sizes.",e:"Risking $50 per trade: a +$150 winner is +3R, a stop-out is −1R."},
{t:"Risk:reward",c:"risk",d:"Potential gain divided by potential loss, measured before you enter.",e:"Risk 20 points to make 60 = 1:3. At 1:3 you only need to be right about 35% of the time to break even.",v:{k:"c",d:[[100,100.5,98,99],[99,100,96,97],[97,98,94.2,95],[95,96,93.5,94],[94,95,92,93]],bx:[{i0:0,i1:4,p0:100,p1:102,c:"d",t:"risk = 1R (20 pts)"},{i0:0,i1:4,p0:100,p1:94,c:"u",t:"reward = 3R (60 pts)",below:true}],hl:[{p:100,t:"entry",c:"k",solid:true,la:true}]},cap:"Red is what you're paying for the chance at green. Measure it before entering, never after."},
{t:"Risk per trade",c:"risk",d:"The fixed percentage of your account you're willing to lose on any single idea. Usually 0.5–2%.",e:"1% of $5,000 = $50. It doesn't change because a setup looks especially good — every setup looks good at the time."},
{t:"Position sizing",c:"risk",d:"Working backwards from your risk limit and stop distance to the number of contracts. This is the calculation that keeps you solvent.",e:"$50 risk, 20-point stop, $2 per point → 1 contract. If the maths says 0.6 contracts, the trade is too big for the account and you skip it.",v:{k:"raw",svg:'<svg viewBox="0 0 320 150" role="img" aria-label="position sizing formula"><rect x="8" y="8" width="304" height="30" fill="var(--tint)" stroke="var(--rule2)" stroke-width="0.6"/><text class="lb" x="16" y="21">1 · RISK BUDGET</text><text class="lbk" x="16" y="33">$5,000 account × 1% = $50 max loss</text><rect x="8" y="44" width="304" height="30" fill="var(--tint)" stroke="var(--rule2)" stroke-width="0.6"/><text class="lb" x="16" y="57">2 · RISK PER CONTRACT</text><text class="lbk" x="16" y="69">20 pt stop × $2 per point = $40</text><rect x="8" y="80" width="304" height="34" fill="var(--accent)" opacity="0.12"/><rect x="8" y="80" width="304" height="34" fill="none" stroke="var(--accent)" stroke-width="0.8"/><text class="lba" x="16" y="93">3 · SIZE</text><text class="lba" x="16" y="106">$50 ÷ $40 = 1 contract</text><text class="lbd" x="16" y="130">Round DOWN, always. 0.6 contracts means skip the trade.</text><text class="lb" x="16" y="143">Never round up to \u201cmake it worth it\u201d.</text></svg>'},cap:"Three lines. Do them in this order, every time, before you click."},
{t:"Win rate",c:"risk",d:"The percentage of trades that are winners. Almost meaningless on its own — it only matters alongside your average win and average loss.",e:"A 90% win rate that gives back everything on the tenth trade is a losing system."},
{t:"Expectancy",c:"risk",d:"The average amount you make per trade over a large sample. The single number that tells you whether a system is worth trading.",e:"40% win rate at 1:3 → (0.4 × $150) − (0.6 × $50) = +$30 per trade. You lose 6 times in 10 and still make money.",v:{k:"e",base:0,s:[{v:[0,-1,-2,1,0,-1,-2,1,0,3,2,1,4,3,6,5,4,7,6,9],c:"a",t:"+9R over 20 trades"}],mk:[{i:6,p:-2,t:"4 losses in 5",below:true,c:"d"}]},cap:"Equity in R. Losing streaks are normal; the curve still climbs because winners are 3× the size."},
{t:"Profit factor",c:"risk",d:"Gross profit divided by gross loss. Above 1.0 is profitable; above 1.5 is solid; above 3 in a backtest usually means a bug.",e:"$8,000 won ÷ $5,000 lost = 1.6."},
{t:"Drawdown",c:"risk",d:"The fall from an equity peak to the following trough. Max drawdown is the worst one on record — the number that tells you whether you could actually sit through this system.",e:"Account peaks at $12,000, falls to $9,000 → a 25% drawdown. Every strategy has one; the question is whether you'd still be pressing buttons at the bottom of it.",v:{k:"e",base:100,s:[{v:[100,108,116,131,124,113,104,97,106,118,129,141],c:"a"}],mk:[{i:3,p:131,t:"peak"},{i:7,p:97,t:"trough — 26% drawdown",below:true,c:"d"}]},cap:"Same system, same year. The 26% dip is where most people quit."},
{t:"Risk of ruin",c:"risk",d:"The probability of losing enough of the account that recovery is impractical. Rises brutally fast with position size.",e:"With no genuine edge and realistic costs at 10% risk per trade, roughly 82% of accounts are wiped out — while about 0.8% still finish above +500% on luck alone."},
{t:"Kelly criterion",c:"risk",d:"A formula for the mathematically optimal bet size given your edge. Correct in theory, unbearable in practice — the swings are enormous.",e:"Almost everyone trades quarter-Kelly or half-Kelly. Full Kelly assumes you know your edge exactly, which you don't."},
{t:"Sharpe ratio",c:"risk",d:"Return per unit of volatility. Measures how smooth the ride was, not just where it ended.",e:"Above 1 is decent. Above 2 in a retail backtest is usually a sign of look-ahead bias, not genius."},
{t:"Portfolio heat",c:"risk",d:"Total risk open across every position at once.",e:"Five trades at 1% each = 5% heat. If they're all correlated, it's really one 5% trade."},
{t:"Correlation",c:"risk",d:"How much two instruments move together. Correlated positions are the same bet wearing different names.",e:"Long MNQ and long ES at 1% each isn't 2 trades at 1% — it's one trade at 2%, because they're ~0.95 correlated."},
{t:"Recovery maths",c:"risk",d:"Losses and the gains needed to undo them are not symmetrical. The deeper the hole, the steeper the climb out.",e:"−10% needs +11% back. −50% needs +100%. −90% needs +900%. This is the whole argument for small position sizes."}
);
</script>

<script>
D.push(
{t:"Candlestick",c:"pa",d:"One bar showing four prices for a period: open, high, low, close. The body is open-to-close, the wicks are the extremes price reached and gave back.",e:"A long lower wick means sellers pushed price down and buyers rejected it before the close.",v:{k:"c",d:[[100,104,98,103],[103,112,101,110],[110,113,105,107]],bx:[{i0:1,i1:1,p0:103,p1:110,c:"a",t:"body = open to close"}],mk:[{i:1,p:112,t:"high (upper wick)",c:"g"},{i:1,p:101,t:"low (lower wick)",below:true,c:"g"}]},cap:"Green = closed above open. Hollow body, coloured outline is the same information."},
{t:"Timeframe",c:"pa",d:"How much time each candle represents. Higher timeframes set context, lower timeframes give precision on entries.",e:"Daily for bias, 15-minute for the level, 5-minute for the trigger. Not three conflicting opinions — one nested decision."},
{t:"Support",c:"pa",d:"A price area where buyers have repeatedly stepped in. Not a line, a zone — and it gets weaker each time it's tested.",e:"Price bounces off 23,200 three times, so that's where resting buy interest sits.",v:{k:"c",d:[[110,111,104,105],[105,106,99,100],[100,101,95.2,97],[97,99,96,98],[98,99,95.1,96.5],[96.5,100,95.3,99],[99,103,98,102],[102,106,101,105]],hl:[{p:95.1,t:"support zone",c:"a",la:true,below:true}]},cap:"Three touches, three bounces. The fourth test is the one that usually breaks."},
{t:"Resistance",c:"pa",d:"A price area where sellers have repeatedly stepped in. The mirror image of support.",e:"23,600 rejected price twice — until it doesn't, and it flips to support.",v:{k:"c",d:[[90,96,89,95],[95,100,94,99],[99,104.8,98,101],[101,103,99,100],[100,104.9,99,101],[101,102,97,98],[98,99,93,94],[94,95,90,91]],hl:[{p:104.9,t:"resistance zone",c:"a"}]}},
{t:"Trend",c:"pa",d:"A sustained direction, defined structurally rather than by feel. An uptrend makes higher highs and higher lows; a downtrend makes lower highs and lower lows.",e:"Until a higher low is broken, an uptrend is intact — no matter how overextended it looks.",v:{k:"c",d:[[90,94,89,93],[93,98,92,97],[97,99,93,94],[94,98,93,97],[97,104,96,103],[103,105,99,100],[100,104,99,103],[103,110,102,109]],mk:[{i:1,p:98,t:"HH",c:"u"},{i:3,p:93,t:"HL",below:true,c:"u"},{i:4,p:104,t:"HH",c:"u"},{i:5,p:99,t:"HL",below:true,c:"u"}]},cap:"HH = higher high, HL = higher low. Structure, not vibes."},
{t:"Range",c:"pa",d:"Sideways price action between a definable high and low. Most of the time, markets are in one.",e:"23,300 to 23,450 for three sessions. Range strategies fade the edges; trend strategies get chopped to pieces.",v:{k:"c",d:[[100,104,99,101],[101,103,96.2,97],[97,98,96.1,97],[97,103.8,96,103],[103,104,99,100],[100,101,96.3,97],[97,103.9,96.5,103],[103,104,100,101]],hl:[{p:104,t:"range high",c:"a"},{p:96,t:"range low",c:"a",la:true,below:true}]}},
{t:"Breakout",c:"pa",d:"Price leaving a range or level with conviction — ideally with a body close beyond it and expanding volume.",e:"A close above 23,450 on triple average volume. A wick above it is not a breakout.",v:{k:"c",d:[[100,103,97,98],[98,103,97,102],[102,103,98,99],[99,103,98,102],[102,103.2,100,103],[103,110,102.5,109],[109,113,107,112],[112,116,110,115]],hl:[{p:103.2,t:"range high",c:"a"}],mk:[{i:5,p:110,t:"body closes above",c:"u"}]}},
{t:"Fakeout",c:"pa",d:"A break that immediately reverses, trapping everyone who chased it. Extremely common at obvious levels, because that's where the stops are.",e:"Price wicks 5 points above the high, closes back inside, then travels 80 points the other way.",v:{k:"c",d:[[100,103,97,98],[98,103,97,102],[102,103.1,99,100],[100,107,99.5,101],[101,102,96,97],[97,98,92,93],[93,94,89,90],[90,92,87,88]],hl:[{p:103.1,t:"range high",c:"a"}],mk:[{i:3,p:107,t:"wick out, close back in",c:"d"}]},cap:"The candle that breaks out closes back inside the range. That close is the tell."},
{t:"Pullback",c:"pa",d:"A temporary counter-trend move inside a larger trend. The main way to enter without chasing.",e:"Uptrend dips into the 50 EMA for three candles, then continues. Distinguishing this from a reversal is the hard part — you only know afterwards.",v:{k:"c",d:[[90,95,89,94],[94,99,93,98],[98,103,97,102],[102,103,99,100],[100,101,97,98],[98,99,96,97],[97,102,96,101],[101,107,100,106]],mk:[{i:5,p:96,t:"pullback",below:true,c:"a"}]}},
{t:"Reversal",c:"pa",d:"A genuine change of trend direction, confirmed by structure breaking — not by a single strong candle.",e:"An uptrend making its first lower low. Everything before that is a pullback with an opinion."},
{t:"Gap",c:"pa",d:"Price opening away from the previous close, leaving untraded space on the chart.",e:"Nasdaq closes at 23,400 Friday and opens at 23,550 Monday. Anyone short over the weekend with no stop just found out.",v:{k:"c",d:[[100,103,99,102],[102,104,101,103],[103,105,102,104],[112,116,111,115],[115,118,113,117],[117,119,114,116]],bx:[{i0:2,i1:3,p0:105,p1:111,c:"s",t:"gap"}]},cap:"No trading happened in that band. A stop inside it fills on the other side."},
{t:"Doji",c:"pa",d:"A candle that opens and closes at nearly the same price. Indecision — buyers and sellers finished level.",e:"Meaningful at the end of an extended run; meaningless in the middle of chop.",v:{k:"c",d:[[96,100,95,99],[99,103,95,99.2],[99,101,95,96]],mk:[{i:1,p:103,t:"open ≈ close",c:"a"}]}},
{t:"Hammer",c:"pa",d:"A small body with a long lower wick. Sellers drove price down and were completely rejected before the close.",e:"Most useful at a support level after a run down, not floating in the middle of a range.",v:{k:"c",d:[[104,105,100,101],[101,102,94,101.5],[101.5,106,101,105]],mk:[{i:1,p:94,t:"rejected",below:true,c:"u"}]}},
{t:"Engulfing",c:"pa",d:"A candle whose body completely covers the previous candle's body, in the opposite direction.",e:"A bullish engulfing at support says the sellers who controlled the last candle were overwhelmed in this one.",v:{k:"c",d:[[104,105,101,102],[102,103,100,101],[100.5,107,100,106.5]],bx:[{i0:2,i1:2,p0:100.5,p1:106.5,c:"u",t:"engulfs prior body"}]}},
{t:"Swing high / low",c:"pa",d:"A local peak or trough with lower highs (or higher lows) on both sides. The reference points all structure is measured from.",e:"Your stop usually goes beyond the swing point that would invalidate the idea."},
{t:"Trendline / channel",c:"pa",d:"Diagonal lines connecting swing points. Useful for seeing slope; easy to draw three different ways until one supports your bias.",e:"If you have to ignore two wicks to make it fit, it isn't there."},
{t:"VWAP",c:"pa",d:"Volume-Weighted Average Price — the average price weighted by volume traded, reset each session. Institutions benchmark their fills against it, which makes it a genuine intraday magnet.",e:"Price stretched 1% above VWAP by 10am often gets pulled back toward it."},
{t:"Volume profile",c:"pa",d:"Volume displayed by price level instead of by time. Shows where business actually got done.",e:"The Point of Control (POC) is the most-traded price — usually a magnet, and a level price hesitates at."}
);
D.push(
{t:"Lagging vs leading",c:"ind",d:"Lagging indicators are calculated from past price and confirm what already happened. Leading indicators claim to anticipate. Every indicator is derived from price, so none of them know anything price didn't already tell you.",e:"A moving average crossing is a summary of the last 50 candles, not a forecast of the next one."},
{t:"Moving average",c:"ind",d:"The average closing price over N periods, drawn as a line. SMA weights all periods equally; EMA weights recent ones more heavily.",e:"200 EMA as a trend filter: only take longs while price is above it.",v:{k:"c",d:[[90,93,89,92],[92,95,91,94],[94,95,91,92],[92,97,91,96],[96,100,95,99],[99,101,96,97],[97,102,96,101],[101,106,100,105],[105,108,103,107],[107,111,106,110]],pl:[{pts:[[0,91],[1,92],[2,92.6],[3,93.4],[4,95],[5,96],[6,97.2],[7,99],[8,101],[9,103.4]],c:"a",t:"EMA"}]}},
{t:"RSI",c:"ind",d:"Relative Strength Index. A 0–100 momentum oscillator. Above 70 is called overbought, below 30 oversold — but strong trends can sit at 80 for weeks.",e:"Most useful as a divergence tool, least useful as a standalone buy/sell signal."},
{t:"MACD",c:"ind",d:"The difference between two EMAs, plotted with a signal line and histogram. A momentum and trend-change gauge.",e:"MACD crossing above its signal line is a classic long trigger — and a lagging one."},
{t:"Bollinger Bands",c:"ind",d:"A moving average with bands two standard deviations above and below. The bands expand with volatility and contract when it dies.",e:"A squeeze — bands pinching tight — often precedes an expansion. It doesn't tell you which way.",v:{k:"c",d:[[100,101,99,100.4],[100.4,101,99.6,100],[100,100.8,99.4,100.2],[100.2,101,99.5,100.6],[100.6,105,100,104],[104,108,103,107],[107,110,105,109]],pl:[{pts:[[0,102.5],[1,102],[2,101.6],[3,101.4],[4,105.4],[5,109],[6,111.5]],c:"a"},{pts:[[0,97.5],[1,98],[2,98.4],[3,98.6],[4,96.6],[5,95],[6,95.5]],c:"a"}],mk:[{i:2,p:99.4,t:"squeeze",below:true,c:"g"}]}},
{t:"ATR",c:"ind",d:"Average True Range — the average size of a candle's full range over N periods. The correct way to size a stop.",e:"If ATR on the 5-minute is 12 points, a 4-point stop will be hit by ordinary noise before your idea gets a chance."},
{t:"Stochastic",c:"ind",d:"Shows where the close sits within the recent high-low range, as a percentage.",e:"%K crossing %D from below 20 is the classic long trigger. Whipsaws constantly in a trend."},
{t:"Fibonacci retracement",c:"ind",d:"Levels drawn at 23.6%, 38.2%, 50%, 61.8% and 78.6% of a completed move, used to find pullback entries.",e:"After a leg from 90 to 110, the 62–79% zone (94.2 to 97.6) is where ICT's Optimal Trade Entry sits.",v:{k:"c",d:[[90,94,89.5,93],[93,99,92,98],[98,105,97,104],[104,110,103,109],[109,110,104,105],[105,106,100,101],[101,102,96,97],[97,103,95.5,102],[102,108,101,107]],zn:[{p0:94.2,p1:97.6,c:"s",t:"0.62 – 0.79 zone"}],hl:[{p:110,t:"swing high",c:"g"},{p:90,t:"swing low",c:"g",la:true,below:true}]}},
{t:"Divergence",c:"ind",d:"Price makes a new extreme but the indicator doesn't. A warning that momentum is draining out of the move.",e:"Price prints a higher high into resistance while RSI prints a lower high."},
{t:"Confluence",c:"ind",d:"Several independent signals pointing at the same level. Raises your confidence — it does not make the trade certain.",e:"61.8% retracement + prior support + 200 EMA all landing at 23,300."}
);
</script>

<script>
D.push(
{t:"Smart money",c:"ict",d:"The framework's central claim: that institutional order flow drives price in patterns a retail trader can read and follow.",e:"Everything else in this section is built on top of this assumption. Worth holding it loosely."},
{t:"Liquidity",c:"ict",d:"In this framework, clusters of resting orders — mostly stop losses — sitting at obvious places. Price is said to seek them out.",e:"Every short's stop sits just above the swing high. That's a pool of buy orders waiting to be triggered."},
{t:"Buy-side / sell-side liquidity",c:"ict",d:"BSL is the stops parked above highs (which become buy orders when triggered). SSL is the stops below lows.",e:"Equal highs are the cleanest BSL there is — two obvious tops with everyone's stops stacked in the same 5 points.",v:{k:"c",d:[[96,101.5,95,100],[100,101.6,97,98],[98,101.5,97,101],[101,102,96,97],[97,98,94.4,95],[95,99,94.3,98],[98,101,96,100]],hl:[{p:101.6,t:"BSL — stops above",c:"s"},{p:94.3,t:"SSL — stops below",c:"s",la:true,below:true}]}},
{t:"Liquidity sweep",c:"ict",d:"Price spikes through an obvious high or low, triggers the stops resting there, and immediately reverses. Also called a stop hunt or a raid.",e:"Wicks 5 points above equal highs, then drops 80 points. The wick is the sweep; the close back inside is the signal.",v:{k:"c",d:[[96,101.5,95,100],[100,101.6,97,98],[98,101.5,97,101],[101,106,100,101.5],[101.5,102,96,97],[97,98,92,93],[93,94,89,90]],hl:[{p:101.6,t:"equal highs",c:"s",la:true}],mk:[{i:3,p:106,t:"sweep",c:"s"},{i:5,p:92,t:"then leaves",below:true,c:"d"}]},cap:"Price reaches above the highs, takes the stops, and goes the other way."},
{t:"Inducement",c:"ict",d:"A minor high or low taken out first, to bait traders into the wrong side before the real move.",e:"The obvious little breakout everyone piles into, five minutes before the actual sweep.",v:{k:"c",d:[[96,99,95,98],[98,100.2,97,99],[99,100,96,97],[97,101,96,100],[100,104.5,99,100.5],[100.5,101,96,97],[97,98,92,93]],hl:[{p:100.2,t:"inducement",c:"g",la:true},{p:104.5,t:"real sweep",c:"s"}]}},
{t:"BOS",c:"ict",d:"Break of Structure. Price breaks a swing point in the direction of the existing trend — continuation, not a signal to reverse.",e:"An uptrend takes out its prior high. Normal behaviour.",v:{k:"c",d:[[90,95,89,94],[94,100,93,99],[99,100.5,95,96],[96,97,94,95],[95,99,94,98],[98,104,97,103],[103,106,102,105]],hl:[{p:100.5,t:"prior high",c:"g",la:true}],mk:[{i:5,p:104,t:"BOS",c:"a"}]}},
{t:"CHoCH",c:"ict",d:"Change of Character. The first structural break against the prevailing trend — the earliest evidence the trend may be over.",e:"An uptrend making its first lower low. Not proof, but the first thing that isn't business as usual.",v:{k:"c",d:[[90,95,89,94],[94,100,93,99],[99,100,95.5,96],[96,101,95,100],[100,102,97,98],[98,99,93,94],[94,95,91,92]],hl:[{p:95,t:"prior higher low",c:"g",la:true}],mk:[{i:5,p:93,t:"CHoCH",below:true,c:"d"}]}},
{t:"Displacement",c:"ict",d:"A large, fast, one-directional move with big candle bodies and little overlap. Treated as the footprint of aggressive participation.",e:"Three consecutive full-bodied candles with almost no wicks. Usually leaves a fair value gap behind it.",v:{k:"c",d:[[100,101,99,100.5],[100.5,101,99.5,100],[100,107,99.8,106.5],[106.5,113,106,112.5],[112.5,118,112,117.5],[117.5,119,116,118]],mk:[{i:3,p:113,t:"displacement",c:"a"}]}},
{t:"Fair value gap",c:"ict",d:"FVG or imbalance. A three-candle pattern where the first candle's wick and the third candle's wick don't overlap, leaving a band price moved through too fast to trade properly.",e:"Price frequently returns to that band later before continuing — which is what makes it an entry zone.",v:{k:"c",d:[[98,100,97,99],[99,108,98.5,107],[107.5,112,102,111],[111,112,106,107],[107,108,101.5,103],[103,109,102,108]],bx:[{i0:0,i1:5,p0:100,p1:102,c:"s",t:"FVG"}],mk:[{i:4,p:101.5,t:"returns to fill",below:true,c:"a"}]},cap:"Candle 1's high is below candle 3's low. That untouched band is the gap."},
{t:"Order block",c:"ict",d:"The last opposing candle before a displacement move. A bullish order block is the last down candle before a strong rally.",e:"Marked as a zone, then watched for a retest. Note it is identified after the move — which is the main criticism of it.",v:{k:"c",d:[[104,105,101,102],[102,103,99,100],[100,101,97.5,98],[98.5,106,98,105],[105,111,104,110],[110,112,106,107],[107,108,99.5,100],[100,106,99,105]],bx:[{i0:2,i1:7,p0:97.5,p1:101,c:"a",t:"order block"}],mk:[{i:6,p:99.5,t:"retest",below:true,c:"a"}]}},

{t:"Mitigation block",c:"ict",d:"A zone price returns to so trapped positions from an earlier move can exit near breakeven.",e:"Similar geometry to an order block, different story about why it works."},
{t:"Premium / discount",c:"ict",d:"The upper and lower halves of a dealing range, split at equilibrium (the 50% level). The rule: buy in discount, sell in premium.",e:"In a 23,300–23,500 range, equilibrium is 23,400. Buying at 23,480 is buying in premium — poor risk:reward by definition.",v:{k:"c",d:[[92,96,90.5,95],[95,100,94,99],[99,109.5,98,104],[104,106,99,100],[100,102,90.2,92],[92,98,91,97],[97,104,96,103],[103,109,102,108]],zn:[{p0:100,p1:109.5,c:"d",t:"premium — sell zone"},{p0:90.2,p1:100,c:"u",t:"discount — buy zone"}],hl:[{p:100,t:"equilibrium 50%",c:"k",solid:true,la:true}]}},
{t:"OTE",c:"ict",d:"Optimal Trade Entry — the 62% to 79% retracement band of a leg, treated as the highest-value entry area.",e:"See the Fibonacci retracement entry for the drawing. It's the deep end of a normal pullback."},

{t:"Reality check on this section",c:"ict",d:"The vocabulary here is genuinely useful for describing market structure, and stop clustering above highs and below lows is real, observable microstructure. What isn't established is that these patterns are tradeable edges — most are defined loosely enough to be spotted only in hindsight, and the framework has no independent validation.",e:"A liquidity-sweep detector can show a 65% win rate at p=0.0000 on pure random-walk data if it has a look-ahead bug. Keep the vocabulary; keep the noise control gate harder.",warn:true}

D.push(
{t:"Edge",c:"bt",d:"A statistical reason your expectancy is positive. It has to survive realistic costs, or it isn't one.",e:"Plenty of strategies have an edge before commission and slippage. Almost none keep it afterwards."},
{t:"Backtest",c:"bt",d:"Running a strategy over historical data to estimate how it would have performed.",e:"Cheap, fast, and the easiest place in trading to fool yourself completely."},
{t:"Forward test",c:"bt",d:"Running the strategy live in real time on simulated money. Slower and far more honest than a backtest.",e:"Paper trading MNQ with the same rules, same size and same discipline you'd use with real money."},
{t:"In-sample / out-of-sample",c:"bt",d:"The data you developed and tuned on, versus data the strategy has never seen. Only out-of-sample results mean anything.",e:"A 70/30 split: build on the first 70% of history, judge on the last 30%."},
{t:"Walk-forward",c:"bt",d:"Optimise on one window, test on the next, roll forward, repeat. Much harder to fool than a single split.",e:"Optimise on 2019–2020, test 2021. Optimise 2020–2021, test 2022. And so on."},
{t:"Overfitting",c:"bt",d:"Tuning a strategy until it fits the noise in past data perfectly, at which point it describes history and predicts nothing.",e:"A 12-parameter strategy with a 94% win rate across 40 trades is not a discovery. It's a very precise description of 40 specific candles.",v:{k:"e",base:100,s:[{v:[100,116,131,149,166,184,181,175,170,164,159,152],c:"a"}],zn:[{i0:0,i1:5,c:"u",t:"in-sample"},{i0:5,i1:11,c:"d",t:"out-of-sample"}]},cap:"Same strategy, same code. The only thing that changed is that the data was new."},
{t:"p-hacking",c:"bt",d:"Re-running tests, tweaking parameters or changing the sample until something clears your threshold, then reporting only that result.",e:"\"Keep trying more strategies until one is profitable\" is this, exactly. The search itself is what invalidates the finding.",warn:true},
{t:"Multiple comparisons",c:"bt",d:"Test enough strategies at a 5% significance level and roughly 5% of pure noise will pass by luck alone.",e:"1,000 tests at p<0.05 gives you ~50 false winners. The fix is a correction like Bonferroni — divide your threshold by the number of tests."},
{t:"Look-ahead bias",c:"bt",d:"Accidentally using information that wasn't available at that moment in time. Produces spectacular, entirely fake results.",e:"Using a candle's close to decide an entry that happens during that same candle."},
{t:"Survivorship bias",c:"bt",d:"Testing only on assets that still exist today, silently excluding everything that failed.",e:"Backtesting the S&P 500's current members over 20 years tests a list assembled with hindsight."},
{t:"Random-walk control",c:"bt",d:"Running your strategy on synthetic noise that has no structure. If it still 'wins', the strategy is detecting nothing and your test is broken.",e:"A permanent gate, not a one-off check. It is the single most useful thing you can add to a backtest engine.",v:{k:"e",base:100,s:[{v:[100,107,104,113,119,116,126,133,130,140],c:"a",t:"real data"},{v:[100,106,103,112,117,115,124,130,128,137],c:"g",dash:true,t:"pure noise",below:true}]},cap:"If the noise curve looks like the real one, you haven't found an edge — you've found a bug."},
{t:"Positive control",c:"bt",d:"Testing your engine on a phenomenon known to be real, to prove the code can detect something when something is there.",e:"Replicating the documented pre-FOMC drift, including its disappearance after 2015. If your engine can't find that, it can't find anything."},
{t:"Sample size",c:"bt",d:"How many independent observations support the conclusion. Small samples produce confident nonsense.",e:"Two years of FOMC meetings is 16 events. That is not a study — it's an anecdote with a spreadsheet."},
{t:"Monte Carlo",c:"bt",d:"Resampling or reshuffling the trade sequence thousands of times to see the range of outcomes the same edge could have produced.",e:"Shows you the drawdown you didn't happen to get, but easily could."},
{t:"Degrees of freedom",c:"bt",d:"The number of tunable parameters. Each one is another opportunity to fit noise.",e:"Two parameters is defensible. Twelve is a guarantee of overfitting."},
{t:"Benchmark",c:"bt",d:"The passive alternative your strategy must beat to justify existing.",e:"Buy-and-hold. If 15 strategy families across 14,000 backtests can't beat it, that's the answer — the answer is just uncomfortable."},
{t:"Cost model",c:"bt",d:"Commission, spread and slippage built into the simulation. Testing at double realistic costs is a good habit.",e:"A high-frequency strategy that looks great at zero cost usually dies the moment you add one tick of slippage."},
{t:"Latency",c:"bt",d:"The delay between signal and fill. Kills strategies that assume you can transact at the exact close of a candle.",e:"Your backtest fills at 23,450.00. Reality fills you at 23,450.75, four seconds later."}
);

{t:"Scalping",c:"style",d:"Seconds to minutes, many trades a day, small targets. Costs and execution quality dominate.",e:"Ten MNQ trades a day for 8 points each — where commission is a quarter of every win."},
{t:"Day trading",c:"style",d:"Positions opened and closed within the session. No overnight or gap risk.",e:"Flat by 4pm New York, no matter what."},
{t:"Swing trading",c:"style",d:"Holding days to weeks. Fewer decisions, wider stops, overnight risk.",e:"Entering on a daily pullback and holding for six days."},
{t:"Position trading",c:"style",d:"Weeks to months, driven by higher-timeframe structure or macro views.",e:"Holding a trend from a monthly breakout."},

{t:"Systematic vs discretionary",c:"style",d:"Systematic means fixed rules executed identically every time, ideally by code. Discretionary means human judgement per trade.",e:"Systematic is testable. Discretionary is not, which is why nobody can tell you whether their discretionary edge is real."},
{t:"HFT",c:"style",d:"High-frequency trading on microsecond timescales, with servers physically co-located inside the exchange.",e:"Not a retail activity in any sense. Competing here is a category error."},

{t:"Confirmation bias",c:"psy",d:"Weighting evidence that supports your position and dismissing what contradicts it.",e:"Screenshotting the wins for the journal and forgetting the losses."},

{t:"Contract specification",c:"fut",alt:"contract specs spec sheet",lvl:1,d:"The exchange's rulebook for a single futures contract: tick size, tick value, trading hours, margin, expiry months and how it settles. Everything about what your position is actually worth lives here.",e:"MNQ: 0.25 tick, $0.50 a tick, $2 a point, quarterly expiries, cash settled. Read the spec sheet before trading anything — it is one page and it decides your risk.",rel:["Tick","Point / handle","Multiplier"]},
{t:"Multiplier",c:"fut",lvl:1,d:"The number that converts a one-point price move into dollars. The single most important line on a contract spec.",e:"NQ has a $20 multiplier, MNQ has $2. Same chart, same setup, ten times the consequence. Trading NQ 'because the levels are the same' is a ten-fold size increase in disguise.",rel:["Contract specification","Notional value"],warn:true},
{t:"Notional value",c:"fut",lvl:1,d:"The full market value your contract controls, as opposed to the margin you posted to control it. The number that tells you your real exposure.",e:"MNQ at 23,450 × $2 = $46,900 of Nasdaq per contract. Eight contracts is $375,200 of exposure — on an account far smaller than that.",rel:["Leverage","Margin (initial)"],warn:true},
{t:"Initial vs maintenance margin",c:"fut",lvl:1,d:"Initial is what you post to open. Maintenance is the lower figure you must stay above to keep it open. Fall below and the broker asks for money or closes you.",e:"~$1,700 initial and ~$1,550 maintenance on MNQ is typical. Note both are a fraction of the $46,900 you control — that gap is the leverage.",rel:["Margin call","Day trading margin"]},
{t:"Day trading margin",c:"fut",lvl:1,d:"A much smaller margin brokers offer intraday only, on the condition you flatten before the close. It is a broker courtesy, not an exchange rule, and it can be withdrawn.",e:"$50 intraday against $1,700 overnight. It makes a $500 account look like it can trade futures. It cannot — the margin changed, the risk did not.",rel:["Initial vs maintenance margin","Notional value"],warn:true},
{t:"Settlement",c:"fut",lvl:2,d:"How a contract ends: cash settled (the difference is paid) or physically delivered (the actual commodity changes hands).",e:"Index futures settle in cash. Crude oil physically delivers, which is why holding CL to expiry as a retail trader is a genuinely bad idea.",rel:["Expiry","Rollover"]},
{t:"Expiry",c:"fut",lvl:1,d:"The date a contract stops trading. Futures are a series of separate instruments, not one continuous thing.",e:"Index futures run on a March / June / September / December cycle, expiring the third Friday.",rel:["Rollover","Front month"]},

{t:"Roll yield",c:"fut",lvl:3,d:"The gain or loss you take purely from rolling into the next contract at a different price, independent of any market move.",e:"In contango you sell the cheap expiring contract and buy a dearer one every quarter — a structural bleed that has nothing to do with your entry being right.",rel:["Contango / backwardation","Rollover"]},
{t:"Continuous contract",c:"fut",lvl:2,d:"A synthetic chart stitching successive contracts into one series so it can be backtested. The join is an artefact — the price gaps at every roll unless it is adjusted.",e:"Back-adjusted series shift all the old prices to remove the seam, which means the historical prices on your chart are not prices anything ever traded at.",rel:["Rollover","Back-adjustment"],warn:true},

{t:"Limit up / limit down",c:"fut",lvl:2,d:"Exchange-set bands beyond which a contract cannot trade for a period. Trading halts or is restricted to one side.",e:"On a genuinely violent night your stop does not fill because there is no trading below the limit. The gap is not a broker failure, it is the market being closed to you.",rel:["Circuit breaker","Gap risk"],warn:true},

{t:"Basis trade",c:"fut",lvl:3,d:"Buying spot and shorting the future (or the reverse) to harvest the convergence. An institutional carry trade, not a directional bet.",e:"Enormously popular and heavily leveraged, which makes an unwind of it a systemic event rather than a market opinion.",rel:["Basis","Funding rate"]},
{t:"Spread trade",c:"fut",lvl:3,d:"Long one contract and short a related one, so you are trading the relationship rather than the direction.",e:"Long ES, short NQ expresses 'value beats tech' with much of the market direction cancelled out. Margin is lower because the risk genuinely is.",rel:["Correlation","Pairs trade"]},
{t:"Tick value",c:"fut",lvl:1,d:"What one minimum price increment is worth per contract. Tick size is the movement, tick value is the money.",e:"MNQ: tick size 0.25 points, tick value $0.50. Four ticks to a point, $2 a point.",rel:["Tick","Multiplier"]},
{t:"Gap risk",c:"fut",lvl:1,d:"The risk that price jumps past your stop without trading there, so you exit far worse than planned. Stops are instructions, not guarantees.",e:"A stop at 23,400 in a market that reopens at 23,180 fills you at 23,180. Holding 8 MNQ through that is −$4,320 on a stop you thought capped you at −$800.",rel:["Slippage","Limit up / limit down","Overnight risk"],warn:true},
{t:"Overnight risk",c:"fut",lvl:1,d:"Exposure held while you are asleep and the market is not. For an Australian trading US index futures, this is most of the position's life.",e:"The US session runs while Perth sleeps. Any position held is unmanaged for eight hours, which is the argument for either a hard stop or being flat.",rel:["Gap risk","Flat"],warn:true},
{t:"Option",c:"opt",lvl:1,d:"A contract giving the right, not the obligation, to buy (call) or sell (put) an underlying at a set price before or at a set date. You pay a premium for that right.",e:"Buying a call risks only the premium. Selling one exposes you to the whole move — the two sides are not mirror images of each other in risk.",rel:["Call","Put","Premium"]},
{t:"Call",c:"opt",lvl:1,d:"The right to buy the underlying at the strike price. Gains value as the underlying rises.",e:"A 24,000 call on Nasdaq pays off if the index is above 24,000 at expiry by more than what you paid.",rel:["Put","Strike"]},
{t:"Put",c:"opt",lvl:1,d:"The right to sell the underlying at the strike price. Gains value as the underlying falls, which makes it the standard hedge.",e:"Holding shares and buying a put is insurance: you have paid a premium to cap your downside at the strike.",rel:["Call","Protective put"]},
{t:"Strike",c:"opt",lvl:1,d:"The price at which the option can be exercised. The fixed reference the whole contract is priced around.",e:"A 23,500 call and a 24,500 call on the same underlying and expiry are completely different risk profiles.",rel:["Moneyness"]},
{t:"Premium",c:"opt",lvl:1,d:"The price of the option itself. For a buyer it is the maximum loss; for a seller it is the maximum gain.",e:"Pay $4.20 for a call and $4.20 × the multiplier is everything you can lose. That capped downside is the entire appeal.",rel:["Option","Intrinsic value","Extrinsic value"]},
{t:"Moneyness",c:"opt",lvl:1,d:"Where the strike sits relative to the current price: in the money (ITM), at the money (ATM), or out of the money (OTM).",e:"With price at 23,450, a 23,000 call is ITM, a 23,450 call is ATM, a 24,000 call is OTM and consists purely of time value.",rel:["Strike","Intrinsic value"]},
{t:"Intrinsic value",c:"opt",lvl:2,d:"The part of the premium you would keep if the option expired right now. Zero for anything out of the money.",e:"Price 23,450, call strike 23,000 → $450 of intrinsic value. Anything you paid above that is time value.",rel:["Extrinsic value","Moneyness"]},
{t:"Extrinsic value",c:"opt",alt:"time value",lvl:2,d:"The rest of the premium — what you are paying for time remaining and expected movement. It decays to zero at expiry, always.",e:"Every out-of-the-money option is 100% extrinsic. Hold it to expiry unchanged and you lose everything you paid, on schedule.",rel:["Theta","Intrinsic value"],warn:true},
{t:"Option delta",c:"opt",lvl:1,d:"How much the option price moves per one-point move in the underlying. Also a rough proxy for the probability of finishing in the money.",e:"A 0.30 delta call gains about $0.30 per point of underlying rise, and finishes ITM roughly 30% of the time.",rel:["Gamma","Delta"]},
{t:"Gamma",c:"opt",lvl:2,d:"How fast option delta itself changes as the underlying moves. High gamma means your exposure is changing under you, quickly.",e:"Gamma is largest at the money and near expiry. A 0DTE ATM option can go from behaving like nothing to behaving like the full underlying in minutes.",rel:["Delta","0DTE","Gamma squeeze"]},
{t:"Theta",c:"opt",lvl:1,d:"The premium lost per day purely from time passing. Negative for buyers, positive for sellers.",e:"Theta of −$18 means the position loses $18 a day if nothing else changes. Nothing else changing is the common case.",rel:["Extrinsic value","Theta decay curve"]},
{t:"Theta decay curve",c:"opt",lvl:2,d:"Time value does not bleed away evenly — it accelerates sharply in the final weeks.",e:"An option loses time value slowly for months, then falls off a cliff in the last two weeks. Sellers want that cliff, buyers want to be nowhere near it.",rel:["Theta"]},
{t:"Vega",c:"opt",lvl:2,d:"How much the option price moves per one point change in implied volatility. Long options are long vega.",e:"Buy options before an event and you are betting on the move being larger than the market has priced, not merely on direction.",rel:["Implied volatility","IV crush"]},
{t:"Rho",c:"opt",lvl:3,d:"Sensitivity to interest rates. The least important greek for short-dated retail positions and the most important for long-dated ones.",e:"Irrelevant on a weekly. Meaningful on a LEAP.",rel:["Delta","Vega"]},
{t:"Implied volatility",c:"opt",alt:"IV",lvl:1,d:"The volatility the market's option prices imply for the future. Not a forecast that comes true — a price, set by supply and demand for protection.",e:"High IV means options are expensive because people are scared. Selling into it is a real strategy and a real way to be short a tail.",rel:["Vega","IV rank","Realised volatility"]},
{t:"Realised volatility",c:"opt",lvl:2,d:"How much the underlying actually moved, measured after the fact. Implied is the forecast, realised is the outcome.",e:"Implied consistently exceeds realised on average — the variance risk premium. That is why selling options makes money most of the time and occasionally makes a crater.",rel:["Implied volatility","Variance risk premium"]},
{t:"Variance risk premium",c:"opt",lvl:3,d:"The persistent gap between implied and realised volatility, paid to whoever is willing to be short volatility. One of the few genuinely well-documented risk premia.",e:"It is compensation for taking a rare, enormous loss. Collecting it is a real edge; forgetting what you were paid for is how vol sellers die.",rel:["Realised volatility","Short volatility"],warn:true},
{t:"IV rank / IV percentile",c:"opt",lvl:2,d:"Where current implied volatility sits within its own past year. Turns a raw IV number into context.",e:"IV of 22 means nothing alone. IV rank of 85 means it has been higher only 15% of the past year — that is the sell signal vol traders actually use.",rel:["Implied volatility"]},
{t:"IV crush",c:"opt",lvl:2,d:"The collapse in implied volatility immediately after a scheduled event resolves. It can make a directionally correct option lose money.",e:"You buy calls into earnings, the stock rises 4%, and your calls fall because IV halved the moment uncertainty vanished.",rel:["Implied volatility","Vega","Earnings"],warn:true},
{t:"Volatility skew",c:"opt",lvl:3,d:"Options at different strikes trading at different implied volatilities. In equities, downside puts are persistently dearer.",e:"The skew is the market pricing crashes as faster and deeper than melt-ups, which is empirically correct.",rel:["Implied volatility","Term structure"]},
{t:"Term structure",c:"opt",lvl:3,d:"Implied volatility across different expiries. Normally upward sloping; inverted in a panic.",e:"When near-dated IV exceeds long-dated, the market expects the trouble to be immediate.",rel:["Volatility skew","VIX"]},
{t:"0DTE",c:"opt",lvl:2,d:"Options expiring the same day. All gamma, no time value, and now a large share of index option volume.",e:"Positions can go from worthless to enormous and back within an hour. Treated as trading by the people selling the courses and as a lottery by the maths.",rel:["Gamma","Theta"],warn:true},
{t:"Assignment",c:"opt",lvl:2,d:"Being obliged to fulfil an option you sold. Can happen early on American-style contracts.",e:"Sell a put and get assigned, and you now own the shares at the strike, with the cash requirement that implies — often at the worst possible moment.",rel:["Exercise","Pin risk"],warn:true},
{t:"Exercise",c:"opt",lvl:2,d:"Using your right to buy or sell at the strike. American style allows it any time, European only at expiry.",e:"Index options are usually European, equity options usually American. It changes your early-assignment risk entirely.",rel:["Assignment"]},
{t:"Pin risk",c:"opt",lvl:3,d:"The uncertainty when the underlying closes almost exactly at your strike and you do not know whether you will be assigned.",e:"You go home flat on paper and wake up holding a position because the close was two cents the other way.",rel:["Assignment"]},
{t:"Open interest (options)",c:"opt",lvl:2,d:"The number of option contracts outstanding at each strike. Where positioning is concentrated.",e:"Huge open interest at a round strike acts as a magnet into expiry, because dealers hedging it trade against price movement.",rel:["Gamma exposure","Max pain"]},
{t:"Gamma exposure",c:"opt",alt:"GEX dealer gamma",lvl:3,d:"An estimate of how much dealers must buy or sell to stay hedged as price moves. Positive dealer gamma dampens moves; negative amplifies them.",e:"In positive gamma, dealers sell rallies and buy dips, pinning price. Flip negative and the same mechanism accelerates every move. A plausible mechanism, and still hard to trade after costs.",rel:["Gamma","Open interest (options)","Gamma squeeze"]},
{t:"Gamma squeeze",c:"opt",lvl:3,d:"A feedback loop where heavy call buying forces dealers to buy the underlying to hedge, pushing price up, forcing more hedging.",e:"The mechanism behind several 2021 meme-stock moves. Real, rare, and mostly identified after it has finished.",rel:["Gamma exposure","Short squeeze"]},
{t:"Max pain",c:"opt",lvl:3,d:"The price at which the largest total value of options expires worthless. Sometimes presented as a magnet.",e:"Treat it as a description of positioning, not a prediction. The evidence for price being dragged there is much weaker than the confidence with which it is quoted.",rel:["Open interest (options)"],warn:true},
{t:"Covered call",c:"opt",lvl:2,d:"Holding the underlying and selling a call against it. Collects premium, caps your upside.",e:"Income until the day it rallies 15% and you have sold your gains for a small fee. It is not free money, it is a swap of upside for a payment.",rel:["Premium","Assignment"]},
{t:"Protective put",c:"opt",lvl:2,d:"Buying a put against a long position as insurance with a known cost.",e:"The one hedge that genuinely caps downside. It costs money every period it is not needed, which is what insurance is.",rel:["Put","Hedge"]},
{t:"Vertical spread",c:"opt",lvl:2,d:"Buying one option and selling another at a different strike, same expiry. Caps both the cost and the payoff.",e:"The standard way to express a directional view with defined risk instead of paying full premium.",rel:["Option","Defined risk"]},
{t:"Straddle / strangle",c:"opt",lvl:2,d:"Buying both a call and a put — same strike for a straddle, different strikes for a strangle. A bet on movement, not direction.",e:"You need a move larger than both premiums combined. IV crush after the event is the usual reason a correct call still loses.",rel:["IV crush","Implied volatility"]},
{t:"Iron condor",c:"opt",lvl:3,d:"Selling an out-of-the-money call spread and put spread at once. Profits if price stays in a range.",e:"Wins often, loses big. The classic shape that looks like a strategy and is actually a short volatility position with a defined but large tail.",rel:["Short volatility","Iron condor"],warn:true},
{t:"Short volatility",c:"opt",lvl:3,d:"Any position that makes small steady gains while markets are calm and large sudden losses when they are not.",e:"Selling premium, iron condors, martingale grid bots, and carry trades are all the same trade wearing different clothes. Check whether your 'consistent' system is this.",rel:["Variance risk premium","Martingale","Tail risk"],warn:true},
{t:"VIX",c:"opt",lvl:1,d:"The index of 30-day implied volatility on the S&P 500. Called the fear gauge because it rises when protection gets bid.",e:"VIX below 14 is calm, above 30 is stress. It is not tradeable directly — VIX futures and ETPs have their own decay.",rel:["Implied volatility","Contango / backwardation"]},
{t:"Volatility ETP decay",c:"opt",lvl:3,d:"Volatility exchange-traded products roll futures continuously, so contango steadily erodes them regardless of what volatility does.",e:"Long vol ETPs lose value in calm markets by construction. Holding one as a long-term hedge is paying rent on an asset designed to shrink.",rel:["Roll yield","VIX"],warn:true},
{t:"Currency pair",c:"fx",lvl:1,d:"Every FX quote is a ratio of two currencies. You are always long one and short the other — there is no way to hold a single currency in isolation.",e:"Buying EURUSD is buying euros with dollars. If the dollar strengthens against everything, your euro view can be right and the trade still loses.",rel:["Base / quote currency"]},
{t:"Base / quote currency",c:"fx",lvl:1,d:"In EURUSD, EUR is the base and USD the quote. The price is how many units of quote it takes to buy one unit of base.",e:"EURUSD 1.0850 means one euro costs 1.0850 US dollars.",rel:["Currency pair"]}
);
D.push(
{t:"Pipette",c:"fx",lvl:2,d:"A tenth of a pip — the fifth decimal place brokers quote to.",e:"1.08505 is half a pip above 1.0850. Mostly it exists so spreads can be advertised as smaller numbers."},
{t:"Majors / minors / exotics",c:"fx",lvl:1,d:"Majors are the USD pairs with the deepest liquidity. Minors are crosses between majors without USD. Exotics involve a smaller economy's currency.",e:"EURUSD is a major, EURGBP a minor, USDTRY an exotic — with a spread perhaps twenty times wider and gaps to match.",rel:["Liquidity","Spread"]},
{t:"Carry trade",c:"fx",lvl:2,d:"Borrowing in a low-interest currency to hold a high-interest one and collecting the difference. A genuine risk premium, paid for taking crash risk.",e:"Short yen, long Australian dollar was the classic. It pays steadily for years and then unwinds in a week — 'up the stairs, down the lift'.",rel:["Swap / rollover fee","Short volatility"],warn:true},
{t:"Swap / rollover fee",c:"fx",lvl:2,d:"The interest debited or credited for holding a position past the daily rollover, reflecting the rate difference between the two currencies.",e:"Triple charged on Wednesdays to cover the weekend. On a long-held position this quietly becomes the dominant term in your P&L.",rel:["Carry trade","Costs"]},
{t:"Interbank market",c:"fx",lvl:2,d:"The genuine wholesale FX market between banks. Retail platforms sit several layers away from it.",e:"Your 'market price' is your broker's price. It usually tracks the interbank market and is not obliged to.",rel:["Dealing desk / B-book"]},
{t:"Dealing desk / B-book",c:"fx",lvl:2,d:"A broker model where your trade is not passed to the market — the broker takes the other side. Your loss is directly their revenue.",e:"Not automatically fraudulent, but it is a structural conflict of interest. Check whether your broker is A-book (passes flow through) or B-book.",rel:["Interbank market","Regulation"],warn:true},
{t:"ECN broker",c:"fx",lvl:2,d:"A broker routing orders to an external liquidity pool, charging commission rather than widening the spread.",e:"Usually the cheaper structure once you trade any real volume, and the incentives are cleaner.",rel:["Dealing desk / B-book"]},
{t:"Requote",c:"fx",lvl:2,d:"The broker declining your requested price and offering a different one. A dealing-desk behaviour that vanished from good venues.",e:"Frequent requotes only when you are winning is the single loudest broker red flag there is.",rel:["Slippage","Dealing desk / B-book"],warn:true},
{t:"Fixing",c:"fx",lvl:3,d:"A benchmark FX rate set at a specific time each day, used to value funds and settle contracts. The 4pm London fix is the big one.",e:"Volume and volatility spike into the fix because large flows are forced to transact there."},
{t:"NDF",c:"fx",lvl:3,d:"Non-deliverable forward — a cash-settled contract on a currency that cannot be freely traded.",e:"Used for currencies with capital controls. Institutional territory."},
{t:"Triangular relationship",c:"fx",lvl:3,d:"Three pairs sharing currencies must be internally consistent, or a riskless arbitrage exists.",e:"EURUSD, GBPUSD and EURGBP pin each other. Any gap is closed by machines in microseconds, so it is not an opportunity, it is a consistency check.",rel:["Arbitrage"]},
{t:"FX session overlap",c:"fx",lvl:1,d:"Volume concentrates when two major centres are open together. The London–New York overlap is the deepest window of the day.",e:"For Perth that overlap is roughly 9pm–1am AWST. The Sydney–Tokyo overlap in your morning is far thinner and chops more.",rel:["Session","Asian range"]},
{t:"Spot vs perpetual",c:"cry",lvl:1,d:"Spot is owning the coin. A perpetual is a leveraged derivative that tracks it with no expiry date, held in line by funding payments.",e:"Most retail crypto 'trading' is perps. You never own anything — you hold a leveraged bet with a liquidation price.",rel:["Funding rate","Liquidation"]},
{t:"Liquidation cascade",c:"cry",lvl:1,d:"Forced closures triggering further price movement, triggering more forced closures. The mechanism behind most violent crypto wicks.",e:"A 4% move at 20x leverage wipes the position out entirely. When thousands of them close at once, the 4% becomes 12% in a minute.",rel:["Liquidation","Long squeeze"],warn:true},
{t:"Long squeeze / short squeeze",c:"cry",lvl:1,d:"A move that forces the crowded side to close, and their closing accelerates the very move that trapped them.",e:"Crypto publishes liquidation levels effectively for free through open interest and funding, which is why price so reliably runs to them.",rel:["Liquidation cascade","Funding rate"]},
{t:"CEX vs DEX",c:"cry",lvl:1,d:"A centralised exchange holds your coins and runs an order book. A decentralised exchange is a smart contract you trade against from your own wallet.",e:"CEX: fast, convenient, and you are trusting a company with your money. DEX: you keep custody and pay gas for every action.",rel:["Custody","AMM"]},
{t:"Custody",c:"cry",lvl:1,d:"Who actually controls the private keys. If a platform holds them, you hold a claim on a company, not an asset.",e:"'Not your keys, not your coins' is not a slogan — it is the accurate legal description, as several exchange collapses demonstrated.",rel:["CEX vs DEX"],warn:true},
{t:"AMM",c:"cry",lvl:2,d:"Automated market maker — a pool of two assets priced by a formula rather than an order book. The core mechanism of most DEXs.",e:"You trade against the pool, and the price moves along a curve as you do. Large trades move it a lot.",rel:["Impermanent loss","Slippage"]},
{t:"Impermanent loss",c:"cry",lvl:3,d:"The loss a liquidity provider takes versus simply holding both assets, caused by the pool rebalancing as prices diverge.",e:"Badly named — it is permanent once you withdraw. Advertised yields frequently do not net it off.",rel:["AMM","Yield farming"],warn:true},
{t:"Yield farming",c:"cry",lvl:3,d:"Moving capital between protocols to collect incentive emissions. Headline APYs are usually paid in a token whose price is falling.",e:"A 400% APY paid in a token down 90% is a negative return with extra steps.",rel:["Impermanent loss"],warn:true},
{t:"Gas",c:"cry",lvl:2,d:"The fee paid to have a transaction included on-chain. Rises with network congestion, independent of your trade size.",e:"A $20 gas fee on a $200 trade is a 10% cost. On-chain trading has a minimum viable trade size and it is not small.",rel:["Costs"]},
{t:"MEV",c:"cry",lvl:3,d:"Maximal extractable value — profit taken by reordering, inserting or censoring transactions before they confirm.",e:"A sandwich attack buys ahead of your pending swap and sells into it. You are the exit liquidity, automatically, on chain, by design.",rel:["Front running","Slippage"],warn:true},
{t:"Stablecoin",c:"cry",lvl:1,d:"A token designed to hold a fixed value, usually one dollar, backed by reserves or by an algorithm.",e:"Backed by real reserves is a credit question. Backed by an algorithm has repeatedly meant backed by nothing during a run.",rel:["Depeg"]},
{t:"Depeg",c:"cry",lvl:2,d:"A stablecoin losing its target value. Slow drift is a warning; a fast break is usually terminal.",e:"An algorithmic stablecoin at $0.98 is not a discount, it is a bank run in progress.",rel:["Stablecoin"],warn:true},
{t:"On-chain metrics",c:"cry",lvl:3,d:"Data taken from the blockchain itself — active addresses, exchange flows, holder age. Genuinely different information from price.",e:"One of the few datasets that is not derived from OHLCV, which makes it more interesting than another price indicator and no less prone to overfitting.",rel:["Alternative data"]},
{t:"Halving",c:"cry",lvl:2,d:"The scheduled reduction of Bitcoin's block reward, roughly every four years, cutting new supply issuance in half.",e:"Fully known in advance, which is exactly why 'it always pumps after the halving' is a claim about four non-independent observations.",rel:["Sample size"],warn:true},
{t:"Wash trading",c:"cry",lvl:2,d:"Trading with yourself to inflate reported volume. Widespread on unregulated venues.",e:"Ranking exchanges or tokens by reported volume without adjusting for it produces a league table of who lies most.",rel:["Red flags"],warn:true},
{t:"24/7 market",c:"cry",lvl:1,d:"Crypto never closes, so there is no session boundary to force you flat and no overnight halt to slow a liquidation.",e:"It sounds like an advantage. In practice it removes every natural stopping point, which is a psychological problem more than a technical one.",rel:["Overnight risk","Discipline"]},
{t:"Colocation",c:"exec",lvl:3,d:"Renting rack space in the exchange's own data centre to shave microseconds off the round trip.",e:"The structural reason speed-based strategies are not a retail opportunity. You cannot compete on latency from a house in Perth.",rel:["Latency"]},
{t:"Market impact",c:"exec",lvl:2,d:"The amount your own order moves the price against you. Grows with size relative to available liquidity.",e:"Irrelevant on 1 MNQ. Decisive for a fund, which is why some real edges exist only at sizes too small to be worth institutional attention.",rel:["Liquidity","Slippage"]},
