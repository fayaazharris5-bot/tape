{t:"Structured product",c:"deriv",lvl:2,d:"A packaged combination of a bond and derivatives sold with a headline feature like capital protection or enhanced yield.",e:"You can usually build the same payoff yourself for less. The gap is the fee, and it is rarely disclosed as one.",rel:["Fee opacity"],warn:true},
{t:"Fee opacity",c:"deriv",lvl:2,d:"Costs embedded in a product's pricing rather than charged visibly.",e:"If you cannot find the fee, you are the fee. Ask what the same exposure costs assembled from components.",rel:["Structured product","Payment for order flow"],warn:true},
{t:"Capital protection",c:"deriv",lvl:2,d:"A structure promising return of principal at maturity, usually by holding a zero-coupon bond and buying options with the rest.",e:"Protection is only as good as the issuer, it applies only at maturity, and it costs you the dividends and most of the upside.",rel:["Structured product"],warn:true},
{t:"Knock-in / knock-out",c:"deriv",lvl:3,d:"Barrier features that activate or cancel a payoff when price touches a level.",e:"Creates a discontinuous payoff — a tiny move through the barrier changes everything. Hedging it produces violent flows near the level.",rel:["Pin risk"]},
{t:"Counterparty risk",c:"deriv",lvl:1,d:"The risk that the other side of your contract fails to pay.",e:"Cleared futures largely remove it. OTC contracts, CFDs and unregulated crypto venues do not.",rel:["Clearing house","Broker insolvency"],warn:true},
{t:"Notional vs premium",c:"deriv",lvl:2,d:"The exposure a contract controls versus the cash you paid for it.",e:"Confusing the two is how people discover their 'small' options position was a large directional bet.",rel:["Notional value","Premium"],warn:true},
{t:"Margin lending",c:"deriv",lvl:2,d:"Borrowing from a broker against your portfolio to buy more.",e:"Interest accrues daily and the broker can force liquidation at the worst possible moment, without asking.",rel:["Margin call","Leverage"],warn:true},
{t:"Market risk",c:"riskt",lvl:1,d:"The risk of loss from price moving against you. The one everybody thinks about.",e:"Manageable with sizing and stops. It is also the least likely thing to actually ruin you.",rel:["Position sizing","Tail risk"]},
{t:"Liquidity risk",c:"riskt",lvl:1,d:"The risk you cannot exit at a reasonable price because there is nobody on the other side.",e:"Invisible in normal conditions and decisive in bad ones. Position size should be set against thin-market liquidity, not average liquidity.",rel:["Liquidity","Market impact"],warn:true},
{t:"Gap and overnight risk",c:"riskt",lvl:1,d:"The risk of price jumping while you cannot act.",e:"For an Australian holding US index futures this is the dominant risk, not intraday volatility.",rel:["Gap risk","Overnight risk"],warn:true},
{t:"Correlation risk",c:"riskt",lvl:2,d:"The risk that positions you believed were independent move together.",e:"Five 1% positions that turn out to be one trade is a 5% position you never agreed to take.",rel:["Correlation breakdown","Portfolio heat"],warn:true},
{t:"Basis risk",c:"riskt",lvl:3,d:"The risk that a hedge and the thing it hedges do not move together as expected.",e:"Hedging an ASX portfolio with US index futures leaves you exposed to the difference between the two markets — and to the currency.",rel:["Hedge","Basis"]},
{t:"Model risk",c:"riskt",lvl:2,d:"The risk that your model is wrong in a way the backtest cannot reveal.",e:"Every assumption — normal returns, stable correlations, fills at the touch — is a place this hides.",rel:["Fat tails","Overfitting"],warn:true},
{t:"Operational risk",c:"riskt",lvl:1,d:"Loss from process, system or human failure rather than from the market — a fat-finger order, a crashed bot, a missed rollover.",e:"Boring, common, and entirely preventable with checklists and a kill switch.",rel:["Kill switch","Reconciliation"]},
{t:"Concentration",c:"riskt",lvl:1,d:"Too much of the outcome depending on one position, sector, strategy or venue.",e:"Includes venue concentration: everything on one exchange is a single point of failure regardless of how diversified the positions look.",rel:["Concentration risk","Diversification"]},
{t:"Sequence-of-returns risk",c:"riskt",lvl:2,d:"The risk that the order of returns, not their average, determines the outcome.",e:"Decisive when you are adding or withdrawing capital. Same average return, different order, very different ending balance.",rel:["Sequence risk","Withdrawal policy"]},
{t:"Regulatory risk",c:"riskt",lvl:2,d:"The risk that a rule change alters what you can trade, at what leverage, or with what tax treatment.",e:"ASIC's CFD intervention changed retail leverage overnight. Strategies built on the old limits stopped being possible.",rel:["Retail leverage cap","Regulation"]},
{t:"Platform risk",c:"riskt",lvl:1,d:"The risk your broker, exchange or data feed fails when you need it.",e:"Outages cluster on the most volatile days, which is exactly when you need to act. Have a second route.",rel:["Backup and redundancy","Broker insolvency"],warn:true},
{t:"Key person risk",c:"riskt",lvl:3,d:"When a system depends on one individual's judgement, availability or undocumented knowledge.",e:"In a one-person trading operation this is you. Illness, travel and sleep are risk factors with real P&L consequences.",rel:["Trading US hours from Perth"]},
{t:"Risk budgeting",c:"riskt",lvl:2,d:"Allocating a fixed total amount of risk across positions and strategies, rather than sizing each in isolation.",e:"Forces the trade-off to be explicit: a new position must displace risk from an existing one.",rel:["Portfolio heat","Position limit"]},
{t:"Unknown unknowns",c:"riskt",lvl:2,d:"Risks not on any list because nobody has thought of them yet.",e:"The reason position limits exist at all. You cannot model this one, only survive it by not being maximally exposed.",rel:["Tail risk","Risk of ruin"]},
{t:"Business cycle",c:"cycle",lvl:1,d:"The recurring expansion and contraction of economic activity.",e:"Different assets lead at different phases. The cycle is real; timing it reliably is not.",rel:["Recession","Leading indicator"]},
{t:"Recession",c:"cycle",lvl:1,d:"A sustained contraction in economic activity, formally dated well after it begins.",e:"You find out you were in one months later. Equities usually bottom before it is announced.",rel:["Business cycle","Yield curve"]},
{t:"Soft landing",c:"cycle",lvl:2,d:"Inflation falling back to target without a recession.",e:"Rare historically, and priced as the base case almost every tightening cycle.",rel:["Central bank","Rate expectations"]},
{t:"Stagflation",c:"cycle",lvl:2,d:"High inflation alongside weak growth — the combination policy tools handle worst.",e:"The 1970s scenario. Bad for both equities and bonds at once, which breaks the standard balanced portfolio.",rel:["Correlation breakdown"]},
{t:"Credit cycle",c:"cycle",lvl:2,d:"The expansion and contraction of lending appetite, usually leading the business cycle.",e:"Credit spreads widen before equities fall. It is one of the more reliable sequences in macro.",rel:["Credit spread"]},
{t:"Volatility regime",c:"cycle",lvl:2,d:"Extended periods of persistently high or low volatility. Volatility clusters strongly.",e:"A strategy tuned in a low-vol regime will size wrongly in a high-vol one unless it scales with ATR.",rel:["Volatility targeting","Autocorrelation"]},
{t:"Bull market",c:"cycle",lvl:1,d:"A sustained rising market, conventionally a 20% advance from a low.",e:"Makes almost every long strategy look skilful. This is why benchmark-relative reporting matters.",rel:["Benchmark","Beta"]},
{t:"Bear market",c:"cycle",lvl:1,d:"A sustained decline, conventionally 20% from a high.",e:"Contains the sharpest rallies. Bear market rallies exist to make shorts cover and dip-buyers hopeful.",rel:["Bear market rally"]},
{t:"Bear market rally",c:"cycle",lvl:2,d:"A strong advance within an ongoing downtrend.",e:"Frequently larger and faster than rallies in bull markets, which is exactly what makes it convincing.",rel:["Bear market","Retracement vs reversal"],warn:true},
{t:"Melt-up risk",c:"cycle",lvl:2,d:"The risk of being out of a market that keeps rising without pullbacks.",e:"Being flat has an opportunity cost. It is a real risk, just not one that can bankrupt you.",rel:["Melt-up","FOMO"]},
{t:"Rotation",c:"cycle",lvl:2,d:"Capital moving between sectors or styles without leaving the market.",e:"The index can be flat while everything underneath it moves violently. Index-level analysis misses this entirely.",rel:["Sector","Factor investing"]},
{t:"Sector",c:"cycle",lvl:1,d:"A grouping of companies by business type — technology, financials, energy, healthcare.",e:"Sector correlation is high within and lower across. It is the first useful diversification axis in equities.",rel:["Correlation matrix","Rotation"]},
{t:"Structural break",c:"cycle",lvl:3,d:"A permanent change in how a market behaves — a rule change, a new participant class, a technology shift.",e:"Distinct from a regime cycle because it does not revert. Decimalisation and the rise of HFT were both structural breaks.",rel:["Regime change","Factor decay"]},
{t:"API",c:"tech",lvl:1,d:"The programmatic interface a broker or data provider exposes for placing orders and pulling data.",e:"Read the rate limits and the error codes before writing anything. Both will matter at the worst moment.",rel:["Rate limit","REST vs WebSocket"]},
{t:"REST vs WebSocket",c:"tech",lvl:2,d:"REST is request-and-response, one call at a time. A WebSocket holds an open connection and pushes updates as they happen.",e:"Polling REST for live prices is slow and burns your rate limit. Streaming is the correct tool for market data.",rel:["API","Rate limit"]},
{t:"Rate limit",c:"tech",lvl:2,d:"A cap on how many requests you may make in a period. Exceeding it gets you throttled or banned.",e:"Handle the 429 response explicitly with backoff. A retry loop without backoff turns a hiccup into a lockout.",rel:["API","Idempotency"],warn:true},
{t:"FIX protocol",c:"tech",lvl:3,d:"The messaging standard institutions use for order routing.",e:"Rarely available to retail, and the vocabulary leaks into broker documentation regardless.",rel:["Smart order routing"]},
{t:"Data feed",c:"tech",lvl:1,d:"The source of your prices, and whether it is real-time, delayed, consolidated or from a single venue.",e:"A free delayed feed is fine for research and useless for execution. Know which one your chart is showing.",rel:["Data quality","Latency"]},
{t:"Backfill",c:"tech",lvl:2,d:"Retrieving historical data to fill gaps in a stored series.",e:"Backfilled bars may come from a different source than your live ones, which quietly creates two datasets in one table.",rel:["Data quality","Bad tick"],warn:true},
{t:"VPS",c:"tech",lvl:2,d:"A rented virtual server, used to run automation continuously without depending on your own machine.",e:"Solves the 3am power cut and the accidental laptop lid. It does not solve a bug.",rel:["Kill switch","Latency to broker"]},
{t:"Heartbeat",c:"tech",lvl:2,d:"A periodic signal confirming a connection or process is alive.",e:"Without one, a silently dead feed looks identical to a quiet market. That distinction has cost people real money.",rel:["Fail-safe default","Monitoring"],warn:true},
{t:"Monitoring and alerting",c:"tech",lvl:2,d:"Automated checks that tell you when something has broken, rather than you noticing later.",e:"Alert on staleness, on rejected orders, and on position mismatch. Alerting on profit is noise.",rel:["Heartbeat","Reconciliation"]},
{t:"Time synchronisation",c:"tech",lvl:3,d:"Keeping your system clock accurate against a reference.",e:"Clock drift corrupts bar alignment and makes latency measurements meaningless.",rel:["Timezone alignment"]},
{t:"Database vs flat files",c:"tech",lvl:3,d:"Where market data lives — a proper database, or Parquet and CSV on disk.",e:"Columnar files are fast and simple for research. A database earns its keep once you need concurrent writes and integrity guarantees.",rel:["Reproducibility"]},
{t:"Survivorship-free dataset",c:"tech",lvl:3,d:"Historical data including delisted and dead instruments.",e:"Almost never free. Its absence is the single most common quiet defect in a retail equity backtest.",rel:["Survivorship bias","Data quality"],warn:true},
{t:"Corporate action adjustment",c:"tech",lvl:3,d:"Applying splits and dividends consistently across a stored history.",e:"Do it once, at ingest, and record which convention you used. Mixing adjusted and unadjusted series is a silent disaster.",rel:["Adjusted price","Corporate action"],warn:true},
{t:"Dry run mode",c:"tech",lvl:2,d:"Running the full system with order submission disabled, logging what it would have done.",e:"Catches the plumbing failures without risking money, and it is the last gate before going live.",rel:["Paper trading a bot","Kill switch"]},
{t:"Fixed dollar risk",c:"money",lvl:1,d:"Risking the same cash amount on every trade regardless of account size.",e:"Simple and it does not compound. After a run of losses you are risking a larger share of a smaller account.",rel:["Fixed fractional sizing"],warn:true},
{t:"Percent volatility sizing",c:"money",lvl:2,d:"Sizing so each position's expected daily move is a fixed share of the account, using ATR.",e:"Puts unlike instruments on comparable footing. Gold and MNQ get different contract counts for the same risk.",rel:["ATR","Volatility targeting"]},
{t:"Fixed ratio",c:"money",lvl:3,d:"Increasing size by one unit after each fixed increment of profit, rather than by a percentage.",e:"Designed for small futures accounts. Grows more slowly than fixed fractional early and faster later.",rel:["Fixed fractional sizing"]},
{t:"Pyramiding",c:"money",lvl:2,d:"Adding to a winning position as it moves in your favour.",e:"Raises the average entry and can turn a winner into a loser if the last tranche is the biggest. Add in decreasing size, not increasing.",rel:["Scaling in","Averaging down"],warn:true},
{t:"Scaling out rules",c:"money",lvl:2,d:"Predefined points for taking partial profits.",e:"Reduces variance and reduces expectancy. Whether that trade is worth it depends on your MFE data, not on how it feels.",rel:["Scaling out","MAE / MFE"]},
{t:"Risk parity across strategies",c:"money",lvl:3,d:"Allocating so each strategy contributes equal risk rather than equal capital.",e:"Prevents one high-volatility system dominating the combined equity curve.",rel:["Risk parity","Ensemble"]},
{t:"Anti-martingale in practice",c:"money",lvl:2,d:"Increasing exposure after gains and cutting after losses, so drawdowns shrink your risk automatically.",e:"What fixed fractional sizing does without you deciding anything. That automaticity is the point.",rel:["Anti-martingale","Fixed fractional sizing"]},
{t:"Grid trading",c:"money",lvl:2,d:"Placing a ladder of orders at intervals, adding as price moves against you.",e:"Produces a smooth curve and hides a martingale. It works until a trend does not come back, which is the one scenario it cannot survive.",rel:["Martingale","Short volatility"],warn:true},
{t:"Averaging in vs averaging down",c:"money",lvl:1,d:"Planned staged entry at predetermined levels, versus unplanned adding because you are losing.",e:"Same mechanics, opposite discipline. If the second entry was not written down before the first, it is averaging down.",rel:["Averaging down","Scaling in"],warn:true},
{t:"Maximum position count",c:"money",lvl:2,d:"A cap on simultaneous open positions, independent of individual sizing.",e:"Stops a correlated cluster forming while each individual trade looks reasonable.",rel:["Portfolio heat","Position limit"]},
{t:"Risk per setup type",c:"money",lvl:3,d:"Allocating different risk to different setups based on their measured historical edge.",e:"Only defensible once you have enough trades per setup to distinguish them. Below that it is a story about which setup you like.",rel:["Sample size","Expectancy"],warn:true},
{t:"Capital preservation mode",c:"money",lvl:2,d:"A predefined reduced-risk state entered after a drawdown threshold.",e:"Halve size at −10%, halve again at −15%, stop at −20%. The numbers matter less than deciding them in advance.",rel:["Drawdown protocol","Pre-commitment"]}
);
D.push(
{t:"Swing high / swing low",c:"pa",lvl:1,d:"A local extreme with lower highs either side, or higher lows either side. The building block of structure.",e:"The lookback that defines 'local' is a parameter. Change it and the structure on your chart changes with it.",rel:["Market structure","Parameter choice"]},
{t:"Market structure",c:"pa",lvl:1,d:"The sequence of swing highs and lows that defines trend direction objectively.",e:"Its value is that it is codeable. Once you fix the swing lookback, two people get the same answer.",rel:["Swing high / swing low","Break of structure"]},
{t:"Break of structure",c:"pa",lvl:2,d:"Price closing beyond the prior swing point in the direction of trend, confirming continuation.",e:"Objective once the swing definition is fixed. Most disagreement about it is disagreement about the lookback.",rel:["Market structure","Change of character"]},
{t:"Change of character",c:"pa",lvl:2,d:"The first break against the prevailing structure, read as the earliest sign of a turn.",e:"Also the most common false signal in a strong trend, because every pullback produces one at some timeframe.",rel:["Break of structure","Retracement vs reversal"],warn:true},
{t:"Higher timeframe bias",c:"pa",lvl:1,d:"Deciding direction on a slower chart before looking for entries on a faster one.",e:"Reduces the number of setups you take, which is usually the point.",rel:["Top-down analysis","Timeframe"]},
{t:"Fractal nature of price",c:"pa",lvl:2,d:"The observation that charts look structurally similar across timeframes.",e:"True visually and often overstated. Costs do not scale down with the timeframe, which is why the same pattern is not equally tradeable on every chart.",rel:["Cost drag","Sub-daily frequency"],warn:true},
{t:"Volume at price",c:"pa",lvl:2,d:"How much traded at each level, rather than in each time period.",e:"Low-volume areas get traversed quickly; high-volume areas act as magnets and as friction.",rel:["Point of Control","Value area"]},
{t:"Imbalance",c:"pa",lvl:2,d:"A price area traversed with one-sided aggression, leaving little two-way trade behind.",e:"The general concept underneath fair value gaps. The name changes by community; the observation does not.",rel:["Liquidity void","Expansion"]},
{t:"Wick fill",c:"pa",lvl:3,d:"Price returning to trade through the area a long wick covered.",e:"Common enough to notice, unreliable enough to need a stop. Test the base rate before treating it as a target.",rel:["Pattern base rate","Gap fill"]},
{t:"Round numbers",c:"pa",lvl:1,d:"Whole figures like 23,000 or 100 that attract orders and stops for no reason beyond being memorable.",e:"A genuine behavioural mechanism — people place orders at round numbers, so liquidity genuinely concentrates there.",rel:["Economic rationale","Equal highs / equal lows"]},
{t:"Session open reaction",c:"pa",lvl:2,d:"The volatility burst as a major session opens and overnight orders execute.",e:"The New York open is the most consistent volatility event of the day for index futures. Whether it is tradeable is a separate question.",rel:["Opening range","Session"]},
{t:"Overnight range",c:"pa",lvl:2,d:"The high and low set outside the main session, often used as reference levels for the day.",e:"Thinner liquidity means these extremes are set by fewer participants, which is why they get swept so often.",rel:["Asian range","Liquidity sweep"]},
{t:"Failed auction",c:"pa",lvl:3,d:"Price probing beyond a range extreme and being rejected, indicating no acceptance at the new level.",e:"The auction-theory description of the same event ICT calls a sweep and Wyckoff calls a spring.",rel:["Spring","Liquidity sweep"]},
{t:"Trend day vs balance day",c:"pa",lvl:2,d:"A day that trends persistently in one direction versus one that rotates around a central value.",e:"Different strategies work on each, and you usually know which it is only after the first hour or two.",rel:["Initial balance","Open drive"]},
{t:"Diamond hands / paper hands",c:"slang",lvl:1,d:"Holding through volatility versus selling early. Used as praise and insult respectively.",e:"Both are marketing for someone else's exit. Neither is a risk framework.",rel:["Exit liquidity"],warn:true},
{t:"Catching a falling knife",c:"slang",lvl:1,d:"Buying an asset in freefall on the assumption it is cheap.",e:"There is no level at which a decline must stop. 'It cannot go lower' is a statement about your imagination.",rel:["Mean reversion","Averaging down"],warn:true},
{t:"Stop hunt",c:"slang",lvl:1,d:"The belief that price moved specifically to trigger your stop.",e:"Nobody is targeting you. Stops cluster at obvious levels, and price moving to where the orders are is the market working, not a conspiracy.",rel:["Liquidity sweep","Round numbers"],warn:true},
{t:"Revenge on the market",c:"slang",lvl:1,d:"Treating losses as a personal affront to be answered.",e:"The market has no memory of you and no opinion about your account.",rel:["Revenge trading","Tilt"]},
{t:"Buy the dip",c:"slang",lvl:1,d:"Adding on weakness within an assumed uptrend.",e:"Works brilliantly in a bull market and is indistinguishable from averaging down in a bear one. The distinction is the trend, which you learn afterwards.",rel:["Averaging down","Bull market"],warn:true},
{t:"To the moon",c:"slang",lvl:1,d:"Expectation of a large advance, usually stated without a mechanism or a target.",e:"A sentiment reading, not a thesis.",rel:["Economic rationale"]},
{t:"Alpha decay in public",c:"slang",lvl:2,d:"A shared edge stopping working once enough people trade it.",e:"A real mechanism for capacity-constrained strategies, and also a convenient excuse for something that never worked.",rel:["Factor decay","Capacity"]},
{t:"Backtest hero",c:"slang",lvl:2,d:"Someone with spectacular historical results and no live record.",e:"The gap between the two is the entire subject of the statistics section.",rel:["Paper-to-live gap","Overfitting"],warn:true},
{t:"Blown up",c:"slang",lvl:1,d:"Losing an account, usually through leverage rather than through being wrong.",e:"Almost always survivable as a lesson and almost never survivable as a position.",rel:["Risk of ruin","Position limit"]},
{t:"Boredom trading",c:"psy",lvl:1,d:"Entering because nothing is happening and watching is uncomfortable.",e:"The setup did not appear; the discomfort did. Those are different signals.",rel:["Overtrading","Discipline"]},
{t:"Sleep and decision quality",c:"psy",lvl:1,d:"The measurable degradation in judgement, risk perception and impulse control from poor sleep.",e:"Directly relevant if you trade the New York session from Perth. Trading tired is a sizing decision you did not know you were making.",rel:["Trading US hours from Perth","Screen time"],warn:true},
{t:"Identity and trading",c:"psy",lvl:2,d:"Attaching self-worth to trade outcomes, so a loss becomes a verdict on you.",e:"Makes it nearly impossible to cut losers, because closing the trade makes the judgement final.",rel:["Loss aversion","Process vs outcome"]},
{t:"Isolation",c:"psy",lvl:2,d:"Trading alone with no colleague to challenge a thesis.",e:"Nobody says 'that is your third revenge trade'. A written journal is the substitute, and a weak one.",rel:["Trading journal","Key person risk"]},
{t:"Expectation setting",c:"psy",lvl:1,d:"Having a realistic view of achievable returns before starting.",e:"Consistent 10% a month is not a benchmark, it is a marketing claim. Professional managers celebrate a good year at 15–20%.",rel:["Benchmark","Guaranteed returns"],warn:true},
{t:"Variance tolerance",c:"psy",lvl:2,d:"How much swing you can experience without abandoning the plan.",e:"The real constraint on position size, and it is personal. Size to what you can sit through, not to what the maths permits.",rel:["Drawdown","Position sizing"]},
{t:"Detachment from money",c:"psy",lvl:3,d:"Thinking in R multiples and percentages rather than dollars.",e:"Helps with execution and can hide how large a position actually is. Check the dollar figure periodically anyway.",rel:["R","Notional value"]},
{t:"The first big win problem",c:"psy",lvl:2,d:"An early outsized gain teaching the wrong lesson about what works.",e:"A lucky win reinforces whatever you happened to do, which is how bad habits get installed with confidence.",rel:["Overconfidence after a win streak","Sample size"],warn:true},
{t:"Quitting well",c:"psy",lvl:2,d:"Deciding in advance what evidence would make you stop trading altogether.",e:"A legitimate and underrated outcome. If a documented process shows no edge after a fair trial, stopping is the correct result, not a failure.",rel:["Null result","Strategy retirement"]},
{t:"Wyckoff method",c:"wyc",lvl:2,d:"Richard Wyckoff's framework reading price and volume as the footprint of a large operator accumulating and distributing stock.",e:"Published in the 1930s. Almost every 'smart money' concept circulating today is a renamed piece of it.",rel:["Accumulation","Composite operator"]},
{t:"Composite operator",c:"wyc",lvl:2,d:"Wyckoff's device of treating all large buyers as one rational actor, to reason about intent.",e:"A thinking tool, not a claim that a single entity exists. Modern retail content frequently forgets that distinction.",rel:["Smart money","Wyckoff method"],warn:true},
{t:"Selling climax",c:"wyc",lvl:2,d:"Panic selling on enormous volume that marks the end of a decline as large buyers absorb supply.",e:"Wide range, huge volume, close well off the low. The volume is the evidence, not the candle shape.",rel:["Capitulation","Automatic rally"]},
{t:"Automatic rally",c:"wyc",lvl:3,d:"The sharp bounce after a selling climax, once aggressive selling exhausts and supply thins.",e:"It defines the upper boundary of the trading range that follows.",rel:["Selling climax","Trading range"]},
{t:"Secondary test",c:"wyc",lvl:3,d:"A return toward the climax low on reduced volume and a narrower range, confirming supply has dried up.",e:"Lower volume on the retest is the actual signal. Same price, less selling.",rel:["Selling climax"]},
{t:"Trading range",c:"wyc",lvl:2,d:"The sideways band where accumulation or distribution takes place, bounded by the climax and the automatic reaction.",e:"Wyckoff's whole method is about determining which of the two is happening inside it.",rel:["Accumulation","Distribution"]},
{t:"Sign of strength",c:"wyc",lvl:3,d:"A wide-range advance on expanding volume through range resistance, indicating demand has taken control.",e:"Paired with a 'last point of support' pullback, it is Wyckoff's entry trigger.",rel:["Last point of support","Markup / markdown"]},
{t:"Last point of support",c:"wyc",lvl:3,d:"The final higher low after a sign of strength, before markup begins.",e:"Structurally identical to what modern content calls a bullish order block retest.",rel:["Sign of strength","Order block"]},
{t:"Effort vs result",c:"wyc",lvl:2,d:"Comparing volume (effort) against the price move it produced (result). A mismatch signals absorption.",e:"Huge volume with a small range means someone large is taking the other side. This is the most transferable idea in the whole method.",rel:["Absorption","Volume confirmation"]},
{t:"Supply and demand zones",c:"wyc",lvl:1,d:"Areas where one side previously overwhelmed the other, expected to matter again.",e:"The modern retail repackaging of Wyckoff's ranges. Same observation, newer vocabulary, no new evidence.",rel:["Support / resistance","Order block"]},
{t:"Phases A to E",c:"wyc",lvl:3,d:"Wyckoff's labelling of a range: stopping the trend, building the cause, testing, breaking out, and trending away.",e:"Like Elliott's counts, the labels are applied confidently in hindsight and argued about in real time.",rel:["Wave count","Pattern subjectivity"],warn:true},
{t:"Cause and effect",c:"wyc",lvl:3,d:"Wyckoff's idea that the time spent building a range determines the size of the move out of it.",e:"An appealing proportionality claim that is rarely stated precisely enough to test.",rel:["Falsifiability","Measured move"],warn:true},
{t:"Internal vs external liquidity",c:"ict",lvl:3,d:"Liquidity resting inside a range versus beyond its extremes.",e:"A framework for sequencing targets: sweep the inside first, then run for the outside. Testable in principle, rarely tested in practice.",rel:["Draw on liquidity","Liquidity pool"]},
{t:"Liquidity pool",c:"ict",lvl:2,d:"A concentration of resting stop and entry orders, typically just beyond an obvious high or low.",e:"The one genuinely mechanical idea in the framework: stops cluster where everyone can see the level.",rel:["Equal highs / equal lows","Round numbers"]},
{t:"Propulsion block",c:"ict",lvl:3,d:"An order block forming inside a prior one, taught as a strengthened continuation zone.",e:"The taxonomy expands faster than the evidence. Each new sub-type adds researcher degrees of freedom.",rel:["Degrees of freedom","Order block"],warn:true},
{t:"Balanced price range",c:"ict",lvl:3,d:"An area where up and down imbalances overlap, considered rebalanced.",e:"An imbalance filled in both directions. Useful bookkeeping, not a signal.",rel:["Imbalance","Liquidity void"]},
{t:"Rejection block",c:"ict",lvl:3,d:"A zone defined by the wicks rather than the bodies of a cluster of candles.",e:"Another variant of the same underlying observation — price went there and came back.",rel:["Rejection","Order block"]},
{t:"Optimal trade entry",c:"ict",alt:"OTE",lvl:3,d:"A retracement band, commonly 62–79% of a leg, treated as the preferred entry zone.",e:"Fibonacci retracement with a house name and a narrower band.",rel:["Fibonacci retracement","Equilibrium / 50% level"]},
{t:"Unicorn model",c:"ict",lvl:3,d:"A setup requiring a breaker block and a fair value gap to overlap.",e:"Adding conditions raises the apparent quality and shrinks the sample. Both effects are guaranteed; only one is useful.",rel:["Sample size","A+ setup"],warn:true},
{t:"Institutional order flow",c:"ict",lvl:2,d:"The framework's central claim: that large participants leave readable footprints in price.",e:"Real footprints exist in order flow data, which retail cannot see. Inferring them from candles alone is the leap the evidence does not support.",rel:["Order flow information","Smart money"],warn:true},
{t:"Framework vs strategy",c:"ict",lvl:1,d:"A framework describes markets; a strategy states entries, exits and size precisely enough to test.",e:"Most ICT material is the former sold as the latter. Converting it into a fully specified rule is where the claims usually dissolve.",rel:["Fully specified rule","Falsifiability"]},
{t:"Volatility clustering",c:"stat",lvl:2,d:"The tendency for volatile days to follow volatile days, and calm to follow calm.",e:"One of the most robust empirical facts in finance, and far more forecastable than direction.",rel:["Autocorrelation","Volatility regime"]},
{t:"Volatility smile",c:"opt",lvl:3,d:"The curved shape of implied volatility across strikes, dearer at both extremes.",e:"Appeared in equity index options after 1987, when the market learned crashes happen.",rel:["Volatility skew"]},
{t:"Gamma pinning",c:"opt",lvl:3,d:"Price gravitating toward a large open-interest strike near expiry as dealer hedging suppresses movement.",e:"A plausible, mechanically-explained effect. Also frequently invoked after the fact for any quiet expiry day.",rel:["Gamma exposure","Max pain"]},
{t:"Charm and vanna",c:"opt",lvl:3,d:"Second-order greeks: how delta changes with time, and how delta changes with volatility.",e:"Drive dealer hedging flows into expiry and around volatility shifts. Institutional detail, retail folklore.",rel:["Delta hedging","Gamma exposure"]},
{t:"Delta hedging",c:"opt",lvl:3,d:"Continuously trading the underlying to keep an option position directionally neutral.",e:"The activity that converts options positioning into actual buying and selling of the underlying.",rel:["Option delta","Gamma exposure"]}
);
D.push(
{t:"Volatility as an asset class",c:"opt",lvl:3,d:"Treating volatility itself as something to be long or short, independent of direction.",e:"Most retail 'income' strategies are short volatility without the trader framing it that way.",rel:["Short volatility","Variance risk premium"],warn:true},
{t:"Realised vs implied spread",c:"opt",lvl:3,d:"The gap between what the market charged for volatility and what actually occurred.",e:"Positive on average, which is the variance risk premium, and violently negative in the periods that matter.",rel:["Variance risk premium","Tail risk"]},
{t:"Last traded price",c:"basics",lvl:1,d:"The price of the most recent execution — distinct from the bid and the ask.",e:"You cannot trade at the last price. You buy at the ask and sell at the bid.",rel:["Bid","Ask"]},
{t:"Mid price",c:"basics",lvl:1,d:"The midpoint between bid and ask, used as a fair reference and never guaranteed as a fill.",e:"Marking a portfolio at mid overstates what you would actually receive liquidating it.",rel:["Spread","Midpoint / pegged order"]},
{t:"Quote vs trade",c:"basics",lvl:2,d:"A quote is an intention to trade; a trade is an execution that happened.",e:"Quote data is much larger and much noisier. Most retail charts show trades only.",rel:["Order book / DOM","Time and sales"]},
{t:"Position vs order",c:"basics",lvl:1,d:"A position is exposure you hold; an order is an instruction that may or may not become one.",e:"Confusing the two is how people believe they are flat while a working order fills behind them.",rel:["Time in force","Reconciliation"],warn:true},
{t:"Realised vs unrealised",c:"basics",lvl:1,d:"Profit banked by closing versus profit that exists only while the position is open.",e:"Unrealised gains are a loan from the market, repayable on demand.",rel:["Drawdown on a position","Withdrawal policy"]},
{t:"Leverage vs margin",c:"basics",lvl:1,d:"Leverage is the ratio of exposure to capital; margin is the deposit required to hold it.",e:"Low margin does not mean low leverage — it usually means the opposite.",rel:["Notional value","Capital efficiency"],warn:true},
{t:"Long-only vs long-short",c:"basics",lvl:2,d:"Whether a strategy can profit from declines or only from advances.",e:"Long-only strategies inherit the market's long-run upward drift, which flatters every backtest of them.",rel:["Beta","Benchmark"]},
{t:"Instrument selection",c:"basics",lvl:2,d:"Choosing what to trade based on liquidity, cost, hours and contract size relative to your account.",e:"For a small Australian account, micro futures and liquid ETFs clear the cost hurdle. Illiquid small caps and exotic FX do not.",rel:["Round turn","Liquidity"]},
{t:"Minimum viable account",c:"basics",lvl:1,d:"The smallest balance where costs and minimum position sizes do not dominate the outcome.",e:"If a 1% risk budget cannot buy one contract with a sensible stop, the instrument is wrong for the account.",rel:["Position sizing","Capital allocation"]},
{t:"Paper profit trap",c:"basics",lvl:1,d:"Treating open gains as achievement and sizing up before they are realised.",e:"The equity high is not money until it is closed and, ideally, withdrawn.",rel:["Realised vs unrealised","Trailing drawdown"],warn:true},
{t:"Trade frequency",c:"basics",lvl:1,d:"How often a strategy trades, which determines both cost drag and how fast you accumulate evidence.",e:"A once-a-month strategy needs years to produce a meaningful sample. That is a real constraint on validating slow ideas.",rel:["Sample size","Turnover"]},
{t:"Sweep the book",c:"flow",lvl:2,d:"A single aggressive order consuming several price levels at once.",e:"Visible as a burst of prints across levels. Signals urgency, which is rarer and more informative than size alone.",rel:["Aggressor","Market impact"]},
{t:"Stacked bids / offers",c:"flow",lvl:3,d:"Large resting size at consecutive levels, giving the appearance of a wall.",e:"Walls that vanish as price approaches were never real. That is the ordinary case, not the exception.",rel:["Spoofing","Order book / DOM"],warn:true},
{t:"Liquidity gap",c:"flow",lvl:2,d:"A price region with very little resting size, where a modest order moves price a long way.",e:"Where the fast moves happen. Overnight sessions are mostly this.",rel:["Overnight range","Slippage"]},
{t:"Trade imbalance",c:"flow",lvl:3,d:"A significant skew between aggressive buying and selling over a window.",e:"Informative in real order flow data, and only approximated by anything derived from OHLCV bars.",rel:["Delta","Order flow"]},
{t:"Exchange fees and rebates",c:"exec",lvl:3,d:"Venues often charge takers and pay makers, or the reverse.",e:"For high-frequency strategies the rebate is the edge. For retail it is a rounding error inside the commission.",rel:["Round turn","Payment for order flow"]},
{t:"Queue position",c:"exec",lvl:3,d:"Where your resting limit order sits in the priority line at a price level.",e:"At the back of a long queue you get filled mainly when the level is about to break — which is adverse selection by construction.",rel:["Adverse selection","Fill rate"]},
{t:"Execution algorithm",c:"exec",lvl:3,d:"Software slicing an order over time or volume to reduce impact.",e:"Necessary above a certain size. Irrelevant at one contract, which is a genuine advantage of being small.",rel:["TWAP / VWAP execution","Capacity"]},
{t:"Crossing the spread",c:"exec",lvl:1,d:"Paying the ask to buy or hitting the bid to sell, for immediate execution.",e:"The cost of certainty. On a one-tick MNQ spread it is $0.50 a contract each way, every time.",rel:["Spread","Round turn"]},
{t:"Flight to quality",c:"macro",lvl:2,d:"Capital moving into government bonds, the dollar and gold during stress.",e:"The mechanism behind the classic negative stock-bond correlation, which does not hold when inflation is the problem.",rel:["Risk-on / risk-off","Correlation breakdown"]},
{t:"Liquidity conditions",c:"macro",lvl:2,d:"How much cash is sloshing through the financial system, driven by central bank balance sheets and fiscal flows.",e:"A slow variable that explains multi-month trends better than any chart pattern does.",rel:["Quantitative easing","Repo"]},
{t:"Positioning",c:"macro",lvl:2,d:"How the market is already leaning, readable from futures data, options open interest and fund surveys.",e:"Explains why good news can sell off: if everyone is already long, there is nobody left to buy.",rel:["COT report","Herding"]},
{t:"Priced in",c:"macro",lvl:1,d:"Information already reflected in the current price.",e:"The reason an expected rate cut can produce no rally. You are trading the surprise, not the event.",rel:["Consensus / expected","Rate expectations"]},
{t:"Event risk",c:"macro",lvl:1,d:"Exposure to a scheduled or unscheduled announcement that can gap price.",e:"Scheduled event risk is a choice. Being in a position through CPI is a decision, whether or not you made it deliberately.",rel:["Economic calendar","Gap risk"],warn:true},
{t:"Correlation to the index",c:"riskt",lvl:1,d:"How much of a position's movement is simply the whole market moving.",e:"Most single-stock trades are mostly an index bet. If you would not take the index position, reconsider the stock one.",rel:["Beta","Concentration"]},
{t:"Drawdown duration tolerance",c:"riskt",lvl:2,d:"How long you can stay underwater before abandoning a system.",e:"Nearly always shorter than the backtest's worst stretch. Compare the two numbers before committing.",rel:["Time under water","Variance tolerance"]},
{t:"Position ageing",c:"riskt",lvl:3,d:"Tracking how long positions have been open relative to the intended holding period.",e:"A trade held far past its thesis window has quietly become a different trade.",rel:["Time stop"]},
{t:"Chart timeframe alignment",c:"tech",lvl:2,d:"Whether your bars close on the same boundaries as the exchange session and as everyone else's charts.",e:"A 4-hour chart anchored to your local midnight shows different candles to one anchored to New York. Both are 'correct' and they disagree.",rel:["Timezone alignment","Session"],warn:true},
{t:"Bar close vs intrabar signal",c:"tech",lvl:1,d:"Whether a rule triggers only on a completed bar or the moment a condition is met inside one.",e:"Intrabar triggers can un-trigger before the close. A backtest evaluating on closes but a live bot firing intrabar are two different strategies.",rel:["Repainting","Look-ahead bias"],warn:true},
{t:"Replay testing",c:"tech",lvl:2,d:"Stepping through historical data bar by bar without seeing what comes next.",e:"The honest manual version of a backtest. Slow, and it removes hindsight in a way scrolling a chart cannot.",rel:["Hindsight bias","Forward test"]},
{t:"Screener",c:"tech",lvl:2,d:"A filter run across many instruments to surface those meeting set conditions.",e:"Useful for finding candidates and a fast route to multiple testing if you run dozens of screens and trade whatever surfaces.",rel:["Multiple testing","Universe"],warn:true},
{t:"Watchlist discipline",c:"tech",lvl:2,d:"Deciding in advance what you will look at, so the day is not spent hunting.",e:"An unbounded search across thousands of instruments guarantees you find something. That is not the same as finding an edge.",rel:["Screener","Selection bias"]},
{t:"Consistent profitability",c:"prop",lvl:1,d:"Producing returns steadily rather than in lumps — an evaluation requirement, and a poor description of how real edges behave.",e:"Genuine strategies are lumpy. A rule demanding smoothness selects for short-volatility behaviour.",rel:["Consistency rule","Short volatility"],warn:true},
{t:"Evaluation expected cost",c:"prop",lvl:2,d:"The fee multiplied by the expected number of attempts before passing.",e:"At a 5% pass rate a $150 evaluation has an expected cost near $3,000. That is the number to compare against the payout.",rel:["Reset fee","Evaluation"],warn:true},
{t:"Payout verification",c:"prop",lvl:2,d:"Checking that a firm actually pays, through independently verifiable evidence rather than testimonials.",e:"Screenshots are not evidence. A firm's payout record is the only part of the offer that matters.",rel:["Track record screenshot","Payout split"]},
{t:"Two-step vs one-step",c:"prop",lvl:2,d:"Whether the evaluation has one profit target or two phases with separate targets.",e:"More phases means more chances to breach a drawdown rule. The pass rate falls accordingly.",rel:["Evaluation","Trailing drawdown"]},
{t:"Cost basis",c:"cost",lvl:1,d:"What you paid for an asset, including fees, used to calculate gain or loss.",e:"Tracking it accurately across partial fills and multiple entries is the tedious part of tax time. Do it as you go.",rel:["CGT","Record keeping"]},
{t:"FIFO vs specific identification",c:"cost",lvl:2,d:"Whether disposals are matched to the earliest purchase or to a chosen parcel.",e:"Changes the calculated gain substantially when you have accumulated over time. Rules vary — accountant territory.",rel:["Cost basis","CGT"]},
{t:"Realisation event",c:"cost",lvl:2,d:"The moment a gain or loss becomes taxable, generally on disposal rather than on paper.",e:"Unrealised gains are not taxed, which is why the timing of a sale is a tax decision as well as a trading one. General information only.",rel:["Realised vs unrealised","CGT"]},
{t:"Deductible expenses",c:"cost",lvl:2,d:"Costs of producing assessable income — data, platform fees, interest — which may be deductible depending on your status.",e:"Depends heavily on whether you are carrying on a business of trading. Get advice rather than a forum answer.",rel:["Trader vs investor status"]},
{t:"Foreign income",c:"cost",lvl:3,d:"Gains earned overseas, which may be taxable at home with credits for tax already paid abroad.",e:"Trading US futures from Australia raises this. It is not optional and it is not complicated once set up properly.",rel:["Currency exposure","CGT"]},
{t:"Exchange outage",c:"cry",lvl:2,d:"A venue going down or halting withdrawals, usually during maximum volatility.",e:"Positions cannot be managed and funds cannot be moved. This has ended more crypto accounts than bad analysis.",rel:["Platform risk","Custody"],warn:true},
{t:"Insurance fund",c:"cry",lvl:3,d:"An exchange reserve covering losses when a liquidation cannot be closed above bankruptcy price.",e:"When it is exhausted, some venues socialise losses across profitable traders. Read the policy before using leverage there.",rel:["Liquidation cascade","Counterparty risk"],warn:true},
{t:"Auto-deleveraging",c:"cry",lvl:3,d:"An exchange force-closing profitable positions to cover losses it cannot otherwise settle.",e:"Your winning trade is closed without your consent. A risk that simply does not exist on regulated futures exchanges.",rel:["Insurance fund","Clearing house"],warn:true},
{t:"Isolated vs cross margin",c:"cry",lvl:2,d:"Whether a position's margin is ring-fenced or drawn from the whole account balance.",e:"Cross margin means one bad position can liquidate everything. Isolated caps the damage to that trade.",rel:["Liquidation","Position limit"],warn:true},
{t:"Perp funding arbitrage",c:"cry",lvl:3,d:"Collecting funding by holding offsetting spot and perpetual positions.",e:"Delta-neutral in theory. The residual risks are exchange failure, funding flipping, and both legs sitting on different venues.",rel:["Basis / cash-and-carry","Counterparty risk"]},
{t:"Effect size",c:"stat",lvl:2,d:"How large an effect is, as distinct from how confident you are that it exists.",e:"A statistically significant edge of half a tick is real and untradeable. Significance and importance are different questions.",rel:["p-value","Cost drag"]},
{t:"Power",c:"stat",lvl:3,d:"The probability a test detects an effect that is genuinely there.",e:"Retail samples are usually badly underpowered, meaning a null result is weak evidence of absence — and a positive one is likely to be inflated.",rel:["Sample effect size","Sample size"]},
{t:"Sample effect size",c:"stat",lvl:3,d:"The measured magnitude in your sample, which overstates the truth when power is low and you only report winners.",e:"Known as the winner's curse. The first estimate of a new edge is almost always too flattering.",rel:["Power","Regression to the mean"],warn:true},
{t:"Effective breadth",c:"stat",lvl:3,d:"The number of genuinely independent bets a strategy makes per period.",e:"The fundamental law of active management: skill times the square root of breadth. Sixty correlated assets do not give sixty bets.",rel:["Effective sample size","Correlation"]},
{t:"Backtest overfitting by iteration",c:"stat",lvl:1,d:"Overfitting accumulated across many small manual adjustments rather than one big search.",e:"Nobody counts these, which is exactly why the trial ledger exists. Every tweak you eyeballed is a trial.",rel:["Trial ledger","p-hacking"],warn:true},
{t:"Reporting the whole search",c:"stat",lvl:1,d:"Disclosing every variant tried, not just the one presented.",e:"Without it, a reported Sharpe carries no information about the future. This is the single most important reporting rule here.",rel:["Trial ledger","Multiple testing"]},
{t:"Alpha versus noise",c:"basics",lvl:1,d:"Whether a result reflects skill or the ordinary variation of a random process.",e:"At this project's trial count, noise alone produces best-of-search Sharpes around 2.4. That is the bar a claim of skill has to clear.",rel:["Noise floor","Random trader benchmark"]},
{t:"Trading as a business",c:"ops",lvl:1,d:"Treating it as an operation with fixed costs, records, a capital base and a review cycle.",e:"The framing that makes cost drag, tax and record keeping feel like the core work they actually are.",rel:["Record keeping","Capital allocation"]},
{t:"Opportunity cost of time",c:"ops",lvl:1,d:"What the hours spent trading and researching could have produced elsewhere.",e:"Worth costing honestly. A thousand hours for a return below the index is a result, and it is one worth knowing.",rel:["Benchmark","Quitting well"]},
{t:"Skill vs luck attribution",c:"ops",lvl:2,d:"Distinguishing outcomes caused by your decisions from those caused by variance.",e:"Requires a large sample and a plan recorded in advance. Without both, every good month reads as skill.",rel:["Process vs outcome","Sample size"]},
{t:"Definition of done",c:"ops",lvl:2,d:"The stated conditions under which a research question counts as answered.",e:"Written before the test, it prevents the goalposts moving when the answer is disappointing.",rel:["Pre-registration","Null result"]}
);
D.push(
{t:"Research backlog",c:"ops",lvl:3,d:"A queue of hypotheses waiting to be tested, prioritised by how strong the proposed mechanism is.",e:"Prioritising by mechanism rather than by chart appeal is what keeps a search from becoming a fishing trip.",rel:["Economic rationale","Pre-registration"]},
{t:"Negative result archive",c:"ops",lvl:1,d:"A permanent record of what did not work and why.",e:"The most valuable document in a research project, and the one everyone deletes. A hidden failed search is a lie by omission.",rel:["Trial ledger","Null result"]},
{t:"Exit strategy",c:"mgmt",lvl:1,d:"The predefined rules for how a trade ends — target, stop, time limit, or trailing rule.",e:"Entries are heavily studied and exits decide the distribution of outcomes. A random entry with a good exit beats the reverse more often than anyone expects.",rel:["Take profit","Stop loss"]},
{t:"Stop placement logic",c:"mgmt",lvl:1,d:"Placing the stop where the idea is proven wrong, not at a dollar amount you find comfortable.",e:"If a $50 loss is all you can accept but invalidation sits 60 points away, the answer is fewer contracts, not a closer stop.",rel:["Position sizing","Invalidation"]},
{t:"Invalidation",c:"mgmt",lvl:1,d:"The specific condition that proves the trade thesis wrong, decided before entry.",e:"'A 5-minute close back above the swept high' is invalidation. 'It felt wrong' is not.",rel:["Stop placement logic","Fully specified rule"]},
{t:"Structural stop",c:"mgmt",lvl:2,d:"A stop placed beyond a structural feature — a swing point, a range edge, an order block.",e:"Ties the exit to the reason for entry. It also puts your stop where everyone else's is, which is a real trade-off.",rel:["Liquidity pool","Volatility stop"]},
{t:"Volatility stop",c:"mgmt",lvl:2,d:"A stop set at a multiple of ATR rather than at a chart feature.",e:"Adapts automatically as conditions change, and it ignores structure entirely. Many systems use the wider of the two.",rel:["ATR","Structural stop"]},
{t:"Stop too tight",c:"mgmt",lvl:1,d:"A stop inside the instrument's normal noise, so ordinary movement closes the trade.",e:"Produces a high loss rate that looks like bad analysis and is actually a measurement error. Compare stop distance to ATR before blaming the setup.",rel:["ATR","MAE / MFE"],warn:true},
{t:"Target selection",c:"mgmt",lvl:1,d:"Choosing where to take profit — a structural level, a measured move, an R multiple, or a volatility multiple.",e:"A fixed 3R target in an instrument that rarely travels 3R before reverting is a rule guaranteed to underperform.",rel:["Measured move","MAE / MFE"]},
{t:"Partial exit",c:"mgmt",lvl:2,d:"Closing part of the position while leaving the rest running.",e:"Lowers variance and lowers expectancy. Whether that is worth it is answered by your MFE data, not by preference.",rel:["Scaling out","Scaling out rules"]},
{t:"Runner management",c:"mgmt",lvl:2,d:"How the final portion of a position is handled once partials are taken.",e:"Trailing it too tightly gives back the entire benefit of leaving it on. Test the trail distance rather than guessing.",rel:["Runner","Trailing stop"]},
{t:"Moving a stop",c:"mgmt",lvl:1,d:"Adjusting a stop after entry — legitimate when it tightens risk, and a serious problem when it widens it.",e:"Widening a stop because price is approaching it is how a planned −1R becomes −4R. This single habit ends more accounts than any strategy flaw.",rel:["Break-even stop","Discipline"],warn:true},
{t:"Trade thesis",c:"mgmt",lvl:1,d:"The one-sentence reason you are in the trade, written at entry.",e:"When it no longer applies, exit — regardless of whether the stop has been hit. That is a legitimate discretionary exit; a bad feeling is not.",rel:["Invalidation","Trading journal"]},
{t:"Holding period",c:"mgmt",lvl:1,d:"How long a trade is intended to stay open, decided in advance.",e:"Drifting from an intraday plan into an overnight hold is a different strategy with different risk. Name it when it happens.",rel:["Time stop","Overnight risk"],warn:true},
{t:"Adding to winners",c:"mgmt",lvl:2,d:"Increasing size as a position moves in your favour, on a predefined schedule.",e:"Only sound in decreasing increments with the stop moved so total risk does not grow. Otherwise it is leverage with extra steps.",rel:["Pyramiding","Portfolio heat"],warn:true},
{t:"Exit on time",c:"mgmt",lvl:2,d:"Closing at a fixed point — session end, a set number of bars, or before a scheduled event.",e:"Removes overnight and event risk mechanically. Test what it costs; it is often less than people assume.",rel:["Time stop","Event risk"]},
{t:"Reversal vs exit",c:"mgmt",lvl:2,d:"Whether the signal to close is also a signal to enter the other side.",e:"Always-in systems are a distinct design with double the turnover. Do not become one by accident after a stop-out.",rel:["Revenge trading","Turnover"],warn:true},
{t:"Post-exit review",c:"mgmt",lvl:2,d:"Recording where price went after you exited, to test whether your exits leave money on the table.",e:"The only way to know whether targets are too near or too far. Almost nobody logs it, which is why almost nobody knows.",rel:["MAE / MFE","Journaling the near-misses"]},
{t:"Slippage on exit",c:"mgmt",lvl:2,d:"The extra cost of exiting in adverse conditions, which is worse than entry slippage because you are not choosing the moment.",e:"Stops fill in fast markets by definition. Model exit slippage more pessimistically than entry slippage.",rel:["Slippage","Brutal cost model"],warn:true},
{t:"One trade at a time",c:"mgmt",lvl:1,d:"A constraint limiting you to a single open position while learning.",e:"Makes attribution possible and caps correlated exposure at one. Underrated as a starting rule.",rel:["Maximum position count","Portfolio heat"]}
);

{t:"Consolidation",c:"pa",d:"Price coiling into a progressively tighter range as buyers and sellers reach agreement. Different from a plain range: a range has flat boundaries, consolidation narrows.",e:"Each swing gets smaller and each candle's range shrinks. Volatility contracting like this usually resolves with an expansion — it just doesn't tell you which way.",v:{k:"c",d:[[100,110,92,108],[108,109,94,96],[96,106,95,104],[104,105,98,99],[99,103.5,98.5,102.5],[102.5,103,100,100.5],[100.5,102,100,101],[101,101.6,100.2,100.8],[100.8,109,100.5,108]],pl:[{pts:[[0,110],[1,109],[2,106],[3,105],[4,103.5],[5,103],[6,102],[7,101.6]],c:"a"},{pts:[[0,92],[1,94],[2,95],[3,98],[4,98.5],[5,100],[6,100],[7,100.2]],c:"a"}],mk:[{i:8,p:109,t:"expansion",c:"u",left:true}]},cap:"The two lines converging is the tell. Tight coils resolve violently."},
{t:"Accumulation",c:"pa",d:"A period where large buyers build positions quietly at low prices, absorbing supply without pushing price up. From Wyckoff. The base that forms before an uptrend.",e:"After a long decline price stops making lower lows and goes sideways for weeks on steady volume. Nothing looks exciting — that's the point.",v:{k:"c",d:[[112,113,104,105],[105,106,96,97],[97,99,92,93],[93,98,91,97],[97,99,93,94],[94,98,90,96],[96,99,94,98],[98,100,95,99],[99,105,98,104],[104,110,103,109]],bx:[{i0:2,i1:7,p0:90,p1:99,c:"a",t:"accumulation range"}],mk:[{i:9,p:110,t:"markup",c:"u",left:true}]},cap:"Selling gets absorbed sideways. The trend that follows starts here, not at the breakout."},
{t:"Distribution",c:"pa",d:"The mirror of accumulation — large holders offloading into strength near highs while price goes sideways. The ceiling that forms before a downtrend.",e:"Price stops making higher highs, chops in a range, and every rally gets sold. Retail is usually most bullish here.",v:{k:"c",d:[[90,98,89,97],[97,106,96,105],[105,112,104,111],[111,113,106,107],[107,112,105,111],[111,112.5,106,107],[107,111,104,105],[105,109,103,104],[104,105,98,99],[99,100,92,93]],bx:[{i0:3,i1:7,p0:103,p1:113,c:"d",t:"distribution range"}],mk:[{i:9,p:92,t:"markdown",below:true,c:"d",left:true}]}},
{t:"Markup / markdown",c:"pa",d:"The trending phases either side of accumulation and distribution. Markup is the rally out of a base; markdown is the decline out of a top. The four together are Wyckoff's cycle.",e:"Accumulation → markup → distribution → markdown, then it repeats. It's the same idea ICT repackages as accumulation, manipulation, distribution."},
{t:"Spring",c:"pa",d:"A dip below an accumulation range's low that immediately reclaims it. Wyckoff's term for the shakeout that clears out weak holders before markup.",e:"Structurally identical to what ICT calls a liquidity sweep — the concept predates it by about a century.",v:{k:"c",d:[[100,101,96.2,97],[97,101,96.1,100],[100,101,97,98],[98,99,92,96.5],[96.5,101,96,100],[100,104,99,103],[103,108,102,107]],hl:[{p:96.1,t:"range low",c:"a",la:true}],mk:[{i:3,p:92,t:"spring",below:true,c:"s"}]},cap:"Down through the floor, then straight back above it. The reclaim is the signal, not the dip."},
{t:"Upthrust",c:"pa",d:"The opposite of a spring — a poke above a distribution range's high that fails and closes back inside. Wyckoff called the version at the very top a UTAD.",e:"The last trap before markdown begins."},
{t:"Expansion",c:"pa",d:"A sharp increase in range and volatility, usually out of consolidation. One of the four things price can do: expand, retrace, reverse, or consolidate.",e:"Candle ranges triple and the wicks disappear. ICT calls the same thing displacement."},
{t:"Equal highs / equal lows",c:"pa",d:"Two or more swing points finishing at almost exactly the same price. They look like strong levels and function as magnets, because stops pile up just beyond them.",e:"Three touches within a couple of points at 23,600. Everyone's stop is in the same five-point band.",v:{k:"c",d:[[94,100.3,93,99],[99,100.2,96,97],[97,100.4,96,99],[99,100,95,96],[96,100.3,95,99],[99,104,98,103]],hl:[{p:100.4,t:"equal highs",c:"s"}],mk:[{i:5,p:104,t:"taken",c:"d",left:true}]}},
{t:"Retracement vs reversal",c:"pa",d:"A retracement is a pause inside the trend; a reversal is the trend ending. The distinction is only confirmable after the fact, which is why structure rules exist.",e:"Rule of thumb: until a higher low breaks, it's a retracement. Once it breaks, treat it as a reversal until proven otherwise."},
{t:"Previous day high / low",c:"pa",d:"PDH and PDL. Yesterday's extremes, carried onto today's chart. Among the most watched intraday levels precisely because everyone can see them.",e:"Price runs to PDH at 10am, sweeps it by four points, and reverses. That's a liquidity sweep of an obvious level.",v:{k:"c",d:[[97,99,95,98],[98,100,96,99],[99,102.4,98,101],[101,102,99,100],[100,102.6,99,100],[100,101,97,98],[98,99,95.2,96]],hl:[{p:102.4,t:"PDH",c:"a"},{p:95,t:"PDL",c:"a",la:true,below:true}],mk:[{i:4,p:102.6,t:"swept",c:"d"}]}},
{t:"Opening range",c:"pa",d:"The high and low of the first N minutes of a session — usually 5, 15 or 30. A reference box for the rest of the day.",e:"Trade the break of the 15-minute opening range, or fade the failed break of it. Both are real strategies with the same box.",v:{k:"c",d:[[100,102.2,99,101],[101,102,99.1,100],[100,102,99.5,101.5],[101.5,104,101,103.5],[103.5,106,103,105],[105,108,104,107]],bx:[{i0:0,i1:2,p0:99.1,p1:102.2,c:"a",t:"opening range"}],mk:[{i:3,p:104,t:"break",c:"u"}]}},
{t:"Gap fill",c:"pa",d:"Price returning to trade through a gap it previously jumped over. Common enough to be a strategy, unreliable enough to need a stop.",e:"Nasdaq gaps up 150 points and grinds back to the Friday close by midday."},
{t:"Chop",c:"pa",d:"Directionless, overlapping price action that stops out both sides. Not a phase you trade — a phase you sit out.",e:"Overlapping candles, no follow-through, ATR falling. The correct trade is usually none."},
{t:"Top-down analysis",c:"pa",d:"Reading the highest timeframe first for bias, then stepping down for the level, then down again for the entry trigger.",e:"Daily for direction, 15m for the zone, 5m for the trigger — three nested views, not three opinions."},
{t:"Anchored VWAP",c:"ind",d:"VWAP calculated from a specific event you choose rather than the session open.",e:"Anchor it to an earnings gap or a major swing low and it becomes a reference for everyone who bought after that event."}
);
D.push(
{t:"Order flow",c:"flow",d:"The actual sequence of buy and sell orders hitting the book. Everything on a candlestick chart is a summary of it after the fact.",e:"Candles tell you price moved. Order flow tells you whether it moved because buyers were aggressive or sellers just stepped away."},
{t:"Aggressor",c:"flow",d:"Whoever crosses the spread to get filled — the market order, not the resting limit order. Trades are classified by which side was aggressive.",e:"A trade at the ask is a buy aggressor; at the bid, a sell aggressor."},
{t:"Absorption",c:"flow",d:"Heavy aggressive buying or selling that fails to move price, because a large resting order is soaking it all up.",e:"Thousands of contracts hit the bid at 23,400 and price doesn't budge. Someone big is buying everything offered."},
{t:"Delta",c:"flow",d:"Buy-aggressor volume minus sell-aggressor volume. Cumulative delta sums it over time.",e:"Price makes a new high but cumulative delta doesn't — buyers are getting less aggressive, and the move is running on fumes.",v:{k:"e",s:[{v:[0,1.2,0.5,2.1,1.3,2.9],c:"a",t:"price"},{v:[0,1.2,0.6,2.0,1.1,1.4],c:"s",t:"cum. delta",below:true}],mk:[{i:5,p:2.9,t:"new high"},{i:5,p:1.4,t:"delta doesn't follow",below:true,c:"d"}]}},
{t:"Footprint chart",c:"flow",d:"A candle drawn with the traded volume at each price level inside it, split by aggressor side.",e:"Lets you see that a candle closed green but the buying all happened at the low."},
{t:"Iceberg order",c:"flow",d:"A large order that only shows a small portion in the book, refreshing as it fills, so its true size stays hidden.",e:"The 20 contracts at 23,400 keep refilling no matter how many you sell into them. That's not 20, it's 2,000."},
{t:"Spoofing",c:"flow",d:"Placing large orders with no intention of filling them, to create a false impression of supply or demand, then pulling them.",e:"Illegal in regulated markets and prosecuted. Also a reason the book you're staring at may be lying to you."},
{t:"Time and sales",c:"flow",d:"The raw scrolling list of every executed trade with price, size and time. The tape.",e:"Reading it is a genuine skill and largely obsolete for retail, because the machines read it faster."},
{t:"Point of Control",c:"flow",d:"POC — the single price level with the most volume traded in a session or range. The market's centre of gravity.",e:"Price often returns to it. A POC from a prior day that has never been retouched is called a naked or virgin POC.",v:{k:"raw",svg:'<svg viewBox="0 0 320 150" role="img" aria-label="volume profile with value area"><rect x="8" y="46" width="200" height="54" fill="var(--accent)" opacity="0.08"/><text class="lba" x="212" y="52">VAH</text><text class="lba" x="212" y="99">VAL</text><text class="lb" x="212" y="72">70% of volume</text><g fill="var(--ink3)" opacity="0.75"><rect x="8" y="14" width="26" height="8"/><rect x="8" y="25" width="44" height="8"/><rect x="8" y="36" width="70" height="8"/></g><g fill="var(--accent)" opacity="0.55"><rect x="8" y="47" width="104" height="8"/><rect x="8" y="58" width="132" height="8"/></g><rect x="8" y="69" width="196" height="8" fill="var(--signal)"/><text class="lbs" x="212" y="76">POC</text><g fill="var(--accent)" opacity="0.55"><rect x="8" y="80" width="140" height="8"/><rect x="8" y="91" width="98" height="8"/></g><g fill="var(--ink3)" opacity="0.75"><rect x="8" y="102" width="62" height="8"/><rect x="8" y="113" width="38" height="8"/><rect x="8" y="124" width="20" height="8"/></g><text class="lb" x="8" y="145">Volume by price, not by time. Widest bar wins.</text></svg>'},cap:"Turn a volume profile on its side and the shape tells you where business got done."},
{t:"Value area",c:"flow",d:"The price band containing about 70% of a session's volume, bounded by the Value Area High and Low.",e:"Price accepted inside the value area means balance. Price rejecting outside it means the auction is searching for a new one."},
{t:"Initial balance",c:"flow",d:"The range of the first hour of a session, used as the day's reference frame in auction theory.",e:"A day that never leaves its initial balance is a balanced day. One that breaks and extends is a trend day."},
{t:"Auction market theory",c:"flow",d:"The idea that markets move to facilitate trade, advertising higher prices until buying dries up and lower prices until selling dries up.",e:"The intellectual ancestor of most 'liquidity' language in modern SMC content."},
{t:"Open drive",c:"flow",d:"A session that opens and immediately trends hard in one direction without returning to the open.",e:"The strongest trend-day signature there is, and also the day type that punishes fading."}
);

{t:"Turtle soup",c:"ict",d:"Fading a false breakout of a prior high or low. Originally a rule from Connors and Raschke's Street Smarts — fade the 20-day breakout the Turtle traders were buying — later adopted into ICT material.",e:"Price breaks a 20-day high, fails to hold, and closes back below it. You short the failure, not the breakout.",v:{k:"c",d:[[95,99,94,98],[98,101.8,97,100],[100,101,97,98],[98,102,97,101],[101,105,100,101.5],[101.5,102,97,98],[98,99,93,94],[94,95,90,91]],hl:[{p:101.8,t:"prior high",c:"a",la:true}],mk:[{i:4,p:105,t:"failed break",c:"d"}]}},
{t:"Silver bullet",c:"ict",d:"An ICT setup restricted to specific one-hour windows — most commonly 10:00–11:00 New York — where you take the first fair value gap that forms after a liquidity sweep.",e:"Narrow by design: one hour, one pattern, one entry. The narrowness is also what makes the sample size small when you go to test it."},
{t:"Consequent encroachment",c:"ict",d:"The 50% level of a fair value gap, used as a more precise entry than the gap's edge.",e:"Instead of entering at the top of the FVG, you wait for the midpoint."},
{t:"Liquidity void",c:"ict",d:"A larger area of the chart price moved through in one shot, leaving very little trading in between. Broader than a single FVG.",e:"Often revisited later — the market 'rebalancing' an area it skipped."},
{t:"Draw on liquidity",c:"ict",d:"The pool the framework says price is currently heading toward — the objective, rather than the entry.",e:"\"Bearish, drawing on the sell-side liquidity below Tuesday's low.\" It's a directional target, stated as a destination."},
{t:"Daily bias",c:"ict",d:"Your one-line directional call for the session, decided before the session opens.",e:"Written down in advance, it stops you rewriting the story mid-move. Decided during the session, it's just following price."},
{t:"Asian range",c:"ict",d:"The high and low of the Asian session, used as a reference box for London and New York.",e:"For you in Perth the Asian session is your afternoon and evening — the one window that's actually convenient."},
{t:"True open",c:"ict",d:"A specific opening price used as the reference for premium and discount within a cycle, rather than the calendar open.",e:"Midnight New York for the day, Monday's 18:00 for the week. Above it is premium, below it is discount."},
{t:"Quarterly Theory",c:"ict",d:"A time-based framework popularised by Trader Daye, built on ICT's AMD idea. Every cycle is split into four quarters running Accumulation, Manipulation, Distribution, then Continuation or Reversal — and the same pattern is claimed to repeat fractally from yearly cycles down to 90-minute and 22.5-minute ones.",e:"Daily cycle: Asia accumulates, London manipulates from the true open, New York AM distributes, New York PM continues or reverses.",v:{k:"c",d:[[100,101,99,100],[100,101,99.3,100.4],[100.4,101,96,97],[97,98,95.5,96],[96,102,95.8,101],[101,107,100,106],[106,110,105,109],[109,110,106,107]],bx:[{i0:0,i1:1,p0:99,p1:101,c:"g",t:"Q1 accum"},{i0:2,i1:3,p0:95.5,p1:98,c:"d",t:"Q2 manip",below:true},{i0:4,i1:5,p0:95.8,p1:107,c:"u",t:"Q3 distrib"},{i0:6,i1:7,p0:105,p1:110,c:"a",t:"Q4"}]},cap:"One cycle, four quarters. The claim is that this nests inside itself at every timescale."},
{t:"90-minute cycle",c:"ict",d:"The execution-level layer of Quarterly Theory — each six-hour session split into four 90-minute blocks, each itself split into 22.5-minute quarters.",e:"Used to time entries within a session you already have a bias on."},
{t:"NDOG / NWOG",c:"ict",d:"New Day Opening Gap and New Week Opening Gap — the gap between one session's close and the next one's open.",e:"The Friday-close-to-Sunday-open gap is the one that catches weekend positions."},
{t:"Standard deviation projections",c:"ict",d:"Projecting targets as multiples of a measured leg — 1x, 2x, 2.5x the distance of the initial move.",e:"A way of setting targets without a level to aim at. Test whether the multiples actually hold before trusting them."},
{t:"Model",c:"style",d:"A single, fully specified setup you trade repeatedly — one bias rule, one entry trigger, one invalidation, one target.",e:"Having one model you've logged 100 trades on beats knowing twelve you've logged none on."},
{t:"A+ setup",c:"style",d:"A trade where every one of your conditions is met, rather than most of them.",e:"Useful as a filter, dangerous as an excuse — 'it was A+' is not a reason to size up beyond your risk rule."}

<script>
/* ====================================================================
   PAYOFF DIAGRAMS — data, not decoration.
   Profit at expiry across a price range for each option structure,
   stored as a raw chart spec on the term so the grid renders it like
   any other chart. Runs before the grid is built, so there is a single
   render path rather than a second injection pass afterwards.
   ==================================================================== */
(function(){
"use strict";
var W=320,H=150,PAD=14;

function payoff(legs,lo,hi){
  /* leg: {type:"c"|"p"|"s", strike, qty, prem}  qty<0 = short */
  var pts=[],n=64,i,j;
  for(i=0;i<=n;i++){
    var S=lo+(hi-lo)*i/n, v=0;
    for(j=0;j<legs.length;j++){
      var L=legs[j], intr;
      if(L.type==="c") intr=Math.max(0,S-L.strike)-L.prem;
      else if(L.type==="p") intr=Math.max(0,L.strike-S)-L.prem;
      else intr=S-L.strike;
      v+=intr*L.qty;
    }
    pts.push([S,v]);
  }
  return pts;
}

function payoffSvg(legs,label){
  var lo=60,hi=140;
  var pts=payoff(legs,lo,hi);
  var vs=pts.map(function(p){return p[1];});
  var vmax=Math.max.apply(null,vs), vmin=Math.min.apply(null,vs);
  var span=Math.max(1,vmax-vmin), padv=span*0.18;
  vmax+=padv; vmin-=padv;
  function X(S){return PAD+(S-lo)/(hi-lo)*(W-PAD*2);}
  function Y(v){return H-PAD-(v-vmin)/(vmax-vmin)*(H-PAD*2);}
  var zero=Y(0);
  var up="",dn="",i;
  for(i=0;i<pts.length;i++){
    var x=X(pts[i][0]).toFixed(1), y=Y(pts[i][1]).toFixed(1);
    (pts[i][1]>=0?  (up+= (up?"L":"M")+x+" "+y)
                 :  (dn+= (dn?"L":"M")+x+" "+y));
  }
  var line=pts.map(function(p,k){return (k?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1);}).join("");
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+' payoff at expiry">';
  s+='<line x1="'+PAD+'" y1="'+zero.toFixed(1)+'" x2="'+(W-PAD)+'" y2="'+zero.toFixed(1)+'" stroke="var(--rule2)" stroke-width="0.8" stroke-dasharray="3 3"/>';
  /* shade profit above the zero line and loss below it */
  s+='<path d="'+line+'L'+X(hi).toFixed(1)+' '+zero.toFixed(1)+'L'+X(lo).toFixed(1)+' '+zero.toFixed(1)+'Z" fill="var(--up)" opacity="0.10"/>';
  s+='<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round"/>';
  legs.forEach(function(L){
    if(L.type==="s")return;
    var x=X(L.strike).toFixed(1);
    s+='<line x1="'+x+'" y1="'+PAD+'" x2="'+x+'" y2="'+(H-PAD)+'" stroke="var(--signal)" stroke-width="0.6" opacity="0.55"/>';
  });
  s+='<text class="lb" x="'+PAD+'" y="'+(H-3)+'">underlying price →</text>';
  s+='<text class="lbu" x="'+(W-PAD)+'" y="'+(PAD+2)+'" text-anchor="end">profit</text>';
  s+='<text class="lbd" x="'+(W-PAD)+'" y="'+(H-PAD)+'" text-anchor="end">loss</text>';
  s+='</svg>';
  return s;
}

var SPEC={
  "Call":{legs:[{type:"c",strike:100,qty:1,prem:5}],cap:"Long call. Loss capped at the premium, upside open."},
  "Put":{legs:[{type:"p",strike:100,qty:1,prem:5}],cap:"Long put. Loss capped at the premium, profit grows as price falls."},
  "Naked option selling":{legs:[{type:"c",strike:100,qty:-1,prem:5}],cap:"Short call. Gain capped at the premium, loss uncapped. Look at the right-hand side."},
  "Covered call":{legs:[{type:"s",strike:100,qty:1,prem:0},{type:"c",strike:110,qty:-1,prem:4}],cap:"Stock plus a short call. The premium is paid for by giving up everything above the strike."},
  "Protective put":{legs:[{type:"s",strike:100,qty:1,prem:0},{type:"p",strike:95,qty:1,prem:4}],cap:"Stock plus a long put. The floor is what you bought; the premium is the cost of it."},
  "Vertical spread":{legs:[{type:"c",strike:100,qty:1,prem:6},{type:"c",strike:115,qty:-1,prem:2}],cap:"Both ends capped. Cheaper than the outright, and the upside stops at the short strike."},
  "Straddle / strangle":{legs:[{type:"c",strike:100,qty:1,prem:5},{type:"p",strike:100,qty:1,prem:5}],cap:"A bet on movement. You need a move larger than both premiums combined, either way."},
  "Iron condor":{legs:[{type:"p",strike:85,qty:1,prem:1},{type:"p",strike:92,qty:-1,prem:3},
                       {type:"c",strike:108,qty:-1,prem:3},{type:"c",strike:115,qty:1,prem:1}],
                 cap:"Wins in the middle, loses at both edges. The flat top is why it feels consistent until it isn't."},
  "Collar":{legs:[{type:"s",strike:100,qty:1,prem:0},{type:"p",strike:95,qty:1,prem:4},{type:"c",strike:110,qty:-1,prem:4}],
            cap:"Both ends fixed for roughly nothing. The standard way to hold a position you can't sell."},
  "Butterfly":{legs:[{type:"c",strike:90,qty:1,prem:12},{type:"c",strike:100,qty:-2,prem:5},{type:"c",strike:110,qty:1,prem:1}],
               cap:"A tight bet on finishing near the middle strike. Cheap, and usually worthless."},
  "Ratio spread":{legs:[{type:"c",strike:100,qty:1,prem:6},{type:"c",strike:110,qty:-2,prem:2}],
                  cap:"Looks defined until the right-hand side. Past the short strikes the loss keeps going."},
  "Short volatility":{legs:[{type:"c",strike:105,qty:-1,prem:3},{type:"p",strike:95,qty:-1,prem:3}],
                      cap:"Small steady gain in the middle, large loss at either tail. Most 'income' strategies are this shape."}
};

D.forEach(function(x){
  var sp=SPEC[x.t];
  if(!sp||x.v)return;
  x.v={k:"raw",svg:payoffSvg(sp.legs,x.t)};
  if(!x.cap)x.cap=sp.cap;
});
})();
</script>

<script>
/* =====================================================================
   LONG-FORM BODIES — first 20, for voice and depth approval.
   Rules followed: contested frameworks are named as contested, older
   documented names are credited, and there are no win rates, edges or
   invented statistics anywhere in here.
   ===================================================================== */
(function(){
var L={

"Liquidity sweep":{
long:"A sweep is price trading through a level where resting orders are known to sit, and then failing to hold beyond it. The level is usually an obvious one — a prior day's high, a session high, a double top — because obvious levels are where stop orders accumulate. Those stops are, mechanically, market orders waiting to fire.\n\nThe mechanism people propose is straightforward and does not require anyone to be manipulating anything. If a lot of stop orders sit above a high, price reaching that high triggers them, and that burst of buying pushes price further up in a short window. If there is no genuine demand behind the move, price falls back once the stops are exhausted. What is left on the chart is a wick through the level and a close back inside.\n\nThe reclaim is the event, not the poke. Price going above a high is ordinary. Price going above a high and closing back below it is the thing being described. If you treat the poke itself as a signal you will be early on almost every one.\n\nWhere people get fooled: sweeps are trivially easy to identify after the fact and genuinely hard to act on live, because at the moment of the wick you cannot tell a sweep from a breakout that is about to keep going. That asymmetry — obvious in hindsight, ambiguous in real time — is what makes the pattern feel far more reliable than it tests. In this project's own runs the sweep family was tested across 6 variants and then 784-variant sweeps, and lost out-of-sample.",
usage:"Generally used as a location filter rather than a trigger: it marks an area where a reversal might be attempted, and something else — a structure break, a close back through a level — provides the actual entry. It is also used to reason about where a stop should not go, since placing one just beyond an obvious high puts it in the pool everyone else's is in.",
see:["Spring","Equal highs / equal lows","Liquidity pool","Turtle soup","Stop hunt"]},

"Order block":{
long:"An order block is the last opposing candle before a strong directional move — the final down candle before a rally, or the final up candle before a decline. The claim is that large orders were filled in that candle's range, and that price returning there will meet unfilled interest from the same participants.\n\nThis is a community framework and it has no independent validation. The proposed mechanism is not observable from a price chart: you cannot see who transacted in a candle, only that it traded. The reasoning runs backwards — the move is used as evidence that large orders were there, and the presence of large orders is then used to explain the move.\n\nWhat the concept does capture, in a way that predates it by a century, is that price often returns to areas it left quickly. Wyckoff described the same observation in terms of supply and demand zones. Whether you call it an order block, a supply zone or the origin of a move, the chart feature is the same: an area price departed from with conviction.\n\nWhere people get fooled: the definition has a lot of freedom in it. Which candle counts, whether you use the body or the whole range, how many you can nominate on one chart, and whether a failed one retroactively becomes a breaker — each of those is a choice, and the more choices a pattern has the more reliably you can find one that explains whatever just happened. Count the degrees of freedom before trusting a backtest of it.",
usage:"Typically used as a zone to wait for rather than a signal to act on — price returning to the area is the setup, and confirmation comes from something else. The zone's edges are also commonly used to define invalidation, which is the more defensible use of it.",
see:["Supply and demand zones","Breaker block","Mitigation block","Fair value gap","Accumulation"]},

"Fair value gap":{
