<script>
/* ================= LIVE READ =================
   Reads real OHLCV from a keyless public endpoint and states what is
   measurably true right now, in the glossary's own vocabulary.

   It deliberately does NOT suggest an action. Every detector below answers
   "what is this?" and never "what should I do?". Where this project has
   already tested the structure, the recorded result is shown beside it —
   that is the honest thing to put next to a pattern you just spotted. */

/* self-contained helpers: this module sits outside the main IIFE, so it must
   not reach for $ / esc / slug, which are private to it. svgFor is global. */
function lrEl(id){return document.getElementById(id);}
function lrEsc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function lrSlug(x){return String(x).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}

var LR_SRC={
  "BINANCE:BTCUSDT":{api:"binance",sym:"BTCUSDT"},
  "BINANCE:ETHUSDT":{api:"binance",sym:"ETHUSDT"}
};
var LR_TF={"1":"1m","5":"5m","15":"15m","60":"1h","240":"4h","D":"1d"};
var LRBARS=null, LRBUSY=false, LRERR=null;

function lrSupported(sym){return !!LR_SRC[sym];}

function lrFetch(sym,tf){
  var s=LR_SRC[sym];
  if(!s) return Promise.reject(new Error("unsupported"));
  var iv=LR_TF[tf]||"15m";
  var url="https://api.binance.com/api/v3/klines?symbol="+encodeURIComponent(s.sym)+
          "&interval="+encodeURIComponent(iv)+"&limit=200";
  return fetch(url,{mode:"cors"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(rows){
    if(!rows||!rows.length) throw new Error("empty response");
    return rows.map(function(k){
      return {t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]};
    }).filter(function(b){
      return isFinite(b.o)&&isFinite(b.h)&&isFinite(b.l)&&isFinite(b.c);
    });
  });
}

/* ---------- small maths helpers ---------- */
function lrATR(b,n){
  if(b.length<n+1) return null;
  var s=0;
  for(var i=b.length-n;i<b.length;i++){
    var p=b[i-1].c;
    s+=Math.max(b[i].h-b[i].l,Math.abs(b[i].h-p),Math.abs(b[i].l-p));
  }
  return s/n;
}
function lrPct(arr,v){
  var n=0;
  for(var i=0;i<arr.length;i++) if(arr[i]<=v) n++;
  return arr.length?Math.round(n/arr.length*100):0;
}
function lrSwings(b,k){
  /* pivot highs/lows with k bars either side — the swing lookback is a
     parameter, and changing it changes the structure you "see" */
  var hi=[],lo=[],i,j,ok;
  for(i=k;i<b.length-k;i++){
    ok=true; for(j=i-k;j<=i+k;j++) if(b[j].h>b[i].h){ok=false;break;}
    if(ok) hi.push(i);
    ok=true; for(j=i-k;j<=i+k;j++) if(b[j].l<b[i].l){ok=false;break;}
    if(ok) lo.push(i);
  }
  return {hi:hi,lo:lo};
}
function lrFmt(x){
  var a=Math.abs(x);
  return x.toLocaleString(undefined,{maximumFractionDigits:a<10?4:(a<1000?2:0)});
}

/* ---------- detectors: each returns a fact, never an instruction ---------- */
function lrRead(b){
  var out=[],n=b.length,last=b[n-1];
  var atr=lrATR(b,14);

  /* 1. Range and where we sit in it */
  var look=Math.min(50,n);
  var hi=-Infinity,lo=Infinity,i;
  for(i=n-look;i<n;i++){ if(b[i].h>hi)hi=b[i].h; if(b[i].l<lo)lo=b[i].l; }
  var pos=(hi>lo)?(last.c-lo)/(hi-lo):0.5;
  out.push({term:"Premium / discount",label:"Position in the last "+look+" bars",
    detail:"Range "+lrFmt(lo)+" to "+lrFmt(hi)+". Price is at "+Math.round(pos*100)+"% of it — "+
      (pos>0.7?"the premium third":pos<0.3?"the discount third":"the middle, which is where the least information is")+".",
    ev:null});

  /* 2. Volatility, in its own historical terms */
  if(atr){
    var hist=[],j;
    for(i=20;i<n;i++){
      var s=0;
      for(j=i-13;j<=i;j++){ var p=b[j-1].c; s+=Math.max(b[j].h-b[j].l,Math.abs(b[j].h-p),Math.abs(b[j].l-p)); }
      hist.push(s/14);
    }
    var pc=lrPct(hist,atr);
    out.push({term:"ATR",label:"Volatility right now",
      detail:"ATR(14) is "+lrFmt(atr)+", which is higher than "+pc+"% of the last "+hist.length+" readings. "+
        (pc>80?"Wide bars — a fixed-point stop is much tighter in ATR terms than usual."
         :pc<20?"Quiet — the same stop is much wider in ATR terms than usual.":"Unremarkable."),
      ev:"Sizing off a fixed point distance while volatility moves like this is how position risk drifts without you changing anything."});
  }

  /* 3. Structure, stated with its parameter shown */
  var sw=lrSwings(b,3);
  if(sw.hi.length>=2&&sw.lo.length>=2){
    var h1=b[sw.hi[sw.hi.length-1]].h,h0=b[sw.hi[sw.hi.length-2]].h;
    var l1=b[sw.lo[sw.lo.length-1]].l,l0=b[sw.lo[sw.lo.length-2]].l;
    var up=h1>h0&&l1>l0, dn=h1<h0&&l1<l0;
    out.push({term:"Market structure",label:"Structure on a 3-bar swing",
      detail:up?"Higher high and higher low — an uptrend by the structural definition."
        :dn?"Lower high and lower low — a downtrend by the structural definition."
        :"Mixed: the last two swing highs and lows disagree. That is a range by definition, not a trend waiting to resume.",
      ev:"Change the swing lookback from 3 and this reading can flip. The structure is a function of the parameter, not a property of the market."});
  }

  /* 4. Equal highs / lows — a shelf of stops, and computable */
  if(atr){
    var tol=atr*0.15,eq=null;
    for(i=sw.hi.length-1;i>0&&!eq;i--){
      if(Math.abs(b[sw.hi[i]].h-b[sw.hi[i-1]].h)<=tol) eq={side:"highs",p:b[sw.hi[i]].h};
    }
    for(i=sw.lo.length-1;i>0&&!eq;i--){
      if(Math.abs(b[sw.lo[i]].l-b[sw.lo[i-1]].l)<=tol) eq={side:"lows",p:b[sw.lo[i]].l};
    }
    if(eq) out.push({term:"Equal highs / equal lows",label:"Matched swing "+eq.side,
      detail:"Two swing "+eq.side+" within 0.15 ATR of each other, around "+lrFmt(eq.p)+". Resting orders concentrate just beyond a level everybody can see.",
      ev:"This is the one mechanism in the sweep family with a plain explanation: stops cluster at obvious prices. It still did not survive testing as an entry."});
  }

  /* 5. Sweep and reclaim — fully specified, and already tested here */
  if(sw.hi.length){
    var pi=sw.hi[sw.hi.length-1],pv=b[pi].h,swept=null;
    for(i=pi+1;i<n;i++) if(b[i].h>pv&&b[i].c<pv){ swept={i:i,p:pv}; break; }
    if(swept) out.push({term:"Liquidity sweep",label:"Swept a prior high and closed back below",
      detail:"Bar "+(n-swept.i)+" bars ago traded above "+lrFmt(swept.p)+" and closed back under it.",
      ev:"Tested in this project across 6 variants then 784-variant sweeps. Lost out-of-sample, −24% to −48%. PR-005 produced +100.4% on QQQ against +0.2% on MNQ — same index, different wrapper, which is what a sample artefact looks like.",
      warn:true});
  }

  /* 6. Contraction */
  if(n>20){
    var r1=0,r2=0;
    for(i=n-10;i<n;i++) r1+=b[i].h-b[i].l;
    for(i=n-20;i<n-10;i++) r2+=b[i].h-b[i].l;
    if(r2>0&&r1/r2<0.7) out.push({term:"Consolidation",label:"Ranges contracting",
      detail:"The last 10 bars average "+Math.round((1-r1/r2)*100)+"% smaller range than the 10 before them.",
      ev:"Compression resolves with expansion often enough to be worth naming, and it says nothing about direction."});
  }

  /* 7. Gap from the prior bar */
  if(n>2&&atr){
    var g=b[n-1].o-b[n-2].c;
    if(Math.abs(g)>atr*0.5) out.push({term:"Gap",label:"Gap from the prior bar",
      detail:"Opened "+lrFmt(Math.abs(g))+" "+(g>0?"above":"below")+" the previous close — "+(Math.abs(g)/atr).toFixed(1)+" ATR.",
      ev:"A stop does not protect across a gap. It fills at the other side."});
  }

  return out;
}

/* ---------- render ---------- */
function lrRenderInto(host,sym,tf){
  if(!host) return;
  if(navigator.onLine===false){
    host.innerHTML='<div class="lrcard"><p class="lrempty">Offline — the live read needs a connection. The glossary, quiz and your strategies do not.</p></div>';
    return;
  }
  if(typeof fetch!=="function"){
    host.innerHTML='<div class="lrcard"><p class="lrempty">This browser has no fetch API, so the live read is unavailable. Everything else still works.</p></div>';
    return;
  }
  if(!lrSupported(sym)){
    host.innerHTML='<div class="lrcard"><p class="lrempty">No keyless public feed for this symbol, so there is nothing to measure honestly. '+
      'Switch to BTC/USDT or ETH/USDT for the live read — index and futures data needs a paid key, and I would rather show nothing than guess.</p></div>';
    return;
  }
  host.innerHTML='<div class="lrcard"><p class="lrempty">Reading the last 200 bars…</p></div>';
  LRBUSY=true;
  lrFetch(sym,tf).then(function(bars){
    LRBUSY=false;LRBARS=bars;LRERR=null;
    var facts=lrRead(bars);
    var last=bars[bars.length-1];

    /* reuse the glossary's own chart engine — no second renderer */
    var tail=bars.slice(-40).map(function(b){return [b.o,b.h,b.l,b.c];});
    var fig=svgFor({k:"c",d:tail});

    var rows=facts.map(function(f){
      return '<div class="lrrow'+(f.warn?" warn":"")+'">'+
        '<div class="lrhead"><span class="lrlabel">'+lrEsc(f.label)+'</span>'+
        '<button class="btn tiny" data-term="term-'+lrSlug(f.term)+'">'+lrEsc(f.term)+'</button></div>'+
        '<p class="lrdetail">'+lrEsc(f.detail)+'</p>'+
        (f.ev?'<p class="lrev">'+lrEsc(f.ev)+'</p>':'')+'</div>';
    }).join("");

    host.innerHTML=
      '<div class="lrcard">'+
        '<div class="lrtop"><h3>What is measurably true right now</h3>'+
        '<button class="btn" id="lr-refresh">Refresh</button></div>'+
        '<p class="lrsub">'+lrEsc(sym)+' · '+lrEsc(LR_TF[tf]||tf)+' · last close '+lrEsc(lrFmt(last.c))+
        ' · '+bars.length+' bars from Binance public data. No account, no key, nothing of yours connected.</p>'+
        '<figure class="lrfig">'+fig+'<figcaption>Last 40 bars, drawn with the same engine as every chart in the glossary.</figcaption></figure>'+
        rows+
        '<p class="lrfoot">These are descriptions, not recommendations. Nothing here says buy or sell, and nothing here forecasts. '+
        'The most useful thing on this panel is the line under each pattern saying how it actually tested.</p>'+
      '</div>';

    if(lrEl("lr-refresh")) lrEl("lr-refresh").onclick=function(){lrRenderInto(host,sym,tf);};
    Array.prototype.forEach.call(host.querySelectorAll("[data-term]"),function(b){
      b.onclick=function(){if(window.__goTerm)window.__goTerm(b.dataset.term);};
    });
  }).catch(function(e){
    LRBUSY=false;LRERR=e;
    host.innerHTML='<div class="lrcard"><p class="lrempty">Could not reach the public price feed ('+
      lrEsc(String(e.message||e))+'). Nothing else in the app depends on it.'+
      ' <button class="btn" id="lr-retry">Try again</button></p></div>';
    if(lrEl("lr-retry")) lrEl("lr-retry").onclick=function(){lrRenderInto(host,sym,tf);};
  });
}
</script>

<script>
(function(){
"use strict";
var MOTION=!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function el(id){return document.getElementById(id);}

/* ---------- toast: one place for all transient feedback ---------- */
var t=document.createElement("div");
t.id="toast";t.setAttribute("role","status");t.setAttribute("aria-live","polite");
document.body.appendChild(t);
var toastTimer=null;
window.__toast=function(msg){
  t.textContent=msg;t.classList.add("show");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show");},1900);
};

/* copy-link buttons already write to the clipboard; give them a receipt */
document.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest(".lnk"):null;
  if(b) window.__toast("Link copied");
},true);

/* ---------- theme toggle: Auto -> Dark -> Light ---------- */
var TH="tg.theme";
var themeBtn=document.createElement("button");
themeBtn.className="btn";themeBtn.id="themebtn";themeBtn.type="button";
var nav=document.querySelector("nav.tabs");
if(nav){
  var holder=document.createElement("span");
  holder.style.cssText="margin-left:auto;display:inline-flex;gap:8px;align-items:center";
  holder.appendChild(themeBtn);
  nav.appendChild(holder);
}
function paintTheme(v){
  if(v) document.documentElement.setAttribute("data-theme",v);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.textContent = v==="dark"?"Dark":v==="light"?"Light":"Auto";
  themeBtn.setAttribute("aria-label","Colour theme: "+themeBtn.textContent+". Click to change.");
}
var saved=null; try{saved=localStorage.getItem(TH);}catch(e){}
paintTheme(saved||"");
themeBtn.onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : cur==="light" ? "" : "dark";
  paintTheme(next);
  try{localStorage.setItem(TH,next);}catch(e){}
  window.__toast("Theme: "+(next||"auto"));
};

/* ---------- back to top ---------- */
var top=document.createElement("button");
top.id="totop";top.type="button";top.setAttribute("aria-label","Back to top");top.innerHTML="↑";
document.body.appendChild(top);
top.onclick=function(){
  window.scrollTo({top:0,behavior:MOTION?"smooth":"auto"});
  var qq=el("q"); if(qq) qq.focus();
};
var ticking=false;
window.addEventListener("scroll",function(){
  if(ticking)return;
  ticking=true;
  window.requestAnimationFrame(function(){
    top.classList.toggle("show",window.scrollY>700);
    ticking=false;
  });
},{passive:true});

/* ---------- keyboard help ---------- */
var m=document.createElement("div");
m.id="kbmodal";m.hidden=true;m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
m.setAttribute("aria-label","Keyboard shortcuts");
m.innerHTML='<div id="kbcard"><h3>Shortcuts</h3><dl>'+
  '<dt><kbd>/</kbd></dt><dd>Search</dd>'+
  '<dt><kbd>Esc</kbd></dt><dd>Clear search, or close this</dd>'+
  '<dt><kbd>s</kbd></dt><dd>Open the section list</dd>'+
  '<dt><kbd>1</kbd> – <kbd>4</kbd></dt><dd>Jump to a tab</dd>'+
  '<dt><kbd>t</kbd></dt><dd>Back to top</dd>'+
  '<dt><kbd>?</kbd></dt><dd>This list</dd>'+
  '</dl><p style="margin:16px 0 0"><button class="btn" id="kbclose">Close</button></p></div>';
document.body.appendChild(m);
function kbShow(v){m.hidden=!v;if(v)el("kbclose").focus();}
el("kbclose").onclick=function(){kbShow(false);};
m.addEventListener("click",function(e){if(e.target===m)kbShow(false);});

function typing(){
  var a=document.activeElement;
  return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!m.hidden){kbShow(false);return;}
  if(typing()||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="?"){e.preventDefault();kbShow(true);return;}
  if(e.key==="t"){e.preventDefault();window.scrollTo({top:0,behavior:MOTION?"smooth":"auto"});return;}
  if(e.key==="s"){var sb=el("secopen"); if(sb){e.preventDefault();sb.click();} return;}
  if(/^[1-4]$/.test(e.key)){
    var tabs=document.querySelectorAll('nav.tabs [role="tab"]');
    var i=parseInt(e.key,10)-1;
    if(tabs[i]){e.preventDefault();tabs[i].click();tabs[i].focus();}
  }
});

/* ---------- remember the last tab ---------- */
var TKEY="tg.lasttab";
function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function read(k){try{return localStorage.getItem(k);}catch(e){return null;}}
document.querySelectorAll('nav.tabs [role="tab"]').forEach(function(b){
  b.addEventListener("click",function(){
    store(TKEY,b.id);
    var p=document.getElementById(b.getAttribute("aria-controls"));
    if(p&&MOTION){p.classList.remove("tabpanel-in");void p.offsetWidth;p.classList.add("tabpanel-in");}
  });
});
if(!location.hash){
  var last=read(TKEY);
  if(last&&el(last)&&last!=="tab-terms") el(last).click();
}

/* ---------- staggered entrance, capped so filtering stays instant ---------- */
if(MOTION){
  var grid=el("grid");
  if(grid){
    var restagger=function(){
      var vis=[],all=grid.querySelectorAll(".entry"),i;
      for(i=0;i<all.length&&vis.length<24;i++) if(all[i].style.display!=="none") vis.push(all[i]);
      vis.forEach(function(e,ix){
        e.style.animation="none";void e.offsetWidth;
        e.style.animation="fadeUp .28s ease both";
        e.style.animationDelay=(Math.min(ix,14)*14)+"ms";
      });
    };
    var qq=el("q");
    if(qq) qq.addEventListener("input",function(){clearTimeout(window.__stg);window.__stg=setTimeout(restagger,90);});
    document.addEventListener("click",function(e){
      if(e.target.closest&&(e.target.closest(".chip")||e.target.closest(".secitem"))) setTimeout(restagger,0);
    });
  }
}
})();
</script>

<script>
(function(){
"use strict";
function el(id){return document.getElementById(id);}
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* =====================================================================
   1. SIMPLE / DETAILED
   Simple strips the example, the see-also chain and the caveat block,
   enlarges the definition, and hides Advanced terms outright. Where a
   plain-language rewrite exists it is shown instead of the standard one.
   ===================================================================== */
var PLAIN={
  "Liquidity":"How easily you can get in or out without shoving the price around.",
  "Slippage":"You asked for one price and got a worse one.",
  "Spread":"The gap between the buy price and the sell price. You pay it every trade.",
  "Leverage":"Borrowed size. It multiplies the win and the loss equally.",
  "Margin (initial)":"The deposit the broker locks up so you can hold a leveraged position.",
  "Expectancy":"What you make per trade on average once wins and losses are both counted.",
  "Drawdown":"How far your account fell from its highest point.",
  "Risk of ruin":"The chance you lose so much that coming back isn't realistic.",
  "Position sizing":"Working out how many contracts you can hold without a normal loss hurting.",
  "Stop loss (SL)":"An order that closes you out so a loss can't keep growing.",
  "Win rate":"How often you win. On its own it tells you almost nothing.",
  "Profit factor":"Total won divided by total lost. Above 1 means you made money.",
  "Sharpe ratio":"Return compared to how bumpy the ride was.",
  "Overfitting":"Your rules learned the noise in old data instead of anything repeatable.",
  "Out-of-sample":"Data your strategy has never seen. The only results that mean anything.",
  "Multiple testing":"Try enough ideas and one looks great by luck alone.",
  "Sample size":"How many trades your conclusion rests on. Usually far too few.",
  "Volatility":"How much price is swinging about.",
  "ATR":"The average size of a bar. Use it to set stop distance.",
  "Liquidity sweep":"Price pokes past an obvious high or low, grabs the stops, then comes back.",
  "Fair value gap":"A gap left behind when price moved so fast it skipped a level.",
  "Order block":"The last candle before a big move, treated as a zone price may return to.",
  "Gap risk":"Price jumps past your stop while you can't do anything about it.",
  "Notional value":"The full value you actually control, not the deposit you put down.",
  "Implied volatility":"How much movement option prices are pricing in.",
  "Theta":"What an option loses each day just from time passing.",
  "Option delta":"How much the option moves when the underlying moves one point.",
  "Funding rate":"A fee passed between longs and shorts to keep a perp near spot.",
  "Expectancy per trade":"Average profit per trade across a big sample.",
  "Buy and hold":"Own it and do nothing. The benchmark most strategies fail to beat.",
  "Benchmark":"What you have to beat for the effort to have been worth it.",
  "Random trader benchmark":"Coin-flip entries with your costs. Beat this before believing anything.",
  "Pre-registration":"Write down the test and what counts as a pass before you run it.",
  "p-hacking":"Fiddling with settings until a failed test finally passes.",

<script>
/* =====================================================================
   PAYOFF DIAGRAMS
   Real computed curves, not decoration: profit at expiry across a price
   range for each structure. Fed through the existing engine's raw path,
   so there is still only one renderer.
   ===================================================================== */
(function(){
"use strict";
var W=320,H=150,PAD=14;

function payoff(legs,lo,hi){
  /* leg: {type:"c"|"p"|"s", strike, qty, prem}  qty<0 = short */
  var pts=[],n=64,i,j;
  for(i=0;i<=n;i++){
    var S=lo+(hi-lo)*i/n, v=0;
    for(j=0;j<legs.length;j++){
      var L=legs[j], intr;
      if(L.type==="c") intr=Math.max(0,S-L.strike)-L.prem;
      else if(L.type==="p") intr=Math.max(0,L.strike-S)-L.prem;
      else intr=S-L.strike;
      v+=intr*L.qty;
    }
    pts.push([S,v]);
  }
  return pts;
}

function payoffSvg(legs,label){
  var lo=60,hi=140;
  var pts=payoff(legs,lo,hi);
  var vs=pts.map(function(p){return p[1];});
  var vmax=Math.max.apply(null,vs), vmin=Math.min.apply(null,vs);
  var span=Math.max(1,vmax-vmin), padv=span*0.18;
  vmax+=padv; vmin-=padv;
  function X(S){return PAD+(S-lo)/(hi-lo)*(W-PAD*2);}
  function Y(v){return H-PAD-(v-vmin)/(vmax-vmin)*(H-PAD*2);}
  var zero=Y(0);
  var up="",dn="",i;
  for(i=0;i<pts.length;i++){
    var x=X(pts[i][0]).toFixed(1), y=Y(pts[i][1]).toFixed(1);
    (pts[i][1]>=0?  (up+= (up?"L":"M")+x+" "+y)
                 :  (dn+= (dn?"L":"M")+x+" "+y));
  }
  var line=pts.map(function(p,k){return (k?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1);}).join("");
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+' payoff at expiry">';
  s+='<line x1="'+PAD+'" y1="'+zero.toFixed(1)+'" x2="'+(W-PAD)+'" y2="'+zero.toFixed(1)+'" stroke="var(--rule2)" stroke-width="0.8" stroke-dasharray="3 3"/>';
  /* shade profit above the zero line and loss below it */
  s+='<path d="'+line+'L'+X(hi).toFixed(1)+' '+zero.toFixed(1)+'L'+X(lo).toFixed(1)+' '+zero.toFixed(1)+'Z" fill="var(--up)" opacity="0.10"/>';
  s+='<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round"/>';
  legs.forEach(function(L){
    if(L.type==="s")return;
    var x=X(L.strike).toFixed(1);
    s+='<line x1="'+x+'" y1="'+PAD+'" x2="'+x+'" y2="'+(H-PAD)+'" stroke="var(--signal)" stroke-width="0.6" opacity="0.55"/>';
  });
  s+='<text class="lb" x="'+PAD+'" y="'+(H-3)+'">underlying price →</text>';
  s+='<text class="lbu" x="'+(W-PAD)+'" y="'+(PAD+2)+'" text-anchor="end">profit</text>';
  s+='<text class="lbd" x="'+(W-PAD)+'" y="'+(H-PAD)+'" text-anchor="end">loss</text>';
  s+='</svg>';
  return s;
}

var SPEC={
  "Call":{legs:[{type:"c",strike:100,qty:1,prem:5}],cap:"Long call. Loss capped at the premium, upside open."},
  "Put":{legs:[{type:"p",strike:100,qty:1,prem:5}],cap:"Long put. Loss capped at the premium, profit grows as price falls."},
  "Naked option selling":{legs:[{type:"c",strike:100,qty:-1,prem:5}],cap:"Short call. Gain capped at the premium, loss uncapped. Look at the right-hand side."},
  "Covered call":{legs:[{type:"s",strike:100,qty:1,prem:0},{type:"c",strike:110,qty:-1,prem:4}],cap:"Stock plus a short call. The premium is paid for by giving up everything above the strike."},
  "Protective put":{legs:[{type:"s",strike:100,qty:1,prem:0},{type:"p",strike:95,qty:1,prem:4}],cap:"Stock plus a long put. The floor is what you bought; the premium is the cost of it."},
  "Vertical spread":{legs:[{type:"c",strike:100,qty:1,prem:6},{type:"c",strike:115,qty:-1,prem:2}],cap:"Both ends capped. Cheaper than the outright, and the upside stops at the short strike."},
  "Straddle / strangle":{legs:[{type:"c",strike:100,qty:1,prem:5},{type:"p",strike:100,qty:1,prem:5}],cap:"A bet on movement. You need a move larger than both premiums combined, either way."},
  "Iron condor":{legs:[{type:"p",strike:85,qty:1,prem:1},{type:"p",strike:92,qty:-1,prem:3},
                       {type:"c",strike:108,qty:-1,prem:3},{type:"c",strike:115,qty:1,prem:1}],
                 cap:"Wins in the middle, loses at both edges. The flat top is why it feels consistent until it isn't."},
  "Collar":{legs:[{type:"s",strike:100,qty:1,prem:0},{type:"p",strike:95,qty:1,prem:4},{type:"c",strike:110,qty:-1,prem:4}],
            cap:"Both ends fixed for roughly nothing. The standard way to hold a position you can't sell."},
  "Butterfly":{legs:[{type:"c",strike:90,qty:1,prem:12},{type:"c",strike:100,qty:-2,prem:5},{type:"c",strike:110,qty:1,prem:1}],
               cap:"A tight bet on finishing near the middle strike. Cheap, and usually worthless."},
  "Ratio spread":{legs:[{type:"c",strike:100,qty:1,prem:6},{type:"c",strike:110,qty:-2,prem:2}],
                  cap:"Looks defined until the right-hand side. Past the short strikes the loss keeps going."},
  "Short volatility":{legs:[{type:"c",strike:105,qty:-1,prem:3},{type:"p",strike:95,qty:-1,prem:3}],
                      cap:"Small steady gain in the middle, large loss at either tail. Most 'income' strategies are this shape."}
};

/* attach to any of those terms that has no chart yet */
var D=window.D||[];
var added=0;
D.forEach(function(x){
  var sp=SPEC[x.t];
  if(!sp||x.v)return;
  x.v={k:"raw",svg:payoffSvg(sp.legs,x.t)};
  if(!x.cap)x.cap=sp.cap;
  added++;
});

/* the grid is already rendered, so inject into the live DOM too */
function slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
Object.keys(SPEC).forEach(function(name){
  var e=document.getElementById("term-"+slug(name));
  if(!e||e.querySelector("figure"))return;
  var f=document.createElement("figure");
  f.innerHTML=payoffSvg(SPEC[name].legs,name)+'<figcaption>'+
    String(SPEC[name].cap).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</figcaption>';
  e.appendChild(f);
  e.classList.add("haschart");
});
window.__payoffsAdded=added;
})();
</script>

<script>
/* =====================================================================
   LONG-FORM BODIES — first 20, for voice and depth approval.
   Rules followed: contested frameworks are named as contested, older
   documented names are credited, and there are no win rates, edges or
   invented statistics anywhere in here.
   ===================================================================== */
(function(){
var L={

"Liquidity sweep":{
long:"A sweep is price trading through a level where resting orders are known to sit, and then failing to hold beyond it. The level is usually an obvious one — a prior day's high, a session high, a double top — because obvious levels are where stop orders accumulate. Those stops are, mechanically, market orders waiting to fire.\n\nThe mechanism people propose is straightforward and does not require anyone to be manipulating anything. If a lot of stop orders sit above a high, price reaching that high triggers them, and that burst of buying pushes price further up in a short window. If there is no genuine demand behind the move, price falls back once the stops are exhausted. What is left on the chart is a wick through the level and a close back inside.\n\nThe reclaim is the event, not the poke. Price going above a high is ordinary. Price going above a high and closing back below it is the thing being described. If you treat the poke itself as a signal you will be early on almost every one.\n\nWhere people get fooled: sweeps are trivially easy to identify after the fact and genuinely hard to act on live, because at the moment of the wick you cannot tell a sweep from a breakout that is about to keep going. That asymmetry — obvious in hindsight, ambiguous in real time — is what makes the pattern feel far more reliable than it tests. In this project's own runs the sweep family was tested across 6 variants and then 784-variant sweeps, and lost out-of-sample.",
usage:"Generally used as a location filter rather than a trigger: it marks an area where a reversal might be attempted, and something else — a structure break, a close back through a level — provides the actual entry. It is also used to reason about where a stop should not go, since placing one just beyond an obvious high puts it in the pool everyone else's is in.",
see:["Spring","Equal highs / equal lows","Liquidity pool","Turtle soup","Stop hunt"]},

"Order block":{
long:"An order block is the last opposing candle before a strong directional move — the final down candle before a rally, or the final up candle before a decline. The claim is that large orders were filled in that candle's range, and that price returning there will meet unfilled interest from the same participants.\n\nThis is a community framework and it has no independent validation. The proposed mechanism is not observable from a price chart: you cannot see who transacted in a candle, only that it traded. The reasoning runs backwards — the move is used as evidence that large orders were there, and the presence of large orders is then used to explain the move.\n\nWhat the concept does capture, in a way that predates it by a century, is that price often returns to areas it left quickly. Wyckoff described the same observation in terms of supply and demand zones. Whether you call it an order block, a supply zone or the origin of a move, the chart feature is the same: an area price departed from with conviction.\n\nWhere people get fooled: the definition has a lot of freedom in it. Which candle counts, whether you use the body or the whole range, how many you can nominate on one chart, and whether a failed one retroactively becomes a breaker — each of those is a choice, and the more choices a pattern has the more reliably you can find one that explains whatever just happened. Count the degrees of freedom before trusting a backtest of it.",
usage:"Typically used as a zone to wait for rather than a signal to act on — price returning to the area is the setup, and confirmation comes from something else. The zone's edges are also commonly used to define invalidation, which is the more defensible use of it.",
see:["Supply and demand zones","Breaker block","Mitigation block","Fair value gap","Accumulation"]},

"Fair value gap":{
long:"A fair value gap is a three-candle formation where the first candle's high sits below the third candle's low, leaving a band of prices that the middle candle passed through without two-way trade. It is not a gap in the traditional sense — the market never closed — it is a stretch that price crossed so quickly that little business was done there.\n\nThe mechanism is simply the shape of fast movement. When one side is aggressive enough, price moves through levels faster than resting orders can be replaced, so those levels get skipped rather than traded. The observation that price often returns to fill such areas is a description of mean reversion in short-term order flow, not a special property of the pattern.\n\nThe same feature has other names. In order-flow language it is an imbalance. In auction terms it is a low-volume node. Volume profile draws the identical information as a thin section of the histogram. None of those framings claim more than the shape supports.\n\nWhere people get fooled: gaps are everywhere once you start looking, and on a low enough timeframe there are dozens per session. Without a rule about which ones count — size relative to ATR, whether the gap sits at a level that already mattered, how long it stays unfilled — you are choosing after the fact. And 'price often returns' is not the same claim as 'price returns often enough to trade after costs'.",
usage:"Usually treated as an area of interest for an entry on a pullback, with the midpoint sometimes used as a more precise level than the edge. It is also used as a target when price is heading back through an area it skipped.",
see:["Imbalance","Liquidity void","Balanced price range","Consequent encroachment","Displacement"]},

"Break of structure":{
long:"A break of structure is a close beyond the most recent swing point in the direction of the existing trend — a close above the prior swing high in an uptrend, or below the prior swing low in a downtrend. It is used to confirm that the trend is still intact.\n\nWhat makes it worth having is that it is codeable. Once you fix the swing definition — how many bars either side make a pivot — two people looking at the same chart will identify the same breaks. That is unusual in this vocabulary and it is the main reason this term is more useful than most of the ones around it.\n\nThe catch is that the swing definition is a parameter, not a fact. A three-bar swing and a ten-bar swing produce different structure on the same chart, and neither is correct. Any strategy built on structure inherits that parameter, and if the result only works at one setting you have found a lookback that fitted the sample rather than a property of the market.\n\nWhere people get fooled: the distinction between a close beyond a level and a wick beyond it is doing enormous work, and it is easy to relax it in the moment. It is also easy to redraw which swing counts once you know what happened next.",
usage:"Generally used as trend confirmation and as a way to define where a directional thesis stops being valid. It is more commonly a filter on other setups than an entry trigger by itself.",
see:["Change of character","Market structure","Swing high / swing low","Trend"]},

"Change of character":{
long:"A change of character is the first structural break against the prevailing trend — in an uptrend, the first close below a swing low that had been holding. It is read as the earliest evidence that control may be changing hands.\n\nThe logic is the mirror of a break of structure, and it inherits the same strength and the same weakness: it is objective once the swing lookback is fixed, and the lookback is arbitrary.\n\nThe practical problem is that in any strong trend, pullbacks produce a change of character at some timeframe almost continuously. On a one-minute chart a healthy uptrend generates them all day. Without specifying the timeframe and the swing definition, the term describes something that is nearly always true somewhere and therefore predicts nothing.\n\nWhere people get fooled: it is the earliest signal in the structural family, which means it is also the one most often wrong. Traders who want to be early are drawn to it for exactly the reason it disappoints — being first to call a reversal and being wrong look identical until several bars later.",
usage:"Usually used as an alert to start looking rather than as a reason to act, often paired with a requirement that a higher timeframe agrees before anything is done with it.",
see:["Break of structure","Market structure","Retracement vs reversal"]},

"Accumulation":{
long:"Accumulation is a period where buying is absorbed sideways rather than pushing price up — large buyers building positions gradually at low prices, taking what sellers offer without bidding the market away from themselves. It comes from Richard Wyckoff's work in the 1920s and 1930s, and it is the base that forms before a sustained advance.\n\nThe mechanism is a size problem. A buyer who needs a large position cannot simply lift every offer, because doing so moves the price against them before they are filled. The alternative is to buy patiently within a range, letting sellers come to them. From outside, that behaviour looks like a market going nowhere on unremarkable volume.\n\nWyckoff's framework describes the phases in some detail — a selling climax, an automatic rally that sets the range ceiling, secondary tests on lower volume, and often a spring through the floor before the advance begins. Most modern 'smart money' vocabulary is a renaming of this material, including the accumulation-manipulation-distribution cycle.\n\nWhere people get fooled: accumulation and a market that is simply going nowhere look the same in real time. The distinguishing evidence is meant to be volume behaviour — selling that fails to move price, tests on lighter volume — and that evidence is far less clear-cut on a live chart than in a textbook diagram. The phase labels are also applied confidently after the move and argued about during it.",
usage:"Generally used as context rather than a trigger: knowing a market may be basing changes which direction of setup you are willing to take. Its range boundaries also give objective levels regardless of whether the interpretation is right.",
see:["Distribution","Spring","Wyckoff method","Trading range","Markup / markdown"]},

"Distribution":{
long:"Distribution is the mirror of accumulation — large holders offloading into strength near highs while price moves sideways, selling into every rally rather than dumping into a falling market. It is the ceiling that forms before a sustained decline.\n\nThe mechanism is the same size problem inverted. Selling a large position into a falling market gets progressively worse prices, so the seller distributes gradually while there is still demand to sell into. That demand is usually strongest when sentiment is most positive, which is why distribution tends to coincide with the most bullish commentary.\n\nStructurally you get a range that stops making higher highs, rallies that keep failing at a similar level, and eventually a failed push above the range — Wyckoff's upthrust, or an upthrust after distribution at the very top.\n\nWhere people get fooled: the same ambiguity as accumulation, plus a psychological one. Distribution occurs while the news is good and the trend still looks intact, so calling it early means fighting a rising market. Most people who identify distribution correctly do so several weeks after they first called it.",
usage:"Used as context for bias — a market suspected of distributing shifts which direction of setup you look for. The range high provides an objective invalidation level whether or not the reading is correct.",
see:["Accumulation","Upthrust","Wyckoff method","Markup / markdown"]},

"Spring":{
long:"A spring is a dip below the floor of a trading range that immediately reclaims it. Wyckoff named it, and the idea is that the move flushes out weak holders and tests whether supply remains below the range before an advance begins.\n\nIt is structurally identical to what modern material calls a liquidity sweep of a range low. The concept predates that vocabulary by roughly a century, which is worth knowing when the same chart feature is presented as a recent discovery.\n\nThe mechanism is the stop-order one: sell stops accumulate below an obvious range floor, price trading there triggers them, and if there is no genuine supply behind the move the market recovers. The reclaim is what distinguishes a spring from a breakdown, and you only know which you had after the close.\n\nWhere people get fooled: in a real breakdown, the first move below the range looks exactly like a spring. The two are distinguished only by what happens next, which means any rule that acts at the low is acting on ambiguity. Waiting for the reclaim costs you the best price and removes most of the ambiguity — that trade-off is measurable and worth measuring rather than assuming.",
usage:"Typically used as a location for a long attempt within a range-bound context, with the range floor providing invalidation. The reclaim close is the usual trigger rather than the low itself.",
see:["Liquidity sweep","Upthrust","Accumulation","Trading range","Turtle soup"]},

"Consolidation":{
long:"Consolidation is price coiling into a progressively tighter range — each swing smaller than the last, each bar's range narrower. It is distinct from a plain range, which has roughly flat boundaries; consolidation converges.\n\nThe mechanism is a narrowing of disagreement. Volatility clusters, and periods of low volatility tend to follow periods of low volatility until something changes. Compression is one of the more measurable things on a chart: you can compute the average bar range over the last N bars against the N before it and get a number rather than an impression.\n\nWhat compression reliably indicates is that an expansion is likely at some point. What it does not indicate is direction. Every framework that claims to read direction from a coil is adding a claim the shape does not support.\n\nWhere people get fooled: the breakout from a coil frequently goes both ways before it goes anywhere — a false break in one direction, then the real move in the other. Positioning for the first move out is positioning for the leg most likely to be reversed.",
usage:"Generally used as a volatility filter — either to stand aside until it resolves, or to prepare an order on both sides. Its boundaries also give a natural invalidation level for whichever side you eventually take.",
see:["Expansion","Bollinger squeeze","Range","Inside bar","Chop"]},

"Support / resistance":{
long:"Support and resistance are price areas where advances have previously stalled or declines have previously found buyers. They are the oldest idea in technical analysis and the one most people learn first.\n\nThe mechanism that holds up best is not memory in the market but the concentration of orders. People place orders at prices they can identify, and everyone identifies the same obvious highs, lows and round numbers. A level matters because it is visible, not because price has an attachment to it.\n\nThe most useful version of the concept is the flip: a level that acted as resistance and then broke often behaves as support afterwards. That is consistent with the order mechanism — the people who sold there and were wrong become buyers if price returns, and those who wanted in have a reference.\n\nWhere people get fooled: levels are drawn, not found. Any chart supports a dozen defensible lines, and a line drawn after the fact will fit the past perfectly. Treat them as zones rather than prices, decide the drawing rule in advance, and be suspicious of any analysis where the level appeared after the move.",
usage:"Used for locating entries and for placing invalidation. The more common mistake is using them as reasons to trade rather than as places where something else must also happen.",
see:["Retest","Round numbers","Rejection","Equal highs / equal lows","Trendline"]},

"Breakout":{
long:"A breakout is price moving decisively beyond a defined boundary — a range high, a consolidation edge, an N-bar high. The premise is that clearing the level marks a change in the balance between buyers and sellers.\n\nThe mechanism is a combination of stop orders above the level and new entries triggered by the move itself, which together produce a burst of activity. Whether that burst continues depends on whether genuine interest follows it, and that is the part no formation tells you in advance.\n\nBreakout systems are among the most tested ideas in trading — the Donchian channel and the Turtle rules are breakouts with explicit parameters — and they share a characteristic profile: a low proportion of trades that work, with the ones that do work being large. That shape is uncomfortable to trade, and it is the reason most people abandon breakout systems during the long stretches of small losses that are a normal part of them.\n\nWhere people get fooled: on retail timeframes false breaks are common, and each one is expensive because the entry is at the extreme of the range. Fading them is a whole strategy family in its own right. In this project's own testing the breakout families lost out-of-sample once costs were applied.",
usage:"Generally used with a defined boundary decided in advance and invalidation just back inside it, since the setup's premise fails the moment price closes back in the range. Whether to enter on the break or on a retest of it is a testable choice, not a matter of preference.",
see:["False breakout","Donchian Channel","Retest","Consolidation","Measured move"]},

"Risk:reward":{
long:"Risk to reward is the potential gain of a trade divided by the potential loss, measured before entry from the entry price, the invalidation level and the target. A trade risking 20 points to make 60 is 1:3.\n\nThe reason it matters is arithmetic. The ratio determines the win rate you need simply to break even: at 1:1 you need better than half, at 1:3 roughly a quarter, at 1:5 under a fifth. That relationship is fixed and it is the single most useful piece of maths a new trader can hold.\n\nWhat it does not do is make a trade good. The ratio is a property of where you put three lines on a chart, and you can produce any ratio you like by moving the target further away. A 1:10 setup with a target price rarely reaches is worse than a 1:1 with a target that is hit routinely. The ratio only means something alongside how often each outcome actually occurs, which requires a trade log rather than an opinion.\n\nWhere people get fooled: quoting the planned ratio rather than the realised one. Partial exits, moved stops and scratched trades all mean the ratio you achieved is rarely the one you planned. Logging both is what turns this from a slogan into information.",
usage:"Used as a pre-trade filter — a minimum ratio below which a setup is skipped — and as the unit that makes results comparable across instruments. It should be computed from the invalidation level, not chosen to make the trade look acceptable.",
see:["R","Expectancy","MAE / MFE","Target selection","Stop placement logic"]},

"Drawdown":{
long:"Drawdown is the fall from an equity peak to the trough that follows it. Maximum drawdown is the worst such fall on record, and it is the number that tells you whether a strategy is one you could actually have held.\n\nIt matters more than the return figure because it is what you experience. Two strategies with identical annual returns can have a 10% and a 50% worst case, and only one of those is something a person keeps trading. Every strategy has a drawdown; the question is whether you would still have been pressing buttons at the bottom of it.\n\nTwo properties are worth internalising. First, recovery is asymmetric: down 50% needs 100% to get back, down 90% needs 900%. Second, duration matters as much as depth — a 20% drawdown lasting three years ends more strategies than a 40% one lasting three months, because people abandon systems out of boredom and doubt as readily as out of pain.\n\nWhere people get fooled: assuming the worst historical drawdown is the worst possible one. It is simply the worst that happened in your sample, and the next one is under no obligation to respect it. Planning for roughly one and a half times the backtested figure is a common and defensible allowance.",
usage:"Used to set position size, to decide in advance at what depth you reduce risk or stop, and to compare strategies on a risk-adjusted basis rather than on return alone.",
see:["Time under water","Recovery maths","Risk of ruin","Calmar ratio","Drawdown protocol"]},

"Position sizing":{
long:"Position sizing is working backwards from what you are willing to lose and where the trade is invalidated, to arrive at how many units you can hold. Risk budget divided by risk per unit gives size. It is the calculation that decides whether you survive a losing streak.\n\nThe order matters. The stop goes where the idea is proven wrong, and the size follows from that distance. Doing it the other way round — choosing a size and then placing the stop where the loss feels tolerable — puts the stop inside the market's normal noise and guarantees being taken out by ordinary movement.\n\nBecause stop distance varies with volatility, a fixed number of contracts is not a fixed amount of risk. The same 20-point stop is a different bet when the average bar range is 30 points than when it is 300. Sizing off ATR rather than off a fixed point distance is how that drift gets controlled.\n\nWhere people get fooled: rounding up. When the maths says 0.6 contracts, the answer is that the trade is too large for the account, not that you should trade one. Also the belief that conviction justifies size — every setup feels good at the time, which is precisely why the rule has to be mechanical.",
usage:"Applied before every trade as a calculation rather than a judgement, using the account balance, a fixed risk percentage, the stop distance and the value per point.",
see:["Risk per trade","R","ATR","Risk of ruin","Fixed fractional sizing"]},

"Bullish engulfing":{
long:"A bullish engulfing is a candle whose body completely covers the previous candle's body, closing above where the prior one opened. It is read as buyers taking control decisively enough to undo a period of selling.\n\nThe shape does describe something real: within that period, the close finished above the previous open, which means the net result of the two bars is upward. That is a fact about the bars, not a forecast.\n\nContext does nearly all the work. The same shape appearing at a level that has mattered before, after an extended decline, on volume noticeably above average, is a different observation from the same shape appearing in the middle of a chop. On a five-minute chart engulfing candles occur dozens of times a day.\n\nWhere people get fooled: candlestick patterns are taught as a catalogue, which implies each has independent predictive value. When individual patterns are tested in isolation with realistic costs, results tend to sit close to what you would get from entries with no pattern at all. Treat the shape as description and put the weight on where it happened.",
usage:"Generally used as a trigger once location has already been established by something else, and as a way to define invalidation — the low of the engulfing candle is a natural level to be wrong beneath.",
see:["Bearish engulfing","Pattern base rate","Volume confirmation","Rejection","Timeframe"]},

"Hammer":{
long:"A hammer is a candle with a small body near the top of its range and a long lower wick, appearing after a decline. Sellers pushed price down during the period and were rejected before the close.\n\nThe wick is the entire message. It records that price traded lower and would not stay there. That is genuine information about what happened within the bar — it is one of the few candle shapes where the story and the data actually match.\n\nContext determines whether it means anything. The identical shape after an advance is called a hanging man and is read bearishly. Same candle, opposite reading, decided entirely by what preceded it. That fact is worth sitting with, because it tells you the shape alone is not carrying the claim.\n\nWhere people get fooled: hammers in open space, away from any level, are noise with a name. The version worth attention is one whose wick rejected a level that already mattered — which is really a statement about the level, with the candle as confirmation rather than cause.",
usage:"Used as a trigger at a level rather than a standalone signal, with the wick's low giving a natural invalidation point. The distance to that low also sets the position size, which is often the more useful output.",
see:["Pin bar","Shooting star","Hanging man","Rejection","Dragonfly doji"]},

"Premium / discount":{
long:"Premium and discount describe where price sits within a range relative to its midpoint. Above the 50% level is premium, below it is discount. The framing is used to argue that buying should be done in the lower half of a range and selling in the upper half.\n\nThe underlying idea is ordinary and defensible: within a range, entering nearer the boundary you are fading gives a better price and a tighter invalidation than entering in the middle. That is a statement about risk-to-reward geometry, not a prediction.\n\nThe midpoint itself has no special property. It is the arithmetic mean of the range's extremes, and it matters mainly because a lot of people compute the same number. Fibonacci retracement levels are used the same way and the 50% level is not even a Fibonacci ratio.\n\nWhere people get fooled: everything depends on which range you measure. Choosing the swing that defines the range after seeing where price went is where the framework quietly does its fitting. Fix the range definition in advance — which swing, which timeframe — or the tool measures your hindsight rather than the market.",
usage:"Used as a filter on entry location within an already-established directional bias, and to reject setups where the entry sits in the half of the range that gives poor geometry.",
see:["Equilibrium / 50% level","Fibonacci retracement","Optimal trade entry","Range"]},

"Expectancy":{
long:"Expectancy is the average amount a trade makes or loses across a large sample, computed from the win rate and the average size of wins and losses. It is the single number that says whether a set of rules is worth trading.\n\nThe formula is simple: win rate times average win, minus loss rate times average loss. A system winning 40% of the time with wins three times the size of losses returns a positive expectancy despite losing six times in ten. That combination is common and it is why win rate quoted alone is close to meaningless.\n\nExpectancy is usually expressed per trade in R, which makes it comparable across instruments and account sizes. Multiplying it by the number of trades you take in a period gives an estimate of what the approach produces, and that estimate is only as good as the sample the inputs came from.\n\nWhere people get fooled: computing it from too few trades and treating the result as a property of the system. Thirty trades produce enormous variation in all three inputs. A positive expectancy from a small sample is a hypothesis, not a finding, and the first honest question is always how many trades it rests on.",
usage:"Used to decide whether a set of rules is worth continuing with, and to compare approaches on a common scale. It is computed from a trade log rather than estimated, because estimated inputs are consistently flattering.",
see:["Win rate","Profit factor","R","Sample size","Risk:reward"]},

"Stop loss":{
long:"A stop loss is a resting order that closes a position once price reaches a level, capping the loss on that trade. It is the mechanism that converts an open-ended exposure into a defined one.\n\nIts placement should come from the idea, not from the money. The level is where the reason for the trade stops being true — beyond the swing that defined the structure, outside the range you were fading, past the wick you were trading against. If the resulting loss is more than you are willing to take, the answer is fewer units, not a nearer stop.\n\nA resting stop and a mental one are not the same instrument. A mental stop requires you to be present, attentive and willing at the moment it matters, which is exactly when those three are least reliable. On a position held overnight from a different timezone it provides nothing at all.\n\nWhere people get fooled: believing a stop guarantees the price. It guarantees an exit, not a level. In a gap or a halt, the fill happens wherever trading resumes. The second failure is widening one as price approaches — the single habit that turns a planned small loss into an account-ending one.",
usage:"Placed at the point of invalidation at the time of entry, ideally submitted together with the entry so there is never a window with an unprotected position. Moving it is defensible only in the direction that reduces risk.",
see:["Stop placement logic","Invalidation","Mental stop","Gap risk","Moving a stop"]},

"Reality check on this section":{
long:"The ICT and smart-money vocabulary describes chart features that exist. Sweeps, gaps, and areas price left quickly are all visible and mostly measurable. What is not established is the explanatory story attached to them — that a coordinated class of participants is engineering these moves, and that the patterns therefore carry predictive value.\n\nThat story is not observable from price. A chart shows that trading occurred at a price, not who traded or why. Every inference about intent is added by the interpreter, and frameworks built that way tend to explain each outcome after it happens while forbidding nothing in advance. A framework that cannot be wrong cannot be evidence.\n\nMost of the underlying observations have older documented names. A spring is a liquidity sweep. The accumulation-manipulation-distribution cycle is Wyckoff's. Turtle soup is Connors and Raschke's fade of a failed twenty-day breakout. Knowing the lineage is useful because the older literature is generally more careful about what it claims.\n\nNone of this makes the vocabulary useless. It is a compact way to describe chart structure and it communicates efficiently with other people who use it. The problem is only ever the gap between describing a shape and claiming an edge — and that gap is where testing belongs. In this project the sweep family has been through 6 variants and then 784-variant sweeps, and lost out-of-sample.",
usage:"Best treated as shared vocabulary for describing structure, with any claim about profitability sent to a pre-registered test before it changes what you do.",
see:["Falsifiability","Framework vs strategy","Wyckoff method","Institutional order flow","Economic rationale"]}

};

/* attach to the data.
   The test harness evaluates data-only script blocks in a bare context with no
   window object, so guard rather than assume a browser. */
if(typeof window==="undefined") return;
var D=window.D||[];
var n=0;
D.forEach(function(x){
  var e=L[x.t];
  if(!e)return;

  n++;
});
window.__longAdded=n;
window.__LONGKEYS=Object.keys(L);

</script>

<script>
/* ====================================================================
   TAPE — CONFIG
   Every commercial surface is driven from here. An EMPTY string means
   the feature is completely hidden and the app behaves exactly as it
   did before this block existed. Nothing here phones home.
   ==================================================================== */
var TAPE = {
  name:      "Tape",
  wordmark:  "TAPE",
  url:       "",           /* e.g. "tape.example.com" — shown on exported images */
  accent:    "",           /* e.g. "#C0800C" — overrides --signal when set */
  supportUrl:"",           /* footer support link; hidden while empty */
  workbookUrl:"",          /* paid workbook link; hidden while empty */
  sections:  null,         /* null = all; or ["basics","risk"] to ship a subset */
  footer:    ""            /* extra footer line; hidden while empty */
};
/* guarded: the test harness evaluates data blocks with no document */
if(typeof document!=="undefined" && TAPE.accent){
  try{ document.documentElement.style.setProperty("--signal", TAPE.accent); }catch(e){}
}
</script>

<script>
/* ====================================================================
   IMAGE EXPORT
   Serialises an existing SVG through XMLSerializer into a canvas and
   hands back a PNG blob. No library, no network.

   The one real trap: the charts are drawn with CSS custom properties
   (var(--up), var(--accent)...). Those do not resolve inside a
   standalone serialised SVG, so every var() is substituted with its
   computed value before rasterising, or the export comes out black.
   ==================================================================== */
var TAPE_PRESETS = {
  square:    {w:1080, h:1080, label:"Square 1080×1080"},
  portrait:  {w:1080, h:1920, label:"Portrait 1080×1920"},
  landscape: {w:1200, h:630,  label:"Landscape 1200×630"}
};

function tapeVars(){
  var cs = getComputedStyle(document.documentElement);
  var names = ["--paper","--card","--ink","--ink2","--ink3","--rule","--rule2",
               "--up","--down","--accent","--signal","--tint"];
  var out = {};
  names.forEach(function(n){ out[n] = (cs.getPropertyValue(n) || "").trim() || "#888"; });
  return out;
}

function tapeInlineVars(svgText, vars){
  return svgText.replace(/var\(\s*(--[a-z0-9-]+)\s*(?:,[^)]*)?\)/gi, function(m, name){
    return vars[name] || "#888";
  });
}

function tapeWrapText(ctx, text, maxW){
  var words = String(text).split(/\s+/), lines = [], line = "";
  for(var i=0;i<words.length;i++){
    var probe = line ? line+" "+words[i] : words[i];
    if(ctx.measureText(probe).width > maxW && line){ lines.push(line); line = words[i]; }
    else line = probe;
  }
  if(line) lines.push(line);
  return lines;
}

/* Returns a Promise for a PNG Blob. */
function tapeExportPng(svgEl, opts){
  opts = opts || {};
  var preset = TAPE_PRESETS[opts.preset] || TAPE_PRESETS.square;
  var vars = tapeVars();
  var W = preset.w, H = preset.h;

  var clone = svgEl.cloneNode(true);
  if(!clone.getAttribute("xmlns")) clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  var raw = new XMLSerializer().serializeToString(clone);
  raw = tapeInlineVars(raw, vars);
  /* the chart's text classes live in the page stylesheet, not the svg */
  raw = raw.replace(/<svg([^>]*)>/, '<svg$1><style>'+
    'text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;fill:'+vars["--ink3"]+'}'+
    '.lb{fill:'+vars["--ink3"]+'}.lbu{fill:'+vars["--up"]+'}.lbd{fill:'+vars["--down"]+'}'+
    '.lba{fill:'+vars["--accent"]+'}.lbs{fill:'+vars["--signal"]+'}.lbk{fill:'+vars["--ink"]+'}'+
    '</style>');

  var url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(raw);

  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      try{
        var cv = document.createElement("canvas");
        cv.width = W; cv.height = H;
        var ctx = cv.getContext("2d");

        ctx.fillStyle = vars["--paper"]; ctx.fillRect(0,0,W,H);

        var pad = Math.round(W * 0.075);
        var innerW = W - pad*2;

        /* title.
           Measured at a 200px thumbnail the first version only reached 4.25:1 —
           antialiasing on downscale eats thin text. Heavier weight, larger size
           and a solid plate behind it so the contrast survives shrinking. */
        var titleSize = Math.round(W * 0.078);
        ctx.textBaseline = "top";
        ctx.font = "800 "+titleSize+"px ui-sans-serif, system-ui, sans-serif";
        var titleLines = tapeWrapText(ctx, opts.title || "", innerW).slice(0,2);
        var plateH = titleLines.length*titleSize*1.14 + Math.round(W*0.03);
        ctx.fillStyle = vars["--card"];
        ctx.fillRect(0, pad - Math.round(W*0.022), W, plateH);
        ctx.fillStyle = vars["--signal"];
        ctx.fillRect(0, pad - Math.round(W*0.022), Math.round(W*0.012), plateH);
        ctx.fillStyle = vars["--ink"];
        var y = pad;
        titleLines.forEach(function(L){ ctx.fillText(L, pad, y); y += titleSize*1.14; });
        y += Math.round(W*0.012);

        /* one line of definition */
        if(opts.subtitle){
          var subSize = Math.round(W * 0.028);
          ctx.fillStyle = vars["--ink2"];
          ctx.font = "400 "+subSize+"px ui-sans-serif, system-ui, sans-serif";
          y += Math.round(W*0.014);
          tapeWrapText(ctx, opts.subtitle, innerW).slice(0,3).forEach(function(L){
            ctx.fillText(L, pad, y); y += subSize*1.42;
          });
        }

        /* chart, scaled to fit what's left above the footer */
        var footerH = Math.round(W * 0.085);
        var availTop = y + Math.round(W*0.035);
        var availH = H - availTop - footerH - pad*0.5;
        var ar = (img.width && img.height) ? img.width/img.height : 320/150;
        var dw = innerW, dh = dw/ar;
        if(dh > availH){ dh = availH; dw = dh*ar; }
        var dx = pad + (innerW - dw)/2;
        var dy = availTop + Math.max(0,(availH - dh)/2);

        ctx.fillStyle = vars["--tint"];
        ctx.fillRect(pad, dy - Math.round(W*0.02), innerW, dh + Math.round(W*0.04));
        ctx.drawImage(img, dx, dy, dw, dh);

        /* caption */
        if(opts.caption){
          var capSize = Math.round(W*0.022);
          ctx.fillStyle = vars["--ink3"];
          ctx.font = "400 "+capSize+"px ui-sans-serif, system-ui, sans-serif";
          var capY = dy + dh + Math.round(W*0.032);
          tapeWrapText(ctx, opts.caption, innerW).slice(0,2).forEach(function(L){
            ctx.fillText(L, pad, capY); capY += capSize*1.4;
          });
        }

        /* attribution — the only thing that survives the file being copied */
        var markSize = Math.round(W*0.026);
        ctx.font = "700 "+markSize+"px ui-monospace, Menlo, Consolas, monospace";
        ctx.fillStyle = vars["--signal"];
        ctx.textBaseline = "alphabetic";
        ctx.fillText(TAPE.wordmark || "TAPE", pad, H - pad*0.75);
        if(TAPE.url){
          ctx.font = "400 "+markSize+"px ui-monospace, Menlo, Consolas, monospace";
          ctx.fillStyle = vars["--ink3"];
          ctx.textAlign = "right";
          ctx.fillText(TAPE.url, W - pad, H - pad*0.75);
          ctx.textAlign = "left";
        }

        if(cv.toBlob) cv.toBlob(function(b){ b ? resolve(b) : reject(new Error("toBlob returned null")); }, "image/png");
        else reject(new Error("canvas.toBlob unavailable"));
      }catch(err){ reject(err); }
    };
    img.onerror = function(){ reject(new Error("svg failed to rasterise")); };
    img.src = url;
  });
}

function tapeDownload(blob, filename){
  try{
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  }catch(e){ return false; }
}

/* expose for tests and for the post builder */
if(typeof window!=="undefined"){
  window.tapeExportPng = tapeExportPng;
  window.tapeDownload = tapeDownload;
  window.TAPE_PRESETS = TAPE_PRESETS;
  window.tapeInlineVars = tapeInlineVars;
}
</script>

<script>
/* ====================================================================
   EXPORT BUTTONS on every chart, plus the config-driven footer line.
   ==================================================================== */
(function(){
"use strict";
if(typeof document==="undefined") return;

function slugOf(el){
  var e = el.closest ? el.closest(".entry") : null;
  return e ? (e.dataset.slug||"chart") : "chart";
}
function titleOf(el){
  var e = el.closest ? el.closest(".entry") : null;
  if(!e) return TAPE.name;
  var h = e.querySelector(".term");
  if(!h) return TAPE.name;
  var c = h.cloneNode(true);
  Array.prototype.forEach.call(c.querySelectorAll("button"), function(b){ b.remove(); });
  return c.textContent.trim();
}
function defOf(el){
  var e = el.closest ? el.closest(".entry") : null;
  var p = e ? e.querySelector(".def") : null;
  return p ? p.textContent.trim() : "";
}
function capOf(fig){
  var c = fig.querySelector("figcaption");
  return c ? c.textContent.trim() : "";
}

function mountExport(fig){
  if(fig.querySelector(".expbar")) return;
  var svg = fig.querySelector("svg");
  if(!svg) return;
  var bar = document.createElement("div");
  bar.className = "expbar";
  bar.innerHTML = '<span class="explab">Export</span>';
  Object.keys(TAPE_PRESETS).forEach(function(k){
    var b = document.createElement("button");
    b.type = "button"; b.className = "expbtn"; b.dataset.preset = k;
    b.textContent = TAPE_PRESETS[k].label.split(" ")[0];
    b.setAttribute("aria-label","Export chart as "+TAPE_PRESETS[k].label+" PNG");
    b.onclick = function(ev){
      ev.stopPropagation();
      b.disabled = true;
      tapeExportPng(svg, {
        preset:k, title:titleOf(fig), subtitle:defOf(fig), caption:capOf(fig)
      }).then(function(blob){
        tapeDownload(blob, (TAPE.wordmark||"tape").toLowerCase()+"-"+slugOf(fig)+"-"+k+".png");
        if(window.__toast) window.__toast("Exported "+TAPE_PRESETS[k].label);
      }).catch(function(err){
        if(window.__toast) window.__toast("Export failed: "+err.message);
      }).then(function(){ b.disabled = false; });
    };
    bar.appendChild(b);
  });
  fig.appendChild(bar);
}

function mountAll(){
  document.querySelectorAll("#grid figure").forEach(mountExport);
}
mountAll();

/* config-driven footer additions; invisible while the constants are empty */
(function(){
  var f = document.getElementById("foot");
  if(!f) return;
  var bits = [];
  if(TAPE.footer) bits.push(TAPE.footer);
  if(TAPE.supportUrl) bits.push('<a href="'+TAPE.supportUrl+'" rel="noopener noreferrer">Support this project</a>');
  if(TAPE.workbookUrl) bits.push('<a href="'+TAPE.workbookUrl+'" rel="noopener noreferrer">Printable workbook</a>');
  if(!bits.length) return;
  var p = document.createElement("p");
  p.className = "tapefoot";
  p.innerHTML = bits.join(" &middot; ");
  f.appendChild(p);
})();
})();
</script>

<script>
/* ====================================================================
   STRUCTURED DATA
   DefinedTermSet + DefinedTerm. Injected at runtime because the terms
   live in JS; search engines execute JS, but a static block would mean
   duplicating a megabyte of data into the head.
   ==================================================================== */
(function(){
if(typeof document==="undefined") return;
try{
  var D=window.D||[], CAT=window.CAT||[];
  if(!D.length) return;
  var catName={}; CAT.forEach(function(c){catName[c[0]]=c[1];});
  var ld={
    "@context":"https://schema.org",
    "@type":"DefinedTermSet",
    "name":(window.TAPE&&TAPE.name)||"Tape",
    "description":"Trading terms, what they look like on a chart, and whether they hold up when tested.",
    "hasDefinedTerm": D.slice(0,400).map(function(x){
      return {"@type":"DefinedTerm","name":x.t,"description":x.d,
              "inDefinedTermSet":(window.TAPE&&TAPE.name)||"Tape",
              "termCode":String(x.t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")};
    })
  };
  var sc=document.createElement("script");
  sc.type="application/ld+json";
  sc.textContent=JSON.stringify(ld);
  document.head.appendChild(sc);
  window.__ldCount=ld.hasDefinedTerm.length;
}catch(e){}
})();
</script>

<script>
/* ====================================================================
   POST BUILDER + CAROUSEL EXPORT
   The growth engine: turn any term, or a whole section, into finished
   images and a copyable caption. Everything client-side.
   ==================================================================== */
(function(){
"use strict";
if(typeof document==="undefined") return;

var EKEY="tape.exported";
function loadExported(){try{return JSON.parse(localStorage.getItem(EKEY)||"[]");}catch(e){return [];}}
function saveExported(a){try{localStorage.setItem(EKEY,JSON.stringify(a));}catch(e){}}
function markExported(slug){
  var a=loadExported();
  if(a.indexOf(slug)<0){a.push(slug);saveExported(a);}
}
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function slugify(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}

function captionFor(x){
  var lines=[];
  lines.push(x.t.toUpperCase());
  lines.push("");
  lines.push(x.d);
  if(x.e){lines.push("");lines.push(x.warn?("Careful: "+x.e):("Example: "+x.e));}
  if(window.TAPE&&TAPE.url){lines.push("");lines.push(TAPE.url);}
  return lines.join("\n");
}

/* find a rendered svg for a term, if it has one */
function svgFor(slug){
  var e=document.getElementById("term-"+slug);
  return e?e.querySelector("figure svg"):null;
}

function exportTerm(x, preset){
  var slug=slugify(x.t);
  var svg=svgFor(slug);
  if(!svg) return Promise.reject(new Error("no chart for "+x.t));
  var e=document.getElementById("term-"+slug);
  var cap=e?(e.querySelector("figcaption")||{}).textContent||"":"";
  return window.tapeExportPng(svg,{preset:preset||"square",title:x.t,subtitle:x.d,caption:cap})
    .then(function(b){markExported(slug);return b;});
}

/* ---- carousel: a whole section as numbered slides ---- */
function carousel(sectionId, preset, onProgress){
  var D=window.D||[];
  var items=D.filter(function(x){return x.c===sectionId && svgFor(slugify(x.t));});
  var out=[], i=0;
  function step(){
    if(i>=items.length) return Promise.resolve(out);
    var x=items[i];
    return exportTerm(x,preset).then(function(b){
      var n=String(i+1).padStart(2,"0");
      out.push({name:n+"-"+slugify(x.t)+".png",blob:b,term:x.t});
      i++;
      if(onProgress)onProgress(i,items.length,x.t);
      return step();
    }).catch(function(){ i++; return step(); });
  }
  return step();
}
window.tapeCarousel=carousel;
window.tapeExportTerm=exportTerm;
window.tapeCaptionFor=captionFor;

/* ---- UI ---- */
function mount(){
  var host=document.getElementById("panel-terms");
  if(!host||document.getElementById("postbuilder")) return;
  var D=window.D||[], CAT=window.CAT||[];

  var box=document.createElement("div");
  box.id="postbuilder";
  box.className="wrap";
  var opts=CAT.filter(function(c){
    return D.some(function(x){return x.c===c[0]&&svgFor(slugify(x.t));});
  }).map(function(c){
    var n=D.filter(function(x){return x.c===c[0]&&svgFor(slugify(x.t));}).length;
    return '<option value="'+esc(c[0])+'">'+esc(c[1])+' ('+n+')</option>';
  }).join("");

  box.innerHTML=
    '<details id="pbdet"><summary>Post builder — turn terms into images</summary>'+
    '<div class="pbbody">'+
    '<p class="pbnote">Exports run entirely in this browser. Nothing is uploaded.</p>'+
    '<div class="pbrow">'+
      '<label class="qlab" for="pb-preset">Size</label>'+
      '<select id="pb-preset" class="btn"><option value="square">Square 1080</option>'+
      '<option value="portrait">Portrait 1080×1920</option><option value="landscape">Landscape 1200×630</option></select>'+
      '<button class="btn pri" id="pb-surprise">Surprise me</button>'+
    '</div>'+
    '<div class="pbrow">'+
      '<label class="qlab" for="pb-sec">Carousel</label>'+
      '<select id="pb-sec" class="btn">'+opts+'</select>'+
      '<button class="btn" id="pb-run">Export section as slides</button>'+
    '</div>'+
    '<div id="pb-out" class="pbout" aria-live="polite"></div>'+
    '</div></details>';
  host.insertBefore(box, host.firstChild);

  var out=document.getElementById("pb-out");

  document.getElementById("pb-surprise").onclick=function(){
    var done=loadExported();
    var pool=D.filter(function(x){return svgFor(slugify(x.t))&&done.indexOf(slugify(x.t))<0;});
    if(!pool.length){ out.textContent="Every term with a chart has been exported. Clear tape.exported to start again."; return; }
    var x=pool[Math.floor(Math.random()*pool.length)];
    var preset=document.getElementById("pb-preset").value;
    out.textContent="Exporting "+x.t+"…";
    exportTerm(x,preset).then(function(b){
      window.tapeDownload(b,(TAPE.wordmark||"tape").toLowerCase()+"-"+slugify(x.t)+".png");
      var cap=captionFor(x);
      var copied=false;
      try{ if(navigator.clipboard){ navigator.clipboard.writeText(cap); copied=true; } }catch(e){}
      out.innerHTML='<b>'+esc(x.t)+'</b> exported. '+(copied?"Caption copied to clipboard.":"Caption below.")+
        '<textarea class="pbcap" readonly rows="6">'+esc(cap)+'</textarea>'+
        '<span class="pbleft">'+(pool.length-1)+' charted terms left to post</span>';
    }).catch(function(e){ out.textContent="Export failed: "+e.message; });
  };

  document.getElementById("pb-run").onclick=function(){
    var sec=document.getElementById("pb-sec").value;
    var preset=document.getElementById("pb-preset").value;
    var btn=this; btn.disabled=true;
    out.textContent="Building slides…";
    carousel(sec,preset,function(i,n,name){ out.textContent="Slide "+i+" of "+n+" — "+name; })
      .then(function(files){
        files.forEach(function(f,ix){
          setTimeout(function(){ window.tapeDownload(f.blob,f.name); }, ix*250);
        });
        out.innerHTML='<b>'+files.length+' slides</b> exported, numbered in order. '+
          'Your browser may ask to allow multiple downloads.';
        btn.disabled=false;
      }).catch(function(e){ out.textContent="Carousel failed: "+e.message; btn.disabled=false; });
  };
}
mount();
})();
</script>

<script>
/* ====================================================================
   PRINTABLE WORKBOOK — uses the existing print stylesheet, no library.
   ==================================================================== */
(function(){
if(typeof document==="undefined") return;
function mount(){
  var f=document.getElementById("foot");
  if(!f||document.getElementById("wbprint")) return;
  var b=document.createElement("button");
  b.id="wbprint"; b.type="button"; b.className="btn";
  b.textContent="Print / save as PDF";
  b.onclick=function(){
    document.body.classList.add("printing");
    var was=document.getElementById("panel-terms").hidden;
    document.getElementById("panel-terms").hidden=false;
    setTimeout(function(){
      window.print();
      document.body.classList.remove("printing");
      document.getElementById("panel-terms").hidden=was;
    },80);
  };
  var p=document.createElement("p");
  p.appendChild(b);
  f.appendChild(p);
}
mount();
})();
</script>
