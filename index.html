long:"Kill zones are the framework's named time windows \u2014 chiefly around the London and New York opens \u2014 during which its setups are considered valid. Trades outside the windows are, in this system, simply not taken regardless of how the chart looks.\n\nThe defensible core is session statistics: volatility and volume genuinely concentrate around major session opens, measurably and persistently. Restricting trading to hours when spreads are tight and movement is real is ordinary good practice, and time-of-day filters are among the few filters cheap to test honestly, since the window is objective.\n\nWhat the label adds beyond that is the implication of intent \u2014 that these are the hours when engineered moves are executed \u2014 and a fixed schedule occasionally at odds with its own logic, since a window defined in New York time drifts against other markets whenever daylight saving changes on one side. For a Perth trader the practical detail is blunter: the New York kill zone sits in the middle of the night, which makes any strategy built on it a sleep-deprivation strategy first and a trading strategy second.\n\nWhere people get fooled: crediting the window for results that any volatility filter would have produced, and never testing the same setup against a random window of equal length \u2014 the control that would actually isolate the claim.",
usage:"Used as a time filter, which is its testable content: state the window, take setups only inside it, and compare the log against the same setups unfiltered before believing the window itself carries the edge.",
see:["Judas swing", "Silver bullet", "Asian range", "True open"]},

"Judas swing":{
long:"The Judas swing is the framework's name for an early-session feint: a move shortly after a session opens that runs in one direction, collects the stops and breakout entries above or below the overnight range, then reverses into what becomes the real move of the day. The name casts the first move as the betrayal.\n\nUnderneath the branding sits a pattern traders have described for decades \u2014 the failed opening breakout, or the open drive that fades. Session opens concentrate orders: overnight positions defending levels, new entries chasing the first move, stops clustered just beyond the Asian range. A push into that congestion that fails to hold has real mechanical reasons to reverse hard, none of which require deceit as an explanation.\n\nAs with everything in this family, the observation is genuine and the reliability claim is untested. First moves also simply continue \u2014 trend days exist, and they punish fading the open harshly. Nothing on the chart distinguishes the feint from the real move at the time; only the reclaim or the failure does, bars later.\n\nWhere people get fooled: labelling after the fact. The morning move that reversed was the Judas swing; the one that ran all day was displacement. Assigned in hindsight, the term cannot be wrong, which is precisely the problem.",
usage:"Used, when disciplined, as a reason to demand confirmation before trading the first directional push of a session \u2014 the reclaim of the swept level being the event, not the initial break.",
see:["Liquidity sweep", "Kill zone", "Turtle soup", "False breakout"]},

"Power of 3":{
long:"Power of 3 is the framework's claim that price action within a session \u2014 or a day, a week, any cycle \u2014 unfolds in three acts: accumulation, a range where positions are built; manipulation, a false move against the intended direction to collect stops; and distribution, the true directional leg. The open-high-low-close of a candle is read as a miniature of the same drama.\n\nThe lineage is worth naming: this is Wyckoff's accumulation\u2013markup\u2013distribution cycle, published a century earlier, with a manipulation act inserted and the intent story hardened. Wyckoff offered his phases as a description of how large positions must be built; Power of 3 presents each session as choreography.\n\nThe testable residue is modest but real: ranges often precede directional moves, and false breaks of the overnight range before the day's true move are common enough to have older names. The untestable part is the framing that all three acts are one participant's plan \u2014 a claim no chart can verify, since identical shapes emerge from ordinary crowd behaviour around session opens.\n\nWhere people get fooled: the template fits almost any completed day in hindsight, because most days contain a range, a failed move and a trend somewhere. A pattern that can be found in everything after the fact forbids nothing in advance.",
usage:"Used descriptively to organise a session in review \u2014 where was the range, the failed move, the real leg \u2014 and pre-registered with exact definitions before being trusted as anything more than narration.",
see:["Accumulation", "Judas swing", "Quarterly Theory", "Reality check on this section"]},

"SMT divergence":{
long:"SMT divergence \u2014 smart money technique divergence \u2014 is a disagreement between two instruments that normally move together: one index sweeps its prior low while its closely correlated sibling holds above its own. The framework reads the failure of the pair to confirm each other as evidence the move is corrective and a reversal is near.\n\nOf everything in this section, this is the most testable idea, because it uses two independent data series and produces an objective condition: instrument A takes out a reference level, instrument B does not, within a stated window. No intent story is needed for the logic either \u2014 correlated indices diverging at extremes genuinely can reflect relative strength worth knowing about, the same reasoning behind classic intermarket analysis.\n\nThe honest caveats are the usual ones. Which pairs, which reference points, and what time window all have to be fixed in advance, or the divergences get found after the move. And correlated pairs diverge briefly all the time for mundane reasons \u2014 different contract rolls, one-sided flows, timing of a single large order \u2014 so raw frequency is high and specificity is the whole game.\n\nWhere people get fooled: scanning several pairs and celebrating whichever diverged before a turn. With enough pairs, one always did. The test is one pair, one rule, declared first.",
usage:"Used as a confirmation filter at levels already selected \u2014 a sweep unconfirmed by the correlated instrument is treated as more suspect \u2014 and worth pre-registering properly, since it is one of the few claims here a trade log can actually settle.",
see:["Correlation", "Liquidity sweep", "Divergence", "Framework vs strategy"]},

"IPDA":{
long:"IPDA \u2014 the Interbank Price Delivery Algorithm \u2014 is the framework's claim that price movement is administered by an algorithm which delivers price between pools of liquidity and imbalances on a schedule, and that its behaviour can be anticipated by traders who understand its logic.\n\nThis is the point where the vocabulary crosses from interpretation into assertion of hidden machinery, so it is worth being precise about what is and is not known. Real markets do run on matching engines with published rules, and algorithmic execution genuinely dominates volume \u2014 those are facts about plumbing and participants. The existence of a single coordinating algorithm that steers price toward retail-visible levels on a timetable is not among the facts; no exchange documentation, market-structure research or regulatory record describes such a thing, and the claim's origin is the framework itself.\n\nFunctionally, IPDA plays the role of an axiom: it converts every observed move into intentional delivery, which makes the framework feel coherent while making it untestable \u2014 an algorithm whose behaviour explains all outcomes can never be caught contradicting itself.\n\nWhere people get fooled: mistaking internal consistency for evidence. A story in which everything fits is a property of flexible stories, not of validated ones. The parts of this section worth keeping survive without the axiom.",
usage:"Included for vocabulary rather than use: recognising the term and the claim it smuggles in lets you separate the framework's observable pieces \u2014 levels, sweeps, sessions \u2014 from the machinery asserted underneath them.",
see:["Reality check on this section", "Smart money", "Institutional order flow", "Falsifiability"]},

"Liquidity pool":{
long:"A liquidity pool is a price area where resting orders have visibly accumulated: stops beyond an obvious swing high or low, breakout orders above a well-tested level, entries clustered under equal lows. The framework treats these pools as the market's destinations \u2014 where price is drawn because that is where the executable orders are.\n\nThe mechanism here is the most defensible in the section, because it needs no story about intent. People place orders at levels they can identify, everyone identifies the same obvious levels, and stop orders are market orders waiting to trigger. A shelf of stops beyond a clean high is therefore real fuel: price reaching it sets off a burst of forced transactions, which is why moves often accelerate just past obvious levels and why fills there are worse than expected.\n\nWhat does not follow automatically is the navigational claim \u2014 that price seeks these pools with intent and reaching one implies reversal. Pools get consumed in continuation as often as at turning points; the burst of orders is fuel for whatever happens next, not a verdict.\n\nWhere people get fooled: drawing pools everywhere and crediting whichever one price eventually touched. The concept earns its keep only when the levels are marked in advance and the misses are counted with the hits.",
usage:"Used to reason about stop placement \u2014 just beyond the obvious level is inside the pool with everyone else's \u2014 and to anticipate where movement may accelerate, without assuming the pool's consumption predicts direction.",
see:["Equal highs / equal lows", "Liquidity sweep", "Stop hunt", "Inducement"]},

"Turtle soup":{
long:"Turtle soup is a fade of a failed breakout at a multi-day extreme: price takes out something like a twenty-day low, fails to continue, and the trade is entered back inside the range betting the break was false. The name is a joke at the expense of the Turtle traders, whose famous system bought exactly those breakouts \u2014 this strategy aims to eat them.\n\nCredit where it is documented: the setup was published by Linda Raschke and Laurence Connors in Street Smarts in 1995, with specific rules about how recent the prior extreme must be and where entries and stops go. It long predates the modern vocabulary that renamed the same event a liquidity sweep of an old low. Knowing the lineage matters, because the original authors stated testable rules rather than intent stories.\n\nMechanically it monetises a real phenomenon \u2014 breakout systems cluster orders beyond extremes, and when a break attracts no follow-through, the trapped entries unwinding become fuel for the reversal.\n\nWhere people get fooled: assuming the pattern's fame means it still pays. This project tested the sweep-and-reclaim family across hundreds of variants and it lost out of sample, roughly \u221224% to \u221248%. A setup can be well-defined, historically documented, mechanically sensible \u2014 and still not survive costs on current data. That is exactly why the ledger, not the story, gets the last word.",
usage:"Used as the reference example of a fully specified reversal rule: objective trigger, stated invalidation, published source. Anyone trading it owes themselves a look at out-of-sample results first.",
see:["Liquidity sweep", "False breakout", "Spring", "Breakout"]}

};

/* Attach to the data. D is simply in scope: this block and the D.push blocks
   are both plain data, with nothing browser-specific between them. That is
   why the window guard this used to carry has gone. */
D.forEach(function(x){
  var e=L[x.t];
  if(!e)return;
  x.long=e.long; x.usage=e.usage; x.see=e.see;
});
})();
</script>

<script>
/* ====================================================================
   STARTER LIBRARY
   Every strategy below has PUBLISHED rules from a documented source —
   a book, a paper, or a public rule set. Nothing here is invented and
   nothing is attributed to anyone who did not publish it.

   Evidence is deliberately "untested" with sampleSize 0 across the
   board. Several of these HAVE been tested by this project's own
   Strategy Lab, and the recorded outcome is written into `results` —
   but a verified trade count is what earns a tested badge, and that
   number lives in the Lab, not here. The Strategy Lab bridge is what
   should upgrade these, not a guess made in the browser.
   ==================================================================== */
var TAPE_SEED=[];
/* Emptied deliberately. Eleven strategies were removed here: their rules were
   written from recall and given citations, which made recalled text look
   sourced. Rules only enter this library if they are dictated directly or read
   from a named file. A blank library is correct; invented rules that look
   researched are not. */
/* No explicit export line is needed: a top-level var in a classic script is
   already a property of the global object, which is how the provenance guard
   in the test suite reads it. */
</script>

<!-- ====================================================================
     3. ENGINE
     candleSvg / equitySvg / svgFor and nothing else. There is exactly one
     chart renderer in this file and everything draws through it.
     ==================================================================== -->

<script>
var W=320,H=150;
/* `label` becomes the svg's aria-label. Callers that are asking the reader to
   identify the pattern — the quiz and the spot-the-pattern card — deliberately
   pass nothing, because naming the term there would give away the answer. */
function svgFor(v,label){
  if(!v) return "";
  if(v.k==="raw") return v.svg;
  if(v.k==="e") return equitySvg(v,label);
  return candleSvg(v,label);
}
function col(c){
  return {a:"var(--accent)",s:"var(--signal)",u:"var(--up)",d:"var(--down)",k:"var(--ink)",g:"var(--ink3)",r:"var(--rule2)"}[c||"g"];
}
function cls(c){
  return {a:"lba",s:"lbs",u:"lbu",d:"lbd",k:"lbk"}[c||""]||"lb";
}
function candleSvg(v,label){
  var d=v.d,n=d.length,pad=8,top=10,vh=v.vol?26:0,bot=6+vh;
  var ps=[];
  d.forEach(function(c){ps.push(c[1],c[2]);});
  (v.hl||[]).forEach(function(o){ps.push(o.p);});
  (v.bx||[]).forEach(function(o){ps.push(o.p0,o.p1);});
  (v.zn||[]).forEach(function(o){ps.push(o.p0,o.p1);});
  (v.pl||[]).forEach(function(o){o.pts.forEach(function(p){ps.push(p[1]);});});
  (v.mk||[]).forEach(function(o){ps.push(o.p);});
  var lo=Math.min.apply(null,ps),hi=Math.max.apply(null,ps),rg=(hi-lo)||1;
  lo-=rg*0.14; hi+=rg*0.14; rg=hi-lo;
  var plotH=H-top-bot;
  function Y(p){return top+(hi-p)/rg*plotH;}
  var step=(W-pad*2)/n, cw=Math.min(step*0.62,13);
  function X(i){return pad+step*(i+0.5);}
  var s="";
  (v.zn||[]).forEach(function(o){
    s+='<rect x="'+pad+'" y="'+Y(Math.max(o.p0,o.p1)).toFixed(1)+'" width="'+(W-pad*2)+'" height="'+Math.abs(Y(o.p0)-Y(o.p1)).toFixed(1)+'" fill="'+col(o.c)+'" opacity="0.09"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+(W-pad-2)+'" y="'+(Y(Math.max(o.p0,o.p1))+10).toFixed(1)+'" text-anchor="end">'+o.t+'</text>';
  });
  (v.bx||[]).forEach(function(o){
    var x0=X(o.i0)-cw/2-2,x1=X(o.i1)+cw/2+2,y0=Y(Math.max(o.p0,o.p1)),y1=Y(Math.min(o.p0,o.p1));
    s+='<rect x="'+x0.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+(x1-x0).toFixed(1)+'" height="'+Math.max(y1-y0,2).toFixed(1)+'" fill="'+col(o.c)+'" opacity="0.15" stroke="'+col(o.c)+'" stroke-width="0.6"/>';
    if(o.t){
      var ty=o.below?y1+9:y0-3;
      s+='<text class="'+cls(o.c)+'" x="'+((x0+x1)/2).toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle">'+o.t+'</text>';
    }
  });
  (v.hl||[]).forEach(function(o){
    s+='<line x1="'+pad+'" y1="'+Y(o.p).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+Y(o.p).toFixed(1)+'" stroke="'+col(o.c)+'" stroke-width="0.8"'+(o.solid?"":' stroke-dasharray="3 3"')+'/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+(o.la?pad+2:W-pad-2)+'" y="'+(Y(o.p)+(o.below?9:-3)).toFixed(1)+'" text-anchor="'+(o.la?"start":"end")+'">'+o.t+'</text>';
  });
  if(v.vol){
    var mv=Math.max.apply(null,v.vol),vy=H-4;
    v.vol.forEach(function(u,i){
      var h=u/mv*(vh-6);
      s+='<rect x="'+(X(i)-cw/2).toFixed(1)+'" y="'+(vy-h).toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+(d[i][3]>=d[i][0]?col("u"):col("d"))+'" opacity="0.4"/>';
    });
  }
  d.forEach(function(c,i){
    var up=c[3]>=c[0],cc=up?col("u"):col("d"),x=X(i);
    s+='<line x1="'+x.toFixed(1)+'" y1="'+Y(c[1]).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+Y(c[2]).toFixed(1)+'" stroke="'+cc+'" stroke-width="1"/>';
    var y0=Y(Math.max(c[0],c[3])),hgt=Math.max(Math.abs(Y(c[0])-Y(c[3])),1.2);
    s+='<rect x="'+(x-cw/2).toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="'+(up?"none":cc)+'" stroke="'+cc+'" stroke-width="1"/>';
  });
  (v.pl||[]).forEach(function(o){
    var p=o.pts.map(function(q){return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1);}).join(" ");
    s+='<polyline points="'+p+'" fill="none" stroke="'+col(o.c)+'" stroke-width="'+(o.w||1.2)+'"'+(o.dash?' stroke-dasharray="3 3"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+X(o.pts[o.pts.length-1][0]).toFixed(1)+'" y="'+(Y(o.pts[o.pts.length-1][1])-4).toFixed(1)+'" text-anchor="end">'+o.t+'</text>';
  });
  (v.mk||[]).forEach(function(o){
    var x=X(o.i),y=Y(o.p);
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.4" fill="'+col(o.c)+'"/>';
    if(o.t){
      var ax=o.right?"start":(o.left?"end":"middle");
      var tx=o.right?x+5:(o.left?x-5:x);
      s+='<text class="'+cls(o.c)+'" x="'+tx.toFixed(1)+'" y="'+(y+(o.below?10:-6)).toFixed(1)+'" text-anchor="'+ax+'">'+o.t+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(label||"chart")+'">'+s+'</svg>';
}
function equitySvg(v,label){
  var pad=10,top=12,bot=10,ps=[];
  v.s.forEach(function(o){o.v.forEach(function(p){ps.push(p);});});
  var lo=Math.min.apply(null,ps),hi=Math.max.apply(null,ps),rg=(hi-lo)||1;
  lo-=rg*0.12;hi+=rg*0.16;rg=hi-lo;
  var plotH=H-top-bot,n=v.s[0].v.length;
  function Y(p){return top+(hi-p)/rg*plotH;}
  function X(i){return pad+(W-pad*2)*(i/(n-1));}
  var s='<line x1="'+pad+'" y1="'+Y(v.base||0).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+Y(v.base||0).toFixed(1)+'" stroke="var(--rule2)" stroke-width="0.7" stroke-dasharray="3 3"/>';
  (v.zn||[]).forEach(function(o){
    s+='<rect x="'+X(o.i0).toFixed(1)+'" y="'+top+'" width="'+(X(o.i1)-X(o.i0)).toFixed(1)+'" height="'+plotH+'" fill="'+col(o.c)+'" opacity="0.08"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+((X(o.i0)+X(o.i1))/2).toFixed(1)+'" y="'+(top+9)+'" text-anchor="middle">'+o.t+'</text>';
  });
  v.s.forEach(function(o){
    var p=o.v.map(function(q,i){return X(i).toFixed(1)+","+Y(q).toFixed(1);}).join(" ");
    s+='<polyline points="'+p+'" fill="none" stroke="'+col(o.c)+'" stroke-width="1.5"'+(o.dash?' stroke-dasharray="3 3"':'')+' stroke-linejoin="round"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+(W-pad-2)+'" y="'+(Y(o.v[o.v.length-1])+(o.below?9:-4)).toFixed(1)+'" text-anchor="end">'+o.t+'</text>';
  });
  (v.mk||[]).forEach(function(o){
    s+='<circle cx="'+X(o.i).toFixed(1)+'" cy="'+Y(o.p).toFixed(1)+'" r="2.4" fill="'+col(o.c)+'"/>';
    if(o.t) s+='<text class="'+cls(o.c)+'" x="'+X(o.i).toFixed(1)+'" y="'+(Y(o.p)+(o.below?10:-6)).toFixed(1)+'" text-anchor="middle">'+o.t+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(label||"equity curve")+'">'+s+'</svg>';
}
</script>

<!-- ====================================================================
     4. UTIL
     One esc, one slug, one el, one storage wrapper, one key list — plus
     the one-time tg.* to tape.* migration, which belongs beside them.
     ==================================================================== -->

<script>
/* ====================================================================
   UTIL — one of each.
   Seven private copies of esc, seven of slug and six of el used to be
   declared inside the modules below, each unreachable from the next.
   They live here once; every module binds to them under the local name
   it already used, so call sites did not have to move.

   esc and escText are deliberately two functions. escText escapes only
   & and <, and the grid's search highlighter depends on exactly that:
   it builds a regex from the RAW text and applies it to the ESCAPED
   text, so escaping " and > as well would silently stop highlighting
   any search containing those characters.
   ==================================================================== */
var TAPE_NS=(function(){
"use strict";
function el(id){return document.getElementById(id);}
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function escText(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function slug(x){return String(x).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}

/* One storage wrapper. A browser with storage disabled throws on every
   access, which is why fifteen call sites each carried their own
   try/catch. Unavailable storage degrades to null/false/fallback here
   instead, in one place. */
/* Every storage key the app uses. Worth having in one list because the
   names are NOT consistent: the tg.* prefix is the original, tape.* is the
   current one, and the strategies tab still reads and writes the old name
   while the term panel and the seed loader prefer the new one. Naming them
   here documents that split rather than hiding it in eight literals. */
var K={
  stars:      "tg.stars.v1",
  strats:     "tg.strats.v1",    /* strategies tab reads and writes this */
  stratsTape: "tape.strats.v1",  /* term panel and seed loader prefer this */
  quiz:       "tg.quiz.v1",
  theme:      "tg.theme",
  lastTab:    "tg.lasttab",
  depth:      "tg.depth",
  exported:   "tape.exported"
};

var store={
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,String(v));return true;}catch(e){return false;}},
  json:function(k,fb){try{var r=localStorage.getItem(k);return r?JSON.parse(r):fb;}catch(e){return fb;}},
  setJson:function(k,v){return store.set(k,JSON.stringify(v));},
  keys:function(){try{var a=[],i;for(i=0;i<localStorage.length;i++)a.push(localStorage.key(i));return a;}catch(e){return [];}}
};

/* One-time key migration: everything saved under tg.* is re-saved under
   tape.*. It lives here because this is where storage lives, and because
   running it inside UTIL guarantees it happens before any module reads a
   key. Snapshotting the keys beats walking live indices while inserting. */
(function(){
  if(store.get("tape.migrated")) return;
  var ok=true;
  store.keys().forEach(function(k){
    if(!k||k.indexOf("tg.")!==0) return;
    var nk="tape."+k.slice(3);
    if(store.get(nk)===null && !store.set(nk,store.get(k))) ok=false;
  });
  /* only claim the migration is done if every copy actually landed */
  if(ok) store.set("tape.migrated","1");
})();

return {el:el,esc:esc,escText:escText,slug:slug,store:store,K:K};
})();
</script>

<!-- ====================================================================
     5. MODULES
     One IIFE per feature, in load order. They share UTIL and the few
     cross-module functions through TAPE_NS rather than by reaching for
     globals. Order matters: the grid builds the cards the strategies
     module assigns ids to, the panel creates the element the walkthrough
     observes, and live-read is defined before the tab that calls it.
     ==================================================================== -->

<script>
/* ====================================================================
   TERMS TAB — the grid
   Builds every section and card from D, and wires search with its
   synonym map, the filter chips, the section drawer and the saved-terms
   star. The markup written here is the contract every later module reads:
   data-slug is the id, and .haschart drives the "has a chart" filter.
   ==================================================================== */
(function(){
  var grid=document.getElementById("grid"),chips=document.getElementById("chips"),
      q=document.getElementById("q"),countEl=document.getElementById("count"),
      active="all";

  var esc=TAPE_NS.escText, slug=TAPE_NS.slug;

  var SKEY=TAPE_NS.K.stars, STAR=TAPE_NS.store.json(SKEY,{})||{};
  function starSave(){TAPE_NS.store.setJson(SKEY,STAR);}
  var SYN={
    "stop hunt":"liquidity sweep","stophunt":"liquidity sweep","raid":"liquidity sweep",
    "sl":"stop loss","tp":"take profit","rr":"risk:reward","r:r":"risk:reward","r multiple":"risk:reward",
    "imbalance":"fair value gap","fvg":"fair value gap","ob":"order block",
    "bsl":"buy-side","ssl":"sell-side","ma":"moving average","ema":"moving average",
    "sma":"moving average","bb":"bollinger","dom":"order book","tape":"time and sales",
    "poc":"point of control","va":"value area","ib":"initial balance",
    "pdh":"previous day","pdl":"previous day","amd":"power of 3","choch":"change of character",
    "bos":"break of structure","mss":"market structure","ote":"optimal trade entry",
    "dd":"drawdown","pf":"profit factor","ev":"expectancy","edge":"edge",
    "curve fitting":"overfitting","curvefit":"overfitting","p hacking":"p-hacking",
    "position size":"position sizing","sizing":"position sizing","risk of ruin":"risk of ruin",
    "wyckoff":"accumulation","spring":"spring","coil":"consolidation","range bound":"range",
    "smc":"smart money","ict":"smart money","scalp":"scalping","swing":"swing trading",
    "leverage":"leverage","margin call":"margin call","liquidated":"liquidation",
    "rekt":"rekt","squeeze":"squeeze","gap up":"gap","gap down":"gap"
  };
  function expand(t){
    if(!t)return t;
    if(SYN[t])return SYN[t];
    var k;
    for(k in SYN){if(SYN.hasOwnProperty(k)&&k.length>2&&t.indexOf(k)>-1)return SYN[k];}
    return t;
  }
  function hl(el,term){
    if(!term||term.length<2)return;
    var rx=new RegExp("("+term.replace(/[-.*+?^${}()|[\]\\]/g,String.fromCharCode(92,92)+"$&")+")","ig");
    ["h3","p"].forEach(function(sel){
      Array.prototype.forEach.call(el.querySelectorAll(sel),function(n){
        if(n.querySelector("mark"))return;
        Array.prototype.forEach.call(n.childNodes,function(c){
          if(c.nodeType!==3||!rx.test(c.nodeValue))return;
          rx.lastIndex=0;
          var span=document.createElement("span");
          span.innerHTML=esc(c.nodeValue).replace(rx,"<mark>$1</mark>");
          n.replaceChild(span,c);
        });
      });
    });
  }
  function unhl(el){
    Array.prototype.forEach.call(el.querySelectorAll("mark"),function(m){
      var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();
    });
  }

  /* Two terms deliberately share a name — Liquidity (basics vs ICT) and Chop
     (price action vs slang) — because they are genuinely different senses.
     The slug used to be derived from the name alone, so both cards got the
     same element id: the second was unreachable by deep link, starring one
     starred both, and the detail panel showed the wrong sense for the first.

     Settle it once here, where the id contract is established, and let every
     other module read x.slug rather than re-deriving it. The first occurrence
     keeps the bare slug, so existing links and see-also references still land
     on the primary sense; later ones take their section as a suffix. */
  var usedSlug={};
  D.forEach(function(x){
    var s=slug(x.t);
    if(usedSlug[s]){
      var alt=s+"-"+slug(x.c), i=2;
      while(usedSlug[alt]) alt=s+"-"+slug(x.c)+"-"+(i++);
      s=alt;
    }
    usedSlug[s]=1;
    x.slug=s;
  });

  CAT.forEach(function(c){
    var s=document.createElement("section");
    s.id="sec-"+c[0];
    var n=D.filter(function(x){return x.c===c[0];}).length;
    s.innerHTML='<div class="sechead"><h2>'+c[1]+'</h2><span class="n">'+n+' terms</span></div><p class="secnote">'+c[2]+'</p>';
    D.filter(function(x){return x.c===c[0];}).forEach(function(x){
      var e=document.createElement("article");
      e.className="entry"+(x.v?" haschart":"");
      var tslug=x.slug;
      var txt='<div><h3 class="term"><button class="star" data-star="'+tslug+'" title="Save this term" aria-label="Save '+esc(x.t)+'">\u2605</button>'+esc(x.t)+'<button class="lnk" data-slug="'+tslug+'" title="Copy a link to this term" aria-label="Copy link to '+esc(x.t)+'">link</button></h3><p class="def">'+esc(x.d)+'</p>'+
              '<p class="ex'+(x.warn?" warn":"")+'"><b>'+(x.warn?"Careful":"Example")+'</b> · '+esc(x.e)+'</p></div>';
      var fig=x.v?'<figure>'+svgFor(x.v,esc(x.t)+" chart")+(x.cap?'<figcaption>'+esc(x.cap)+'</figcaption>':'')+'</figure>':'';
      e.innerHTML=txt+fig;
      e.dataset.hay=(x.t+" "+x.d+" "+x.e).toLowerCase();
      e.dataset.slug=tslug;
      s.appendChild(e);
    });
    grid.appendChild(s);
  });

  var PREFERS_MOTION = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function mkchip(id,label){
    var b=document.createElement("button");
    b.className="chip";b.textContent=label;b.dataset.id=id;
    b.setAttribute("aria-pressed",id===active?"true":"false");
    b.onclick=function(){ setActive(id); };
    chips.appendChild(b);
  }
  mkchip("all","All");
  mkchip("charts","Has a chart");
  mkchip("starred","\u2605 Saved");

  /* 48 sections as 48 chips was an eight-row wall. The three filters above are
     the ones used constantly; the sections live in a drawer that remembers
     nothing and costs one tap. setActive() keeps both surfaces in sync. */
  function setActive(id){
    active=id;
    Array.prototype.forEach.call(chips.children,function(c){
      if(c.dataset.id) c.setAttribute("aria-pressed",c.dataset.id===id?"true":"false");
    });
    Array.prototype.forEach.call(document.querySelectorAll("#secgrid [data-sec]"),function(b){
      b.setAttribute("aria-pressed",b.dataset.sec===id?"true":"false");
    });
    var cur=document.getElementById("seccur");
    if(cur){
      var name="All sections";
      CAT.forEach(function(c){if(c[0]===id)name=c[1];});
      if(id==="charts")name="Has a chart";
      if(id==="starred")name="\u2605 Saved";
      cur.textContent=name;
    }
    apply();
  }

  var drawerBtn=document.createElement("button");
  drawerBtn.className="chip secbtn";
  drawerBtn.id="secopen";
  drawerBtn.setAttribute("aria-expanded","false");
  drawerBtn.innerHTML='Sections <span id="seccur">All sections</span> <span class="caret">\u25be</span>';
  chips.appendChild(drawerBtn);

  var drawer=document.createElement("div");
  drawer.id="secdrawer";
  drawer.hidden=true;
  drawer.innerHTML='<input id="secq" type="search" placeholder="Filter sections\u2026" aria-label="Filter sections">'+
                   '<div id="secgrid"></div>';
  chips.parentNode.appendChild(drawer);

  var sg=drawer.querySelector("#secgrid");
  function secRow(id,label,n){
    var b=document.createElement("button");
    b.className="secitem";b.dataset.sec=id;
    b.setAttribute("aria-pressed",id===active?"true":"false");
    b.innerHTML='<span>'+esc(label)+'</span><span class="secn">'+n+'</span>';
    b.onclick=function(){
      setActive(id);
      closeDrawer();
      var sec=document.getElementById("sec-"+id);
      if(sec&&id!=="all") sec.scrollIntoView({block:"start",behavior:PREFERS_MOTION?"smooth":"auto"});
      else window.scrollTo({top:0,behavior:PREFERS_MOTION?"smooth":"auto"});
    };
    sg.appendChild(b);
  }
  secRow("all","All sections",D.length);
  CAT.forEach(function(c){
    secRow(c[0],c[1],D.filter(function(x){return x.c===c[0];}).length);
  });

  function openDrawer(){
    drawer.hidden=false;drawerBtn.setAttribute("aria-expanded","true");
    drawer.classList.add("in");
    var f=document.getElementById("secq");if(f)f.focus();
  }
  function closeDrawer(){
    drawer.hidden=true;drawerBtn.setAttribute("aria-expanded","false");
    drawer.classList.remove("in");
  }
  drawerBtn.onclick=function(){ drawer.hidden?openDrawer():closeDrawer(); };
  document.getElementById("secq").addEventListener("input",function(){
    var v=this.value.trim().toLowerCase();
    Array.prototype.forEach.call(sg.children,function(b){
      b.style.display=(!v||b.textContent.toLowerCase().indexOf(v)>-1)?"":"none";
    });
  });
  document.addEventListener("click",function(e){
    if(drawer.hidden)return;
    if(!drawer.contains(e.target)&&e.target!==drawerBtn&&!drawerBtn.contains(e.target)) closeDrawer();
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&!drawer.hidden){closeDrawer();drawerBtn.focus();}
  });

  function apply(){
    var raw=q.value.trim().toLowerCase(),term=expand(raw),shown=0;
    CAT.forEach(function(c){
      var sec=document.getElementById("sec-"+c[0]),vis=0;
      Array.prototype.forEach.call(sec.querySelectorAll(".entry"),function(e){
        var ok=true;
        if(active!=="all"){
          ok = active==="charts" ? e.classList.contains("haschart")
             : active==="starred" ? STAR[e.dataset.slug]===1
             : c[0]===active;
        }
        if(ok&&term) ok=e.dataset.hay.indexOf(term)>-1||(raw!==term&&raw.length>2&&e.dataset.hay.indexOf(raw)>-1);
        e.style.display=ok?"":"none";
        unhl(e);
        if(ok){vis++;shown++;if(raw)hl(e,e.dataset.hay.indexOf(raw)>-1?raw:term);}
      });
      sec.style.display=vis?"":"none";
    });
    var ns=Object.keys(STAR).length;
    countEl.textContent=shown+" / "+D.length+(ns?" \u00b7 \u2605"+ns:"")+(term!==raw&&raw?" \u00b7 "+raw+" \u2192 "+term:"");
    var old=document.getElementById("noresult");
    if(old) old.remove();
    if(!shown){
      var p=document.createElement("p");
      p.id="noresult";p.className="empty";
      p.textContent="No terms match \u201c"+q.value+"\u201d. Try a shorter word.";
      grid.appendChild(p);
    }
  }
  Array.prototype.forEach.call(grid.querySelectorAll(".star"),function(b){
    if(STAR[b.dataset.star]===1)b.classList.add("on");
    b.onclick=function(ev){
      ev.stopPropagation();
      if(STAR[b.dataset.star]===1){delete STAR[b.dataset.star];b.classList.remove("on");}
      else{STAR[b.dataset.star]=1;b.classList.add("on");}
      starSave();
      if(active==="starred")apply();
    };
  });
  Array.prototype.forEach.call(grid.querySelectorAll(".lnk"),function(b){
    b.onclick=function(ev){
      ev.stopPropagation();
      var url=location.href.split("#")[0]+"#t="+b.dataset.slug;
      var done=function(){var o=b.textContent;b.textContent="copied";setTimeout(function(){b.textContent=o;},1400);};
      if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(done,function(){window.prompt("Copy:",url);});
      else window.prompt("Copy this link:",url);
    };
  });
  q.addEventListener("input",apply);
  q.addEventListener("keydown",function(e){if(e.key==="Escape"){q.value="";apply();}});
  apply();

  document.getElementById("foot").innerHTML=
    D.length+" terms across "+CAT.length+" sections · "+
    D.filter(function(x){return !!x.v;}).length+" drawn as charts<br>"+
    "Charts are schematic — drawn to show the shape of each concept clearly, not taken from live market data.<br>"+
    "Educational reference only. Nothing here is financial advice.";
})();
</script>

<script>
/* ================= LIVE READ =================
   Reads real OHLCV from a keyless public endpoint and states what is
   measurably true right now, in the glossary's own vocabulary.

   It deliberately does NOT suggest an action. Every detector below answers
   "what is this?" and never "what should I do?". Where this project has
   already tested the structure, the recorded result is shown beside it —
   that is the honest thing to put next to a pattern you just spotted. */

(function(){
"use strict";
/* lrEl / lrEsc / lrSlug used to be declared here because this module sat
   outside every IIFE and could not see anyone else's helpers. It has its
   own scope now and shares the one set. */
var el=TAPE_NS.el, esc=TAPE_NS.esc, slug=TAPE_NS.slug;

var LR_SRC={
  "BINANCE:BTCUSDT":{api:"binance",sym:"BTCUSDT"},
  "BINANCE:ETHUSDT":{api:"binance",sym:"ETHUSDT"}
};
var LR_TF={"1":"1m","5":"5m","15":"15m","60":"1h","240":"4h","D":"1d"};
var LRBARS=null, LRBUSY=false, LRERR=null;

function lrSupported(sym){return !!LR_SRC[sym];}

function lrFetch(sym,tf){
  var s=LR_SRC[sym];
  if(!s) return Promise.reject(new Error("unsupported"));
  var iv=LR_TF[tf]||"15m";
  var url="https://api.binance.com/api/v3/klines?symbol="+encodeURIComponent(s.sym)+
          "&interval="+encodeURIComponent(iv)+"&limit=200";
  return fetch(url,{mode:"cors"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(rows){
    if(!rows||!rows.length) throw new Error("empty response");
    return rows.map(function(k){
      return {t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]};
    }).filter(function(b){
      return isFinite(b.o)&&isFinite(b.h)&&isFinite(b.l)&&isFinite(b.c);
    });
  });
}

/* ---------- small maths helpers ---------- */
function lrATR(b,n){
  if(b.length<n+1) return null;
  var s=0;
  for(var i=b.length-n;i<b.length;i++){
    var p=b[i-1].c;
    s+=Math.max(b[i].h-b[i].l,Math.abs(b[i].h-p),Math.abs(b[i].l-p));
  }
  return s/n;
}
function lrPct(arr,v){
  var n=0;
  for(var i=0;i<arr.length;i++) if(arr[i]<=v) n++;
  return arr.length?Math.round(n/arr.length*100):0;
}
function lrSwings(b,k){
  /* pivot highs/lows with k bars either side — the swing lookback is a
     parameter, and changing it changes the structure you "see" */
  var hi=[],lo=[],i,j,ok;
  for(i=k;i<b.length-k;i++){
    ok=true; for(j=i-k;j<=i+k;j++) if(b[j].h>b[i].h){ok=false;break;}
    if(ok) hi.push(i);
    ok=true; for(j=i-k;j<=i+k;j++) if(b[j].l<b[i].l){ok=false;break;}
    if(ok) lo.push(i);
  }
  return {hi:hi,lo:lo};
}
function lrFmt(x){
  var a=Math.abs(x);
  return x.toLocaleString(undefined,{maximumFractionDigits:a<10?4:(a<1000?2:0)});
}

/* ---------- detectors: each returns a fact, never an instruction ---------- */
function lrRead(b){
  var out=[],n=b.length,last=b[n-1];
  var atr=lrATR(b,14);

  /* 1. Range and where we sit in it */
  var look=Math.min(50,n);
  var hi=-Infinity,lo=Infinity,i;
  for(i=n-look;i<n;i++){ if(b[i].h>hi)hi=b[i].h; if(b[i].l<lo)lo=b[i].l; }
  var pos=(hi>lo)?(last.c-lo)/(hi-lo):0.5;
  out.push({term:"Premium / discount",label:"Position in the last "+look+" bars",
    detail:"Range "+lrFmt(lo)+" to "+lrFmt(hi)+". Price is at "+Math.round(pos*100)+"% of it — "+
      (pos>0.7?"the premium third":pos<0.3?"the discount third":"the middle, which is where the least information is")+".",
    ev:null});

  /* 2. Volatility, in its own historical terms */
  if(atr){
    var hist=[],j;
    for(i=20;i<n;i++){
      var s=0;
      for(j=i-13;j<=i;j++){ var p=b[j-1].c; s+=Math.max(b[j].h-b[j].l,Math.abs(b[j].h-p),Math.abs(b[j].l-p)); }
      hist.push(s/14);
    }
    var pc=lrPct(hist,atr);
    out.push({term:"ATR",label:"Volatility right now",
      detail:"ATR(14) is "+lrFmt(atr)+", which is higher than "+pc+"% of the last "+hist.length+" readings. "+
        (pc>80?"Wide bars — a fixed-point stop is much tighter in ATR terms than usual."
         :pc<20?"Quiet — the same stop is much wider in ATR terms than usual.":"Unremarkable."),
      ev:"Sizing off a fixed point distance while volatility moves like this is how position risk drifts without you changing anything."});
  }

  /* 3. Structure, stated with its parameter shown */
  var sw=lrSwings(b,3);
  if(sw.hi.length>=2&&sw.lo.length>=2){
    var h1=b[sw.hi[sw.hi.length-1]].h,h0=b[sw.hi[sw.hi.length-2]].h;
    var l1=b[sw.lo[sw.lo.length-1]].l,l0=b[sw.lo[sw.lo.length-2]].l;
    var up=h1>h0&&l1>l0, dn=h1<h0&&l1<l0;
    out.push({term:"Market structure",label:"Structure on a 3-bar swing",
      detail:up?"Higher high and higher low — an uptrend by the structural definition."
        :dn?"Lower high and lower low — a downtrend by the structural definition."
        :"Mixed: the last two swing highs and lows disagree. That is a range by definition, not a trend waiting to resume.",
      ev:"Change the swing lookback from 3 and this reading can flip. The structure is a function of the parameter, not a property of the market."});
  }

  /* 4. Equal highs / lows — a shelf of stops, and computable */
  if(atr){
    var tol=atr*0.15,eq=null;
    for(i=sw.hi.length-1;i>0&&!eq;i--){
      if(Math.abs(b[sw.hi[i]].h-b[sw.hi[i-1]].h)<=tol) eq={side:"highs",p:b[sw.hi[i]].h};
    }
    for(i=sw.lo.length-1;i>0&&!eq;i--){
      if(Math.abs(b[sw.lo[i]].l-b[sw.lo[i-1]].l)<=tol) eq={side:"lows",p:b[sw.lo[i]].l};
    }
    if(eq) out.push({term:"Equal highs / equal lows",label:"Matched swing "+eq.side,
      detail:"Two swing "+eq.side+" within 0.15 ATR of each other, around "+lrFmt(eq.p)+". Resting orders concentrate just beyond a level everybody can see.",
      ev:"This is the one mechanism in the sweep family with a plain explanation: stops cluster at obvious prices. It still did not survive testing as an entry."});
  }

  /* 5. Sweep and reclaim — fully specified, and already tested here */
  if(sw.hi.length){
    var pi=sw.hi[sw.hi.length-1],pv=b[pi].h,swept=null;
    for(i=pi+1;i<n;i++) if(b[i].h>pv&&b[i].c<pv){ swept={i:i,p:pv}; break; }
    if(swept) out.push({term:"Liquidity sweep",label:"Swept a prior high and closed back below",
      detail:"Bar "+(n-swept.i)+" bars ago traded above "+lrFmt(swept.p)+" and closed back under it.",
      ev:"Tested in this project across 6 variants then 784-variant sweeps. Lost out-of-sample, −24% to −48%. PR-005 produced +100.4% on QQQ against +0.2% on MNQ — same index, different wrapper, which is what a sample artefact looks like.",
      warn:true});
  }

  /* 6. Contraction */
  if(n>20){
    var r1=0,r2=0;
    for(i=n-10;i<n;i++) r1+=b[i].h-b[i].l;
    for(i=n-20;i<n-10;i++) r2+=b[i].h-b[i].l;
    if(r2>0&&r1/r2<0.7) out.push({term:"Consolidation",label:"Ranges contracting",
      detail:"The last 10 bars average "+Math.round((1-r1/r2)*100)+"% smaller range than the 10 before them.",
      ev:"Compression resolves with expansion often enough to be worth naming, and it says nothing about direction."});
  }

  /* 7. Gap from the prior bar */
  if(n>2&&atr){
    var g=b[n-1].o-b[n-2].c;
    if(Math.abs(g)>atr*0.5) out.push({term:"Gap",label:"Gap from the prior bar",
      detail:"Opened "+lrFmt(Math.abs(g))+" "+(g>0?"above":"below")+" the previous close — "+(Math.abs(g)/atr).toFixed(1)+" ATR.",
      ev:"A stop does not protect across a gap. It fills at the other side."});
  }

  return out;
}

/* ---------- render ---------- */
function lrRenderInto(host,sym,tf){
  host=host||document.getElementById("lread");   /* the module owns its mount point */
  if(!host) return;
  if(navigator.onLine===false){
    host.innerHTML='<div class="lrcard"><p class="lrempty">Offline — the live read needs a connection. The glossary, quiz and your strategies do not.</p></div>';
    return;
  }
  if(typeof fetch!=="function"){
    host.innerHTML='<div class="lrcard"><p class="lrempty">This browser has no fetch API, so the live read is unavailable. Everything else still works.</p></div>';
    return;
  }
  if(!lrSupported(sym)){
    host.innerHTML='<div class="lrcard"><p class="lrempty">No keyless public feed for this symbol, so there is nothing to measure honestly. '+
      'Switch to BTC/USDT or ETH/USDT for the live read — index and futures data needs a paid key, and I would rather show nothing than guess.</p></div>';
    return;
  }
  host.innerHTML='<div class="lrcard"><p class="lrempty">Reading the last 200 bars…</p></div>';
  LRBUSY=true;
  lrFetch(sym,tf).then(function(bars){
    LRBUSY=false;LRBARS=bars;LRERR=null;
    var facts=lrRead(bars);
    var last=bars[bars.length-1];

    /* reuse the glossary's own chart engine — no second renderer */
    var tail=bars.slice(-40).map(function(b){return [b.o,b.h,b.l,b.c];});
    var fig=svgFor({k:"c",d:tail});

    var rows=facts.map(function(f){
      return '<div class="lrrow'+(f.warn?" warn":"")+'">'+
        '<div class="lrhead"><span class="lrlabel">'+lrEsc(f.label)+'</span>'+
        '<button class="btn tiny" data-term="term-'+lrSlug(f.term)+'">'+lrEsc(f.term)+'</button></div>'+
        '<p class="lrdetail">'+lrEsc(f.detail)+'</p>'+
        (f.ev?'<p class="lrev">'+lrEsc(f.ev)+'</p>':'')+'</div>';
    }).join("");

    host.innerHTML=
      '<div class="lrcard">'+
        '<div class="lrtop"><h3>What is measurably true right now</h3>'+
        '<button class="btn" id="lr-refresh">Refresh</button></div>'+
        '<p class="lrsub">'+lrEsc(sym)+' · '+lrEsc(LR_TF[tf]||tf)+' · last close '+lrEsc(lrFmt(last.c))+
        ' · '+bars.length+' bars from Binance public data. No account, no key, nothing of yours connected.</p>'+
        '<figure class="lrfig">'+fig+'<figcaption>Last 40 bars, drawn with the same engine as every chart in the glossary.</figcaption></figure>'+
        rows+
        '<p class="lrfoot">These are descriptions, not recommendations. Nothing here says buy or sell, and nothing here forecasts. '+
        'The most useful thing on this panel is the line under each pattern saying how it actually tested.</p>'+
      '</div>';

    if(lrEl("lr-refresh")) lrEl("lr-refresh").onclick=function(){lrRenderInto(host,sym,tf);};
    Array.prototype.forEach.call(host.querySelectorAll("[data-term]"),function(b){
      b.onclick=function(){if(TAPE_NS.goTerm)TAPE_NS.goTerm(b.dataset.term);};
    });
  }).catch(function(e){
    LRBUSY=false;LRERR=e;
    host.innerHTML='<div class="lrcard"><p class="lrempty">Could not reach the public price feed ('+
      lrEsc(String(e.message||e))+'). Nothing else in the app depends on it.'+
      ' <button class="btn" id="lr-retry">Try again</button></p></div>';
    if(lrEl("lr-retry")) lrEl("lr-retry").onclick=function(){lrRenderInto(host,sym,tf);};
  });
}

/* the one thing outside this module needs */
TAPE_NS.liveRead=lrRenderInto;
})();
</script>

<script>
/* ====================================================================
   QUIZ TAB
   Weighted multiple choice over the same term data the grid renders:
   terms answered wrongly come back more often. Distractors are drawn
   from the same section on purpose — those are the confusable ones.
   
   Reaches the rest of the app through exactly one function, which is
   why it lifts out of the strategies block cleanly.
   ==================================================================== */
(function(){
"use strict";
var $=TAPE_NS.el, esc=TAPE_NS.esc, slug=TAPE_NS.slug;

var QKEY=TAPE_NS.K.quiz, QST=null, qmode="mixed", qcat="all", qcur=null, qans=null;
function qload(){return TAPE_NS.store.json(QKEY,{});}
function qsave(o){TAPE_NS.store.setJson(QKEY,o);}
function qstats(){if(!QST)QST=qload();return QST;}
function qkey(t){return slug(t);}
function qpool(){
  var p=D.filter(function(x){return x.d&&x.t&&x.t.indexOf("Reality check")<0;});
  if(qcat!=="all")p=p.filter(function(x){return x.c===qcat;});
  if(qmode==="chart")p=p.filter(function(x){return !!x.v;});
  return p;
}
function qweight(x){
  var s=qstats()[qkey(x.t)];
  if(!s)return 3;                       /* unseen: moderately likely */
  var wrongRate=s.w/Math.max(1,s.n);
  return 1+wrongRate*8+(s.n<2?2:0);     /* missed often => comes up often */
}
function qpick(){
  var pool=qpool();
  if(pool.length<4)return null;
  var tot=0,i,ws=pool.map(function(x){var w=qweight(x);tot+=w;return w;});
  var r=Math.random()*tot,acc=0,chosen=pool[0];
  for(i=0;i<pool.length;i++){acc+=ws[i];if(r<=acc){chosen=pool[i];break;}}
  var mode=qmode==="mixed"?(chosen.v&&Math.random()<0.5?"chart":"def"):qmode;
  if(mode==="chart"&&!chosen.v)mode="def";
  /* distractors: prefer same section, they're the confusable ones */
  var same=pool.filter(function(x){return x!==chosen&&x.c===chosen.c;});
  var other=pool.filter(function(x){return x!==chosen&&x.c!==chosen.c;});
  var opts=[chosen];
  function take(arr){
    while(arr.length&&opts.length<4){
      var k=Math.floor(Math.random()*arr.length);
      if(opts.indexOf(arr[k])<0)opts.push(arr[k]);
      arr.splice(k,1);
    }
  }
  take(same.slice());take(other.slice());
  for(i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=opts[i];opts[i]=opts[j];opts[j]=t;}
  return {item:chosen,mode:mode,opts:opts};
}
function quizTools(){
  var t=document.getElementById("qtools");
  var cats='<option value="all">All sections</option>'+CAT.map(function(c){
    return '<option value="'+c[0]+'"'+(qcat===c[0]?" selected":"")+'>'+c[1]+'</option>';}).join("");
  t.innerHTML='<label class="qlab" for="q-mode">Mode</label>'+
    '<select id="q-mode">'+
      '<option value="mixed"'+(qmode==="mixed"?" selected":"")+'>Mixed</option>'+
      '<option value="chart"'+(qmode==="chart"?" selected":"")+'>Chart \u2192 term</option>'+
      '<option value="def"'+(qmode==="def"?" selected":"")+'>Definition \u2192 term</option>'+
    '</select>'+
    '<label class="qlab" for="q-cat">Section</label><select id="q-cat">'+cats+'</select>'+
    '<span class="sep"></span>'+
    '<button class="btn" id="q-skip">Skip</button>'+
    '<button class="btn" id="q-reset">Reset progress</button>';
  $("q-mode").onchange=function(){qmode=this.value;qcur=null;quizRender();};
  $("q-cat").onchange=function(){qcat=this.value;qcur=null;quizRender();};
  $("q-skip").onclick=function(){qcur=null;qans=null;quizRender();};
  $("q-reset").onclick=function(){
    if(this.dataset.armed){QST={};qsave(QST);qcur=null;quizRender();return;}
    this.dataset.armed="1";this.textContent="Tap again to reset";
    var b=this;setTimeout(function(){b.removeAttribute("data-armed");b.textContent="Reset progress";},3000);
  };
}
function quizRender(){
  quizTools();
  var st=qstats(),ks=Object.keys(st),seen=0,right=0,weak=[];
  ks.forEach(function(k){seen+=st[k].n;right+=st[k].n-st[k].w;
    if(st[k].w>0)weak.push({k:k,w:st[k].w,n:st[k].n});});
  weak.sort(function(a,b){return (b.w/b.n)-(a.w/a.n)||b.w-a.w;});
  $("cnt-quiz").textContent=ks.length?ks.length:"";
  $("qscore").innerHTML= seen
    ? "<b>"+seen+"</b> answered &nbsp;\u00b7&nbsp; <b>"+Math.round(right/seen*100)+"%</b> correct &nbsp;\u00b7&nbsp; "+
      ks.length+" of "+D.length+" terms seen"+
      (weak.length?" &nbsp;\u00b7&nbsp; weakest: "+weak.slice(0,3).map(function(x){
        return x.k.replace(/-/g," ");}).join(", "):"")
    : "Terms you get wrong come back more often. Nothing is timed.";

  if(!qcur)qcur=qpick();
  var body=document.getElementById("qbody");
  if(!qcur){body.innerHTML='<p class="empty">Not enough terms in that filter to make a question. Pick another section.</p>';return;}
  var it=qcur.item;
  var prompt = qcur.mode==="chart"
    ? '<figure class="qfig">'+svgFor(it.v)+'</figure><p class="qask">Which term does this chart show?</p>'
    : '<p class="qdef">'+esc(it.d)+'</p><p class="qask">Which term is this?</p>';
  var opts=qcur.opts.map(function(o){
    var cls="qopt";
    if(qans){
      if(o===it)cls+=" ok";
      else if(o===qans)cls+=" no";
      else cls+=" dim";
    }
    return '<button class="'+cls+'" data-o="'+esc(o.t)+'"'+(qans?" disabled":"")+'>'+esc(o.t)+
           '<span class="qsec">'+catName(o.c)+'</span></button>';
  }).join("");
  var after="";
  if(qans){
    var ok=qans===it;
    after='<div class="qres '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite \u2014 that\u2019s <b>"+esc(it.t)+"</b>.")+'</div>'+
          '<div class="qexp"><p><b>'+esc(it.t)+'</b> \u2014 '+esc(it.d)+'</p>'+
          (it.e?'<p class="ex"><b>Example</b> \u00b7 '+esc(it.e)+'</p>':'')+
          (qcur.mode!=="chart"&&it.v?'<figure class="qfig">'+svgFor(it.v)+'</figure>':'')+
          '<div class="acts"><button class="btn pri" id="q-next">Next question</button>'+
          '<button class="btn" data-term="term-'+it.slug+'">See the full entry</button></div></div>';
  }
  body.innerHTML='<div class="qcard">'+prompt+'<div class="qopts">'+opts+'</div>'+after+'</div>';
  Array.prototype.forEach.call(body.querySelectorAll("[data-o]"),function(b){
    b.onclick=function(){
      var picked=null;qcur.opts.forEach(function(o){if(o.t===b.dataset.o)picked=o;});
      qans=picked;
      var k=qkey(it.t),s=qstats();
      if(!s[k])s[k]={n:0,w:0};
      s[k].n++;if(picked!==it)s[k].w++;
      qsave(s);quizRender();
    };});
  if($("q-next"))$("q-next").onclick=function(){qcur=null;qans=null;quizRender();};
  Array.prototype.forEach.call(body.querySelectorAll("[data-term]"),function(b){
    b.onclick=function(){TAPE_NS.goTerm(b.dataset.term);};});
}
function catName(c){for(var i=0;i<CAT.length;i++)if(CAT[i][0]===c)return CAT[i][1];return c;}


TAPE_NS.quizRender=quizRender;
})();
</script>

<script>
/* ====================================================================
   LIVE CHART TAB
   The one tab that needs a network. Everything else in this file works
   offline, so this module says so plainly rather than rendering a blank
   box, and refuses to build a frame when navigator.onLine is already
   false. The spot-the-pattern card underneath is offline-safe: it draws
   through the same chart engine as the glossary.
   ==================================================================== */
(function(){
"use strict";
var $=TAPE_NS.el, esc=TAPE_NS.esc, slug=TAPE_NS.slug;

var LSYM="OANDA:NAS100USD", LTF="15", LBUILT=false, LNETBOUND=false;
/* Every symbol here was opened in a real browser and confirmed to render.
   CME_MINI:MNQ1! and MES1! were the previous defaults and BOTH fail with
   "This symbol is only available on TradingView" — CME futures are not carried
   by the free widget embed. The Nasdaq and S&P entries below are index/CFD
   proxies, not the futures contracts: they track the same underlying but have
   different hours, no contract expiry and no tick value. Flagged as proxy so
   nobody reads a NAS100 chart as an MNQ chart. */
var LSYMS=[["OANDA:NAS100USD","Nasdaq 100  (proxy for MNQ)",1],
           ["PEPPERSTONE:NAS100","Nasdaq 100  alt feed",1],
           ["NASDAQ:QQQ","QQQ  Nasdaq 100 ETF"],
           ["PEPPERSTONE:US500","S&P 500  (proxy for MES)",1],
           ["FOREXCOM:SPXUSD","S&P 500  alt feed",1],
           ["BINANCE:BTCUSDT","BTC/USDT"],["BINANCE:ETHUSDT","ETH/USDT"],
           ["FX:EURUSD","EUR/USD"],["FX:AUDUSD","AUD/USD"],
           ["TVC:GOLD","Gold"],["NASDAQ:NVDA","NVDA"]];
var LTFS=[["1","1m"],["5","5m"],["15","15m"],["60","1h"],["240","4h"],["D","Daily"]];
function liveRender(){
  var t=document.getElementById("ltools");
  t.innerHTML='<label class="qlab" for="l-sym">Market</label><select id="l-sym">'+
      LSYMS.map(function(s){return '<option value="'+s[0]+'"'+(LSYM===s[0]?" selected":"")+'>'+s[1]+'</option>';}).join("")+'</select>'+
    '<label class="qlab" for="l-tf">Timeframe</label><select id="l-tf">'+
      LTFS.map(function(s){return '<option value="'+s[0]+'"'+(LTF===s[0]?" selected":"")+'>'+s[1]+'</option>';}).join("")+'</select>'+
    '<span class="sep"></span><button class="btn" id="l-reload">Reload</button>';
  $("l-sym").onchange=function(){LSYM=this.value;LBUILT=false;liveRender();};
  $("l-tf").onchange=function(){LTF=this.value;LBUILT=false;liveRender();};
  $("l-reload").onclick=function(){LBUILT=false;liveRender();};
  var isProxy=false;
  LSYMS.forEach(function(s){if(s[0]===LSYM&&s[2])isProxy=true;});
  $("lnote").innerHTML=
    "Live data is embedded from TradingView and needs an internet connection \u2014 the rest of this app works offline, this tab doesn\u2019t. "+
    "Delayed quotes on most symbols. Nothing here places an order."+
    (isProxy?'<br><span class="proxywarn">Proxy feed: this is a spot/CFD index, not the futures contract. '+
      'It tracks the same underlying but has different trading hours, no expiry and no tick value \u2014 '+
      'read levels off it, not contract maths. CME futures aren\u2019t carried by the free embed.</span>':"");

  /* Offline: don't build a frame we already know cannot load. A failed embed
     renders as a blank box, which reads as a bug rather than as no signal. */
  if(navigator.onLine===false){
    LBUILT=false;
    $("lframe").innerHTML='<div class="offline"><p class="offhead">You\u2019re offline</p>'+
      '<p>The live chart streams from TradingView, so it needs a connection. '+
      'Everything else in this app \u2014 all '+D.length+' terms, the charts, the quiz and your strategies \u2014 works without one.</p>'+
      '<p><button class="btn" id="l-retry">Try again</button></p></div>';
    if($("l-retry"))$("l-retry").onclick=function(){LBUILT=false;liveRender();};
  } else if(!LBUILT){
    var theme=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    var src="https://s.tradingview.com/widgetembed/?symbol="+encodeURIComponent(LSYM)+
            "&interval="+encodeURIComponent(LTF)+"&theme="+theme+"&style=1&timezone=Australia/Perth"+
            "&withdateranges=1&hidesidetoolbar=0&allow_symbol_change=1&saveimage=0";
    /* sandbox: allow-scripts + allow-same-origin is the documented footgun only
       when the frame is SAME-origin with us — then it can reach parent.document
       and strip its own sandbox. This frame is cross-origin, so allow-same-origin
       just gives TradingView its own origin (which its widget needs for storage;
       without it the frame renders blank — verified in a browser). Deliberately
       NOT granted: allow-top-navigation, allow-modals, allow-downloads. */
    $("lframe").innerHTML='<iframe title="Live chart" src="'+src+'" loading="lazy" '+
      'sandbox="allow-scripts allow-same-origin allow-popups" referrerpolicy="no-referrer"></iframe>'+
      '<div class="offline framefail" hidden><p class="offhead">The chart didn\u2019t load</p>'+
      '<p>TradingView may be blocked, rate-limited, or your connection dropped. '+
      'The rest of the app is unaffected.</p>'+
      '<p><button class="btn" id="l-retry2">Try again</button></p></div>';
    LBUILT=true;
    /* If the embed hasn't reported a load shortly, surface the fallback. */
    (function(){
      var fr=$("lframe").querySelector("iframe"), fb=$("lframe").querySelector(".framefail"), done=false;
      if(!fr||!fb) return;
      function good(){done=true;if(fb)fb.hidden=true;}
      function bad(){if(done)return;if(fb){fb.hidden=false;}}
      fr.addEventListener("load",good);
      fr.addEventListener("error",bad);
      if(window.setTimeout) setTimeout(bad,8000);
      if($("l-retry2"))$("l-retry2").onclick=function(){LBUILT=false;liveRender();};
    })();
  }
  /* bind connectivity listeners once, not on every render */
  if(!LNETBOUND){
    LNETBOUND=true;
    var renet=function(){LBUILT=false;if(!$("panel-live").hidden)liveRender();};
    window.addEventListener("online",renet);
    window.addEventListener("offline",renet);
  }
  var picks=D.filter(function(x){return x.v&&x.v.k==="c";});
  var pick=picks[Math.floor(Math.random()*picks.length)];
  $("lhint").innerHTML='<div class="spotcard"><div class="spothead"><span class="qask">Spot this on the live chart</span>'+
    '<button class="btn" id="l-another">Another</button></div>'+
    '<div class="spotgrid"><figure class="qfig">'+svgFor(pick.v)+'</figure>'+
    '<div><h3 class="term">'+esc(pick.t)+'</h3><p class="def">'+esc(pick.d)+'</p>'+
    '<div class="acts"><button class="btn" data-term="term-'+pick.slug+'">Full entry</button></div></div></div></div>';
  $("l-another").onclick=liveRender;
  if(!$("lread")){
    var lrhost=document.createElement("div");
    lrhost.id="lread";
    $("lhint").parentNode.appendChild(lrhost);
  }
  /* live-read is defined above this module, so it is simply there */
  TAPE_NS.liveRead($("lread"),LSYM,LTF);
  Array.prototype.forEach.call($("lhint").querySelectorAll("[data-term]"),function(b){
    b.onclick=function(){TAPE_NS.goTerm(b.dataset.term);};});
}


TAPE_NS.liveRender=liveRender;
})();
</script>

<script>
/* ====================================================================
   STRATEGIES TAB — and the app's routing
   The strategy library, its evidence model, the trade log and the
   share / export / import round trip — plus setTab and the boot sequence
   that reads the hash. Routing sits here because this module owns the tab
   state; the other two tabs are reached through TAPE_NS.quizRender and
   TAPE_NS.liveRender rather than by being inlined into it, as they were.
   ==================================================================== */
(function(){
"use strict";
var $=TAPE_NS.el;
var KEY=TAPE_NS.K.strats, pending=null, editing=null, tools=false;
var EV=[["untested","Untested","ev-untested"],["backtested","Backtested","ev-backtested"],
        ["forward-tested","Forward-tested","ev-forward"],["live","Live","ev-live"]];
var EVRANK={untested:0,backtested:1,"forward-tested":2,live:3};

var esc=TAPE_NS.esc, slug=TAPE_NS.slug;

/* ---------- storage ---------- */
function load(){return TAPE_NS.store.json(KEY,null);}
function save(a){TAPE_NS.store.setJson(KEY,a);}
var SEED=[{name:"Example — delete me",source:"nobody, this is a template",sourceUrl:"",
  market:"MNQ",timeframe:"5m",session:"09:30–11:00 New York",
  bias:"Daily is in a downtrend (lower highs, lower lows), so shorts only.",
  entry:"1. Price rallies into a level that was support last week.\n2. It wicks above the prior high and closes back below it.\n3. Enter short on the close of that candle.",
  invalidation:"A 5m candle closes back above the swept high. That's the idea being wrong, not a scary moment.",
  target:"Prior swing low. Partial at 2R, stop to breakeven, runner to the low.",
  riskNote:"1% of account. Stop distance sets the size, not confidence. Skip if the maths says under 1 contract.",
  tags:["session","liquidity","short"],evidence:"untested",sampleSize:0,
  results:"none yet — no backtest, no forward test",
  notes:"Replace this with a real strategy. Every field here is optional except the name.",
  added:new Date().toISOString().slice(0,10)}];
var STRATS=load();
if(!STRATS){STRATS=SEED.slice();save(STRATS);}
function cur(){return pending||STRATS;}

/* ---------- share encoding ---------- */
function b64u(u8){var s="",i;for(i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function ub64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
  var b=atob(s),u=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function encodeLib(arr){
  var bytes=new TextEncoder().encode(JSON.stringify(arr));
  if(typeof CompressionStream!=="undefined"){
    try{
      var st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
      return new Response(st).arrayBuffer().then(function(b){return "g"+b64u(new Uint8Array(b));});
    }catch(e){}
  }
  return Promise.resolve("p"+b64u(bytes));
}
function decodeLib(s){
  var mode=s.charAt(0),data=ub64u(s.slice(1));
  if(mode==="g"&&typeof DecompressionStream!=="undefined"){
    var st=new Blob([data]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(st).arrayBuffer().then(function(b){return JSON.parse(new TextDecoder().decode(new Uint8Array(b)));});
  }
  return Promise.resolve(JSON.parse(new TextDecoder().decode(data)));
}

/* ---------- routing ---------- */
function parseHash(){
  var h=location.hash.replace(/^#/,""),out={};
  h.split("&").forEach(function(p){
    if(!p)return;
    var i=p.indexOf("=");
    if(i<0){out.tab=p;return;}
    out[p.slice(0,i)]=p.slice(i+1);
  });
  return out;
}
function setTab(t,push){
  if(t!=="strategies"&&t!=="quiz"&&t!=="live")t="terms";
  [["terms","tab-terms","panel-terms"],["strategies","tab-strats","panel-strats"],["quiz","tab-quiz","panel-quiz"],["live","tab-live","panel-live"]]
    .forEach(function(x){
      var on=x[0]===t;
      $(x[1]).setAttribute("aria-selected",on?"true":"false");
      $(x[2]).hidden=!on;
    });
  if(t==="quiz")TAPE_NS.quizRender();
  if(t==="live")TAPE_NS.liveRender();
  if(push!==false&&history.replaceState)history.replaceState(null,"","#"+t);
}
$("tab-terms").onclick=function(){setTab("terms");};
$("tab-strats").onclick=function(){setTab("strategies");};
$("tab-quiz").onclick=function(){setTab("quiz");};
$("tab-live").onclick=function(){setTab("live");};

/* ---------- glossary cross-links ---------- */
var TERMIDX=[];
Array.prototype.forEach.call(document.querySelectorAll("#grid .entry"),function(e){
  var h=e.querySelector(".term");if(!h)return;
  /* The heading contains the star and copy-link buttons, so its textContent is
     "★Instrumentlink" and slugging it produced term-instrumentlink — which meant
     every copied deep link (built from data-slug) pointed at nothing. Use the
     slug the entry already carries. */
  var id="term-"+(e.dataset.slug||slug(h.textContent));
  e.id=id;
  var nameNode=h.cloneNode(true);
  Array.prototype.forEach.call(nameNode.querySelectorAll("button"),function(b){b.remove();});
  TERMIDX.push({name:nameNode.textContent.trim(),id:id});
});
TERMIDX.sort(function(a,b){return b.name.length-a.name.length;});
function relatedTerms(s){
  var hay=[s.name,s.bias,s.entry,s.invalidation,s.target,s.riskNote,s.notes,(s.tags||[]).join(" ")].join(" ").toLowerCase();
  var hits=[],seen={};
  TERMIDX.forEach(function(t){
    if(hits.length>=6)return;
    var n=t.name.toLowerCase();
    if(n.length<4||seen[t.id])return;
    if(new RegExp("(^|[^a-z])"+n.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+"([^a-z]|$)").test(hay)){seen[t.id]=1;hits.push(t);}
  });
  return hits;
}
TAPE_NS.goTerm=function(id){
  setTab("terms");
  var el=$(id);if(!el)return;
  var q=$("q");if(q){q.value="";}
  var chip=document.querySelector('#chips .chip[data-id="all"]');if(chip)chip.click();
  setTimeout(function(){
    el.scrollIntoView({block:"center",behavior:"smooth"});
    el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
  },40);
};

/* ---------- filters ---------- */
var filt={ev:"all",market:"all",tag:"all"};
function buildChips(){
  var wrap=$("schips");wrap.innerHTML="";
  var mk=function(group,val,label){
    var b=document.createElement("button");
    b.className="chip";b.textContent=label;b.dataset.g=group;b.dataset.v=val;
    b.setAttribute("aria-pressed",filt[group]===val?"true":"false");
    b.onclick=function(){filt[group]=val;buildChips();render();};
    wrap.appendChild(b);
  };
  mk("ev","all","All");
  EV.forEach(function(e){
    if(cur().some(function(s){return s.evidence===e[0];}))mk("ev",e[0],e[1]);
  });
  var mkts={},tags={};
  cur().forEach(function(s){
    if(s.market)mkts[s.market]=1;
    (s.tags||[]).forEach(function(t){tags[t]=1;});
  });
  var mk2=Object.keys(mkts).sort();
  if(mk2.length>1){
    var sep=document.createElement("span");sep.style.cssText="width:1px;height:20px;background:var(--rule2);margin:0 4px";wrap.appendChild(sep);
    mk("market","all","Any market");
    mk2.forEach(function(m){mk("market",m,m);});
  }
  var tg=Object.keys(tags).sort();
  if(tg.length){
    var sep2=document.createElement("span");sep2.style.cssText="width:1px;height:20px;background:var(--rule2);margin:0 4px";wrap.appendChild(sep2);
    mk("tag","all","Any tag");
    tg.slice(0,10).forEach(function(t){mk("tag",t,"#"+t);});
  }
}

/* ---------- toolbar ---------- */
function buildTools(){
  var t=$("stools");
  t.innerHTML=
    '<button class="btn pri" id="b-add">+ Add strategy</button>'+

/* ---------- share / export / import ---------- */
function note(html,bad){
  var n=document.createElement("p");
  n.className="note"+(bad?" bad":"");n.innerHTML=html;
  var old=$("stools").parentNode.querySelector(".note");if(old)old.remove();
  $("stools").insertAdjacentElement("afterend",n);
}
function doShare(btn){
  if(!STRATS.length){note("Nothing to share yet — add a strategy first.",true);return;}
  encodeLib(STRATS).then(function(p){
    var url=location.href.split("#")[0]+"#lib="+p;
    if(url.length>8000){
      note("That library is too big for a link ("+url.length.toLocaleString()+" characters). Use <b>Export .json</b> and send the file instead.",true);
      return;
    }
    var done=function(){btn.textContent="Link copied";setTimeout(function(){btn.textContent="Copy share link";},1800);
      note("Link copied — "+STRATS.length+" strategies, "+url.length.toLocaleString()+" characters. Anyone who opens it gets the whole library.");};
    var fb=function(){
      var ta=document.createElement("textarea");ta.value=url;ta.style.cssText="position:fixed;opacity:0";
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");done();}catch(e){window.prompt("Copy this link:",url);}
      ta.remove();
    };
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(done,fb);else fb();
  }).catch(function(){note("Couldn't build the link. Use Export .json instead.",true);});
}
function doExport(){
  var blob=new Blob([JSON.stringify(STRATS,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="strategies-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  note("Exported "+STRATS.length+" strategies.");
}
function doImport(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var arr;
    try{arr=JSON.parse(r.result);}catch(err){note("That file isn't valid JSON.",true);return;}
    if(!Array.isArray(arr)||!arr.length){note("That file has no strategies in it.",true);return;}
    askMerge(arr,"file");
  };
  r.readAsText(f);
  e.target.value="";
}
function dedupeMerge(base,add){
  var seen={},out=base.slice();
  out.forEach(function(s){seen[(s.name+"|"+(s.source||"")).toLowerCase()]=1;});
  var added=0;
  add.forEach(function(s){
    var k=(s.name+"|"+(s.source||"")).toLowerCase();
    if(seen[k])return;seen[k]=1;out.push(clean(s));added++;
  });
  return {list:out,added:added,skipped:add.length-added};
}
function askMerge(arr,how){
  var b=$("sbanner");
  b.innerHTML='<div class="banner"><p><b>'+arr.length+' strategies</b> from '+(how==="file"?"that file":"a shared link")+
    '. Merge keeps what you already have and skips duplicates. Replace wipes your list first.</p>'+
    '<button class="btn ok" id="m-merge">Merge</button>'+
    '<button class="btn dgr" id="m-repl">Replace</button>'+
    '<button class="btn" id="m-no">Cancel</button></div>';
  $("m-merge").onclick=function(){
    var r=dedupeMerge(STRATS,arr);STRATS=r.list;save(STRATS);pending=null;b.innerHTML="";
    buildChips();render();note("Merged. Added "+r.added+", skipped "+r.skipped+" duplicate"+(r.skipped===1?"":"s")+".");
  };
  $("m-repl").onclick=function(){
    STRATS=arr.map(clean);save(STRATS);pending=null;b.innerHTML="";
    buildChips();render();note("Replaced. You now have "+STRATS.length+" strategies.");
  };
  $("m-no").onclick=function(){pending=null;b.innerHTML="";buildChips();render();};
}
function clean(s){
  return {name:String(s.name||"Untitled").slice(0,120),source:String(s.source||"").slice(0,120),
    sourceUrl:/^https?:\/\//i.test(s.sourceUrl||"")?s.sourceUrl:"",
    market:String(s.market||"").slice(0,30),timeframe:String(s.timeframe||"").slice(0,30),
    session:String(s.session||"").slice(0,60),bias:String(s.bias||""),entry:String(s.entry||""),
    invalidation:String(s.invalidation||""),target:String(s.target||""),riskNote:String(s.riskNote||""),
    tags:Array.isArray(s.tags)?s.tags.slice(0,8).map(function(t){return String(t).slice(0,24);}):[],
    trades:Array.isArray(s.trades)?s.trades.slice(0,400).map(cleanTrade):[],
    evidence:EVRANK[s.evidence]!==undefined?s.evidence:"untested",
    sampleSize:Math.max(0,parseInt(s.sampleSize,10)||0),
    results:String(s.results||""),notes:String(s.notes||""),
    added:/^\d{4}-\d{2}-\d{2}$/.test(s.added||"")?s.added:new Date().toISOString().slice(0,10)};
}

/* ---------- trade log & derived stats ---------- */
function cleanTrade(t){
  t=t||{};
  return {d:/^\d{4}-\d{2}-\d{2}$/.test(t.d||"")?t.d:new Date().toISOString().slice(0,10),
          dir:t.dir==="short"?"short":"long",
          r:Math.round((parseFloat(t.r)||0)*100)/100,
          n:String(t.n||"").slice(0,140)};
}
function nOf(s){return (s.trades&&s.trades.length)?s.trades.length:(s.sampleSize||0);}
function wilson(w,n){
  if(!n)return [0,0];
  var z=1.96,p=w/n,dn=1+z*z/n,c=(p+z*z/(2*n))/dn,m=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/dn;
  return [Math.max(0,c-m),Math.min(1,c+m)];
}
function stats(s){
  var t=(s.trades||[]);if(!t.length)return null;
  var tot=0,peak=0,dd=0,eq=[0],gp=0,gl=0,w=0;
  t.forEach(function(x){
    tot+=x.r;eq.push(Math.round(tot*100)/100);
    if(tot>peak)peak=tot;
    if(peak-tot>dd)dd=peak-tot;
    if(x.r>0){gp+=x.r;w++;}else{gl+=-x.r;}
  });
  var n=t.length,l=n-w,aw=w?gp/w:0,al=l?gl/l:0;
  return {n:n,eq:eq,wins:w,losses:l,wr:w/n,ci:wilson(w,n),exp:tot/n,tot:tot,dd:dd,
          pf:gl>0?gp/gl:(gp>0?Infinity:0),aw:aw,al:al,be:(aw+al)>0?al/(aw+al):0};
}
function tradeBlock(s,key,st){
  var h='<p class="reltitle">Trade log \u2014 your own results</p>';
  if(st){
    h+='<div class="out">n=<b>'+st.n+'</b> &nbsp;\u00b7&nbsp; win rate <b>'+(st.wr*100).toFixed(0)+'%</b> '+
       '<span class="ci">(95% CI '+(st.ci[0]*100).toFixed(0)+'\u2013'+(st.ci[1]*100).toFixed(0)+'%)</span>'+
       ' &nbsp;\u00b7&nbsp; expectancy <b>'+(st.exp>=0?"+":"")+st.exp.toFixed(2)+'R</b>'+
       '<br>total <b>'+(st.tot>=0?"+":"")+st.tot.toFixed(1)+'R</b> &nbsp;\u00b7&nbsp; max drawdown <b>'+st.dd.toFixed(1)+'R</b>'+
       ' &nbsp;\u00b7&nbsp; profit factor <b>'+(isFinite(st.pf)?st.pf.toFixed(2):"\u221e")+'</b>'+
       ' &nbsp;\u00b7&nbsp; avg win '+st.aw.toFixed(2)+'R, avg loss '+st.al.toFixed(2)+'R';
    if(st.be>0&&st.ci[0]<=st.be&&st.be<=st.ci[1])
      h+='<br><span class="bad">Breakeven at this win/loss size is '+(st.be*100).toFixed(0)+
         '%, and that sits inside the confidence interval \u2014 '+st.n+' trades still can\u2019t rule out that this is breakeven.</span>';
    else if(st.n<30)
      h+='<br><span class="bad">'+st.n+' trades is a small sample. Treat these numbers as provisional.</span>';
    h+='</div>';
    h+='<figure style="margin-top:10px">'+svgFor({k:"e",base:0,s:[{v:st.eq,c:st.tot>=0?"u":"d",
        t:(st.tot>=0?"+":"")+st.tot.toFixed(1)+"R"}]})+
       '<figcaption>Cumulative R across '+st.n+' logged trades. Dashed line is breakeven.</figcaption></figure>';
    h+='<table class="stable"><thead><tr><th>Date</th><th>Dir</th><th>Result</th><th>Note</th><th><span class="sr-only">Remove</span></th></tr></thead><tbody>';
    s.trades.slice().reverse().forEach(function(t,i){
      var idx=s.trades.length-1-i;
      h+='<tr><td>'+esc(t.d)+'</td><td>'+esc(t.dir)+'</td>'+
         '<td style="color:'+(t.r>=0?"var(--up)":"var(--down)")+'">'+(t.r>=0?"+":"")+t.r+'R</td>'+
         '<td>'+esc(t.n)+'</td><td><button class="btn" data-rmtrade="'+key+':'+idx+'" title="Remove this trade" aria-label="Remove trade">\u00d7</button></td></tr>';
    });
    h+='</tbody></table>';
  }else{
    h+='<p class="note">Nothing logged yet. Log a few trades and the win rate, expectancy, drawdown and equity curve get computed from them \u2014 instead of typed in from memory.</p>';
  }
  if(!pending){
    h+='<div class="logrow">'+
      '<div class="f"><label for="t-d-'+key+'">Date</label><input id="t-d-'+key+'" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
      '<div class="f"><label for="t-dir-'+key+'">Direction</label><select id="t-dir-'+key+'"><option value="long">Long</option><option value="short">Short</option></select></div>'+
      '<div class="f"><label for="t-r-'+key+'">Result in R</label><input id="t-r-'+key+'" type="number" step="0.1" placeholder="e.g. -1 or 2.5"></div>'+
      '<div class="f grow"><label for="t-n-'+key+'">Note</label><input id="t-n-'+key+'" type="text" placeholder="optional"></div>'+
      '<button class="btn ok" data-addtrade="'+key+'">Log trade</button></div>';
  }
  return h;
}

    if(isOpen){

      h+='<dl class="sbody">'+(rows||'<div class="srow"><dd>No rules recorded yet.</dd></div>')+'</dl>';
      var rel=relatedTerms(s);
