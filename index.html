      var p=b.dataset.rmtrade.split(":"),s=find(p[0]);if(!s||!s.trades)return;
      s.trades.splice(parseInt(p[1],10),1);s.sampleSize=s.trades.length;save(STRATS);render();
    };});
  Array.prototype.forEach.call(wrap.querySelectorAll("[data-e]"),function(b){
    b.onclick=function(){openForm(find(b.dataset.e));};});
  Array.prototype.forEach.call(wrap.querySelectorAll("[data-d]"),function(b){
    b.onclick=function(){
      var s=find(b.dataset.d);if(!s)return;
      if(b.dataset.armed){STRATS.splice(STRATS.indexOf(s),1);save(STRATS);buildChips();render();return;}
      b.dataset.armed="1";b.textContent="Tap again to delete";
      setTimeout(function(){if(b.parentNode){b.removeAttribute("data-armed");b.textContent="Delete";}},3500);
    };});

  var cw=document.getElementById("calcwrap");
  if(tools&&!cw){
    var d=document.createElement("div");d.id="calcwrap";d.innerHTML=calcPanel();
    $("sformwrap").insertAdjacentElement("beforebegin",d);wireCalc();
  }else if(!tools&&cw){cw.remove();}
}
function syncHash(){
  if(pending||$("panel-strats").hidden||!$("panel-quiz").hidden||!$("panel-live").hidden||!history.replaceState)return;
  var p=["strategies"],q=$("sq").value.trim();
  if(q)p.push("q="+encodeURIComponent(q));
  if(filt.ev!=="all")p.push("ev="+encodeURIComponent(filt.ev));
  if(filt.market!=="all")p.push("mk="+encodeURIComponent(filt.market));
  if(filt.tag!=="all")p.push("tg="+encodeURIComponent(filt.tag));
  if($("ssort").value!=="added")p.push("sort="+$("ssort").value);
  history.replaceState(null,"","#"+p.join("&"));
}
function find(k){var r=null;cur().forEach(function(s){if(slug(s.name+"|"+s.source)===k)r=s;});return r;}
var _render=render;render=function(){_render();syncHash();};


/* ---------- boot ---------- */
$("sq").addEventListener("input",render);
$("sq").addEventListener("keydown",function(e){if(e.key==="Escape"){this.value="";render();}});
$("ssort").addEventListener("change",render);
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault();
    ($("panel-strats").hidden?$("q"):$("sq")).focus();
  }
});
buildTools();buildChips();render();
$("cnt-terms").textContent=document.querySelectorAll("#grid .entry").length;

var hp=parseHash();
if(hp.lib){
  decodeLib(hp.lib).then(function(arr){
    if(!Array.isArray(arr)||!arr.length)throw 0;
    pending=arr.map(clean);
    setTab("strategies",false);
    if(history.replaceState)history.replaceState(null,"","#strategies");
    buildChips();render();askMerge(pending,"link");
  }).catch(function(){
    setTab("strategies",false);
    $("sbanner").innerHTML='<div class="banner"><p>That share link couldn\u2019t be read \u2014 it may have been cut short by the app you sent it through. Ask for the .json file instead.</p></div>';
  });
}else{
  setTab(["strategies","quiz","live"].indexOf(hp.tab)>-1?hp.tab:"terms",false);
  if(hp.q)$("sq").value=decodeURIComponent(hp.q);
  if(hp.ev)filt.ev=decodeURIComponent(hp.ev);
  if(hp.mk)filt.market=decodeURIComponent(hp.mk);
  if(hp.tg)filt.tag=decodeURIComponent(hp.tg);
  if(hp.sort)$("ssort").value=hp.sort;
  if(hp.q||hp.ev||hp.mk||hp.tg||hp.sort){buildChips();render();}
  if(hp.t)setTimeout(function(){TAPE_NS.goTerm("term-"+hp.t);},60);
}

var f=$("foot");
f.innerHTML=f.innerHTML+
  "<br>Strategies are stored in this browser only. <b>Export .json</b> or <b>Copy share link</b> to move them between devices or send them to someone.";
})();
</script>

<script>
/* ====================================================================
   PAGE CHROME
   Toast, theme toggle, back-to-top, keyboard shortcuts and the last-tab
   memory. Everything here is page-wide; nothing belongs to a single tab.
   ==================================================================== */
(function(){
"use strict";
var MOTION=!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
var el=TAPE_NS.el;

/* ---------- toast: one place for all transient feedback ---------- */
var t=document.createElement("div");
t.id="toast";t.setAttribute("role","status");t.setAttribute("aria-live","polite");
document.body.appendChild(t);
var toastTimer=null;
TAPE_NS.toast=function(msg){
  t.textContent=msg;t.classList.add("show");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show");},1900);
};

/* copy-link buttons already write to the clipboard; give them a receipt */
document.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest(".lnk"):null;
  if(b) TAPE_NS.toast("Link copied");
},true);

/* ---------- theme toggle: Auto -> Dark -> Light ---------- */
var TH=TAPE_NS.K.theme;
var themeBtn=document.createElement("button");
themeBtn.className="btn";themeBtn.id="themebtn";themeBtn.type="button";
var nav=document.querySelector("nav.tabs");
if(nav){
  var holder=document.createElement("span");

  holder.appendChild(themeBtn);
  nav.appendChild(holder);
}
function paintTheme(v){
  if(v) document.documentElement.setAttribute("data-theme",v);

  themeBtn.textContent = v==="dark"?"Dark":v==="light"?"Light":"Auto";

}

paintTheme(saved||"");
themeBtn.onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : cur==="light" ? "" : "dark";
  paintTheme(next);
  TAPE_NS.store.set(TH,next);
  TAPE_NS.toast("Theme: "+(next||"auto"));
};

/* ---------- back to top ---------- */
var top=document.createElement("button");
top.id="totop";top.type="button";top.setAttribute("aria-label","Back to top");top.innerHTML="↑";
document.body.appendChild(top);
top.onclick=function(){

function typing(){

}
document.addEventListener("keydown",function(e){

  if(e.key==="?"){e.preventDefault();kbShow(true);return;}

  var last=store.get(TKEY);

/* ---------- staggered entrance, capped so filtering stays instant ---------- */

      if(e.target.closest&&(e.target.closest(".chip")||e.target.closest(".secitem"))) setTimeout(restagger,0);
    });
  }
}
})();

<script>
/* ====================================================================
   DETAIL LEVEL, CONDITIONS AND QUICK ADD
   Three passes over the already-rendered grid: the Simple/Detailed toggle
   with its plain-language rewrites, the "what has to be true" boxes, and
   the strategy templates — which ship with their rules blank on purpose,
   so that nothing is invented on the user's behalf.
   ==================================================================== */
(function(){
"use strict";
var el=TAPE_NS.el, esc=TAPE_NS.esc;

/* =====================================================================
   1. SIMPLE / DETAILED
   Simple strips the example, the see-also chain and the caveat block,
   enlarges the definition, and hides Advanced terms outright. Where a
   plain-language rewrite exists it is shown instead of the standard one.
   ===================================================================== */
var PLAIN={
  "Liquidity":"How easily you can get in or out without shoving the price around.",
  "Slippage":"You asked for one price and got a worse one.",
  "Spread":"The gap between the buy price and the sell price. You pay it every trade.",
  "Leverage":"Borrowed size. It multiplies the win and the loss equally.",
  "Margin":"The deposit the broker locks up so you can hold a leveraged position.",
  "Expectancy":"What you make per trade on average once wins and losses are both counted.",
  "Drawdown":"How far your account fell from its highest point.",
  "Risk of ruin":"The chance you lose so much that coming back isn't realistic.",
  "Position sizing":"Working out how many contracts you can hold without a normal loss hurting.",
  "Stop loss":"An order that closes you out so a loss can't keep growing.",
  "Win rate":"How often you win. On its own it tells you almost nothing.",
  "Profit factor":"Total won divided by total lost. Above 1 means you made money.",
  "Sharpe ratio":"Return compared to how bumpy the ride was.",
  "Overfitting":"Your rules learned the noise in old data instead of anything repeatable.",
  "Out-of-sample":"Data your strategy has never seen. The only results that mean anything.",
  "Multiple testing":"Try enough ideas and one looks great by luck alone.",
  "Sample size":"How many trades your conclusion rests on. Usually far too few.",
  "Volatility":"How much price is swinging about.",
  "ATR":"The average size of a bar. Use it to set stop distance.",
  "Liquidity sweep":"Price pokes past an obvious high or low, grabs the stops, then comes back.",
  "Fair value gap":"A gap left behind when price moved so fast it skipped a level.",
  "Order block":"The last candle before a big move, treated as a zone price may return to.",
  "Gap risk":"Price jumps past your stop while you can't do anything about it.",
  "Notional value":"The full value you actually control, not the deposit you put down.",
  "Implied volatility":"How much movement option prices are pricing in.",
  "Theta":"What an option loses each day just from time passing.",
  "Option delta":"How much the option moves when the underlying moves one point.",
  "Funding rate":"A fee passed between longs and shorts to keep a perp near spot.",
  "Expectancy per trade":"Average profit per trade across a big sample.",
  "Buy and hold":"Own it and do nothing. The benchmark most strategies fail to beat.",
  "Benchmark":"What you have to beat for the effort to have been worth it.",
  "Random trader benchmark":"Coin-flip entries with your costs. Beat this before believing anything.",
  "Pre-registration":"Write down the test and what counts as a pass before you run it.",
  "p-hacking":"Fiddling with settings until a failed test finally passes.",
  "Tail risk":"The rare enormous loss hiding at the end of the distribution.",
  "Correlation":"How much two things move together. Correlated positions are one bet.",
  "Trailing drawdown":"A prop-firm loss limit that rises as you profit, so profit raises the floor.",
  "Prop firm":"A company that charges you to take a test for a funded account.",
  "CFD":"A leveraged bet on price where the broker is the other side.",
  "Compounding":"Gains earning gains, and losses doing the same in reverse."
};

var bar=document.createElement("div");
bar.id="depthbar";
bar.innerHTML='<span class="qlabel" style="font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)">Detail</span>'+
  '<span class="seg"><button type="button" id="d-simple" aria-pressed="false">Simple</button>'+
  '<button type="button" id="d-full" aria-pressed="true">Detailed</button></span>'+
  '<span class="hint" id="d-hint"></span>';

/* stamp the level onto each entry so Simple can hide Advanced */
(function(){

  });

var DKEY=TAPE_NS.K.depth;
function setDepth(mode){
  var simple=mode==="simple";

  el("d-simple").setAttribute("aria-pressed",simple?"true":"false");

if(TAPE_NS.toast){/* no toast on first paint */}

/* =====================================================================
   2. CONDITIONS — what has to be true for a structure to exist.
   Definitional, checkable, and deliberately not predictive.
   ===================================================================== */
var COND={
  "Liquidity sweep":["A prior swing high or low that plenty of people can see",
    "Price trades beyond it, taking the orders resting there",
    "It closes back inside the old range — the reclaim is the event, not the poke"],
  "Fair value gap":["Three consecutive candles",
    "Candle 1's high sits below candle 3's low (bullish), or the mirror for bearish",
    "The untouched band between them is the gap"],
  "Order block":["A clear impulsive move away from a level",
    "The last opposing candle before that move",
    "Price later returns to that candle's range"],
  "Break of structure":["A defined swing point, which depends on your swing lookback",
    "A close beyond it, not just a wick",
    "In the direction of the existing trend"],
  "Change of character":["An established sequence of higher highs and higher lows, or the reverse",
    "The first close that breaks that sequence against the trend"],
  "Equal highs / equal lows":["Two or more swing points finishing within a small tolerance of each other",
    "Tolerance stated as a fraction of ATR, not eyeballed"],
  "Spring":["A defined trading range with a floor",
    "Price dips below the floor",
    "It closes back above it inside the same or next bar"],
  "Consolidation":["Each successive swing smaller than the last",
    "Bar ranges contracting, not just price going sideways"],
  "Bullish engulfing":["A down candle","A following up candle whose body fully covers it",
    "Context matters more than the shape: at a level, or in open space?"],
  "Inside bar":["A bar whose high is below the prior high",
    "And whose low is above the prior low"],
  "Double top":["Two swing highs at a similar price","A trough between them","A close below that trough"],
  "Head and shoulders":["Three peaks, the middle highest","A neckline joining the two troughs",
    "A close through the neckline"],
  "Gamma squeeze":["Heavy call buying concentrated in near-dated strikes",
    "Dealers short those calls needing to hedge",
    "Limited float or thin liquidity in the underlying"],
  "Short squeeze":["High short interest relative to float",
    "A catalyst forcing shorts to cover","Thin available liquidity to cover into"],
  "Liquidation cascade":["Crowded leveraged positioning on one side",
    "A move large enough to trigger the first liquidations",
    "Those forced closes moving price into the next cluster"]
};

(function(){
  var D=window.D||[];
  var bySlug={};

    var host=e.querySelector(".ex");
    if(host&&host.parentNode) host.parentNode.insertBefore(box,host.nextSibling);
  });

/* =====================================================================
   3. QUICK ADD — structure only.
   Rules are left blank on purpose: inventing them and attaching a real
   person's name to them would be making things up.
   ===================================================================== */
var TPL=[
  {k:"Session play",v:{name:"",timeframe:"5m",session:"",tags:["session"],
    bias:"",entry:"",invalidation:"",target:"",riskNote:"1% of account. Stop distance sets the size."}},
  {k:"Sweep + reclaim",v:{name:"",timeframe:"5m",tags:["liquidity","reversal"],
    bias:"",entry:"",invalidation:"",target:"",riskNote:"1% of account."}},
  {k:"Breakout",v:{name:"",timeframe:"15m",tags:["breakout","momentum"],
    bias:"",entry:"",invalidation:"",target:"",riskNote:"1% of account."}},
  {k:"Mean reversion",v:{name:"",timeframe:"1h",tags:["mean-reversion"],
    bias:"",entry:"",invalidation:"",target:"",riskNote:"1% of account."}},
  {k:"News / event",v:{name:"",timeframe:"5m",tags:["news","event"],
    bias:"",entry:"",invalidation:"",target:"",riskNote:"Reduced size through scheduled releases."}},
  {k:"ICT / SMC",v:{name:"",timeframe:"5m",tags:["ict","smc","liquidity"],
    bias:"",entry:"",invalidation:"",target:"",riskNote:"1% of account.",
    notes:"Rules intentionally blank — fill these in from your own source. Nothing was assumed on your behalf."}}
];

function fill(v){
  /* openForm is private to the strategy IIFE, so drive the real "+ Add" button
     rather than reaching for it — same result, no coupling. */
  var add=el("b-add");
  if(!add)return;
  add.click();
  setTimeout(function(){

    });

  },0);
}

function mountQuickAdd(){
  var t=el("stools");
  if(!t||el("qadd"))return;
  var row=document.createElement("div");
  row.id="qadd";
  row.innerHTML='<span class="qlabel">Quick add</span>';

var stratTab=el("tab-strats");

<script>
/* ====================================================================
   EXPORT, PAGE FURNITURE AND STRUCTURED DATA
   One module, previously three blocks that could not see each other:
   the PNG rasteriser, the export buttons that call it, and the JSON-LD
   injection. All three read TAPE config and only this module does, so
   the config-driven accent is applied here too.

   The one real trap in the rasteriser: charts are drawn with CSS custom
   properties, which do not resolve inside a standalone serialised SVG,
   so every var() is substituted with its computed value before
   rasterising or the export comes out black.
   ==================================================================== */
(function(){
"use strict";

/* config-driven accent; invisible while TAPE.accent is empty */
if(TAPE.accent){ try{ document.documentElement.style.setProperty("--signal", TAPE.accent); }catch(e){} }
var TAPE_PRESETS = {
  square:    {w:1080, h:1080, label:"Square 1080×1080"},
  portrait:  {w:1080, h:1920, label:"Portrait 1080×1920"},
  landscape: {w:1200, h:630,  label:"Landscape 1200×630"}
};

function tapeVars(){
  var cs = getComputedStyle(document.documentElement);
  var names = ["--paper","--card","--ink","--ink2","--ink3","--rule","--rule2",
               "--up","--down","--accent","--signal","--tint"];
  var out = {};
  names.forEach(function(n){ out[n] = (cs.getPropertyValue(n) || "").trim() || "#888"; });
  return out;
}

function tapeInlineVars(svgText, vars){
  return svgText.replace(/var\(\s*(--[a-z0-9-]+)\s*(?:,[^)]*)?\)/gi, function(m, name){
    return vars[name] || "#888";
  });
}

function tapeWrapText(ctx, text, maxW){
  var words = String(text).split(/\s+/), lines = [], line = "";
  for(var i=0;i<words.length;i++){
    var probe = line ? line+" "+words[i] : words[i];
    if(ctx.measureText(probe).width > maxW && line){ lines.push(line); line = words[i]; }
    else line = probe;
  }
  if(line) lines.push(line);
  return lines;
}

/* Returns a Promise for a PNG Blob. */
function tapeExportPng(svgEl, opts){
  opts = opts || {};
  var preset = TAPE_PRESETS[opts.preset] || TAPE_PRESETS.square;
  var vars = tapeVars();
  var W = preset.w, H = preset.h;

  var clone = svgEl.cloneNode(true);
  if(!clone.getAttribute("xmlns")) clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  var raw = new XMLSerializer().serializeToString(clone);
  raw = tapeInlineVars(raw, vars);
  /* the chart's text classes live in the page stylesheet, not the svg */
  raw = raw.replace(/<svg([^>]*)>/, '<svg$1><style>'+
    'text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;fill:'+vars["--ink3"]+'}'+
    '.lb{fill:'+vars["--ink3"]+'}.lbu{fill:'+vars["--up"]+'}.lbd{fill:'+vars["--down"]+'}'+
    '.lba{fill:'+vars["--accent"]+'}.lbs{fill:'+vars["--signal"]+'}.lbk{fill:'+vars["--ink"]+'}'+
    '</style>');

  var url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(raw);

  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      try{
        var cv = document.createElement("canvas");
        cv.width = W; cv.height = H;
        var ctx = cv.getContext("2d");

        ctx.fillStyle = vars["--paper"]; ctx.fillRect(0,0,W,H);

        var pad = Math.round(W * 0.075);
        var innerW = W - pad*2;

        /* title.
           Measured at a 200px thumbnail the first version only reached 4.25:1 —
           antialiasing on downscale eats thin text. Heavier weight, larger size
           and a solid plate behind it so the contrast survives shrinking. */
        var titleSize = Math.round(W * 0.078);
        ctx.textBaseline = "top";
        ctx.font = "800 "+titleSize+"px ui-sans-serif, system-ui, sans-serif";
        var titleLines = tapeWrapText(ctx, opts.title || "", innerW).slice(0,2);
        var plateH = titleLines.length*titleSize*1.14 + Math.round(W*0.03);
        ctx.fillStyle = vars["--card"];
        ctx.fillRect(0, pad - Math.round(W*0.022), W, plateH);
        ctx.fillStyle = vars["--signal"];
        ctx.fillRect(0, pad - Math.round(W*0.022), Math.round(W*0.012), plateH);
        ctx.fillStyle = vars["--ink"];
        var y = pad;
        titleLines.forEach(function(L){ ctx.fillText(L, pad, y); y += titleSize*1.14; });
        y += Math.round(W*0.012);

        /* one line of definition */
        if(opts.subtitle){
          var subSize = Math.round(W * 0.028);
          ctx.fillStyle = vars["--ink2"];
          ctx.font = "400 "+subSize+"px ui-sans-serif, system-ui, sans-serif";
          y += Math.round(W*0.014);
          tapeWrapText(ctx, opts.subtitle, innerW).slice(0,3).forEach(function(L){
            ctx.fillText(L, pad, y); y += subSize*1.42;
          });
        }

        /* chart, scaled to fit what's left above the footer */
        var footerH = Math.round(W * 0.085);
        var availTop = y + Math.round(W*0.035);
        var availH = H - availTop - footerH - pad*0.5;
        var ar = (img.width && img.height) ? img.width/img.height : 320/150;
        var dw = innerW, dh = dw/ar;
        if(dh > availH){ dh = availH; dw = dh*ar; }
        var dx = pad + (innerW - dw)/2;
        var dy = availTop + Math.max(0,(availH - dh)/2);

        ctx.fillStyle = vars["--tint"];
        ctx.fillRect(pad, dy - Math.round(W*0.02), innerW, dh + Math.round(W*0.04));
        ctx.drawImage(img, dx, dy, dw, dh);

        /* caption */
        if(opts.caption){
          var capSize = Math.round(W*0.022);
          ctx.fillStyle = vars["--ink3"];
          ctx.font = "400 "+capSize+"px ui-sans-serif, system-ui, sans-serif";
          var capY = dy + dh + Math.round(W*0.032);
          tapeWrapText(ctx, opts.caption, innerW).slice(0,2).forEach(function(L){
            ctx.fillText(L, pad, capY); capY += capSize*1.4;
          });
        }

        /* attribution — the only thing that survives the file being copied */
        var markSize = Math.round(W*0.026);
        ctx.font = "700 "+markSize+"px ui-monospace, Menlo, Consolas, monospace";
        ctx.fillStyle = vars["--signal"];
        ctx.textBaseline = "alphabetic";
        ctx.fillText(TAPE.wordmark || "TAPE", pad, H - pad*0.75);
        if(TAPE.url){
          ctx.font = "400 "+markSize+"px ui-monospace, Menlo, Consolas, monospace";
          ctx.fillStyle = vars["--ink3"];
          ctx.textAlign = "right";
          ctx.fillText(TAPE.url, W - pad, H - pad*0.75);
          ctx.textAlign = "left";
        }

        if(cv.toBlob) cv.toBlob(function(b){ b ? resolve(b) : reject(new Error("toBlob returned null")); }, "image/png");
        else reject(new Error("canvas.toBlob unavailable"));
      }catch(err){ reject(err); }
    };
    img.onerror = function(){ reject(new Error("svg failed to rasterise")); };
    img.src = url;
  });
}

function tapeDownload(blob, filename){
  try{
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  }catch(e){ return false; }
}

/* expose for tests and for the post builder */
window.tapeExportPng = tapeExportPng;
window.tapeDownload = tapeDownload;
window.TAPE_PRESETS = TAPE_PRESETS;
window.tapeInlineVars = tapeInlineVars;

function slugOf(el){
  var e = el.closest ? el.closest(".entry") : null;
  return e ? (e.dataset.slug||"chart") : "chart";
}
function titleOf(el){
  var e = el.closest ? el.closest(".entry") : null;
  if(!e) return TAPE.name;
  var h = e.querySelector(".term");
  if(!h) return TAPE.name;
  var c = h.cloneNode(true);
  Array.prototype.forEach.call(c.querySelectorAll("button"), function(b){ b.remove(); });
  return c.textContent.trim();
}
function defOf(el){
  var e = el.closest ? el.closest(".entry") : null;
  var p = e ? e.querySelector(".def") : null;
  return p ? p.textContent.trim() : "";
}
function capOf(fig){
  var c = fig.querySelector("figcaption");
  return c ? c.textContent.trim() : "";
}

function mountExport(fig){
  if(fig.querySelector(".expbar")) return;
  var svg = fig.querySelector("svg");
  if(!svg) return;
  var bar = document.createElement("div");
  bar.className = "expbar";
  bar.innerHTML = '<span class="explab">Export</span>';
  Object.keys(TAPE_PRESETS).forEach(function(k){
    var b = document.createElement("button");
    b.type = "button"; b.className = "expbtn"; b.dataset.preset = k;
    b.textContent = TAPE_PRESETS[k].label.split(" ")[0];
    b.setAttribute("aria-label","Export chart as "+TAPE_PRESETS[k].label+" PNG");
    b.onclick = function(ev){
      ev.stopPropagation();
      b.disabled = true;
      tapeExportPng(svg, {
        preset:k, title:titleOf(fig), subtitle:defOf(fig), caption:capOf(fig)
      }).then(function(blob){
        tapeDownload(blob, (TAPE.wordmark||"tape").toLowerCase()+"-"+slugOf(fig)+"-"+k+".png");
        if(TAPE_NS.toast) TAPE_NS.toast("Exported "+TAPE_PRESETS[k].label);
      }).catch(function(err){
        if(TAPE_NS.toast) TAPE_NS.toast("Export failed: "+err.message);
      }).then(function(){ b.disabled = false; });
    };
    bar.appendChild(b);
  });
  fig.appendChild(bar);
}

function mountAll(){
  document.querySelectorAll("#grid figure").forEach(mountExport);
}
mountAll();

/* config-driven footer additions; invisible while the constants are empty */
(function(){
  var f = document.getElementById("foot");
  if(!f) return;
  var bits = [];
  if(TAPE.footer) bits.push(TAPE.footer);
  if(TAPE.supportUrl) bits.push('<a href="'+TAPE.supportUrl+'" rel="noopener noreferrer">Support this project</a>');
  if(TAPE.workbookUrl) bits.push('<a href="'+TAPE.workbookUrl+'" rel="noopener noreferrer">Printable workbook</a>');
  if(!bits.length) return;
  var p = document.createElement("p");
  p.className = "tapefoot";
  p.innerHTML = bits.join(" &middot; ");
  f.appendChild(p);
})();
(function(){
try{
  var D=window.D||[], CAT=window.CAT||[];
  if(!D.length) return;
  var catName={}; CAT.forEach(function(c){catName[c[0]]=c[1];});
  var ld={
    "@context":"https://schema.org",
    "@type":"DefinedTermSet",
    "name":(window.TAPE&&TAPE.name)||"Tape",
    "description":"Trading terms, what they look like on a chart, and whether they hold up when tested.",
    "hasDefinedTerm": D.slice(0,400).map(function(x){
      return {"@type":"DefinedTerm","name":x.t,"description":x.d,
              "inDefinedTermSet":(window.TAPE&&TAPE.name)||"Tape",
              "termCode":String(x.t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")};
    })
  };
  var sc=document.createElement("script");
  sc.type="application/ld+json";
  sc.textContent=JSON.stringify(ld);
  document.head.appendChild(sc);
}catch(e){}
})();
})();
</script>

<script>
/* ====================================================================
   POST BUILDER + CAROUSEL EXPORT
   The growth engine: turn any term, or a whole section, into finished
   images and a copyable caption. Everything client-side.
   ==================================================================== */
(function(){
"use strict";
if(typeof document==="undefined") return;

var EKEY=TAPE_NS.K.exported;
function loadExported(){return TAPE_NS.store.json(EKEY,[])||[];}
function saveExported(a){TAPE_NS.store.setJson(EKEY,a);}
function markExported(slug){
  var a=loadExported();
  if(a.indexOf(slug)<0){a.push(slug);saveExported(a);}
}
var esc=TAPE_NS.esc;

function captionFor(x){
  var lines=[];
  lines.push(x.t.toUpperCase());
  lines.push("");
  lines.push(x.d);
  if(x.e){lines.push("");lines.push(x.warn?("Careful: "+x.e):("Example: "+x.e));}
  if(window.TAPE&&TAPE.url){lines.push("");lines.push(TAPE.url);}
  return lines.join("\n");
}

/* find a term's rendered <svg> ELEMENT. Deliberately not called svgFor:
   that name belongs to the chart engine, and this shadowed it. */
function svgElFor(slug){
  var e=document.getElementById("term-"+slug);
  return e?e.querySelector("figure svg"):null;
}

function exportTerm(x, preset){
  var slug=x.slug;
  var svg=svgElFor(slug);
  if(!svg) return Promise.reject(new Error("no chart for "+x.t));
  var e=document.getElementById("term-"+slug);
  var cap=e?(e.querySelector("figcaption")||{}).textContent||"":"";
  return window.tapeExportPng(svg,{preset:preset||"square",title:x.t,subtitle:x.d,caption:cap})
    .then(function(b){markExported(slug);return b;});
}

/* ---- carousel: a whole section as numbered slides ---- */
function carousel(sectionId, preset, onProgress){
  var D=window.D||[];
  var items=D.filter(function(x){return x.c===sectionId && svgElFor(x.slug);});
  var out=[], i=0;
  function step(){
    if(i>=items.length) return Promise.resolve(out);
    var x=items[i];
    return exportTerm(x,preset).then(function(b){
      var n=String(i+1).padStart(2,"0");
      out.push({name:n+"-"+x.slug+".png",blob:b,term:x.t});
      i++;
      if(onProgress)onProgress(i,items.length,x.t);
      return step();
    }).catch(function(){ i++; return step(); });
  }
  return step();
}
window.tapeCarousel=carousel;
window.tapeExportTerm=exportTerm;
window.tapeCaptionFor=captionFor;

/* ---- UI ---- */
function mount(){
  var host=document.getElementById("panel-terms");
  if(!host||document.getElementById("postbuilder")) return;
  var D=window.D||[], CAT=window.CAT||[];

  var box=document.createElement("div");
  box.id="postbuilder";
  box.className="wrap";
  var opts=CAT.filter(function(c){
    return D.some(function(x){return x.c===c[0]&&svgElFor(x.slug);});
  }).map(function(c){
    var n=D.filter(function(x){return x.c===c[0]&&svgElFor(x.slug);}).length;
    return '<option value="'+esc(c[0])+'">'+esc(c[1])+' ('+n+')</option>';
  }).join("");

  box.innerHTML=
    '<details id="pbdet"><summary>Post builder — turn terms into images</summary>'+
    '<div class="pbbody">'+
    '<p class="pbnote">Exports run entirely in this browser. Nothing is uploaded.</p>'+
    '<div class="pbrow">'+
      '<label class="qlab" for="pb-preset">Size</label>'+
      '<select id="pb-preset" class="btn"><option value="square">Square 1080</option>'+
      '<option value="portrait">Portrait 1080×1920</option><option value="landscape">Landscape 1200×630</option></select>'+
      '<button class="btn pri" id="pb-surprise">Surprise me</button>'+
    '</div>'+
    '<div class="pbrow">'+
      '<label class="qlab" for="pb-sec">Carousel</label>'+
      '<select id="pb-sec" class="btn">'+opts+'</select>'+
      '<button class="btn" id="pb-run">Export section as slides</button>'+
    '</div>'+
    '<div id="pb-out" class="pbout" aria-live="polite"></div>'+
    '</div></details>';
  host.insertBefore(box, host.firstChild);

  var out=document.getElementById("pb-out");

  document.getElementById("pb-surprise").onclick=function(){
    var done=loadExported();
    var pool=D.filter(function(x){return svgElFor(x.slug)&&done.indexOf(x.slug)<0;});
    if(!pool.length){ out.textContent="Every term with a chart has been exported. Clear tape.exported to start again."; return; }
    var x=pool[Math.floor(Math.random()*pool.length)];
    var preset=document.getElementById("pb-preset").value;
    out.textContent="Exporting "+x.t+"…";
    exportTerm(x,preset).then(function(b){
      window.tapeDownload(b,(TAPE.wordmark||"tape").toLowerCase()+"-"+x.slug+".png");
      var cap=captionFor(x);
      var copied=false;
      try{ if(navigator.clipboard){ navigator.clipboard.writeText(cap); copied=true; } }catch(e){}
      out.innerHTML='<b>'+esc(x.t)+'</b> exported. '+(copied?"Caption copied to clipboard.":"Caption below.")+
        '<textarea class="pbcap" readonly rows="6">'+esc(cap)+'</textarea>'+
        '<span class="pbleft">'+(pool.length-1)+' charted terms left to post</span>';
    }).catch(function(e){ out.textContent="Export failed: "+e.message; });
  };

  document.getElementById("pb-run").onclick=function(){
    var sec=document.getElementById("pb-sec").value;
    var preset=document.getElementById("pb-preset").value;
    var btn=this; btn.disabled=true;
    out.textContent="Building slides…";
    carousel(sec,preset,function(i,n,name){ out.textContent="Slide "+i+" of "+n+" — "+name; })
      .then(function(files){
        files.forEach(function(f,ix){
          setTimeout(function(){ window.tapeDownload(f.blob,f.name); }, ix*250);
        });
        out.innerHTML='<b>'+files.length+' slides</b> exported, numbered in order. '+
          'Your browser may ask to allow multiple downloads.';
        btn.disabled=false;
      }).catch(function(e){ out.textContent="Carousel failed: "+e.message; btn.disabled=false; });
  };
}
mount();
})();
</script>

<script>
/* ====================================================================
   PRINTABLE WORKBOOK — uses the existing print stylesheet, no library.
   ==================================================================== */
(function(){
if(typeof document==="undefined") return;
function mount(){
  var f=document.getElementById("foot");
  if(!f||document.getElementById("wbprint")) return;
  var b=document.createElement("button");
  b.id="wbprint"; b.type="button"; b.className="btn";
  b.textContent="Print / save as PDF";
  b.onclick=function(){
    document.body.classList.add("printing");
    var was=document.getElementById("panel-terms").hidden;
    document.getElementById("panel-terms").hidden=false;
    setTimeout(function(){
      window.print();
      document.body.classList.remove("printing");
      document.getElementById("panel-terms").hidden=was;
    },80);
  };
  var p=document.createElement("p");
  p.appendChild(b);
  f.appendChild(p);
}

<script>
/* ====================================================================
   TERM DETAIL PANEL
   Whole card opens a slide-in panel (full-screen sheet on mobile).
   Escape, the close button and the phone back button all dismiss it.
   #t=slug deep links open it directly.
   ==================================================================== */
(function(){
"use strict";
if(typeof document==="undefined") return;

var el=TAPE_NS.el, esc=TAPE_NS.esc, slugify=TAPE_NS.slug;
var MOTION=!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);

var D=window.D||[], CAT=window.CAT||[];
var BY={}, ORDER={};
D.forEach(function(x){ BY[x.slug]=x; });
CAT.forEach(function(c){ ORDER[c[0]]=D.filter(function(x){return x.c===c[0];}); });
function catName(c){for(var i=0;i<CAT.length;i++) if(CAT[i][0]===c) return CAT[i][1]; return c;}

/* ---------- shell ---------- */
var back=document.createElement("div");
back.id="tpback"; back.hidden=true;
var panel=document.createElement("aside");
panel.id="tpanel"; panel.hidden=true;
panel.setAttribute("role","dialog");
panel.setAttribute("aria-modal","true");
panel.setAttribute("aria-labelledby","tp-title");
panel.setAttribute("tabindex","-1");
document.body.appendChild(back);
document.body.appendChild(panel);

var current=null, lastFocus=null, pushed=false;

/* ---------- strategy matcher (term -> strategies) ---------- */
function strategiesFor(x){
  var lib=[];
  try{
    var raw=TAPE_NS.store.get(TAPE_NS.K.stratsTape)||TAPE_NS.store.get(TAPE_NS.K.strats);
    if(raw) lib=JSON.parse(raw)||[];
  }catch(e){ lib=[]; }
  if(!lib.length) return [];
  var needles=[x.t].concat(x.see||[]).concat(x.alt?String(x.alt).split(/\s+/):[]);
  needles=needles.map(function(n){return String(n).toLowerCase();}).filter(function(n){return n.length>3;});
  return lib.filter(function(s){
    if(s.archived) return false;
    var hay=[s.name,s.bias,s.entry,s.invalidation,s.target,s.riskNote,s.notes,(s.tags||[]).join(" ")]
      .join(" ").toLowerCase();
    return needles.some(function(n){ return hay.indexOf(n)>-1; });
  });
}

/* ---------- related terms ---------- */
function relatedFor(x){
  var out=[], seen={};
  (x.see||[]).forEach(function(n){ if(BY[slugify(n)]&&!seen[n]){seen[n]=1;out.push(n);} });
  (x.rel||[]).forEach(function(n){ if(BY[slugify(n)]&&!seen[n]&&out.length<10){seen[n]=1;out.push(n);} });
  return out;
}

function neighbours(x){
  var list=ORDER[x.c]||[];
  var i=list.indexOf(x);
  return {prev: i>0?list[i-1]:null, next: (i>-1&&i<list.length-1)?list[i+1]:null};
}

/* ---------- render ---------- */
function paras(t){
  return String(t).split(/\n\n+/).map(function(p){return "<p>"+esc(p)+"</p>";}).join("");
}

function render(x){
  current=x;
  var slug=x.slug;
  var srcEntry=el("term-"+slug);
  var figHtml="";
  if(srcEntry){
    var f=srcEntry.querySelector("figure");
    if(f) figHtml='<figure class="tpfig">'+f.innerHTML.replace(/<div class="expbar"[\s\S]*?<\/div>/,"")+'</figure>';
  }
  var extra="";
  if(x.viz2&&x.viz2.length&&window.svgFor){
    extra=x.viz2.map(function(v){
      return '<figure class="tpfig">'+window.svgFor(v.v||v)+(v.cap?'<figcaption>'+esc(v.cap)+'</figcaption>':'')+'</figure>';
    }).join("");
  }

  var strats=strategiesFor(x);
  var stratHtml;
  if(strats.length){
    stratHtml=strats.map(function(s){
      var n=(s.trades&&s.trades.length)||s.sampleSize||0;
      return '<button class="tpstrat" data-strat="'+esc(s.name)+'">'+
        '<span class="tpsname">'+esc(s.name)+'</span>'+
        '<span class="tpsbadge ev-'+esc(s.evidence||"untested")+'">'+esc(s.evidence||"untested")+' · n='+n+'</span>'+
        '</button>';
    }).join("");
  }else{
    stratHtml='<p class="tpnone">No strategy in your library mentions this yet.</p>'+
      '<button class="btn" id="tp-addstrat">Add a strategy tagged “'+esc(x.t)+'”</button>';
  }

  var rel=relatedFor(x);
  var nb=neighbours(x);

  panel.innerHTML=
   '<header class="tphead">'+
     '<div class="tpmeta"><span class="tpsec">'+esc(catName(x.c))+'</span>'+
       (x.lvl?'<span class="lvpip lv'+x.lvl+'">'+(x.lvl===1?"Core":x.lvl===3?"Advanced":"Building")+'</span>':'')+'</div>'+
     '<h2 id="tp-title">'+esc(x.t)+'</h2>'+
     '<div class="tpacts">'+
       '<button class="btn" id="tp-star" aria-pressed="false">☆ Save</button>'+
       '<button class="btn" id="tp-copy">Copy link</button>'+
       '<button class="btn" id="tp-quiz">Test me on this</button>'+
     '</div>'+
     '<button class="tpclose" id="tp-close" aria-label="Close">×</button>'+
   '</header>'+
   '<div class="tpbody">'+
     '<p class="tpdef">'+esc(x.d)+'</p>'+
     (x.long?'<div class="tplong">'+paras(x.long)+'</div>'
            :'<p class="tpstub">A longer write-up for this term hasn’t been written yet. '+
             'The definition and example above are complete; the expanded explanation is being added term by term.</p>')+
     (x.e?'<div class="tpex'+(x.warn?" warn":"")+'"><span class="tplabel">'+(x.warn?"Careful":"Example")+'</span><p>'+esc(x.e)+'</p></div>':'')+
     figHtml+extra+
     (x.usage?'<section class="tpsect"><h3>How it’s typically used</h3><p>'+esc(x.usage)+'</p></section>':'')+
     '<section class="tpsect"><h3>Used in these strategies</h3>'+stratHtml+'</section>'+
     (rel.length?'<section class="tpsect"><h3>Related</h3><div class="tprel">'+
        rel.map(function(n){return '<button class="tag link" data-goterm="'+esc(slugify(n))+'">'+esc(n)+'</button>';}).join("")+
        '</div></section>':'')+
   '</div>'+
   '<footer class="tpnav">'+
     '<button class="btn" id="tp-prev"'+(nb.prev?'':' disabled')+'>← '+(nb.prev?esc(nb.prev.t):"Start")+'</button>'+
     '<button class="btn" id="tp-next"'+(nb.next?'':' disabled')+'>'+(nb.next?esc(nb.next.t):"End")+' →</button>'+
   '</footer>';

  /* star shares state with the card */
  var star=el("tp-star");
  var cardStar=srcEntry?srcEntry.querySelector(".star"):null;
  function paintStar(){
    var on=cardStar&&cardStar.classList.contains("on");
    star.textContent=on?"★ Saved":"☆ Save";
    star.setAttribute("aria-pressed",on?"true":"false");
  }
  paintStar();
  star.onclick=function(){ if(cardStar){cardStar.click(); paintStar();} };

  el("tp-close").onclick=function(){ close(); };
  el("tp-copy").onclick=function(){
    var url=location.origin+location.pathname+"#t="+slug;
    try{ if(navigator.clipboard) navigator.clipboard.writeText(url); }catch(e){}
    if(TAPE_NS.toast) TAPE_NS.toast("Link copied");
  };
  el("tp-quiz").onclick=function(){
    close();
    var tq=el("tab-quiz"); if(tq) tq.click();
    var sel=el("q-cat"); if(sel){ sel.value=x.c; sel.dispatchEvent(new Event("change")); }
  };
  if(el("tp-addstrat")) el("tp-addstrat").onclick=function(){
    close();
    var ts=el("tab-strats"); if(ts) ts.click();
    var add=el("b-add"); if(add) add.click();
    setTimeout(function(){ var tg=el("f-tags"); if(tg) tg.value=x.t.toLowerCase(); var nm=el("f-name"); if(nm) nm.focus(); },30);
  };
  if(nb.prev) el("tp-prev").onclick=function(){ open(slugify(nb.prev.t),true); };
  if(nb.next) el("tp-next").onclick=function(){ open(slugify(nb.next.t),true); };

  panel.querySelectorAll("[data-goterm]").forEach(function(b){
    b.onclick=function(){ open(b.dataset.goterm,true); };
  });
  panel.querySelectorAll("[data-strat]").forEach(function(b){
    b.onclick=function(){
      close();
      var ts=el("tab-strats"); if(ts) ts.click();
      var sq=el("sq"); if(sq){ sq.value=b.dataset.strat; sq.dispatchEvent(new Event("input")); }
    };
  });
  panel.dataset.term=x.slug;
  panel.scrollTop=0;
}

/* ---------- open / close ---------- */
function open(slug,replace){
  var x=BY[slug];
  if(!x) return false;
  if(!panel.hidden && replace){ render(x); try{history.replaceState({tp:slug},"","#t="+slug);}catch(e){} return true; }
  lastFocus=document.activeElement;
  render(x);
  back.hidden=false; panel.hidden=false;
  document.body.classList.add("tpopen");
  if(MOTION){ panel.classList.remove("in"); void panel.offsetWidth; panel.classList.add("in"); }
  try{ history.pushState({tp:slug},"","#t="+slug); pushed=true; }catch(e){}
  panel.focus();
  return true;
}
function close(fromPop){
  if(panel.hidden) return;
  panel.hidden=true; back.hidden=true;
  document.body.classList.remove("tpopen");
  current=null;
  if(!fromPop && pushed){ pushed=false; try{ history.back(); }catch(e){} }
  if(lastFocus&&lastFocus.focus){ try{lastFocus.focus();}catch(e){} }
}

back.onclick=function(){ close(); };
document.addEventListener("keydown",function(e){
  if(panel.hidden) return;
  if(e.key==="Escape"){ e.preventDefault(); close(); return; }
  if(e.key==="ArrowLeft"&&el("tp-prev")&&!el("tp-prev").disabled) el("tp-prev").click();
  if(e.key==="ArrowRight"&&el("tp-next")&&!el("tp-next").disabled) el("tp-next").click();
  /* focus trap */
  if(e.key==="Tab"){
    var f=panel.querySelectorAll('button:not([disabled]),[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
    if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
window.addEventListener("popstate",function(ev){
  var st=ev.state;
  if(st&&st.tp){ pushed=false; open(st.tp,true); pushed=true; }
  else { pushed=false; close(true); }
});

/* ---------- card click ---------- */
var grid=document.getElementById("grid");
if(grid){
  grid.addEventListener("click",function(e){
    if(e.target.closest("button")||e.target.closest("a")) return;
    var card=e.target.closest(".entry");
    if(!card||!card.dataset.slug) return;
    open(card.dataset.slug);
  });
  grid.querySelectorAll(".entry").forEach(function(c){
    c.setAttribute("tabindex","0");
    c.setAttribute("role","button");
    c.setAttribute("aria-label","Open details for "+(c.dataset.slug||"term"));
  });
  grid.addEventListener("keydown",function(e){
    if(e.key!=="Enter"&&e.key!==" ") return;
    var card=e.target.closest?e.target.closest(".entry"):null;
    if(!card||e.target.closest("button")) return;
    e.preventDefault(); open(card.dataset.slug);
  });
}

/* ---------- deep link ---------- */
(function(){
  var m=/^#t=(.+)$/.exec(location.hash||"");
  if(m) setTimeout(function(){ open(decodeURIComponent(m[1])); },60);
})();
})();
</script>

<script>
/* ====================================================================
   WALKTHROUGHS — the honest version of "video"
   Replays a chart bar by bar with a caption per step, using the chart
   engine that is already here. No embeds, no network, works offline,
   and it teaches the thing a static picture cannot: the ORDER events
   happen in. Most patterns are only ambiguous live because you cannot
   see the next bar — stepping forward one at a time reproduces that.
   ==================================================================== */
(function(){
"use strict";
if(typeof document==="undefined") return;

var MOTION=!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* Step captions. Written per term so each step says what actually
   changed, not "candle 4". Terms without an entry still get a
   walkthrough — the steps are just unlabelled. */
var STEPS={
"Liquidity sweep":[
 "A prior high forms. Nothing special yet — this is just where price turned.",
 "Price pulls back. The high is now a level other people can see.",
 "It approaches again. Stop orders from short positions are resting above it.",
 "Price trades THROUGH the high. Live, this is indistinguishable from a breakout.",
 "It closes back below. Only now is it a sweep — the reclaim is the event, not the poke.",
 "Continuation lower. Everything above was fuel, not demand."],
"Spring":[
 "A trading range establishes a floor.",
 "Price works sideways. Sellers are being absorbed, though you cannot see by whom.",
 "It drops through the floor. This looks like a breakdown and may be one.",
 "It closes back inside the range. Wyckoff called this a spring; modern material calls it a sweep of the low.",
 "The advance begins from the reclaim, not from the low."],
"Fair value gap":[
 "First candle. Note where its high sits.",
 "A large candle moves through fast — one side is aggressive enough that levels get skipped.",
 "Third candle. Its low is above the first candle's high, so that band was never traded two ways.",
 "The gap is the untouched band between them. Nothing about it says price must return.",
 "Price returns and trades through it. Common — but 'common' is not the same as 'tradeable after costs'."],
"Bullish engulfing":[
 "A down candle. Sellers had the period.",
 "The next candle opens lower — still no reason to act.",
 "It closes above the previous open, covering the whole body.",
 "That is the pattern. What it means depends entirely on where it happened."],
"Consolidation":[
 "A wide swing. Volatility is high.",
 "The next swing is smaller. The range is contracting.",
 "Smaller again. Bar ranges are narrowing measurably, not just visually.",
 "The coil tightens. This says an expansion is likely and says nothing about direction.",
 "Expansion. It resolved — which way was not knowable from the coil."],
"Break of structure":[
 "A swing high forms. Where exactly depends on your swing lookback.",
 "Price pulls back and makes a higher low.",
 "It pushes into the prior high.",
 "It CLOSES beyond it. A wick through would not count under this definition.",
 "The trend is confirmed by the definition — which is a rule you chose, not a fact about the market."],
"Drawdown":[
 "The equity curve rises. This is the part people plan for.",
 "A peak. From here every point down is drawdown.",
 "It falls. Nothing is broken yet; this is normal.",
 "It keeps falling. This is where most people abandon a system that was fine.",
 "The trough — the maximum drawdown is measured to here.",
 "Recovery. Note it takes longer to climb out than it took to fall in."],
"Accumulation":[
 "A decline into the area.",
 "Selling stops making lower lows. Price goes sideways.",
 "Range-bound. Supply is being absorbed — dull by design, because that is what patient buying looks like.",
 "A dip below the range that recovers: the spring.",
 "Markup. The trend that follows started back in the boring part, not at the breakout."],
"Distribution":[
 "An advance into the area.",
 "Higher highs stop. Rallies begin failing at a similar level.",
 "Range-bound near the top, while sentiment is usually at its most positive.",
 "A push above the range that fails — the upthrust.",
 "Markdown. Recognising this live means fighting a market that still looks strong."]
};

/* Build a spec showing only the first n candles, with annotations that
   reference later bars filtered out so nothing dangles. */
function truncate(v,n){
  var out={k:"c",d:v.d.slice(0,n)};
  if(v.hl) out.hl=v.hl;
  if(v.bx) out.bx=v.bx.filter(function(b){return b.i1<n;});
  if(v.mk) out.mk=v.mk.filter(function(m){return m.i<n;});
  if(v.pl) out.pl=v.pl.map(function(p){
    return {pts:p.pts.filter(function(pt){return pt[0]<n;}),c:p.c};
  }).filter(function(p){return p.pts.length>1;});
  return out;
}
function truncateEquity(v,n){
  var out={k:"e",base:v.base,s:(v.s||[]).map(function(s){
    return {v:s.v.slice(0,n),c:s.c,t:s.t,below:s.below};
  })};
  if(v.mk) out.mk=v.mk.filter(function(m){return m.i<n;});
  return out;
}

function frames(v){
  if(v.k==="c") return v.d.length;
  if(v.k==="e") return (v.s&&v.s[0]&&v.s[0].v.length)||0;
  return 0;
}

function mount(host,term,v){
  var total=frames(v);
  if(total<3) return null;
  var steps=STEPS[term]||null;
  var i=total;             /* start fully drawn */
  var timer=null;

  var box=document.createElement("div");
  box.className="wkbox";
  box.innerHTML='<div class="wkstage"></div>'+
    '<p class="wkcap" aria-live="polite"></p>'+
    '<div class="wkctl">'+
      '<button class="btn" data-w="restart" aria-label="Restart walkthrough">⟲</button>'+
      '<button class="btn" data-w="prev" aria-label="Previous step">◀</button>'+
      '<button class="btn pri" data-w="play" aria-label="Play walkthrough">▶ Walk through</button>'+
      '<button class="btn" data-w="next" aria-label="Next step">▶</button>'+
      '<span class="wkcount"></span>'+
    '</div>';
  host.appendChild(box);

  var stage=box.querySelector(".wkstage");
  var cap=box.querySelector(".wkcap");
  var count=box.querySelector(".wkcount");

  function draw(){
    var spec = v.k==="e" ? truncateEquity(v,i) : truncate(v,i);
    stage.innerHTML=window.svgFor(spec);
    count.textContent=i+" / "+total;
    if(steps){
      var si=Math.min(Math.max(i-1,0),steps.length-1);
      cap.textContent = i>=1 ? steps[si] : "";
      cap.hidden=false;
    }else{
      cap.hidden=true;
    }
    box.querySelector('[data-w="prev"]').disabled = i<=1;
    box.querySelector('[data-w="next"]').disabled = i>=total;
  }
  function stop(){
    if(timer){clearInterval(timer);timer=null;}
    box.querySelector('[data-w="play"]').textContent="▶ Walk through";
  }
  function play(){
    if(timer){stop();return;}
    if(i>=total) i=0;
    box.querySelector('[data-w="play"]').textContent="❚❚ Pause";
    timer=setInterval(function(){
      if(i>=total){ stop(); return; }
      i++; draw();
    }, MOTION?1100:1);
    if(!MOTION){ i=total; draw(); stop(); }
  }
  box.addEventListener("click",function(e){
    var b=e.target.closest("[data-w]");
    if(!b) return;
    e.stopPropagation();
    var a=b.dataset.w;
    if(a==="play") play();
    else { stop();
      if(a==="restart") i=1;
      if(a==="prev"&&i>1) i--;
      if(a==="next"&&i<total) i++;
      draw();
    }
  });
  draw();
  return {stop:stop};
}

/* attach inside the detail panel whenever it renders a charted term */
var active=null;
function attach(){
  var panel=document.getElementById("tpanel");
  if(!panel||panel.hidden) return;
  if(panel.querySelector(".wkbox")) return;
  /* Match on the slug the panel records, not on its heading text: two terms
     share a name, so the text lookup found the wrong one for those two. */
  var D=window.D||[], want=panel.dataset.term||"";
  var x=null;
  for(var k=0;k<D.length;k++) if(D[k].slug===want){x=D[k];break;}
  if(!x||!x.v||(x.v.k!=="c"&&x.v.k!=="e")) return;
  var term=x.t;
  if(!window.svgFor) return;
  var fig=panel.querySelector(".tpfig");
  var host=document.createElement("section");
  host.className="tpsect wksect";
  host.innerHTML='<h3>Walk through it</h3>'+
    '<p class="wknote">Step forward one bar at a time. Live you only ever see the left-hand side.</p>';
  if(fig&&fig.parentNode) fig.parentNode.insertBefore(host,fig.nextSibling);
  else panel.querySelector(".tpbody").appendChild(host);
  if(active&&active.stop) active.stop();
  active=mount(host,term,x.v);
}

/* the panel rewrites its own innerHTML, so watch for changes */
var mo=new MutationObserver(function(){ setTimeout(attach,0); });
var p=document.getElementById("tpanel");
if(p) mo.observe(p,{childList:true});

/* count how many terms can be walked, for the tests */
window.__walkable=(window.D||[]).filter(function(x){
  return x.v&&(x.v.k==="c"||x.v.k==="e")&&frames(x.v)>=3;
}).length;
window.__walkCaptioned=Object.keys(STEPS).length;
})();
</script>

<script>
/* ====================================================================
   SEED LOADER
   Copies TAPE_SEED into the saved library, skipping anything already
   there. TAPE_SEED is empty by design, so today this adds nothing — the
   loader stays because the rule it enforces is the point of it: a seeded
   strategy always arrives untested, at sample size 0.
   ==================================================================== */
(function(){
"use strict";
if(typeof document==="undefined") return;

var el=TAPE_NS.el;
var KEY=TAPE_NS.K.stratsTape, OLD=TAPE_NS.K.strats;

function read(){
  var raw=TAPE_NS.store.get(KEY)||TAPE_NS.store.get(OLD);
  try{ return raw?(JSON.parse(raw)||[]):[]; }catch(e){ return []; }
}
function write(a){ TAPE_NS.store.setJson(KEY,a); }

function loadSeed(){
  var lib=read();
  var have={};
  lib.forEach(function(s){ have[String(s.name).toLowerCase()]=1; });
  var added=0;
  (window.TAPE_SEED||[]).forEach(function(s){
    if(have[String(s.name).toLowerCase()]) return;
    var copy=JSON.parse(JSON.stringify(s));
    copy.trades=[];
    copy.added=new Date().toISOString().slice(0,10);
    /* belt and braces: the evidence model must never be bypassed by a seed */
    if(!copy.trades.length && copy.evidence!=="untested"){ copy.evidence="untested"; copy.sampleSize=0; }
    lib.push(copy);
    added++;
  });
  write(lib);
  return added;
}
window.__loadSeed=loadSeed;

function mount(){
  var t=document.getElementById("stools");
  if(!t||el("b-seed")) return;
  /* starter-library button removed with the seed data it loaded */
}
var ts=el("tab-strats");
if(ts) ts.addEventListener("click",function(){ setTimeout(mount,0); });
mount();
})();
</script>

<script>
/* ====================================================================
   STATEMENT IMPORT
   Reads a trade history CSV exported from a broker, a prop firm
   dashboard or TradingView and turns it into real stats.

   Deliberately NOT an API connection. A key stored in a browser app
   that ships by share link is a key you have given away, and prop-firm
   paper APIs sit behind the same credentials as the live account.
   A CSV has no such problem, works offline, and covers venues no free
   API reaches.

   Nothing here is uploaded. The file is read with FileReader and never
   leaves the machine.
   ==================================================================== */
(function(){
"use strict";
if(typeof document==="undefined") return;

var el=TAPE_NS.el, esc=TAPE_NS.esc;

/* ---------- CSV parsing that survives quoted fields ---------- */
function parseCsv(text){
  var rows=[],row=[],cur="",q=false,i;
  text=String(text).replace(/^﻿/,"");
  for(i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===","){ row.push(cur); cur=""; }
      else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch==="\r"){ /* skip */ }
      else cur+=ch;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){return String(c).trim()!==""; }); });
}

/* ---------- column detection across broker dialects ---------- */
var FIELD_HINTS={
  symbol:  ["symbol","instrument","contract","market","ticker","product","asset"],
  side:    ["side","direction","type","b/s","buy/sell","action","position"],
  qty:     ["qty","quantity","size","volume","contracts","lots","units","filled"],
  entry:   ["entry","entryprice","openprice","avgentry","priceopen","open","buyprice","fillprice"],
  exit:    ["exit","exitprice","closeprice","avgexit","priceclose","close","sellprice"],
  pnl:     ["pnl","p/l","profit","netpnl","realized","realised","gross","net","result","profitloss"],
  opened:  ["opened","opentime","entrytime","datetime","date","opendate","time","tradedate"],
  closed:  ["closed","closetime","exittime","closedate"],
  fees:    ["commission","fees","fee","charges","costs"]
};
function norm(h){ return String(h).toLowerCase().replace(/[^a-z/]/g,""); }
function detect(header){
  var map={};
  header.forEach(function(h,idx){
    var n=norm(h);
    Object.keys(FIELD_HINTS).forEach(function(f){
      if(map[f]!==undefined) return;
      if(FIELD_HINTS[f].some(function(hint){ return n===hint||n.indexOf(hint)>-1; })) map[f]=idx;
    });
  });
  return map;
}
function num(v){
  if(v==null) return NaN;
  var s=String(v).replace(/[()]/g,function(m){return m==="("?"-":"";}).replace(/[^0-9.\-]/g,"");
  var n=parseFloat(s);
  /* accounting negatives: (12.50) means -12.50 */
  if(/^\(.*\)$/.test(String(v).trim())) n=-Math.abs(n);
  return n;
}

function toTrades(rows){
  if(rows.length<2) return {trades:[],map:{},skipped:0};
  var header=rows[0], map=detect(header), out=[], skipped=0;
  rows.slice(1).forEach(function(r){
    var t={};
    if(map.symbol!==undefined) t.symbol=String(r[map.symbol]||"").trim();
    if(map.side!==undefined){
      var sv=String(r[map.side]||"").toLowerCase();
      t.dir=/sell|short|s\b/.test(sv)?"short":"long";
    }
    if(map.qty!==undefined) t.qty=num(r[map.qty]);
    if(map.entry!==undefined) t.entry=num(r[map.entry]);
    if(map.exit!==undefined) t.exit=num(r[map.exit]);
    if(map.fees!==undefined) t.fees=num(r[map.fees]);
    if(map.opened!==undefined) t.opened=String(r[map.opened]||"").trim();
    if(map.closed!==undefined) t.closed=String(r[map.closed]||"").trim();

    var p = map.pnl!==undefined ? num(r[map.pnl]) : NaN;
    if(!isFinite(p) && isFinite(t.entry) && isFinite(t.exit) && isFinite(t.qty)){
      p = (t.dir==="short" ? (t.entry-t.exit) : (t.exit-t.entry)) * t.qty;
    }
    if(isFinite(t.fees)) p = p - Math.abs(t.fees);
    if(!isFinite(p)){ skipped++; return; }
    t.pnl=p;
    out.push(t);
  });
  return {trades:out,map:map,skipped:skipped};
}

/* ---------- stats, reusing the vocabulary the app already teaches ---------- */
function stats(trades){
  var n=trades.length;
  if(!n) return null;
  var wins=trades.filter(function(t){return t.pnl>0;});
  var losses=trades.filter(function(t){return t.pnl<0;});
  var gross=wins.reduce(function(a,t){return a+t.pnl;},0);
  var grossLoss=Math.abs(losses.reduce(function(a,t){return a+t.pnl;},0));
  var net=trades.reduce(function(a,t){return a+t.pnl;},0);
  var avgWin=wins.length?gross/wins.length:0;
  var avgLoss=losses.length?grossLoss/losses.length:0;
  var eq=[],run=0,peak=0,dd=0;
  trades.forEach(function(t){
    run+=t.pnl; eq.push(run);
    if(run>peak) peak=run;
    if(peak-run>dd) dd=peak-run;
  });
  /* Wilson interval on the win rate — the same honesty the trade log uses */
  var p=wins.length/n, z=1.96;
  var den=1+z*z/n;
  var centre=(p+z*z/(2*n))/den;
  var half=(z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n)))/den;
  return {
    n:n, wins:wins.length, losses:losses.length,
    winRate:p*100, ciLow:Math.max(0,(centre-half)*100), ciHigh:Math.min(100,(centre+half)*100),
    net:net, expectancy:net/n, avgWin:avgWin, avgLoss:avgLoss,
    payoff:avgLoss?avgWin/avgLoss:Infinity,
    profitFactor:grossLoss?gross/grossLoss:Infinity,
    maxDrawdown:dd, equity:eq
  };
}

function money(v){
  var a=Math.abs(v);
  return (v<0?"-":"")+"$"+a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

function equitySpec(eq){
  var step=Math.max(1,Math.ceil(eq.length/40));
  var pts=[];
  for(var i=0;i<eq.length;i+=step) pts.push(eq[i]);
  if(pts[pts.length-1]!==eq[eq.length-1]) pts.push(eq[eq.length-1]);
  return {k:"e",base:0,s:[{v:pts,c:pts[pts.length-1]>=0?"u":"d",t:"cumulative P&L"}]};
}

function report(s,fileName,skipped,map){
  var found=Object.keys(map).filter(function(k){return map[k]!==undefined;});
  var chart="";
  try{ if(window.svgFor) chart='<figure class="impfig">'+window.svgFor(equitySpec(s.equity))+
    '<figcaption>Cumulative P&L across '+s.n+' imported trades, in order.</figcaption></figure>'; }catch(e){}

  var flags=[];
  if(s.n<30) flags.push("Fewer than 30 trades. Treat every number here as provisional — the confidence interval below shows how wide the uncertainty still is.");
  if(s.profitFactor>3&&s.n<100) flags.push("A profit factor above 3 on a small sample usually means a short favourable stretch, not an edge.");
  if(map.fees===undefined) flags.push("No commission column was found, so these figures are gross. Real costs will be worse.");

  return '<div class="impcard">'+
    '<div class="imphead"><h3>'+esc(fileName)+'</h3>'+
      '<span class="impmeta">'+s.n+' trades · columns matched: '+esc(found.join(", "))+
      (skipped?' · '+skipped+' rows skipped':'')+'</span></div>'+
    chart+
    '<div class="impgrid">'+
      '<div class="impstat"><span class="impk">Net</span><span class="impv '+(s.net>=0?"up":"down")+'">'+money(s.net)+'</span></div>'+
      '<div class="impstat"><span class="impk">Expectancy / trade</span><span class="impv '+(s.expectancy>=0?"up":"down")+'">'+money(s.expectancy)+'</span></div>'+
      '<div class="impstat"><span class="impk">Win rate</span><span class="impv">'+s.winRate.toFixed(1)+'%</span>'+
        '<span class="impsub">95% CI '+s.ciLow.toFixed(0)+'–'+s.ciHigh.toFixed(0)+'%</span></div>'+
      '<div class="impstat"><span class="impk">Payoff ratio</span><span class="impv">'+(isFinite(s.payoff)?s.payoff.toFixed(2):"—")+'</span></div>'+
      '<div class="impstat"><span class="impk">Profit factor</span><span class="impv">'+(isFinite(s.profitFactor)?s.profitFactor.toFixed(2):"—")+'</span></div>'+
      '<div class="impstat"><span class="impk">Max drawdown</span><span class="impv down">'+money(-s.maxDrawdown)+'</span></div>'+
      '<div class="impstat"><span class="impk">Avg win</span><span class="impv">'+money(s.avgWin)+'</span></div>'+
      '<div class="impstat"><span class="impk">Avg loss</span><span class="impv">'+money(-s.avgLoss)+'</span></div>'+
    '</div>'+
    (flags.length?'<ul class="impflags">'+flags.map(function(f){return "<li>"+esc(f)+"</li>";}).join("")+'</ul>':'')+
    '<p class="impnote">Win rate never means anything on its own — read it beside the payoff ratio and the expectancy. '+
    'This file was read in your browser and was not uploaded anywhere.</p>'+
    '</div>';
}

window.__parseStatement=function(text,name){
  var res=toTrades(parseCsv(text));
  var s=stats(res.trades);
  return {stats:s,skipped:res.skipped,map:res.map,trades:res.trades};
};

/* ---------- UI ---------- */
function mount(){
  var host=document.getElementById("panel-strats");
  if(!host||el("impbox")) return;
  var box=document.createElement("div");
  box.id="impbox"; box.className="wrap";
  box.innerHTML='<details id="impdet"><summary>Import a statement — see your real stats</summary>'+
    '<div class="impbody">'+
      '<p class="impintro">Export your trade history as CSV from your broker, prop dashboard or TradingView and drop it here. '+
      'No account linking, no API key, nothing uploaded — the file is read in this browser and stays on your machine.</p>'+
      '<div id="impdrop" class="impdrop" tabindex="0" role="button" aria-label="Choose or drop a CSV statement">'+
        'Drop a CSV here, or click to choose'+
      '</div>'+
      '<input type="file" id="impfile" accept=".csv,text/csv" class="sr-only" aria-label="Choose a CSV statement to import">'+
      '<div id="impout"></div>'+
    '</div></details>';
  host.insertBefore(box,host.firstChild);

  var drop=el("impdrop"), file=el("impfile"), out=el("impout");

  function handle(f){
    if(!f) return;
    if(!/\.csv$/i.test(f.name)&&f.type!=="text/csv"){
      out.innerHTML='<p class="imperr">That doesn’t look like a CSV. Export your trade history as CSV and try again.</p>';
      return;
    }
    var r=new FileReader();
    r.onload=function(){
      try{
        var res=window.__parseStatement(String(r.result),f.name);
        if(!res.stats){
          out.innerHTML='<p class="imperr">No trades could be read from that file. '+
            'It needs a header row and either a profit/loss column, or entry, exit and quantity columns.</p>';
          return;
        }
        out.innerHTML=report(res.stats,f.name,res.skipped,res.map);
        if(TAPE_NS.toast) TAPE_NS.toast("Read "+res.stats.n+" trades");
      }catch(e){
        out.innerHTML='<p class="imperr">Could not read that file: '+esc(e.message)+'</p>';
      }
    };
    r.onerror=function(){ out.innerHTML='<p class="imperr">The file could not be read.</p>'; };
    r.readAsText(f);
  }

  drop.onclick=function(){ file.click(); };
  drop.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); file.click(); } };
  file.onchange=function(){ handle(file.files&&file.files[0]); };
  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop",function(e){
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    handle(f);
  });
}
var ts=el("tab-strats");
if(ts) ts.addEventListener("click",function(){ setTimeout(mount,0); });
mount();
})();
</script>
