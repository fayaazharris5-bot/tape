long:"The gambler's fallacy is the belief that independent events keep score \u2014 that after five losses a win is due, that a streak stretches probability like a spring storing force. Independent trials store nothing: the coin does not remember, and if trades are independent, neither does the market remember your last five stops.\n\nIn trading the fallacy's expensive form is streak-sizing: increasing risk after losses on the logic that the odds have ripened. This is martingale's reasoning, and it compounds a psychological error with the recovery arithmetic \u2014 bigger bets on an unchanged edge at exactly the moment the account can least fund them. The mirror error also exists: cutting size after wins because a loss feels due, which starves the strategy during exactly the streaks that pay for it.\n\nA subtlety keeps the fallacy alive in markets: trades are not always independent \u2014 regimes exist, and a clustered run of losses can genuinely signal changed conditions. The honest response to that suspicion is analysis of the conditions, not arithmetic superstition about the streak itself.\n\nWhere people get fooled: by the word due. Nothing in an independent sequence is ever due; anything that truly is due implies a dependency worth naming and testing, not betting on by feel.",
usage:"Handled by fixing size as a function of account and stop distance only \u2014 never of the recent streak \u2014 and by treating streak-triggered suspicions as research questions for the log rather than sizing decisions at the screen.",
see:["Martingale", "Recency bias", "Sequence risk", "Risk per trade"]},

"Hindsight bias":{
long:"Hindsight bias is the past rearranging itself into inevitability \u2014 once an outcome is known, the path to it looks obvious, and you misremember having seen it coming. Charts are the perfect medium for the effect: every completed move displays its own explanation, every reversal sits at a level that now clearly mattered, and scrolling history is a museum of things you would surely have caught.\n\nThis single bias funds most of the confidence in pattern trading. Setups reviewed after completion enjoy the enormous advantage of the right-hand side being visible; live, at the hard right edge, the same setups are ambiguous in a way memory refuses to preserve. Bar-replay \u2014 stepping forward one candle at a time with the future hidden \u2014 reliably shocks people for exactly this reason, and it is the honest way to audit whether an edge is visible in real time or only in retrospect.\n\nThe bias also corrupts learning from losses: the exit that proved wrong becomes the mistake I knew better than, generating false lessons from decisions that were sound on the information available.\n\nWhere people get fooled: grading decisions by outcomes. A good decision can lose and a bad one can win; only the pre-trade record \u2014 the plan as written at the time \u2014 lets you review the decision you actually faced.",
usage:"Contained by contemporaneous records \u2014 theses and invalidations written before the outcome \u2014 and by practising on bar-replay rather than completed charts, where the walkthroughs in this app deliberately hide the right-hand side.",
see:["Trading journal", "Process vs outcome", "Confirmation bias", "Narrative fallacy"]},

"Process vs outcome":{
long:"Process versus outcome is the discipline of judging decisions by how they were made rather than by how they turned out. In any activity with luck in the loop, single outcomes are nearly silent about decision quality \u2014 a sound trade loses routinely, a reckless one wins often enough to teach the wrong lesson \u2014 and only over samples do the two measures converge.\n\nThe practical tool is the four-box grid: followed the plan and won, followed and lost, broke it and lost, broke it and won. The first two are both successes of process \u2014 the second merely cost money, which plans are allowed to do. The third is tuition with an obvious lesson. The fourth is the dangerous square: a rewarded violation, which reinforces exactly the behaviour that will eventually do real damage, wearing the costume of a win.\n\nWithout this frame, review collapses into results-worship, and results-worship optimises for whatever won recently \u2014 which in a noisy environment means optimising for noise.\n\nWhere people get fooled: paying lip service to process until the money diverges from it. A losing month of correct decisions feels intolerable, and abandoning good process mid-variance is how sound strategies get discarded at their statistical low.",
usage:"Applied through the journal's plan-followed column: weekly review grades every trade into the four boxes, celebrates disciplined losses, and treats rewarded violations as the most urgent entries on the page.",
see:["Trading journal", "Discipline", "Variance tolerance", "Hindsight bias"]},

"Anchoring":{
long:"Anchoring is judgement gravitating toward an arbitrary reference number. Once a figure is in view \u2014 your entry price, the recent high, a round number, an analyst target \u2014 estimates and decisions form relative to it, even when it carries no information about value.\n\nA trader's most magnetic anchor is their own entry. It defines breakeven, and breakeven becomes a destination: losers are held until price returns to it, winners are exited at it after a retrace, orders cluster around it \u2014 all treating a coordinate of personal history as a fact about the market. The market has never seen your fill.\n\nOld extremes anchor analysis the same way: a stock feels cheap because it once traded higher, an index feels stretched because the number is unfamiliar. Neither the past print nor the round figure obligates anything, though round numbers do earn a footnote \u2014 enough participants anchor on them that order flow genuinely clusters there, making them anchors with real consequences rather than real meaning.\n\nWhere people get fooled: mistaking the anchor's emotional pull for analysis. If a level matters, the reasons should survive being stated without reference to where you personally entered or what price used to be.",
usage:"Countered by re-deriving levels from current structure at each review, and by the fresh-eyes test: any decision that changes when you imagine a different entry price was anchored, not analysed.",
see:["Sunk cost fallacy", "Round numbers", "Disposition effect", "Support / resistance"]},

"Disposition effect":{
long:"The disposition effect is the documented tendency of investors to sell winners too early and hold losers too long \u2014 loss aversion expressed as a portfolio. Named by Shefrin and Statman and measured at scale in brokerage records, most famously by Terrance Odean, it is among the most replicated findings in behavioural finance: across large samples, the positions people choose to realise are disproportionately their gains, while the losses ride.\n\nThe mechanism is the asymmetric ledger of feelings. Selling a winner banks pleasure and closes the risk of watching it evaporate; selling a loser converts a reversible discomfort into a permanent fact. Every incentive of the moment points the wrong way, which is why the pattern survives education, experience and intelligence \u2014 Odean's data showed the sold winners subsequently outperforming the held losers, meaning the instinct was not merely uncomfortable but expensively backwards.\n\nFor a strategy trader the effect is a direct expectancy tax: it truncates the right tail of the trade distribution and fattens the left one, degrading exactly the payoff ratio most systems depend on.\n\nWhere people get fooled: seeing the effect as other people's problem. It is measurable in your own log \u2014 compare average R of realised wins against realised losses versus what the plan specified.",
usage:"Audited from the trade log by comparing planned versus realised R on both sides, and suppressed structurally: exits by rule, stops resting at the exchange, targets that do not renegotiate on approach.",
see:["Loss aversion", "MAE / MFE", "Expectancy", "Anchoring"]},

"Pre-commitment":{
long:"Pre-commitment is binding your future self while your present self is still sane: making the decision now, attaching a mechanism now, so that the moment of temptation arrives to find the choice already made. Ulysses tied to the mast is the founding example \u2014 he did not resolve to resist the sirens; he arranged to be unable to obey them.\n\nIn trading it is the only psychological technique with a reliable track record, precisely because it does not depend on in-the-moment strength. Resting stops are pre-commitment against holding losers. Computed size is pre-commitment against conviction bets. Daily loss limits that lock the platform are pre-commitment against tilt. Written invalidations are pre-commitment against the story mutating mid-trade. In each case the design principle is identical: the rule executes without consulting you at the time.\n\nThe strength of a pre-commitment is measured by what it costs to override. A rule in your head costs nothing to break; a resting order requires deliberate cancellation; a broker-side limit requires a phone call. Friction is the active ingredient.\n\nWhere people get fooled: building overridable commitments and treating the overrides as exceptions. An exception repeated is the actual system; the written rule was decoration.",
usage:"Applied wherever the log shows in-the-moment decisions going bad: identify the recurring failure, move that decision backward in time, and attach the most friction you can tolerate to overriding it.",
see:["Discipline", "Stop loss", "Tilt", "Trading plan"]},

"Sleep and decision quality":{
long:"Sleep deprivation degrades exactly the faculties trading depends on: risk assessment skews optimistic, impulse control weakens, attention narrows and dips, and the deprived brain reliably rates its own performance as fine \u2014 impairment with a built-in blindness to itself. The cognitive literature puts moderate sleep loss in the same performance band as alcohol intoxication; no one would trade drunk on purpose.\n\nFor a trader in Perth this is not an abstract wellness note but a structural feature of the job. The New York session \u2014 where index futures do their real business \u2014 runs through the middle of the local night for most of the year. Every strategy built on those hours is, before any chart is considered, a strategy that requires its operator to be awake at 3am, and its true results include the errors that state produces: wider stops forgotten, sizes fat-fingered, tilt arriving faster and leaving later.\n\nThe honest accounting treats sleep as a risk parameter alongside size and stop distance. A sound system executed exhausted is a different, worse system.\n\nWhere people get fooled: crediting bad night-session results to the strategy and good ones to themselves, when the variable that actually changed was the operator.",
usage:"Treated as policy: either trade sessions compatible with sleep \u2014 the Asian session is the local afternoon \u2014 or automate the night hours, and log sleep state alongside trades so its cost shows up as data.",
see:["Screen time", "Tilt", "Discipline", "Asian range"]},

"Variance tolerance":{
long:"Variance tolerance is how much statistical noise you can live through without abandoning the plan \u2014 the psychological budget that decides whether a strategy's normal turbulence is survivable in your hands. It is personal, mostly fixed, and routinely overestimated by everyone who has not yet been tested.\n\nEvery strategy has a variance signature: win rate and payoff ratio jointly determine how long losing streaks run and how deep drawdowns cut in the ordinary course of working perfectly. A system that wins a third of its trades will produce eight losses in a row as routine arithmetic; a trader who abandons plans after five is incompatible with that system regardless of its expectancy. The mismatch, not the maths, is what fails.\n\nThis is why sizing to what you can sit through beats sizing to what the formulas permit. Kelly-adjacent calculations output the growth-optimal risk; they do not model you closing the platform in disgust at the bottom of a normal drawdown, which returns exactly nothing.\n\nWhere people get fooled: calibrating tolerance in imagination, where drawdowns are numbers. Lived drawdowns come with a doubting voice and a spouse and a run of nights; the backtest's worst stretch, experienced at full size, is the real entrance exam.",
usage:"Estimated honestly from the worst stretch actually endured, then respected: choose strategies whose losing-streak arithmetic fits inside it, and size so the projected drawdown lands within what you have survived before, not what you hope to.",
see:["Drawdown", "Risk per trade", "Process vs outcome", "Sequence risk"]},

"Quitting well":{
long:"Quitting well is ending \u2014 a strategy, a session, or trading altogether \u2014 as a decision made by criteria rather than a collapse made by exhaustion. It is the least discussed skill in the craft, because every incentive of the culture points toward persistence: the content economy sells never-quit, and sunk costs whisper that leaving now wastes everything spent.\n\nThe evidential frame cuts cleaner. A strategy is a hypothesis; a trading career is a portfolio of hypotheses; and hypotheses earn abandonment the same way they earn confidence \u2014 through the log. Deciding in advance what failure looks like (a drawdown depth, a trade count without edge, a time-underwater limit) converts quitting from an emotional surrender into the pre-registered outcome of a test. This project's own instruments work exactly that way: a well-supported no is a successful run, not a wasted one.\n\nThe same applies at career scale. A documented, honest record showing no edge after a fair sample is one of the most valuable objects a trader can own \u2014 it is the expensive lesson already paid for, and walking away with it intact is a profit in every currency except ego.\n\nWhere people get fooled: quitting badly instead \u2014 at the bottom of a normal drawdown, in disgust, with no record \u2014 which teaches nothing and usually precedes returning to repeat it.",
usage:"Arranged in advance like every other exit: written conditions under which the strategy, the session or the pursuit ends, reviewed on schedule, honoured like a stop \u2014 because that is what it is.",
see:["Null result", "Strategy retirement", "Sunk cost fallacy", "Pre-commitment"]},

"Buy-side / sell-side liquidity":{
long:"Buy-side liquidity is the pool of buy orders resting above price \u2014 mostly the stops of short positions and breakout entries above obvious highs. Sell-side liquidity is the mirror below: the stops of longs and sell entries under obvious lows. The naming trips almost everyone at first, because it labels the orders that will execute there, not the traders who put them there.\n\nThe mechanical content is solid. A stop order is a market order waiting for a trigger, so a shelf of them is stored aggression: price reaching the shelf sets it off, and the burst moves price further in that direction before anything else has a chance to respond. That much needs no framework \u2014 it is how stop orders work.\n\nThe framework's addition is directional intent: price is described as being drawn to one side's liquidity, engineered toward the resting orders. Whether or not that story is accepted, the practical reading is the same \u2014 obvious levels have consequences beyond them.\n\nWhere people get fooled: treating consumption of a pool as a signal by itself. The stops firing above a high are as consistent with a genuine breakout as with a sweep; which one it was is only visible in what price does after the pool is spent.",
usage:"Used to map where stops concentrate before a session \u2014 above equal highs, below clean lows \u2014 both to avoid resting your own stop inside the crowd and to expect acceleration rather than hesitation when those levels trade.",
see:["Liquidity pool", "Liquidity sweep", "Equal highs / equal lows", "Draw on liquidity"]},

"Breaker block":{
long:"A breaker block is an order block that failed and switched sides: the last down candle before a rally that was later violated, so that when price returns to it from below, the framework now reads it as resistance rather than support. It is the vocabulary's name for a familiar event \u2014 a zone that broke and is being retested from the other side.\n\nPlain technical analysis has described the same behaviour for a century as support-resistance polarity: a level that held buyers and then broke tends to matter again on the retest, partly because trapped positions from the failure exit at breakeven there, and partly because everyone watching drew the same line. The breaker adds a specific candle-based definition of the zone, which at least makes it drawable in advance.\n\nWhat it inherits from the order-block family is the same freedom problem: which candle qualifies, body or wick, how recent, and whether a second violation re-flips it are all choices, and every choice widens the space of after-the-fact fits.\n\nWhere people get fooled: stacking relabels. A level that fails as an order block becomes a breaker; if the breaker fails it can be relabelled again. A concept that survives its own failures by renaming them is not accumulating evidence.",
usage:"Used as a retest zone after a level fails \u2014 functionally the flip trade \u2014 with the candle definition fixed in advance and the count of failures tracked as honestly as the count of holds.",
see:["Order block", "Support / resistance", "Mitigation block", "Retest"]},

"Mitigation block":{
long:"A mitigation block is the framework's variant of an order block distinguished by the story attached to it: the zone where an institution supposedly exits a losing position at breakeven \u2014 mitigating the damage \u2014 rather than initiating a new one. On the chart it is drawn nearly identically to an order block or breaker; the difference is the narrative about whose orders sit there and why.\n\nThat is precisely its weakness. The distinguishing feature is not observable: candles do not record whether the participant transacting was opening, closing, hedging or mitigating anything. Two concepts that draw the same rectangle and differ only in imputed motive are one concept with two stories.\n\nThe salvageable observation is the one the whole family shares \u2014 areas price left quickly are often revisited, and trapped positions from a failed move do provide real exit flow near their entry prices. Breakeven exits by losers are a genuine mechanic; assigning them to a specific candle is the unsupported step.\n\nWhere people get fooled: precision theatre. Fine distinctions between block types feel like expertise, and the finer the taxonomy the more zones qualify somewhere, which raises the hit rate of hindsight while adding nothing testable in advance.",
usage:"Treated in practice as the same object as an order block or breaker: a candidate retest zone. If a distinction changes no rule \u2014 entry, invalidation or size \u2014 it is vocabulary, not information.",
see:["Order block", "Breaker block", "Reality check on this section", "Framework vs strategy"]},

"Dealing range":{
long:"A dealing range is the framework's working span: the distance between the most recent significant swept low and swept high, inside which current price action is read. Premium and discount are then measured against its midpoint \u2014 above halfway is expensive, below is cheap \u2014 and setups are graded by where in the range they occur.\n\nThe useful content is that it forces a stated frame of reference. Much loose chart-reading fails because the range being reasoned about silently shifts; fixing a low and a high and measuring everything against them is a discipline, whatever the vocabulary. The requirement that both ends be swept \u2014 that stops beyond each extreme have actually been taken \u2014 is the framework's way of selecting extremes that mattered, and it is at least an objective condition.\n\nThe fragility is the selection itself. Charts offer many candidate swings, and two practitioners will happily draw two different dealing ranges over the same prices, each validating their own bias. Every conclusion downstream \u2014 premium, discount, targets \u2014 inherits that choice.\n\nWhere people get fooled: redrawing the range after price escapes it, which converts every failure into the discovery that the real range was larger. A range that resizes to fit outcomes measures nothing.",
usage:"Used to anchor premium and discount: fix the swept extremes in advance, and if price leaves the range, record that the read was wrong rather than promoting a new range retroactively.",
see:["Premium / discount", "Liquidity sweep", "Equilibrium / 50% level", "Internal vs external liquidity"]},

"Unicorn model":{
long:"The unicorn model is a compound ICT setup requiring two of the framework's objects to overlap: a breaker block and a fair value gap occupying the same zone, with the confluence treated as unusually high-probability \u2014 hence the name.\n\nStacking conditions has a real statistical effect, just not the advertised one by default. Each added requirement makes qualifying events rarer, which guarantees a smaller sample; whether it also makes them better is exactly what a smaller sample is worse at demonstrating. A setup that fires eight times a year cannot distinguish skill from luck within any usable horizon, and its backtest is an anecdote collection.\n\nThere is also a selection subtlety: overlapping zones are more likely to be found where price has already reversed sharply \u2014 the conditions are partially consequences of the very moves they are credited with predicting, which inflates hindsight hit rates.\n\nWhere people get fooled: reading rarity as quality. The rarer the pattern, the more each remembered success dominates the impression of it, and the longer a losing stretch must run before anyone concludes anything. Rare setups are where confirmation bias lives most comfortably.",
usage:"If traded at all, logged with particular patience: the qualifying conditions written precisely, every occurrence recorded including the misses, and no conclusion drawn until the count \u2014 not the conviction \u2014 supports one.",
see:["Breaker block", "Fair value gap", "Sample size", "Unicorn model"]},

"Institutional order flow":{
long:"Institutional order flow is the aggregate buying and selling of large participants \u2014 and, in the framework's usage, the claim that its direction can be read from a candle chart and followed. The phrase does double duty, and the two duties deserve separating.\n\nAs a fact about markets: institutions dominate volume, execute through algorithms that slice orders across time to limit impact, and their footprints exist in venue-level data \u2014 auction imbalances, block prints, depth changes. Firms that see real order flow pay for that visibility, and reading it is a profession.\n\nAs a chart-reading claim: a daily or five-minute candle contains no field saying who traded. Inferring institutional intent from bar shapes is interpretation stacked on interpretation, and the framework's confidence in that inference is what the rest of this section's caveats attach to. Nothing about a strong green candle distinguishes a pension fund from a thousand retail entries or a short squeeze.\n\nWhere people get fooled: the vocabulary makes inference feel like observation. Saying institutions are accumulating here reads as data; it is a guess wearing data's clothes. The honest versions of this analysis price in their own uncertainty \u2014 the confident versions are the tell.",
usage:"Useful as a reminder of whose game the market mostly is; used honestly, claims about it are tagged as inference unless they come from actual order-flow data rather than candle shapes.",
see:["Smart money", "Order flow", "IPDA", "Reality check on this section"]},

"Framework vs strategy":{
long:"A framework is a way of describing markets; a strategy is a set of rules precise enough to be executed identically twice and therefore tested. The distinction sounds pedantic and is probably the most financially consequential idea in this section.\n\nA framework says: price seeks liquidity, sessions have character, structure breaks matter. It organises perception, supplies vocabulary, and can be genuinely useful for reading a chart quickly. But nothing in it states when to enter, where you are wrong, or how much to risk \u2014 so nothing in it can be right or wrong in a countable way. Frameworks are unfalsifiable by construction, which is why arguments about them never end.\n\nA strategy says: on this timeframe, when these named conditions occur, enter here, invalidate there, risk this. It can be logged, tested out of sample, and abandoned when the numbers say so. Converting a framework into a strategy is where most of its apparent wisdom evaporates \u2014 the conversion forces choices the framework left comfortably vague, and each choice can fail.\n\nWhere people get fooled: trading the framework directly \u2014 entering because the chart matches the story \u2014 and grading the results by feel. That combination produces conviction without evidence indefinitely.",
usage:"Used as a test to apply to any method you are handed, including everything in this glossary: if it cannot be written as rules a stranger could execute identically, it is not yet a strategy, and it cannot yet be evaluated.",
see:["Fully specified rule", "Falsifiability", "Pre-registration", "Reality check on this section"]},

"Silver bullet":{
long:"The silver bullet is a narrowly scheduled ICT setup: within a specific one-hour window \u2014 most cited is 10:00 to 11:00 New York time \u2014 take the first fair value gap that forms after a liquidity sweep, in the direction of the reclaimed move. One window, one pattern, one entry.\n\nIts narrowness is pedagogically honest and statistically brutal. Honest, because everything is stated: the clock bounds the search, the sweep and the gap are definable events, and there is little room for the after-the-fact flexibility that makes most of the framework untestable. Brutal, because one qualifying hour per day yields a trickle of trades \u2014 months of live execution to accumulate a sample that says anything, during which a run of losses is uninformative and a run of wins is equally so.\n\nFor a Perth trader the window lands in the middle of the night for half the year, which makes the practical cost of collecting that sample higher still.\n\nWhere people get fooled: the name and the testimonials. A setup marketed as a reliable daily opportunity inherits all the burden of proof, and the small-sample maths means most people evaluating it live are reading noise whichever way it goes.",
usage:"If explored, treated as a slow experiment: exact rules pre-registered, every window logged whether or not a trade fired, and judged only once the trade count is meaningful \u2014 not at the first streak in either direction.",
see:["Kill zone", "Fair value gap", "Liquidity sweep", "Sample size"]},

"Consequent encroachment":{
long:"Consequent encroachment is the framework's term for the midpoint of a fair value gap \u2014 fifty per cent of the way across it \u2014 used as a more precise reference than the gap's edges. Entries, reactions and invalidations get measured against that halfway line.\n\nThere is no special mathematics here: it is the same midpoint logic applied everywhere else in the framework, from dealing ranges to equilibrium. The honest rationale for midpoints in general is coordination \u2014 enough participants compute the same simple level that behaviour clusters around it \u2014 plus the practical benefit of precision: a line is a testable reference in a way a fuzzy zone is not.\n\nWhether the middle of a gap specifically holds more often than its edges is an empirical question nobody has answered with public data, and the framework does not offer evidence, only usage. The term mostly signals fluency in the vocabulary rather than adding a mechanism.\n\nWhere people get fooled: mistaking precision for accuracy. Measuring a reaction to the exact midpoint of a gap feels rigorous, but a precise reference for an untested idea is still an untested idea \u2014 the decimal places do not add evidence.",
usage:"Used as the reference line inside a gap for those trading gap fills \u2014 a defined level to react at and to be wrong beyond, which is its entire practical content.",
see:["Fair value gap", "Equilibrium / 50% level", "Premium / discount", "Balanced price range"]},

"Liquidity void":{
long:"A liquidity void is a stretch of chart crossed in one fast, one-sided move \u2014 a run of large candles with minimal overlap, where price transacted thinly on the way through. It is the larger cousin of the fair value gap: not a three-candle formation but a whole zone traversed without two-way business.\n\nThe order-book reality behind the picture is uncontroversial. Fast moves consume the resting orders at each level faster than they are replaced, so little volume changes hands across the span; volume profile shows the same region as a low-volume node. The framework's expectation that such zones get revisited \u2014 price returning to rebalance an area it skipped \u2014 is a restatement of the observation that low-volume areas offer little friction in either direction, so price crosses them quickly whenever it comes back.\n\nThat cuts both ways, which is the practical point: a void is an area where movement is fast, not an area with a preferred direction. It travels fast on the revisit for the same reason it travelled fast the first time.\n\nWhere people get fooled: converting often revisited into must fill and holding positions waiting for it. Plenty of voids fill quickly; some persist for months; nothing enforces either. Basing a stop or a thesis on obligation is the error.",
usage:"Used to set expectations about speed rather than direction: targets inside a void tend to be reached quickly once price enters it, and support or resistance inside one is treated as thin.",
see:["Fair value gap", "Displacement", "Balanced price range", "Liquidity"]},

"Draw on liquidity":{
long:"The draw on liquidity is the framework's answer to the question every trader asks: where is price going? It names the pool of resting orders \u2014 a clean high, equal lows, an old untouched level \u2014 that the current move is supposedly seeking, and directs the trade toward it. Bias, in this system, is a statement about which pool is the draw.\n\nAs orientation, the concept has real utility. It replaces a vague feeling of up or down with a specific destination, which forces targets to be levels rather than hopes and makes the thesis checkable: if price is drawn to the high and instead breaks the low, the read was wrong and there is a defined moment to admit it.\n\nAs a mechanism, it is the section's usual blend: order clusters at obvious levels are real, but nothing establishes that price is pulled toward them with intent \u2014 moves consume whatever liquidity lies along wherever they were already going, which produces the same picture without the teleology.\n\nWhere people get fooled: flexible retrospection. When the named draw is reached, the framework called it; when the opposite pool is reached instead, that one was the real draw. Written down before the session, the concept is a testable bias; assigned afterwards, it is narration.",
usage:"Used to force a falsifiable session bias: name the level acting as the draw before the session, target it, and treat price running the other way as the thesis failing rather than the story updating.",
see:["Liquidity pool", "Daily bias", "Buy-side / sell-side liquidity", "Falsifiability"]},

"Daily bias":{
long:"Daily bias is the one-line directional call made before the session: today reads long toward that high, or short toward that low, decided while the market is closed and you are calm. In ICT teaching it is derived from higher-timeframe structure, recent sweeps and the location of unconsumed liquidity, but the discipline generalises to any method.\n\nThe value is almost entirely in the timing of the decision. A bias fixed before the open is a hypothesis: the session either supports it or breaks it, and either way you learn something about your read. A bias formed during the session is indistinguishable from following price around \u2014 every move mid-session recruits its own justification, which is how a trader ends up long at the high and short at the low of the same day.\n\nA written bias also disciplines trade selection: setups against it require either abstention or an explicit, logged decision to override, and the overrides can then be audited later \u2014 most people discover their overrides underperform their plan.\n\nWhere people get fooled: grading bias by the day's close rather than by whether the stated path played out, and quietly rewriting the morning's call in memory. The fix costs one line in a journal, timestamped before the open.",
usage:"Written before the session with the level that would prove it wrong; used to filter which setups are takeable today, and reviewed weekly as its own dataset \u2014 the bias record is often more instructive than the trade record.",
see:["Draw on liquidity", "Trading journal", "Pre-commitment", "True open"]},

"Asian range":{
long:"The Asian range is the high and low printed during the Asian session \u2014 the hours when Sydney and Tokyo trade while London and New York are dark. For index futures and major FX pairs these are usually the quietest hours of the day, and the range they leave becomes a reference box for everything after.\n\nThe mechanics of its relevance are straightforward. Quiet hours build positions and stack stops just outside a narrow band; the London open then arrives with the day's first real volume into a market whose resting orders are concentrated at two visible lines. Breaks, false breaks and sweeps of the Asian extremes around the London open are consequently among the most-watched recurring events in intraday trading \u2014 the framework's Judas swing is usually staged against exactly this box.\n\nFor a Perth trader the label reads differently: the Asian session is the local afternoon, the one window of the trading day that arrives at a civilised hour. Its quietness is the trade-off for its convenience.\n\nWhere people get fooled: treating the range's edges as support and resistance in the classic sense. They are reference levels because of what rests beyond them, which means the interesting event is usually the violation and its aftermath, not the touch.",
usage:"Marked as the day's first reference box: its extremes locate the early stop clusters, and reactions around its violation at the London open are read as the session's first honest information.",
see:["Judas swing", "Kill zone", "Liquidity pool", "Overnight range"]},

"True open":{
long:"The true open is the framework's preferred zero-point for a cycle: not the official exchange open, but a specific earlier moment \u2014 midnight New York time for the daily cycle, Monday's 18:00 open for the weekly \u2014 from which premium and discount are measured. Price above the true open is dear for longs; below it, cheap.\n\nThe underlying move is to make anchoring explicit. Every mean, range midpoint or session measure needs a start point, and different anchors genuinely produce different reads \u2014 anchored VWAP users argue about the same thing. Declaring the anchor in advance is better hygiene than most chart analysis manages, and if many practitioners share the same anchor, some coordination effect around its levels is at least plausible.\n\nWhat the specific choice of midnight New York does not come with is evidence: no public study establishes that this anchor outperforms the official open, the prior close, or any other candidate. The number is inherited from the framework's authority, not derived.\n\nWhere people get fooled: anchor shopping \u2014 checking several opens and reasoning from whichever one flatters the current position. An anchor only disciplines the analysis if it is fixed before the fact and kept when inconvenient.",
usage:"Used as a declared reference point for the session's premium-discount read: pick the anchor once, measure consistently, and treat its predictive value as an open question your own log can answer.",
see:["Premium / discount", "Dealing range", "Daily bias", "Anchored VWAP"]},

"Quarterly Theory":{
long:"Quarterly Theory is a time-based extension of the framework, popularised by the trader Daye: every cycle \u2014 the year, the month, the week, the day, even ninety-minute blocks \u2014 divides into four quarters playing fixed roles: accumulation, manipulation, distribution, then continuation or reversal. The daily version assigns Asia the range, London the false move from the true open, New York the real leg.\n\nThe skeleton it hangs on is one of the oldest observations in markets: sessions genuinely differ in character, volatility clusters at opens, and quiet ranges precede active trends often enough to matter. Cutting time into quarters and requiring the pattern to nest at every scale is the addition \u2014 and it is an enormous claim, because fractal regularity of that kind would be readily detectable in data, and no such detection has been published outside the community teaching it.\n\nThe scheme's flexibility is its shield: with four quarters and two admissible endings, most days can be labelled compatibly after the fact, and a mislabelled day can be re-cut at a different scale where the pattern fits.\n\nWhere people get fooled: nested cycles offer a matching story at some zoom level for any outcome, and each successful retrofit feels like confirmation. A theory that can always be re-scaled into agreement has surrendered the ability to be wrong.",
usage:"Used, if at all, as a session-character mnemonic \u2014 range, trap, trend \u2014 with any specific timing claim pre-registered and tested before it is allowed to move real risk.",
see:["Power of 3", "Kill zone", "True open", "90-minute cycle"]},

"90-minute cycle":{
long:"The 90-minute cycle is Quarterly Theory's execution layer: each trading session divides into four ninety-minute quarters, and each of those into four 22.5-minute micro-quarters, with the same accumulation-manipulation-distribution roles claimed at every scale. Practitioners use it to time entries inside a session whose direction they have already decided.\n\nIt is worth separating the two things being asserted. That intraday volatility has structure \u2014 opens busier than middles, activity clustering at scheduled times \u2014 is well documented and uncontroversial. That the structure repeats as a fixed four-act play on a ninety-minute clock, fractally, is a far stronger claim, and one that published market microstructure research does not contain. Regularities that precise and that public would be arbitraged by the firms best equipped to see them.\n\nThe subdivision also multiplies interpretive freedom: with sixteen micro-quarters in a session, every reversal lands near some boundary, and near becomes the operative word.\n\nWhere people get fooled: boundary-hunting in hindsight. Mark any day's turning points and a 22.5-minute grid will land close to several \u2014 the same illusion astrology achieves with enough houses. The test is prediction at a stated boundary in advance, logged including the misses.",
usage:"Treated as a timing hypothesis rather than a schedule: if session quarters are to gate entries, the gate is written down first and its hit record kept, with the grid abandoned if it performs no better than untimed entries.",
see:["Quarterly Theory", "Kill zone", "Session", "Multiple testing"]},

"NDOG / NWOG":{
long:"NDOG and NWOG \u2014 New Day Opening Gap and New Week Opening Gap \u2014 are the framework's names for the small dislocations between one session's close and the next one's open: the daily gap at the New York midnight boundary, and the larger weekend gap between Friday's close and Sunday's reopen. The teaching treats these gaps as persistent reference levels that price revisits, sometimes weeks later.\n\nThe weekend gap at least has clear mechanics: news accumulates while the market is shut, positions gap into profit or loss without a chance to exit, and the untraded span behaves like any other low-volume area \u2014 crossed quickly when revisited, and watched by everyone who was caught on the wrong side of it. Gap-fill behaviour in general is one of the older statistical observations in markets, real but far from reliable enough to trade blind.\n\nThe daily version is more artefact than event for most instruments \u2014 minutes of closure on a nearly continuous market \u2014 and its promotion to a durable reference level rests on the framework's say-so rather than on any published property of those particular prices.\n\nWhere people get fooled: the graveyard problem. Old gaps that eventually filled get cited; the ones that never did quietly stop being mentioned. Levels remembered selectively always look magnetic.",
usage:"Weekend gaps earn a place on the chart as genuine untraded zones with trapped positions attached; daily opening gaps are marked only if your own log shows reactions there worth the clutter.",
see:["Gap fill", "Liquidity void", "True open", "Fair value gap"]},

"Standard deviation projections":{
long:"Standard deviation projections, in the ICT usage, are targets made by measuring a reference leg \u2014 typically the manipulation move of a session \u2014 and projecting multiples of it in the opposite direction: \u22121, \u22122, \u22122.5 times the measured swing. Despite the name, no statistical deviation is computed anywhere; the term borrows the costume of statistics for what is measured-move projection.\n\nThat lineage is respectable enough on its own. Measured moves \u2014 expecting a leg to travel about as far as a prior related leg \u2014 are among the oldest target methods in charting, and they solve a real problem: they supply an exit level in open space, where no prior structure offers one. Point-and-figure counts, flag-pole targets and Fibonacci extensions all answer the same need with different arithmetic.\n\nWhat none of them come with, this one included, is demonstrated accuracy: which multiple, measured from which leg, on which timeframe, hits how often \u2014 the framework does not say, and no public test does either. The projections' precision on the chart is not evidence about the future.\n\nWhere people get fooled: multiple multiples. With targets at one, two and two-and-a-half extensions, one of them is frequently near wherever price stalls, and that one gets remembered. Several chances to be right, credited as one skill.",
usage:"Used to place targets when no structural level exists, with one multiple chosen in advance and its hit rate tracked in the log \u2014 the projection is a hypothesis about typical follow-through, testable per setup.",
see:["Measured move", "Fibonacci extension", "Judas swing", "Take profit"]},

"PD array":{
long:"The PD array \u2014 premium-discount array \u2014 is the framework's master inventory: the ordered list of its price-interest objects (order blocks, fair value gaps, breakers, mitigation blocks, old highs and lows, voids) arranged within the current dealing range, premium objects above equilibrium and discount objects below. The teaching runs price from one array element to the next: in a bearish read, rallies into premium arrays are sold toward discount arrays.\n\nAs an organising scheme, it does something genuinely useful for its students: it converts a cluttered chart into a ranked to-do list of levels with a consistent grammar for how price should interact with each. Decision fatigue drops when every level has a name and a role.\n\nThe cost is inherited from the parts. Each object in the array carries the evidential status of its own entry in this glossary \u2014 mostly unvalidated \u2014 and composing many weak claims produces a weaker one, not a stronger one, however systematic it feels. An ordered list of unproven levels is an unproven list.\n\nWhere people get fooled: mistaking taxonomy for probability. With enough object types populating the range, price is always near something from the list, so the framework always has an explanation ready \u2014 coverage that comprehensive is a warning about testability, not a feature.",
usage:"Used as a chart-organisation habit \u2014 levels named, ranked and pre-drawn rather than improvised \u2014 while keeping each object's untested status attached to it, and letting the trade log rather than the taxonomy assign confidence.",
see:["Premium / discount", "Dealing range", "Order block", "Fair value gap"]},

"Internal vs external liquidity":{
long:"Internal and external liquidity split the dealing range's resting orders into two addresses: external liquidity sits beyond the range's extremes \u2014 the stops above the range high and below the range low \u2014 while internal liquidity is everything inside: fair value gaps, minor swing points, small pools formed during the range's construction.\n\nThe framework uses the split as a sequencing map. Price within a range is expected to work the internal objects \u2014 filling gaps, sweeping minor swings \u2014 before making its run at an external pool, and a sweep of external liquidity is expected to send price back toward internal targets. The alternation gives its users a constant answer to what should happen next.\n\nRead mechanically rather than narratively, this is a description of how ranges behave by definition: while price is ranging it oscillates across the middle, and eventually it leaves. The vocabulary re-describes that as intentional collection, which adds direction-of-travel stories but no observable content beyond the range itself.\n\nWhere people get fooled: the sequencing feels predictive because it is retrofitted at every step \u2014 whichever pool trades next was the one being targeted. Written as a genuine forecast (this pool, then that one, invalidated if the order reverses), it becomes testable and, in that form, has never been publicly validated.",
usage:"Used to keep targets consistent with the range read: inside a range, expect rotation between internal levels; after an extreme is swept, name the internal level you expect next and let the miss count mean something.",
see:["Dealing range", "Liquidity pool", "Fair value gap", "Draw on liquidity"]},

"Propulsion block":{
long:"A propulsion block is a refinement of the order block: an order block that forms inside, or immediately reacts from, a previous order block \u2014 the second zone supposedly propelling price with added force because it stacks on the first. The teaching treats it as a strengthened continuation signal.\n\nAt this depth of the taxonomy it is worth stating what accumulates as the block types multiply: each new subtype adds definitional freedom \u2014 one more way a rectangle can qualify \u2014 while resting on the same unvalidated foundation as the parent concept. No public evidence distinguishes propulsion blocks from ordinary order blocks, or either from randomly selected consolidation candles, in forward tests.\n\nThe kernel worth acknowledging is that zones which produce repeated strong reactions are more interesting than zones which produce one; recurrence at a price is genuine information about resting interest there. Classical support and resistance handles the same observation with fewer moving parts.\n\nWhere people get fooled: taxonomy depth masquerading as edge. Learning ever-finer block distinctions feels like progression through a curriculum, but a hundred names for rectangles is still rectangles; the log of what happened at the zones \u2014 kept across all of them, not the memorable ones \u2014 is the only part that counts.",
usage:"Practically folded into the order-block family: a zone that has reacted more than once merits attention on the next visit, whatever it is called, and merits the same predefined invalidation as any other level.",
see:["Order block", "Breaker block", "Support / resistance", "Reality check on this section"]},

"Balanced price range":{
long:"A balanced price range is what remains after price has swept fast in both directions across the same span: an up-move leaving a fair value gap, then a down-move (or the reverse) that fills it and carves its own, leaving a band that has now been traversed violently both ways. The framework calls the area rebalanced \u2014 two-sided business has been done \u2014 and treats its edges as the meaningful references thereafter.\n\nIn auction-theory language, something familiar is being described: a zone contested from both directions where a short-term consensus of value formed under pressure. The claim that price often returns to and reacts around such bands is a close cousin of value-area logic from market profile, which at least has decades of practitioner literature behind the same intuition.\n\nThe honest translation is modest: a balanced price range marks where the last genuine two-sided fight happened, and fight locations tend to matter again. Direction is not part of the information.\n\nWhere people get fooled: expecting balance to hold as support or resistance by obligation. A band built in minutes of violence encodes minutes of opinion; treating its edge as a durable wall \u2014 rather than as one more reference whose reactions belong in the log \u2014 over-reads a small event.",
usage:"Marked after a sharp two-way sequence as a reference band: reactions at its edges are noted, positions through its middle are given wider tolerance, and nothing about it is assumed durable without repetition.",
see:["Fair value gap", "Liquidity void", "Value area", "Consolidation"]},

"Rejection block":{
long:"A rejection block is the wick-based member of the block family: where an order block is drawn from a candle's body, the rejection block is drawn from the long wicks at a swing extreme \u2014 the span price probed and refused to hold. On the return visit, the wick's range is the zone expected to act.\n\nOf all the block variants, this one tracks the oldest and least controversial chart observation: long wicks at extremes record genuine rejection \u2014 trades happened at those prices and were immediately repriced away \u2014 and classical candlestick reading has treated prominent wicks as information for as long as candles have been drawn. Pin-bar traders and hammer readers work the same evidence.\n\nWhat the rebrand adds is chiefly membership in the array taxonomy, plus the usual freedoms: which wick, how long is long, and whether the zone is the full wick or its midpoint vary by teacher. The underlying idea needs none of that to be stated plainly \u2014 prices that were tried and rejected are worth remembering.\n\nWhere people get fooled: forgetting that rejection is dated evidence. A wick shows who lost that fight at that moment; conditions change, and a level defended once is not defended in perpetuity. The second visit is a new event, not a rerun.",
usage:"Used like any wick-extreme reference: the probed span is marked, a return to it is watched for fresh rejection or acceptance, and the level's continued relevance is earned by new reactions rather than assumed from the old one.",
see:["Pin bar", "Hammer", "Order block", "Liquidity sweep"]},

"Optimal trade entry":{
long:"Optimal trade entry \u2014 OTE \u2014 is the framework's pullback entry: after an impulsive move, wait for the retracement into the 62% to 79% band of that leg, and enter there in the direction of the impulse, stop beyond the swing, targets back past the extreme. It is ICT's most mechanical, most taught setup.\n\nStrip the branding and this is Fibonacci-zone pullback trading, a lineage decades older than the vocabulary: enter trend continuation deep in the retracement, where the stop is near and the payoff geometry is favourable. That geometric part is real arithmetic \u2014 an entry at 70% of the leg with invalidation just beyond it risks little to reclaim much, so even a modest continuation rate can carry the maths.\n\nThe open questions are the ones the ratio bands always face: nothing establishes 62\u201379% as special beyond convention, deep retracements are also simply what failing trends do on their way to reversing, and the setup's results hinge on the impulse-selection rule \u2014 which legs count \u2014 far more than on the band itself.\n\nWhere people get fooled: grading the band and not the leg selection. Backtests of OTE that hand-pick which impulses qualified have already made the trade work in hindsight; the honest test defines the qualifying leg mechanically and accepts every signal it generates.",
usage:"Used as a defined pullback-entry template: leg definition, band, stop and target all stated up front \u2014 its favourable risk geometry is the durable part, and the entry band is a convention to be tested, not trusted.",
see:["Fibonacci retracement", "Premium / discount", "Displacement", "Risk:reward"]},

"R":{
long:"R is one unit of risk: whatever you stand to lose if the stop is hit. If the stop sits 20 points away and each point is worth two dollars, then 1R is forty dollars, and every outcome on that trade gets measured against it \u2014 a winner that banks 120 dollars is +3R, a stop-out is \u22121R.\n\nThe point of the unit is comparability. Dollar results depend on account size, instrument and mood on the day; R strips all of that out. A +2R trade on MNQ and a +2R trade on a currency pair are the same achievement, and a month of trading reduces to a single honest series: +3, \u22121, \u22121, +2, \u22121.\n\nIt also quietly enforces discipline. You can only measure in R if you defined the risk before entering, which means a stop existed and a size was calculated. Trades that cannot be expressed in R are trades that had no defined risk.\n\nWhere people get fooled: quoting results in R while moving stops mid-trade. If a planned \u22121R was widened to a \u22123R loss, the series is fiction. The unit only works when the plan it measures was actually followed.",
usage:"Used as the accounting unit for every trade, so results compare across instruments and account sizes. A trade log kept in R is the raw material for expectancy, drawdown and every other statistic worth having.",
see:["Risk per trade", "Expectancy", "Position sizing", "Risk:reward"]},

"Risk per trade":{
long:"Risk per trade is the fixed fraction of the account you are willing to lose on any single idea \u2014 commonly somewhere between half a per cent and two per cent. It is decided once, calmly, in advance, and it does not change because a setup looks especially convincing, because every setup looks convincing at the time.\n\nThe number matters less than its constancy. At 1%, a run of ten straight losses \u2014 which a coin-flip system produces surprisingly often \u2014 costs roughly 10% of the account, which is survivable and recoverable. At 10% per trade the same ordinary streak is ruin. The difference between those two traders is not skill; it is a single parameter chosen before either of them took a trade.\n\nRisk per trade combines with stop distance to produce position size, in that order. The budget comes first, the stop goes where the idea is wrong, and the size falls out of the arithmetic.\n\nWhere people get fooled: raising the fraction after wins, on the reasoning that they are playing with profits. The market does not know the money used to be profit. Ratcheting risk up with confidence is how a good month funds a terminal one.",
usage:"Set once as policy and applied mechanically to every trade through the position-size calculation. Its whole value is that it is not renegotiated in the moment.",
see:["Position sizing", "R", "Risk of ruin", "Drawdown"]},

"Win rate":{
long:"Win rate is the percentage of trades that finish profitable. It is the statistic beginners fixate on and the one that carries the least information on its own, because it says nothing about the size of the wins against the size of the losses.\n\nA system that wins nine trades in ten, banking small gains, and gives everything back on the tenth is a losing system with a beautiful win rate. A trend-following system that loses six times in ten but whose winners are triple the size of its losers makes money while feeling like constant failure. Both facts are invisible if the only number you look at is how often you were right.\n\nWin rate only becomes meaningful next to the payoff ratio \u2014 average win divided by average loss \u2014 and the two together produce expectancy, which is the number that actually decides whether the approach earns anything.\n\nWhere people get fooled: selling and being sold on the number. High win rates are trivially easy to manufacture by taking profits instantly and letting losses run, which is why they dominate marketing and why any advertised figure without the payoff ratio and the sample size beside it should be read as decoration.",
usage:"Read only alongside payoff ratio and sample size, and used mainly to understand what a strategy will feel like to trade \u2014 high win rate means steady small gains punctuated by rare large hits, low win rate means long losing streaks are normal.",
see:["Expectancy", "Profit factor", "Sample size", "R"]},

"Profit factor":{
long:"Profit factor is gross profit divided by gross loss: everything the winners made over everything the losers cost. Above 1.0 the system made money; below it, it lost. Around 1.5 over a real sample is solid. Figures far above that deserve suspicion rather than celebration.\n\nIts usefulness is that it compresses both sides of the ledger into one number without hiding either. A high win rate with tiny wins and a low win rate with huge wins can land on the same profit factor, which is the point \u2014 it measures the outcome, not the style.\n\nIt shares every statistic's weakness: sensitivity to the sample. One outsized winner in a short backtest can drag the profit factor to an impressive level that the next hundred trades will quietly undo. The number stabilises only as the trade count grows.\n\nWhere people get fooled: reading a backtest profit factor above 3 as evidence of a great system. On small samples it usually means one lucky stretch did the work, and on large samples it more often signals a data or cost error than a real edge. This project's own testing treats implausibly high figures as bug reports first.",
usage:"Used beside expectancy as a quick health check on a trade log, and as a red flag in reverse \u2014 implausibly high values in a backtest usually mean the costs or the data are wrong.",
see:["Expectancy", "Win rate", "Sample size", "Drawdown"]},

"Risk of ruin":{
long:"Risk of ruin is the probability of losing so much of the account that continuing is impractical \u2014 not necessarily to zero, but past the point where recovery arithmetic and personal tolerance give out.\n\nWhat makes it worth studying is how violently it responds to position size. The same strategy, the same edge, the same market: at 1% risk per trade the chance of a ruinous drawdown over a few hundred trades is small, at 5% it is material, and at 10% it approaches certainty over any long run. Ruin is almost never caused by a wrong opinion about the market; it is caused by the size at which the opinion was held.\n\nSequence is the mechanism. Losses compound against a shrinking base, and the deeper the hole the larger the gain needed to climb out \u2014 down 50% needs +100%. A big-risk trader does not need to be unlucky for long.\n\nWhere people get fooled: computing ruin odds with their backtested win rate and payoff as if those were known constants. They are estimates from a sample, usually flattering ones, and the honest calculation uses inputs meaningfully worse than the backtest before trusting the answer.",
usage:"Used to choose risk per trade: pick the fraction at which a realistic losing streak leaves the account and the trader both able to continue. The simulator on the Tools panel runs this arithmetic across thousands of orderings.",
see:["Risk per trade", "Recovery maths", "Sequence risk", "Drawdown"]},

"Kelly criterion":{
long:"The Kelly criterion is the formula for the bet size that maximises long-run compound growth when you know your edge and odds exactly: bet the fraction of capital given by edge over odds. For a coin weighted 55/45 paying even money, Kelly says risk 10% of the bankroll per flip.\n\nIt is genuinely optimal \u2014 and nearly unusable as stated, for two reasons. First, full-Kelly sizing produces drawdowns most people cannot sit through; extended 50% drawdowns are within its normal behaviour, and a strategy abandoned mid-drawdown returns nothing. Second, the formula's inputs are your true win probability and payoff, which in markets you never know \u2014 you have sample estimates, and they are usually optimistic.\n\nBecause overestimating your edge with Kelly is far more destructive than underestimating it, practitioners who use it at all use a fraction \u2014 half-Kelly or quarter-Kelly \u2014 trading a little theoretical growth for a lot of survivability.\n\nWhere people get fooled: plugging a 30-trade backtest into the formula and betting accordingly. Kelly amplifies whatever you feed it; fed noise, it sizes you into ruin optimally.",
usage:"Used less as a sizing rule than as an upper bound: whatever Kelly says, real sizing sits well below it, and if your current risk per trade exceeds the Kelly fraction for your own logged numbers, you are over-betting even by the most aggressive standard.",
see:["Kelly fraction in practice", "Risk of ruin", "Risk per trade", "Sample size"]},

"Sharpe ratio":{
long:"The Sharpe ratio is return per unit of volatility: how much you were paid for the bumpiness of the ride, computed as excess return over the risk-free rate divided by the standard deviation of returns. It answers a different question from raw return \u2014 not how much, but how smoothly.\n\nIts virtue is comparability. A 20% year with wild swings and a 12% year that never drew down more than a few per cent are hard to rank by return alone; Sharpe ranks them by what you endured per unit of gain. Institutional money largely thinks in these terms, which is why the measure is everywhere.\n\nIts blind spots matter. It punishes upside volatility exactly as hard as downside \u2014 a strategy with rare huge winners looks worse than it should, which is what the Sortino variant exists to correct. And it assumes the volatility you measured is the volatility there is, which understates strategies that are quiet until they are suddenly not.\n\nWhere people get fooled: annualised Sharpe figures from short windows, and search-inflated ones. At this project's trial count, noise alone was expected to produce a best-of-search Sharpe near 2.4 \u2014 a bar that almost every recorded result sat under. A high Sharpe from many tries means the search was big, not that the edge is real.",
usage:"Used to compare strategies on ride quality rather than raw return, always with the sample length and the number of variants tried disclosed beside it \u2014 an undisclosed search size makes the number meaningless.",
see:["Sortino ratio", "Drawdown", "Multiple testing", "Sample size"]},

"Correlation":{
long:"Correlation measures how much two instruments move together, from +1 (in lockstep) through 0 (unrelated) to \u22121 (in opposition). It is the quiet variable that decides whether a set of positions is diversification or one large bet wearing several names.\n\nThe practical trap is concrete: long MNQ and long MES at 1% risk each is not two 1% trades. The two indices track each other closely enough that it is one trade at roughly 2%, and every additional correlated position stacks the same exposure higher. Portfolio heat computed without correlation is fiction.\n\nCorrelation is also unstable in exactly the wrong way. Measured in calm markets it flatters diversification; in a crisis, correlations across risk assets lurch toward 1 simultaneously, and the portfolio that was five independent ideas becomes one idea at five times the size on the worst possible day. Any plan that only works if calm-period correlations hold is a plan for calm periods.\n\nWhere people get fooled: diversifying by name rather than by driver. Ten positions that all rise when rates fall are one position. The question is never how many tickers, but how many genuinely independent reasons to make money.",
usage:"Used when sizing multiple simultaneous positions \u2014 correlated trades share one risk budget rather than each getting their own \u2014 and checked before believing any claim of diversification.",
see:["Portfolio heat", "Sequence risk", "Drawdown", "Position sizing"]},

"Martingale":{
long:"Martingale is the doubling system: after every loss, increase the stake so the next win recovers everything and adds a unit. Borrowed from casino play, it resurfaces in trading dressed as averaging down with escalating size, recovery trading, or grid systems with widening steps.\n\nThe arithmetic looks bulletproof and the failure is structural. The sequence of stakes grows geometrically \u2014 1, 2, 4, 8, 16 \u2014 so a run of losses that is merely uncommon produces a required stake that exceeds the account. Every martingale account produces the same equity curve: a long, soothing, nearly straight climb of small wins, then a single vertical loss that removes all of it. The smoothness is not safety; it is the tail being stored up.\n\nA useful way to see it: martingale converts a high probability of small wins into a small probability of total loss. Nothing about the market's direction needs to go unusually wrong \u2014 the sizing does the destroying by itself.\n\nWhere people get fooled: by the track record. Months of green days is exactly what the strategy looks like right up until the day it does not exist. Any system whose pitch includes never having a losing week deserves this exact suspicion first.",
usage:"Known mainly so it can be recognised and refused \u2014 including in disguise, when a strategy's plan for a losing position is to add to it with increasing size. The anti-martingale direction, sizing down after losses, is what fixed fractional sizing does automatically.",
see:["Anti-martingale", "Averaging down", "Risk of ruin", "Sequence risk"]},

"MAE / MFE":{
long:"Maximum Adverse Excursion is the worst a trade went against you before it closed; Maximum Favourable Excursion is the best it went in your favour. Logged for every trade, in R, they are the two most underused numbers in retail trading \u2014 because together they audit your stop and your target with your own data.\n\nMAE answers whether the stop is in the right place. If winners rarely go more than 0.4R against you before working, a 1R stop is paying for room the trades never use, and tightening it buys size for free. If winners routinely survive 0.9R of pain first, a tighter stop would be converting eventual winners into losses.\n\nMFE answers the mirror question about targets. If trades regularly reach +2.5R of open profit but the log shows exits averaging +1.2R, the exit rule is donating the difference back. If price rarely reaches the target at all, the target is a wish rather than a level.\n\nWhere people get fooled: never recording either, and tuning stops and targets by feel \u2014 usually in response to whichever recent trade hurt most. Two numbers per trade replace that with evidence.",
usage:"Logged automatically or by hand on every trade, then reviewed in bulk: the distribution of MAE across winners sets the stop, the distribution of MFE across all trades sets the target.",
see:["Stop loss", "R", "Expectancy", "Time stop"]},

"Mental stop":{
long:"A mental stop is an exit level held in the head instead of resting at the exchange: the intention to close the position if price reaches a line, without an order that would do it automatically.\n\nThe argument made for it is avoiding stop hunts \u2014 the belief that a resting order is a target. The argument against it is what it actually depends on: you being at the screen, paying attention, emotionally willing to accept the loss at the exact moment the market is moving fastest against you. Those are precisely the conditions under which people freeze, widen the line, or decide to give it a little more room. The mental stop's failure mode is not rare; it is the default.\n\nOn any position held overnight it is not a risk control at all. Price can travel hundreds of points through the level while you sleep \u2014 an eight-hour unattended window every single day for anyone trading US hours from Perth.\n\nWhere people get fooled: by their own record on calm days. A mental stop honoured ten times in slow conditions says nothing about the fast day that matters, because honouring it was never the hard part until then.",
usage:"Legitimately used only for exits an order type cannot express \u2014 a close-based invalidation, for instance \u2014 and even then paired with a hard catastrophe stop further out so the unattended worst case is still capped.",
see:["Stop loss", "Gap risk", "Discipline", "Overnight risk"]},

"Recovery maths":{
long:"Recovery maths is the asymmetry between losing and getting back to even: a loss of X per cent requires a gain of more than X to recover, and the gap grows viciously with depth. Down 10% needs +11%. Down 25% needs +33%. Down 50% needs +100%, and down 90% needs +900%.\n\nThe reason is nothing deeper than a shrinking base \u2014 percentages after the loss are computed on less capital \u2014 but the consequences shape everything about sensible risk-taking. Small drawdowns are a cost of doing business; deep ones change the task itself, from trading well to performing miracles. The difference between a trader risking 1% and one risking 10% per trade is not linear, because the second one's losing streaks push into the region where the required recovery exceeds what any honest strategy produces.\n\nThis is also the quiet argument against revenge trading. The instinct after a heavy loss is to size up to win it back quickly, which is exactly the action that moves the account further down the curve where recovery gets harder still.\n\nWhere people get fooled: mentally treating \u221230% and +30% as symmetric events. They are not close, and plans built on that symmetry systematically underestimate how expensive drawdowns are.",
usage:"Used when choosing risk per trade and drawdown limits: the tolerable-loss line belongs where the recovery arithmetic still looks like trading rather than like a moonshot.",
see:["Drawdown", "Risk of ruin", "Compounding", "Risk per trade"]},

"Smart money":{
long:"Smart money is the framework's name for large, informed participants \u2014 funds, banks, dealers \u2014 whose activity is claimed to drive price in patterns a retail trader can learn to read from the chart. It is the load-bearing idea underneath most of this section's vocabulary.\n\nTwo separate claims hide inside it, with very different standing. That large participants exist, execute with size constraints, and leave real footprints in order-flow data is simply true \u2014 an institution genuinely cannot buy a large position without managing its own impact. That those footprints can be reliably identified from ordinary candles, and that the market is structured as deliberate engineering against retail stops, is the part with no independent validation. A chart records that trading happened at a price; who traded and why is added by the interpreter.\n\nThe idea also has a long ancestry. Wyckoff built the same reasoning a century ago around his composite operator \u2014 explicitly a thinking tool, not a claim that a single actor exists. Modern usage often drops that caveat.\n\nWhere people get fooled: by explanations that cannot lose. If price sweeping a low is smart money accumulating, and price breaking down instead is smart money distributing, every outcome confirms the story, which means none of them test it.",
usage:"Best treated as shorthand for participants with size and information constraints, useful for reasoning about where orders concentrate \u2014 and treated with suspicion the moment it is offered as an explanation that fits every outcome after the fact.",
see:["Institutional order flow", "Reality check on this section", "Liquidity pool", "Framework vs strategy"]},

"Inducement":{
long:"Inducement is the framework's term for a smaller, nearer pool of resting orders that price collects on the way to a larger one \u2014 a minor swing high placed like bait before the real level. The narrative is that engineered moves take the obvious liquidity first, trapping early entries, before the intended move begins.\n\nStrip the intent story and a real observation remains: obvious minor levels do accumulate stops and breakout orders, because traders place them at what they can see, and price frequently trades through several such shelves in sequence. The behaviour does not require anyone engineering anything \u2014 clustered orders plus ordinary movement produce it on their own.\n\nAs a practical concept it is mostly a patience argument: the first sweep of a minor level is, in this framing, not yet the location that matters, so the framework tells its user to wait for the deeper pool. Whether that waiting improves results is exactly the kind of claim that needs a logged sample rather than a diagram, and no independent validation exists.\n\nWhere people get fooled: unfalsifiability. Any level that held was the real draw; any that broke was mere inducement. When the labels are assigned after the outcome, the concept explains everything and predicts nothing.",
usage:"Used, if at all, as a reason to be sceptical of the first obvious level in the path of a move and to define entries at levels chosen in advance \u2014 with the label written down before the outcome, or not used at all.",
see:["Liquidity pool", "Liquidity sweep", "Draw on liquidity", "Reality check on this section"]},

"BOS":{
long:"BOS \u2014 break of structure \u2014 is the framework's confirmation event: a close beyond the most recent significant swing point in the direction of the prevailing trend, taken to mean the trend remains in force. An uptrend printing a close above its last swing high has, in this vocabulary, broken structure bullishly.\n\nThe concept is the same one plain technical analysis calls trend continuation, and its strength is that it can be made fully objective: fix the swing definition \u2014 how many bars either side make a pivot \u2014 and require a close rather than a wick, and two people will mark identical events on the same chart. Very little in this section clears that bar, which makes BOS one of its most testable pieces.\n\nThe cost of that objectivity is honesty about the parameter. A three-bar swing and a ten-bar swing generate different structure from the same prices; neither is the true one. Any rule built on BOS inherits that choice, and results that survive only one setting are describing the setting, not the market.\n\nWhere people get fooled: counting wick pokes as breaks when it suits the position, and re-selecting which swing counted after the outcome is known. The definition only protects you if it is fixed before the trade.",
usage:"Used as a trend filter and as the confirmation leg of entries built on structure, with the swing lookback and the close requirement written into the rule so the event is the same one every time.",
see:["Break of structure", "CHoCH", "Displacement", "Liquidity sweep"]},

"CHoCH":{
long:"CHoCH \u2014 change of character \u2014 is the first structural break against the prevailing trend: in an uptrend, the first close below a swing low that had been holding. Where BOS confirms continuation, CHoCH is read as the earliest printed evidence that control may be changing hands.\n\nIt inherits the same objectivity as BOS \u2014 fix the swing definition and the event is mechanical \u2014 and adds the classic problem of every early signal: most first breaks against a strong trend are pullbacks, not reversals. On low timeframes a healthy trend prints counter-breaks continuously; a five-minute chart can generate a dozen changes of character inside a move that never stops trending on the hourly. Without a stated timeframe and swing lookback, the term describes something that is nearly always true somewhere.\n\nThe framework typically softens this by demanding confluence \u2014 a CHoCH after a sweep of a significant high, with displacement \u2014 which narrows the signal and simultaneously shrinks any testable sample.\n\nWhere people get fooled: treating earliness as an advantage by itself. Being first to call a reversal and being wrong look identical for several bars, and the trader drawn to CHoCH is usually the one who most wants the trend to turn.",
usage:"Used as an alert rather than an entry \u2014 a prompt to start building the case for a reversal that something else must complete \u2014 and always with the timeframe and swing definition stated.",
see:["Change of character", "BOS", "Liquidity sweep", "Retracement vs reversal"]},

"Displacement":{
long:"Displacement is a fast, one-sided move that leaves large-bodied candles and little overlap \u2014 price not drifting to a new area but being driven there. In the framework it is read as the signature of institutional conviction, and it is what upgrades a level break from noise to signal in most ICT-style models.\n\nThe observable core is real and older than the vocabulary: range expansion. Bar ranges are measurable, so a displacement rule can be made objective \u2014 body size some multiple of the recent average, minimal wick overlap \u2014 and expansion does carry information, because volatility clusters and fast moves tend to come from genuine order-flow imbalance rather than quiet drift.\n\nWhat the framework adds on top is attribution: that the expansion reveals who was trading and why. That part is not observable from candles. A news release, a liquidation cascade and a patient institution produce indistinguishable pictures.\n\nWhere people get fooled: recognising displacement generously in hindsight. After the move works, the impulse that started it looks obviously displaced; the equally sharp impulse that failed is remembered as a fake-out. A threshold written down in advance \u2014 and applied to the failures too \u2014 is the only version that means anything.",
usage:"Used as a strength filter on structure events: a level break accompanied by measured range expansion is treated differently from a drift through the same level. The measurement, not the impression, is the usable part.",
see:["Fair value gap", "BOS", "Liquidity void", "Consolidation"]},

"Kill zone":{
