long:"A fair value gap is a three-candle formation where the first candle's high sits below the third candle's low, leaving a band of prices that the middle candle passed through without two-way trade. It is not a gap in the traditional sense — the market never closed — it is a stretch that price crossed so quickly that little business was done there.\n\nThe mechanism is simply the shape of fast movement. When one side is aggressive enough, price moves through levels faster than resting orders can be replaced, so those levels get skipped rather than traded. The observation that price often returns to fill such areas is a description of mean reversion in short-term order flow, not a special property of the pattern.\n\nThe same feature has other names. In order-flow language it is an imbalance. In auction terms it is a low-volume node. Volume profile draws the identical information as a thin section of the histogram. None of those framings claim more than the shape supports.\n\nWhere people get fooled: gaps are everywhere once you start looking, and on a low enough timeframe there are dozens per session. Without a rule about which ones count — size relative to ATR, whether the gap sits at a level that already mattered, how long it stays unfilled — you are choosing after the fact. And 'price often returns' is not the same claim as 'price returns often enough to trade after costs'.",
usage:"Usually treated as an area of interest for an entry on a pullback, with the midpoint sometimes used as a more precise level than the edge. It is also used as a target when price is heading back through an area it skipped.",
see:["Imbalance","Liquidity void","Balanced price range","Consequent encroachment","Displacement"]},

"Break of structure":{
long:"A break of structure is a close beyond the most recent swing point in the direction of the existing trend — a close above the prior swing high in an uptrend, or below the prior swing low in a downtrend. It is used to confirm that the trend is still intact.\n\nWhat makes it worth having is that it is codeable. Once you fix the swing definition — how many bars either side make a pivot — two people looking at the same chart will identify the same breaks. That is unusual in this vocabulary and it is the main reason this term is more useful than most of the ones around it.\n\nThe catch is that the swing definition is a parameter, not a fact. A three-bar swing and a ten-bar swing produce different structure on the same chart, and neither is correct. Any strategy built on structure inherits that parameter, and if the result only works at one setting you have found a lookback that fitted the sample rather than a property of the market.\n\nWhere people get fooled: the distinction between a close beyond a level and a wick beyond it is doing enormous work, and it is easy to relax it in the moment. It is also easy to redraw which swing counts once you know what happened next.",
usage:"Generally used as trend confirmation and as a way to define where a directional thesis stops being valid. It is more commonly a filter on other setups than an entry trigger by itself.",
see:["Change of character","Market structure","Swing high / swing low","Trend"]},

"Change of character":{
long:"A change of character is the first structural break against the prevailing trend — in an uptrend, the first close below a swing low that had been holding. It is read as the earliest evidence that control may be changing hands.\n\nThe logic is the mirror of a break of structure, and it inherits the same strength and the same weakness: it is objective once the swing lookback is fixed, and the lookback is arbitrary.\n\nThe practical problem is that in any strong trend, pullbacks produce a change of character at some timeframe almost continuously. On a one-minute chart a healthy uptrend generates them all day. Without specifying the timeframe and the swing definition, the term describes something that is nearly always true somewhere and therefore predicts nothing.\n\nWhere people get fooled: it is the earliest signal in the structural family, which means it is also the one most often wrong. Traders who want to be early are drawn to it for exactly the reason it disappoints — being first to call a reversal and being wrong look identical until several bars later.",
usage:"Usually used as an alert to start looking rather than as a reason to act, often paired with a requirement that a higher timeframe agrees before anything is done with it.",
see:["Break of structure","Market structure","Retracement vs reversal"]},

"Accumulation":{
long:"Accumulation is a period where buying is absorbed sideways rather than pushing price up — large buyers building positions gradually at low prices, taking what sellers offer without bidding the market away from themselves. It comes from Richard Wyckoff's work in the 1920s and 1930s, and it is the base that forms before a sustained advance.\n\nThe mechanism is a size problem. A buyer who needs a large position cannot simply lift every offer, because doing so moves the price against them before they are filled. The alternative is to buy patiently within a range, letting sellers come to them. From outside, that behaviour looks like a market going nowhere on unremarkable volume.\n\nWyckoff's framework describes the phases in some detail — a selling climax, an automatic rally that sets the range ceiling, secondary tests on lower volume, and often a spring through the floor before the advance begins. Most modern 'smart money' vocabulary is a renaming of this material, including the accumulation-manipulation-distribution cycle.\n\nWhere people get fooled: accumulation and a market that is simply going nowhere look the same in real time. The distinguishing evidence is meant to be volume behaviour — selling that fails to move price, tests on lighter volume — and that evidence is far less clear-cut on a live chart than in a textbook diagram. The phase labels are also applied confidently after the move and argued about during it.",
usage:"Generally used as context rather than a trigger: knowing a market may be basing changes which direction of setup you are willing to take. Its range boundaries also give objective levels regardless of whether the interpretation is right.",
see:["Distribution","Spring","Wyckoff method","Trading range","Markup / markdown"]},

"Distribution":{
long:"Distribution is the mirror of accumulation — large holders offloading into strength near highs while price moves sideways, selling into every rally rather than dumping into a falling market. It is the ceiling that forms before a sustained decline.\n\nThe mechanism is the same size problem inverted. Selling a large position into a falling market gets progressively worse prices, so the seller distributes gradually while there is still demand to sell into. That demand is usually strongest when sentiment is most positive, which is why distribution tends to coincide with the most bullish commentary.\n\nStructurally you get a range that stops making higher highs, rallies that keep failing at a similar level, and eventually a failed push above the range — Wyckoff's upthrust, or an upthrust after distribution at the very top.\n\nWhere people get fooled: the same ambiguity as accumulation, plus a psychological one. Distribution occurs while the news is good and the trend still looks intact, so calling it early means fighting a rising market. Most people who identify distribution correctly do so several weeks after they first called it.",
usage:"Used as context for bias — a market suspected of distributing shifts which direction of setup you look for. The range high provides an objective invalidation level whether or not the reading is correct.",
see:["Accumulation","Upthrust","Wyckoff method","Markup / markdown"]},

"Spring":{
long:"A spring is a dip below the floor of a trading range that immediately reclaims it. Wyckoff named it, and the idea is that the move flushes out weak holders and tests whether supply remains below the range before an advance begins.\n\nIt is structurally identical to what modern material calls a liquidity sweep of a range low. The concept predates that vocabulary by roughly a century, which is worth knowing when the same chart feature is presented as a recent discovery.\n\nThe mechanism is the stop-order one: sell stops accumulate below an obvious range floor, price trading there triggers them, and if there is no genuine supply behind the move the market recovers. The reclaim is what distinguishes a spring from a breakdown, and you only know which you had after the close.\n\nWhere people get fooled: in a real breakdown, the first move below the range looks exactly like a spring. The two are distinguished only by what happens next, which means any rule that acts at the low is acting on ambiguity. Waiting for the reclaim costs you the best price and removes most of the ambiguity — that trade-off is measurable and worth measuring rather than assuming.",
usage:"Typically used as a location for a long attempt within a range-bound context, with the range floor providing invalidation. The reclaim close is the usual trigger rather than the low itself.",
see:["Liquidity sweep","Upthrust","Accumulation","Trading range","Turtle soup"]},

"Consolidation":{
long:"Consolidation is price coiling into a progressively tighter range — each swing smaller than the last, each bar's range narrower. It is distinct from a plain range, which has roughly flat boundaries; consolidation converges.\n\nThe mechanism is a narrowing of disagreement. Volatility clusters, and periods of low volatility tend to follow periods of low volatility until something changes. Compression is one of the more measurable things on a chart: you can compute the average bar range over the last N bars against the N before it and get a number rather than an impression.\n\nWhat compression reliably indicates is that an expansion is likely at some point. What it does not indicate is direction. Every framework that claims to read direction from a coil is adding a claim the shape does not support.\n\nWhere people get fooled: the breakout from a coil frequently goes both ways before it goes anywhere — a false break in one direction, then the real move in the other. Positioning for the first move out is positioning for the leg most likely to be reversed.",
usage:"Generally used as a volatility filter — either to stand aside until it resolves, or to prepare an order on both sides. Its boundaries also give a natural invalidation level for whichever side you eventually take.",
see:["Expansion","Bollinger squeeze","Range","Inside bar","Chop"]},

"Support / resistance":{
long:"Support and resistance are price areas where advances have previously stalled or declines have previously found buyers. They are the oldest idea in technical analysis and the one most people learn first.\n\nThe mechanism that holds up best is not memory in the market but the concentration of orders. People place orders at prices they can identify, and everyone identifies the same obvious highs, lows and round numbers. A level matters because it is visible, not because price has an attachment to it.\n\nThe most useful version of the concept is the flip: a level that acted as resistance and then broke often behaves as support afterwards. That is consistent with the order mechanism — the people who sold there and were wrong become buyers if price returns, and those who wanted in have a reference.\n\nWhere people get fooled: levels are drawn, not found. Any chart supports a dozen defensible lines, and a line drawn after the fact will fit the past perfectly. Treat them as zones rather than prices, decide the drawing rule in advance, and be suspicious of any analysis where the level appeared after the move.",
usage:"Used for locating entries and for placing invalidation. The more common mistake is using them as reasons to trade rather than as places where something else must also happen.",
see:["Retest","Round numbers","Rejection","Equal highs / equal lows","Trendline"]},

"Breakout":{
long:"A breakout is price moving decisively beyond a defined boundary — a range high, a consolidation edge, an N-bar high. The premise is that clearing the level marks a change in the balance between buyers and sellers.\n\nThe mechanism is a combination of stop orders above the level and new entries triggered by the move itself, which together produce a burst of activity. Whether that burst continues depends on whether genuine interest follows it, and that is the part no formation tells you in advance.\n\nBreakout systems are among the most tested ideas in trading — the Donchian channel and the Turtle rules are breakouts with explicit parameters — and they share a characteristic profile: a low proportion of trades that work, with the ones that do work being large. That shape is uncomfortable to trade, and it is the reason most people abandon breakout systems during the long stretches of small losses that are a normal part of them.\n\nWhere people get fooled: on retail timeframes false breaks are common, and each one is expensive because the entry is at the extreme of the range. Fading them is a whole strategy family in its own right. In this project's own testing the breakout families lost out-of-sample once costs were applied.",
usage:"Generally used with a defined boundary decided in advance and invalidation just back inside it, since the setup's premise fails the moment price closes back in the range. Whether to enter on the break or on a retest of it is a testable choice, not a matter of preference.",
see:["False breakout","Donchian Channel","Retest","Consolidation","Measured move"]},

"Risk:reward":{
long:"Risk to reward is the potential gain of a trade divided by the potential loss, measured before entry from the entry price, the invalidation level and the target. A trade risking 20 points to make 60 is 1:3.\n\nThe reason it matters is arithmetic. The ratio determines the win rate you need simply to break even: at 1:1 you need better than half, at 1:3 roughly a quarter, at 1:5 under a fifth. That relationship is fixed and it is the single most useful piece of maths a new trader can hold.\n\nWhat it does not do is make a trade good. The ratio is a property of where you put three lines on a chart, and you can produce any ratio you like by moving the target further away. A 1:10 setup with a target price rarely reaches is worse than a 1:1 with a target that is hit routinely. The ratio only means something alongside how often each outcome actually occurs, which requires a trade log rather than an opinion.\n\nWhere people get fooled: quoting the planned ratio rather than the realised one. Partial exits, moved stops and scratched trades all mean the ratio you achieved is rarely the one you planned. Logging both is what turns this from a slogan into information.",
usage:"Used as a pre-trade filter — a minimum ratio below which a setup is skipped — and as the unit that makes results comparable across instruments. It should be computed from the invalidation level, not chosen to make the trade look acceptable.",
see:["R","Expectancy","MAE / MFE","Target selection","Stop placement logic"]},

"Drawdown":{
long:"Drawdown is the fall from an equity peak to the trough that follows it. Maximum drawdown is the worst such fall on record, and it is the number that tells you whether a strategy is one you could actually have held.\n\nIt matters more than the return figure because it is what you experience. Two strategies with identical annual returns can have a 10% and a 50% worst case, and only one of those is something a person keeps trading. Every strategy has a drawdown; the question is whether you would still have been pressing buttons at the bottom of it.\n\nTwo properties are worth internalising. First, recovery is asymmetric: down 50% needs 100% to get back, down 90% needs 900%. Second, duration matters as much as depth — a 20% drawdown lasting three years ends more strategies than a 40% one lasting three months, because people abandon systems out of boredom and doubt as readily as out of pain.\n\nWhere people get fooled: assuming the worst historical drawdown is the worst possible one. It is simply the worst that happened in your sample, and the next one is under no obligation to respect it. Planning for roughly one and a half times the backtested figure is a common and defensible allowance.",
usage:"Used to set position size, to decide in advance at what depth you reduce risk or stop, and to compare strategies on a risk-adjusted basis rather than on return alone.",
see:["Time under water","Recovery maths","Risk of ruin","Calmar ratio","Drawdown protocol"]},

"Position sizing":{
long:"Position sizing is working backwards from what you are willing to lose and where the trade is invalidated, to arrive at how many units you can hold. Risk budget divided by risk per unit gives size. It is the calculation that decides whether you survive a losing streak.\n\nThe order matters. The stop goes where the idea is proven wrong, and the size follows from that distance. Doing it the other way round — choosing a size and then placing the stop where the loss feels tolerable — puts the stop inside the market's normal noise and guarantees being taken out by ordinary movement.\n\nBecause stop distance varies with volatility, a fixed number of contracts is not a fixed amount of risk. The same 20-point stop is a different bet when the average bar range is 30 points than when it is 300. Sizing off ATR rather than off a fixed point distance is how that drift gets controlled.\n\nWhere people get fooled: rounding up. When the maths says 0.6 contracts, the answer is that the trade is too large for the account, not that you should trade one. Also the belief that conviction justifies size — every setup feels good at the time, which is precisely why the rule has to be mechanical.",
usage:"Applied before every trade as a calculation rather than a judgement, using the account balance, a fixed risk percentage, the stop distance and the value per point.",
see:["Risk per trade","R","ATR","Risk of ruin","Fixed fractional sizing"]},

"Bullish engulfing":{
long:"A bullish engulfing is a candle whose body completely covers the previous candle's body, closing above where the prior one opened. It is read as buyers taking control decisively enough to undo a period of selling.\n\nThe shape does describe something real: within that period, the close finished above the previous open, which means the net result of the two bars is upward. That is a fact about the bars, not a forecast.\n\nContext does nearly all the work. The same shape appearing at a level that has mattered before, after an extended decline, on volume noticeably above average, is a different observation from the same shape appearing in the middle of a chop. On a five-minute chart engulfing candles occur dozens of times a day.\n\nWhere people get fooled: candlestick patterns are taught as a catalogue, which implies each has independent predictive value. When individual patterns are tested in isolation with realistic costs, results tend to sit close to what you would get from entries with no pattern at all. Treat the shape as description and put the weight on where it happened.",
usage:"Generally used as a trigger once location has already been established by something else, and as a way to define invalidation — the low of the engulfing candle is a natural level to be wrong beneath.",
see:["Bearish engulfing","Pattern base rate","Volume confirmation","Rejection","Timeframe"]},

"Hammer":{
long:"A hammer is a candle with a small body near the top of its range and a long lower wick, appearing after a decline. Sellers pushed price down during the period and were rejected before the close.\n\nThe wick is the entire message. It records that price traded lower and would not stay there. That is genuine information about what happened within the bar — it is one of the few candle shapes where the story and the data actually match.\n\nContext determines whether it means anything. The identical shape after an advance is called a hanging man and is read bearishly. Same candle, opposite reading, decided entirely by what preceded it. That fact is worth sitting with, because it tells you the shape alone is not carrying the claim.\n\nWhere people get fooled: hammers in open space, away from any level, are noise with a name. The version worth attention is one whose wick rejected a level that already mattered — which is really a statement about the level, with the candle as confirmation rather than cause.",
usage:"Used as a trigger at a level rather than a standalone signal, with the wick's low giving a natural invalidation point. The distance to that low also sets the position size, which is often the more useful output.",
see:["Pin bar","Shooting star","Hanging man","Rejection","Dragonfly doji"]},

"Premium / discount":{
long:"Premium and discount describe where price sits within a range relative to its midpoint. Above the 50% level is premium, below it is discount. The framing is used to argue that buying should be done in the lower half of a range and selling in the upper half.\n\nThe underlying idea is ordinary and defensible: within a range, entering nearer the boundary you are fading gives a better price and a tighter invalidation than entering in the middle. That is a statement about risk-to-reward geometry, not a prediction.\n\nThe midpoint itself has no special property. It is the arithmetic mean of the range's extremes, and it matters mainly because a lot of people compute the same number. Fibonacci retracement levels are used the same way and the 50% level is not even a Fibonacci ratio.\n\nWhere people get fooled: everything depends on which range you measure. Choosing the swing that defines the range after seeing where price went is where the framework quietly does its fitting. Fix the range definition in advance — which swing, which timeframe — or the tool measures your hindsight rather than the market.",
usage:"Used as a filter on entry location within an already-established directional bias, and to reject setups where the entry sits in the half of the range that gives poor geometry.",
see:["Equilibrium / 50% level","Fibonacci retracement","Optimal trade entry","Range"]},

"Expectancy":{
long:"Expectancy is the average amount a trade makes or loses across a large sample, computed from the win rate and the average size of wins and losses. It is the single number that says whether a set of rules is worth trading.\n\nThe formula is simple: win rate times average win, minus loss rate times average loss. A system winning 40% of the time with wins three times the size of losses returns a positive expectancy despite losing six times in ten. That combination is common and it is why win rate quoted alone is close to meaningless.\n\nExpectancy is usually expressed per trade in R, which makes it comparable across instruments and account sizes. Multiplying it by the number of trades you take in a period gives an estimate of what the approach produces, and that estimate is only as good as the sample the inputs came from.\n\nWhere people get fooled: computing it from too few trades and treating the result as a property of the system. Thirty trades produce enormous variation in all three inputs. A positive expectancy from a small sample is a hypothesis, not a finding, and the first honest question is always how many trades it rests on.",
usage:"Used to decide whether a set of rules is worth continuing with, and to compare approaches on a common scale. It is computed from a trade log rather than estimated, because estimated inputs are consistently flattering.",
see:["Win rate","Profit factor","R","Sample size","Risk:reward"]},

"Stop loss":{
long:"A stop loss is a resting order that closes a position once price reaches a level, capping the loss on that trade. It is the mechanism that converts an open-ended exposure into a defined one.\n\nIts placement should come from the idea, not from the money. The level is where the reason for the trade stops being true — beyond the swing that defined the structure, outside the range you were fading, past the wick you were trading against. If the resulting loss is more than you are willing to take, the answer is fewer units, not a nearer stop.\n\nA resting stop and a mental one are not the same instrument. A mental stop requires you to be present, attentive and willing at the moment it matters, which is exactly when those three are least reliable. On a position held overnight from a different timezone it provides nothing at all.\n\nWhere people get fooled: believing a stop guarantees the price. It guarantees an exit, not a level. In a gap or a halt, the fill happens wherever trading resumes. The second failure is widening one as price approaches — the single habit that turns a planned small loss into an account-ending one.",
usage:"Placed at the point of invalidation at the time of entry, ideally submitted together with the entry so there is never a window with an unprotected position. Moving it is defensible only in the direction that reduces risk.",
see:["Stop placement logic","Invalidation","Mental stop","Gap risk","Moving a stop"]},

"Reality check on this section":{
long:"The ICT and smart-money vocabulary describes chart features that exist. Sweeps, gaps, and areas price left quickly are all visible and mostly measurable. What is not established is the explanatory story attached to them — that a coordinated class of participants is engineering these moves, and that the patterns therefore carry predictive value.\n\nThat story is not observable from price. A chart shows that trading occurred at a price, not who traded or why. Every inference about intent is added by the interpreter, and frameworks built that way tend to explain each outcome after it happens while forbidding nothing in advance. A framework that cannot be wrong cannot be evidence.\n\nMost of the underlying observations have older documented names. A spring is a liquidity sweep. The accumulation-manipulation-distribution cycle is Wyckoff's. Turtle soup is Connors and Raschke's fade of a failed twenty-day breakout. Knowing the lineage is useful because the older literature is generally more careful about what it claims.\n\nNone of this makes the vocabulary useless. It is a compact way to describe chart structure and it communicates efficiently with other people who use it. The problem is only ever the gap between describing a shape and claiming an edge — and that gap is where testing belongs. In this project the sweep family has been through 6 variants and then 784-variant sweeps, and lost out-of-sample.",
usage:"Best treated as shared vocabulary for describing structure, with any claim about profitability sent to a pre-registered test before it changes what you do.",
see:["Falsifiability","Framework vs strategy","Wyckoff method","Institutional order flow","Economic rationale"]},

"Liquidity":{
long:"Liquidity is how easily you can buy or sell size without moving the price against yourself. A liquid market absorbs your order at or near the quoted price; an illiquid one reprices the moment you show up, so the act of trading becomes its own cost.\n\nIt is best understood as depth, not activity. Volume tells you how much traded; liquidity is how much is waiting to trade \u2014 the resting orders stacked at each price in the book. A market can print heavy volume and still be thin at any given moment, which is why liquidity evaporates exactly when it is most needed: in fast moves, the resting orders pull, spreads widen, and the fill you counted on becomes the slippage you ate.\n\nEvery practical cost in trading scales with it. Spread, slippage, and the reliability of stops are all liquidity in different clothes, and the same strategy run on a deep index future and a thin altcoin is two different strategies with two different cost structures.\n\nWhere people get fooled: judging liquidity from calm conditions. The order book at 2pm on a quiet Tuesday says nothing about the book during the news spike \u2014 and the news spike is when your stop needs the book to be there.",
usage:"Checked before choosing an instrument at all \u2014 position size should be trivial relative to what the book routinely absorbs \u2014 and treated as a variable, not a constant: assume the thin-market version of your instrument when placing stops.",
see:["Spread", "Slippage", "Order book / DOM", "Volume"]},

"Spread":{
long:"The spread is the gap between the best bid and the best ask \u2014 the price at which someone will buy from you versus the price at which someone will sell to you. Cross it and you have paid it: a market buy fills at the ask, and the position is instantly marked against the bid, so every trade begins slightly underwater by exactly the spread.\n\nIt is the most honest price of immediacy in markets. The market maker quoting both sides earns the spread for standing ready to trade with anyone, and what they earn is what you pay for not waiting. Limit orders refuse the toll and accept the risk of no fill instead; market orders pay it and are certain.\n\nAs a cost it is invisible on statements \u2014 no line item says spread \u2014 which is why it kills more small-account strategies than commission does. A one-tick spread on a ten-tick target is 10% of the gross move surrendered at entry, before the trade has an opinion. Double the trade frequency and the toll doubles with it.\n\nWhere people get fooled: backtests that fill at the mid price. Real fills cross the spread twice per round trip, and a strategy whose edge is thinner than that toll is a donation schedule.",
usage:"Priced into every strategy as a per-trade tax: know your instrument's typical spread in ticks, compare it to your average target, and treat any widening \u2014 news, thin hours \u2014 as the market raising its price for immediacy.",
see:["Bid", "Ask", "Slippage", "Market maker"]},

"Slippage":{
long:"Slippage is the difference between the price you intended and the price you got. You wanted in at 23,450.50; you were filled at 23,451.25; the missing three ticks are slippage \u2014 paid on entry, paid again on exit, and paid most heavily at exactly the moments that matter.\n\nIt exists because prices move between decision and execution, and because your order consumes the book: the first contracts fill at the touch, the rest walk deeper into the resting orders. Small orders in deep markets slip barely at all; size in thin markets slips brutally. Stops slip worst of all, because a triggered stop is a market order fired into a market that is by definition moving against you \u2014 the fast day that hits your stop is the day the book is thinnest.\n\nSlippage is also the quiet gap between backtest and reality. A simulation that fills every order at the signal price is simulating a market that does not exist, and this project's own testing applies deliberately pessimistic fills for exactly that reason.\n\nWhere people get fooled: measuring slippage on calm days and averaging it. The average hides the tail, and the tail \u2014 one gap through a stop \u2014 can cost more than a month of ordinary fills.",
usage:"Budgeted, not hoped away: assume worse fills than the chart shows, model exit slippage more pessimistically than entry, and log actual fill-versus-intent per trade so the number is yours rather than a guess.",
see:["Spread", "Gap risk", "Liquidity", "Stop loss"]},

"Bid":{
long:"The bid is the highest price a buyer is currently committed to pay \u2014 not an opinion or an estimate, but a live resting order that will execute against anyone willing to sell at it. The entire quoted market is just this: the best bid, the best ask, and the queue of orders behind each.\n\nThe bid matters to you asymmetrically. When you sell at market, the bid is your price; when you hold a long position, the bid is what it is actually worth right now \u2014 valuing a position at the last trade or the mid flatters it by half the spread. And when the market falls fast, it falls by bids being consumed and cancelled: the price does not so much drop as the buyers beneath it vanish.\n\nSize matters as much as price. A bid for two contracts and a bid for two hundred are the same line on a quote screen and completely different facts about the market. Displayed size can also be cancelled in milliseconds, which is why the book shows intent rather than promises.\n\nWhere people get fooled: forgetting which side of the spread they transact on. Buyers pay the ask and sellers receive the bid \u2014 every retail round trip donates the difference, and pricing a strategy off the mid ignores the toll.",
usage:"Read together with the ask as the true two-sided price of the market: longs are marked at the bid, exits at market will hit it, and its size \u2014 not just its level \u2014 is the honest measure of support at a price.",
see:["Ask", "Spread", "Order book / DOM", "Market maker"]},

"Ask":{
long:"The ask \u2014 also called the offer \u2014 is the lowest price a seller is currently committed to accept: the live resting order you will trade against the moment you buy at market. Together with the bid it forms the whole quoted market; everything else on a chart is history.\n\nThe ask is the buyer's reality. Whatever the last trade printed, whatever the mid suggests, the price you actually pay to get long right now is the ask \u2014 and in a rising market it is a moving target, because asks get lifted and cancelled ahead of you, which is how chasing a fast move fills you progressively worse. Rallies climb by consuming offers the way declines fall by consuming bids.\n\nFor shorts the ask is the exit: covering at market means paying it. A short squeeze is this mechanism at its most violent \u2014 forced buyers all needing the ask at once, and each fill pulling the next offer higher.\n\nWhere people get fooled: reading the last traded price as the price. The last trade is where someone else transacted a moment ago; the ask is where you transact now, and in thin or fast conditions the distance between the two is real money.",
usage:"Treated as the true cost of immediacy on the buy side: entries at market pay it, chases pay it repeatedly, and its size relative to the bid's tells you which way the book is leaning right now.",
see:["Bid", "Spread", "Last traded price", "Liquidity"]},

"Volume":{
long:"Volume is the number of contracts or shares that changed hands in a period \u2014 the one chart statistic that is a fact rather than a derivation. Every unit of it records a completed transaction: a buyer and a seller who both agreed, which is why volume is often described as the market's conviction meter.\n\nIts analytical value is context for price. A breakout on triple average volume means many participants transacted at the new prices; the same breakout on a trickle means almost nobody endorsed it. Wyckoff's entire method reduces to comparing effort (volume) with result (price movement) \u2014 heavy volume that fails to move price implies absorption, movement on no volume implies absence rather than strength.\n\nVolume also has structure worth knowing: it clusters at session opens and closes, dies mid-session, and spikes at scheduled news \u2014 so raw comparisons across times of day mislead. And in crypto, reported volume from unregulated venues is routinely inflated by wash trading, which makes venue choice part of reading the number at all.\n\nWhere people get fooled: treating volume as a signal by itself. It qualifies price behaviour; it does not replace it. High volume confirms that something happened \u2014 it does not say which way it resolves.",
usage:"Used as a qualifier: compare a move's volume against the recent average for that time of day, and let unusual volume upgrade or downgrade the price signal rather than generate one alone.",
see:["Volume confirmation", "Open interest", "Effort vs result", "Liquidity"]},

"Open interest":{
long:"Open interest is the number of derivative contracts currently alive \u2014 positions opened and not yet closed, delivered or expired. It exists because futures and options are created in pairs: every contract has a long and a short, and open interest counts the pairs still standing.\n\nIts value is the dimension volume lacks. Volume says how much trading happened; open interest says whether that trading built positions or unwound them. Rising price with rising open interest means new money entering longs \u2014 fresh commitment. Rising price with falling open interest means shorts covering \u2014 a rally powered by exits, which tends to stall when the exits finish. The same fork applies inverted to declines.\n\nIn crypto perpetuals the number is unusually consequential: high open interest alongside stretched funding marks a crowded, leveraged side, which is the raw material of liquidation cascades. The pool of trapped positions is measurable before the event that traps them.\n\nWhere people get fooled: reading open interest without price direction, or comparing it across contract rolls in futures, where positions migrating to the next expiry make the front contract's number collapse on schedule rather than meaningfully.",
usage:"Read jointly with price as a four-way table \u2014 price up or down, open interest building or unwinding \u2014 to distinguish fresh positioning from forced exits, and watched in perps as a crowding gauge.",
see:["Volume", "Funding rate", "Liquidation cascade", "Rollover"]},

"Volatility":{
long:"Volatility is how much price swings around \u2014 the size of the moves, without regard to their direction. It is the market's weather: it decides how far your stop must sit, how large your position can be, how fast being wrong hurts, and it does all of that before your directional opinion enters the room.\n\nTwo empirical facts about it do most of the practical work. First, it clusters: wild days follow wild days and quiet follows quiet, which makes recent volatility genuinely informative about tomorrow's \u2014 unusual among market statistics, where most things predict nothing. Second, it is itself tradeable and priced: the options market quotes implied volatility, its forecast of movement, against which realised movement can be compared.\n\nFor a position trader the operational form is ATR \u2014 the average bar range \u2014 because every risk decision should be denominated in it. A twenty-point stop is a different object when the day's range is thirty points than when it is three hundred; sizing that ignores the change is risk drifting silently.\n\nWhere people get fooled: treating volatility as danger and its absence as safety. Quiet markets compress before they expand, and the calm stretch that lulled the position into extra size is routinely the staging ground for the move that removes it.",
usage:"Measured, not felt: ATR sets stop distances and position size, volatility percentile says whether current conditions are ordinary for the instrument, and every rule that worked in one regime is re-checked when the regime changes.",
see:["ATR", "Implied volatility", "Volatility clustering", "Position sizing"]},

"Market maker":{
long:"A market maker is a firm that quotes both sides of the market continuously \u2014 a bid and an ask, all day \u2014 earning the spread in exchange for standing ready to trade with whoever shows up. Modern examples are electronic firms like Citadel Securities and Jane Street; the open-outcry ancestor was the pit local.\n\nThe business is inventory management at speed, not prediction. A maker wants to buy at the bid, sell at the ask, and end the day flat, collecting the toll thousands of times; its enemy is adverse selection \u2014 being run over by informed flow that hits its quotes just before the price moves. Everything makers do, from widening spreads in volatility to pulling quotes around news, is defence against being the counterparty to someone who knows more.\n\nIn retail folklore the market maker is a villain hunting individual stops. The mundane truth is less personal: makers manage exposure against flow in aggregate, and the behaviour retail reads as targeting \u2014 price running obvious stop clusters \u2014 needs no villain, only order mechanics at levels everyone can see.\n\nWhere people get fooled: blaming fills on manipulation while paying the widest possible toll voluntarily \u2014 trading at market, in thin hours, through news, in wide-spread instruments. The spread is the maker's fee, and when you cross it is up to you.",
usage:"Understood as the standing counterparty whose spread is your cost of immediacy: trade liquid hours to pay tighter tolls, and expect quotes to thin exactly when everyone needs them at once.",
see:["Spread", "Adverse selection", "Bid", "Liquidity"]},

"Commission":{
long:"Commission is the explicit fee your broker charges per trade \u2014 the visible line item, as distinct from the spread and slippage which are paid in price. On futures it is quoted per contract per side, plus exchange and clearing fees; a full round trip on a micro contract like MNQ typically runs somewhere near a dollar and a half all-in.\n\nSmall numbers deserve arithmetic rather than dismissal. A cost of $1.50 per round trip on a strategy that trades five times a day is roughly $150 a week \u2014 an invisible position permanently short your own activity. For scalping strategies chasing a few ticks, commission plus spread routinely exceeds the average gross win, which is why cost-heavy styles that look profitable at the signal level die on the statement.\n\nZero-commission offerings moved the fee rather than removing it: brokers paid by order-flow wholesalers earn from routing, and the cost reappears in execution quality. Somebody always charges the toll; the only question is which line it hides on.\n\nWhere people get fooled: testing strategies gross of costs, or comparing brokers on commission alone while ignoring the platform's fills. The whole toll \u2014 commission, spread, slippage \u2014 is one number to your equity curve, and only the whole number matters.",
usage:"Loaded into every backtest and every expectancy calculation at realistic rates, and reviewed as a ratio: costs as a percentage of gross profits is a vital sign, and a rising one usually means overtrading rather than pricier fees.",
see:["Spread", "Slippage", "Overtrading", "Expectancy"]},

"Tick":{
long:"A tick is the smallest price increment an instrument is allowed to move \u2014 the exchange-defined quantum of price. On MNQ it is 0.25 index points worth $0.50 per contract; nothing can trade between the ticks, so all price movement is a whole number of them.\n\nTicks are the honest unit for costs and stops. The spread is one tick or several; slippage is counted in them; a stop nine ticks away is a precise quantity of risk once multiplied by tick value and contracts. Thinking in points or dollars without knowing the tick structure invites small, constant rounding errors in the arithmetic that decides size.\n\nTick size also shapes how an instrument trades. A large tick relative to price makes queue position valuable and spreads effectively fixed; a tiny tick lets prices crawl and spreads compress. Exchanges tune tick sizes deliberately for exactly these effects, which is why two similar instruments can feel entirely different to execute.\n\nWhere people get fooled: mixing units \u2014 quoting the stop in points, the target in dollars, the spread in ticks \u2014 and losing track of what one unit of anything is worth. Every instrument has one conversion table, and it belongs in memory before the first order.",
usage:"Learned as the instrument's atomic unit: know the tick size and tick value cold, denominate costs and stop distances in ticks, and convert to money only at the sizing step.",
see:["Point / handle", "Spread", "Position sizing", "Instrument"]},

"Point / handle":{
long:"A point is one whole unit of an instrument's price \u2014 the Nasdaq index moving from 23,450 to 23,451 moved one point \u2014 and the handle is the number's whole-number stem, so at 23,450.75 the handle is 23,450. Traders speak in points and handles because full quotes are cumbersome at speed.\n\nThe practical content is the conversion. A point is worth a fixed dollar amount per contract \u2014 $2 on MNQ, $20 on its big sibling NQ \u2014 and every piece of trade arithmetic runs through that multiplier: a 50-point stop on two MNQ contracts is $200 of risk; the same idea on NQ is $2,000. Identical chart, identical points, ten times the consequence \u2014 which is precisely how traders switching contracts without re-doing the arithmetic get hurt.\n\nHandles also matter as landmarks. Round handles collect orders because humans anchor on round numbers, which gives the big figures \u2014 every 100 points, every 1,000 \u2014 a genuine mechanical footnote: order flow really does cluster there.\n\nWhere people get fooled: hearing points and thinking they are comparable across instruments. Fifty points of Nasdaq, fifty points of crude and fifty pips of a currency pair are unrelated quantities until each is multiplied by its own contract value.",
usage:"Used with its multiplier attached: points express distance on the chart, but risk, targets and expectancy are points times dollars-per-point times contracts, and the multiplier check comes before every trade on an unfamiliar instrument.",
see:["Tick", "Notional value", "Position sizing", "Round numbers"]},

"Instrument":{
long:"An instrument is the thing you are actually trading \u2014 a specific contract or security with its own rulebook: tick size, trading hours, margin, settlement, cost structure. MNQ, a share of CBA, EURUSD and a BTC perpetual are all bets on prices, and beyond that they share almost nothing operationally.\n\nThe rulebook is the point. The same chart pattern on two instruments is two different trades: one gaps overnight and the other trades continuously; one costs a fixed commission and the other a percentage; one settles in cash and the other can be force-closed by a funding mechanism. Strategy results never transfer cleanly across instruments because the strategy was always the rules plus the instrument, not the rules alone \u2014 this project's own testing found the same wrapper producing +100% on one index vehicle and roughly nothing on another.\n\nInstrument choice is also the first risk decision. Leverage, liquidity, session behaviour and cost per trade are mostly fixed by what you trade before how you trade it gets a vote.\n\nWhere people get fooled: learning a setup on one instrument from someone trading another, and assuming the edge \u2014 if it exists \u2014 survives the move. The pattern may translate; the costs, hours and gap behaviour do not.",
usage:"Chosen deliberately: read the contract specification before the chart, match the instrument's liquidity and cost structure to the account size, and treat every strategy claim as instrument-specific until tested.",
see:["Contract specification", "Instrument selection", "Tick", "Liquidity"]},

"Ticker":{
long:"A ticker is the short code an instrument trades under \u2014 AAPL, MNQ1!, BTCUSDT \u2014 a naming convention inherited from the ticker tape machines that once printed trades on paper ribbon. It looks like trivia and is actually a common source of real, avoidable error.\n\nThe traps are concrete. The same company trades under different codes on different exchanges; the same code can mean different things across venues. Futures tickers carry contract months in their suffixes \u2014 the December and March contracts are different instruments at different prices \u2014 while the continuous chart symbol many platforms show (the 1! style) is a stitched abstraction nobody can actually trade. Crypto multiplies the problem: BTCUSD, BTCUSDT and a BTC perpetual differ by quote currency, venue and mechanism, and their prices genuinely diverge.\n\nData feeds inherit all of this. A backtest quietly run on the wrong variant \u2014 the ETF instead of the future, the spot pair instead of the perp \u2014 produces confident results about an instrument you were never trading.\n\nWhere people get fooled: fat-fingering an adjacent symbol and trading it \u2014 a classic, expensive error \u2014 or charting one variant while executing another, then wondering why the levels never quite line up.",
usage:"Verified rather than assumed: confirm the exact symbol, venue and contract month before ordering, and make sure the chart, the data feed and the order ticket all point at the same instrument.",
see:["Instrument", "Exchange", "Rollover", "Contract specification"]},

"Exchange":{
long:"An exchange is the venue where buyers and sellers actually meet \u2014 the matching engine that pairs orders by price and time, publishes the tape, and stands behind the trades. CME hosts the index futures, ASX the local shares, Binance the crypto pairs; your broker is the doorway, but the exchange is the room.\n\nWhat an exchange provides is worth naming precisely: a central order book with published matching rules, transparent prices everyone sees simultaneously, and \u2014 through its clearing house \u2014 a guarantee that the other side of your trade performs even if the counterparty fails. That last piece is invisible until it matters, and it is why regulated futures survived counterparty collapses that vaporised accounts on unregulated venues.\n\nExchanges also set the operating physics: trading hours, tick sizes, halt rules, margin schedules, position limits. Two instruments tracking the same underlying on different venues behave differently because their venues do.\n\nWhere people get fooled: treating venue as an afterthought, especially in crypto, where an exchange may be broker, custodian, market maker and counterparty at once \u2014 a concentration of roles regulated markets deliberately separate. When one entity is the whole room, the room's failure is total.",
usage:"Known, not assumed: which venue your instrument trades on determines its hours, halts, guarantees and costs \u2014 and in unregulated markets, the venue itself is one of the risks being underwritten.",
see:["Broker", "Clearing house", "Halt", "Custody"]},

"Broker":{
long:"A broker is the intermediary that gives you access to the exchange: it holds your money, transmits your orders, extends your margin and charges for the privilege. Tradovate, IBKR and CommSec are doorways to markets they do not themselves operate.\n\nThe relationship has more texture than access. Your broker sets the margin you actually trade on \u2014 often stricter than exchange minimums, sometimes looser intraday \u2014 and it is the entity that force-closes you when equity breaches maintenance. It decides which order types exist for you, how your orders route, and in some models it is quietly your counterparty: a dealing-desk broker takes the other side of your trade, an arrangement in which your loss is its revenue.\n\nBroker failure is a real, separate risk from market risk. What survives it is determined by client-money segregation and the jurisdiction's compensation regime \u2014 details buried in the account agreement that matter more than any feature on the marketing page.\n\nWhere people get fooled: choosing on commission and interface alone. Execution quality, margin behaviour on volatile days, whether funds are segregated and who regulates the entity are the expensive variables, and they only become visible during exactly the events you hope never happen.",
usage:"Selected like a counterparty, because it is one: regulated in a strong jurisdiction, client money segregated, margin rules read before they are experienced, and never confused with the exchange whose prices it relays.",
see:["Exchange", "Margin call", "Broker insolvency", "Regulation"]},

"Realised vs unrealised":{
long:"Realised profit is banked: the position is closed and the money is yours. Unrealised profit exists only while the market cooperates \u2014 a mark on an open position, recalculated every tick, repayable on demand. The distinction sounds like accounting and behaves like psychology.\n\nUnrealised gains change decisions. A position up 40 points gets managed as if those points were possessions \u2014 moves against it feel like losses being inflicted rather than profits never captured, and traders start defending open profit with tightened stops and early exits their plan never specified. Kahneman's loss-aversion asymmetry applies with full force to money that was never banked.\n\nUnrealised losses distort harder. The unclosed loser is not yet real, and holding preserves the story that it might never be \u2014 the exact mechanism behind the disposition effect and every account that rode a small loss into a catastrophic one.\n\nProp-firm trailing drawdowns add a mechanical version: many trail from unrealised peaks, so open profit you never banked can permanently raise your loss floor.\n\nWhere people get fooled: counting open profit as income. The honest ledger counts realised results only, and treats every open position as risk still on the table, whatever colour it currently glows.",
usage:"Kept as two ledgers: performance is measured on closed trades, open positions are measured as exposure, and any rule that treats open profit as spendable \u2014 mentally or mechanically \u2014 gets rewritten.",
see:["Loss aversion", "Disposition effect", "Trailing drawdown", "Paper profit trap"]},

"Leverage vs margin":{
long:"Leverage is the ratio between the exposure you control and the capital you committed; margin is the deposit the broker locks up to let you hold it. They are two views of the same arrangement \u2014 margin is what you post, leverage is what it buys \u2014 and confusing them is how position sizes go quietly wrong.\n\nThe deception is that margin looks like cost. One MNQ contract might require $1,700 of margin while controlling roughly $47,000 of index \u2014 the margin is not the price of the position, it is a good-faith deposit against a $47,000 bet, and every point of index movement settles against the full notional, not the deposit. Low margin does not mean a small position; it means high leverage, which is the opposite.\n\nDay-trading margins sharpen the trap: a broker offering $50 intraday margin on the same contract has changed nothing about the exposure \u2014 $2 per point either way \u2014 only about how little cash stands between an adverse move and a forced liquidation.\n\nWhere people get fooled: sizing by margin consumed \u2014 I can afford four contracts \u2014 instead of by notional exposure and stop-distance risk. Affordability of the deposit says nothing about survivability of the position.",
usage:"Kept separate on purpose: margin answers what the broker requires, leverage and notional answer what you actually hold, and position size is derived from risk arithmetic that never mentions the margin at all.",
see:["Notional value", "Margin call", "Position sizing", "Risk per trade"]},

"Position vs order":{
long:"A position is exposure you hold; an order is an instruction that may or may not become one. The distinction is elementary and its violations are among the most common real-money mistakes in retail trading.\n\nThe failure modes are specific. A working limit order forgotten from last week fills during a spike, and you discover a position you did not know you had, at a price you no longer want, in a thesis you abandoned days ago. A cancel that never went through leaves a live stop that closes a position you meant to keep. A partial fill leaves you holding half the size your risk arithmetic assumed, with a full-size stop attached. In each case the trader's mental book and the broker's actual book disagreed, and the broker's version is the one that pays or costs.\n\nAutomation raises the stakes: a bot that believes it is flat while an order rests is a bot that will double its position on a retry \u2014 which is why reconciliation against the broker's records, not one's own beliefs, is a running discipline rather than a one-off check.\n\nWhere people get fooled: reviewing positions and ignoring working orders. The flat account with three resting orders is not flat; it is short three contingencies.",
usage:"Audited as a pair: end every session by reconciling open positions and working orders against the broker's own records, and treat any order without a current reason to exist as a defect to cancel.",
see:["Reconciliation", "Time in force", "Partial fill", "Stop loss"]},

"Paper profit trap":{
long:"The paper profit trap is treating unrealised gains as achievement \u2014 sizing up, loosening rules and mentally spending money the market has only lent. The equity high on an open position feels like a fact; it is a quote, and quotes retract.\n\nThe trap has a behavioural engine and a mechanical one. Behaviourally, open profit inflates confidence at precisely the moment discipline pays best: after a good run, entries loosen, size creeps and the plan's constraints feel like formalities the trader has outgrown \u2014 the classic setup for giving a streak back with interest. House-money reasoning completes the loop: risking recent gains does not feel like risking money, though the account cannot tell the difference.\n\nMechanically, some structures hard-code the trap. Prop-firm trailing drawdowns commonly trail from peak unrealised equity, so a spike you never banked permanently raises the floor you can be failed at \u2014 paper profit converted directly into real jeopardy.\n\nWhere people get fooled: measuring themselves at the open-equity high. The honest yardstick is realised results at scheduled reviews; anything else grades the market's temporary generosity as personal skill.",
usage:"Defused by rules that only recognise banked outcomes: size derives from settled equity, not open marks; reviews grade closed trades; and profit-protection decisions follow the written plan rather than the glow of an open winner.",
see:["Realised vs unrealised", "Trailing drawdown", "Overconfidence after a win streak", "Withdrawal policy"]},

"Trade frequency":{
long:"Trade frequency is how often a strategy transacts, and it quietly governs three things at once: how fast costs accumulate, how fast evidence accumulates, and what the experience of trading it feels like.\n\nCosts scale linearly with it. Every trade pays spread and commission, so doubling frequency doubles the toll on an edge that may not have doubled with it \u2014 high-frequency retail styles die of costs far more often than of wrong ideas.\n\nEvidence scales with it too, and this cuts the other way. A strategy that trades once a week needs years to produce a sample that distinguishes edge from luck; its backtest is thin, its live evaluation glacial, and every losing month statistically uninformative. A day-trading strategy reaches judgment-worthy sample sizes in months. Slow strategies are cheaper to run and far more expensive to validate.\n\nThe tension has no free resolution \u2014 only a conscious trade-off between the cost tax of trading often and the evidence famine of trading rarely.\n\nWhere people get fooled: letting frequency drift upward from boredom rather than from signal \u2014 the strategy's true frequency is set by how often its conditions occur, and every trade beyond that is overtrading wearing the strategy's clothes.",
usage:"Chosen deliberately when selecting a strategy: match it to the account's cost structure and to how long you are willing to wait for statistical verdicts, then police actual frequency against it in the log.",
see:["Overtrading", "Commission", "Sample size", "Expectancy"]},

"Minimum viable account":{
long:"The minimum viable account is the smallest balance at which an instrument can be traded with honest risk arithmetic \u2014 where a sensible stop, at the smallest available size, stays within your risk-per-trade rule. Below that line, the maths refuses: the account is not small, it is incompatible.\n\nThe calculation is unforgiving. One MNQ contract at $2 per point with a normal 40-point stop risks $80; if that must be no more than 1% of the account, the account must hold $8,000. A $2,000 account trading the same setup is risking 4% per trade not by choice but by structure \u2014 the instrument's smallest unit is too big for the wallet, and every trade is oversized before any decision gets made.\n\nUndersized accounts fail by arithmetic, not just variance: costs loom larger per trade, a routine losing streak breaches ruin territory, and the pressure to make it grow produces exactly the overtrading and oversizing that finish the job.\n\nWhere people get fooled: shrinking the stop instead of the ambition \u2014 placing stops where the account can afford rather than where the trade is wrong, which converts a sizing problem into a strategy that cannot work.",
usage:"Computed before funding anything: instrument's sensible stop, times unit value, divided by risk fraction, equals the account the strategy actually requires \u2014 and if the number is out of reach, the instrument changes, not the stop.",
see:["Position sizing", "Risk per trade", "Instrument selection", "Stop too tight"]},

"Alpha versus noise":{
long:"Alpha versus noise is the discipline's central question: is a result skill, or is it what randomness produces anyway? Every backtest, every hot month, every impressive screenshot is one or the other, and they are indistinguishable by appearance \u2014 only by statistics against the right baseline.\n\nThe baseline is what most evaluation skips. Random entries with the same costs and holding periods produce streaks, smooth equity curves and multi-month runs of profit as a matter of course; a strategy has demonstrated nothing until it beats that, persistently, out of sample. This project runs exactly that control, and its own record is the sobering exhibit: across roughly 58,700 backtests, a random trader ranks near the top of the entire database by deflated Sharpe, and the best results found sit at levels a pure-noise search of equal size was expected to produce.\n\nThe search itself manufactures false alpha: test enough variants and the best one looks brilliant by construction, which is why the honest question is never how good does it look but how many things were tried before it.\n\nWhere people get fooled: demanding this rigour from others' claims and exempting their own month of live results \u2014 a sample far too small to distinguish anything, felt from inside as obvious skill.",
usage:"Applied as a standing filter: every promising result is asked what the noise baseline was, how many variants were searched, and whether the edge survived data it was never fitted to \u2014 and until then it is treated as noise that has not confessed yet.",
see:["Multiple testing", "Sample size", "Out-of-sample", "Sharpe ratio"]},

"FOMO":{
long:"FOMO \u2014 fear of missing out \u2014 is entering because a move is happening without you, not because your conditions are met. The trigger is the discomfort of watching, and the discomfort is real: a rally you are not in feels like money being taken from you, even though unmade profits cost nothing.\n\nThe structural problem with FOMO entries is that they are late by definition \u2014 the move had to already exist to be missed \u2014 and late entries have the worst geometry available: the entry is far from any sensible invalidation, so either the stop is too distant to size properly or too near to survive normal noise. The trade is worse on every measurable axis than the planned version of the same idea.\n\nMarkets also select for this error. The moves that most trigger the feeling are the fastest and most visible ones, which are precisely the moves most prone to snap back once the burst of chasing entries is spent.\n\nWhere people get fooled: remembering the one chase that worked. Occasional reinforcement is the strongest kind, and one rescued FOMO entry funds years of bad ones.",
usage:"Handled structurally rather than by willpower: a written rule that any entry must have existed as a plan before the move began, and a log field marking chased entries so their cost becomes a number rather than a feeling.",
see:["Discipline", "Boredom trading", "Revenge trading", "Pre-commitment"]},

"Revenge trading":{
long:"Revenge trading is re-entering immediately after a loss to win it back \u2014 usually bigger, usually faster, usually with less setup than the trade that just failed. The loss stops being an expense and becomes an insult, and the next trade's purpose quietly changes from making money to erasing the feeling.\n\nIt is the most reliably destructive behaviour in retail trading because it stacks three errors at the worst moment: size increases exactly when judgement is most impaired, entries loosen exactly when patience is most needed, and the recovery arithmetic means each further loss digs a disproportionately deeper hole. A bad hour, not a bad strategy, is how most accounts actually end.\n\nThe tell is time. Planned trades can happen minutes apart if conditions genuinely repeat, but a re-entry within moments of a stop-out, in the same instrument, in the same or opposite direction, sized larger, is almost never a plan \u2014 it is the loss talking.\n\nWhere people get fooled: believing they will recognise the state from inside it. Tilt does not feel like tilt; it feels like clarity and urgency. That is why the defence has to be mechanical.",
usage:"Contained by pre-commitment: a fixed rule \u2014 after N consecutive losses or a daily loss threshold, the platform closes for the day \u2014 decided while calm, because the moment it is needed is the moment it cannot be decided.",
see:["Tilt", "Recovery maths", "Pre-commitment", "Discipline"]},

"Tilt":{
long:"Tilt is the emotional state in which decisions stop matching the plan \u2014 borrowed from poker, where it describes the player who has stopped playing cards and started playing feelings. In trading it follows losses, near-misses, and sometimes wins, and its signature is urgency: everything suddenly needs to be traded now.\n\nThe practical problem is that tilt impairs the very faculty that would detect it. From inside, the state reads as focus and conviction; the trades feel unusually obvious. Self-diagnosis in the moment fails so consistently that any risk plan relying on noticing your own tilt is a plan with a hole in the middle.\n\nWhat works is externalising the detection: rules that fire on observable events rather than on self-assessment. Number of trades per hour, losses in a row, size relative to plan \u2014 a breach of any of these is visible in the log even when the state is invisible from inside.\n\nWhere people get fooled: treating tilt as a character flaw to be overcome rather than a predictable operating condition to be engineered around. Everyone tilts. The traders who survive it are the ones whose systems assume it will happen.",
usage:"Managed with tripwires rather than introspection: predefined limits on trades per session, consecutive losses and daily drawdown, each with an automatic consequence that does not consult you at the time.",
see:["Revenge trading", "Pre-commitment", "Discipline", "Variance tolerance"]},

"Overtrading":{
long:"Overtrading is taking trades because you are present rather than because conditions are met \u2014 trading as an activity instead of as a response. It is the quietest account killer, because no single overtrade looks dangerous; the damage arrives as arithmetic.\n\nCosts scale with trade count while edge does not. Every entry pays the spread and commission whether or not it was a good idea, so a trader whose genuine setups occur twice a day but who trades ten times a day runs eight cost-only trades against two meaningful ones. The strategy can be sound and the account still bleeds, and the bleed hides inside individually forgettable results.\n\nThe deeper mechanism is that screens reward interaction. Watching without acting is genuinely hard, boredom generates signals on demand, and every candle offers something interpretable to a mind looking for permission.\n\nWhere people get fooled: reviewing only outcomes, where overtrading hides among the noise, rather than reviewing trade counts against the plan. The question is not whether the extra trades lost \u2014 some won \u2014 but whether they were in the plan at all.",
usage:"Diagnosed from the log by comparing actual trade frequency against what the strategy's conditions could plausibly generate; treated with hard caps per session and, for the disciplined few, by defining in advance what a valid signal is and counting everything else as error regardless of outcome.",
see:["Boredom trading", "Discipline", "Trading plan", "FOMO"]},

"Confirmation bias":{
long:"Confirmation bias is seeking and over-weighting evidence that supports what you already believe while discounting what contradicts it. In trading it activates the moment a position is opened: the entry converts a neutral analyst into a defendant, and every subsequent piece of information gets sorted by whether it helps the case.\n\nThe effect is measurable in ordinary behaviour: the long who rereads bullish arguments while dismissing the bearish close as manipulation; the analyst who marks every level that held and none that broke; the backtester who stops investigating the moment results turn positive. None of it feels like bias from inside \u2014 it feels like understanding deepening.\n\nMarkets punish this specific error with unusual efficiency, because positions held on curated evidence do not exit when the original reason dies; they exit when the pain exceeds the story, which is invariably later and lower.\n\nWhere people get fooled: believing awareness is protection. Knowing about confirmation bias does not weaken it \u2014 the fix is procedural: writing the invalidation before entry, so that one pre-committed fact outranks all the selectively gathered ones after it.",
usage:"Countered in writing: the invalidation level and the thesis are recorded before entry, and the review asks whether the exit followed the written line or the accumulated rationalisations.",
see:["Invalidation", "Hindsight bias", "Trading journal", "Pre-commitment"]},

"Recency bias":{
long:"Recency bias is over-weighting whatever happened last when estimating what happens next. The most recent trades, the most recent regime, the most recent streak all loom larger than their statistical weight deserves, and decisions quietly recalibrate to a sample of one.\n\nIn trading it produces two mirrored errors. After losses, a sound plan gets abandoned mid-sample \u2014 three stop-outs and the setup is declared broken, though three losses in a row is unremarkable for any real win rate. After wins, size creeps up and conditions loosen, because the recent past insists the game has become easy. Both moves replace the strategy's long-run statistics with last week's mood.\n\nThe market amplifies the bias by being genuinely regime-like: stretches of trending and chopping do cluster, so recent behaviour feels informative. The trap is that the feeling is strongest exactly when a stretch is mature \u2014 confidence in the recent pattern peaks near its expiry.\n\nWhere people get fooled: honouring the bias in system design \u2014 endlessly re-tuning parameters to the last month of data, which is recency bias with extra steps and a backtester.",
usage:"Managed by fixing evaluation windows in advance: a strategy is judged on its full log at pre-set review dates, not re-litigated after every streak, and any parameter change requires evidence beyond the recent handful of trades.",
see:["Sample size", "Gambler's fallacy", "Overconfidence after a win streak", "Regime change"]},

"Trading plan":{
long:"A trading plan is the written document that answers every operational question before the market can ask it: what you trade, on which timeframe, in which sessions, what a valid setup is, where entries and invalidations go, how size is computed, what the daily loss limit is, and \u2014 the part almost everyone omits \u2014 the conditions under which you stop trading entirely.\n\nIts purpose is not bureaucracy; it is moving decisions from the worst decision-making environment to the best one. At the screen, with money moving, every choice is made under pressure by a brain flooded with recent outcomes. At the desk on a Sunday, the same choices are made calmly with the whole record in view. The plan is a pipeline carrying the Sunday brain's judgement into the Tuesday afternoon.\n\nUnwritten plans do not survive contact with a losing streak \u2014 they renegotiate themselves in real time and leave no evidence of the drift. A written one converts drift into a visible, countable act: you either followed the page or you did not.\n\nWhere people get fooled: writing the entry rules and stopping there. Entries are the plan's least important section; sizing, loss limits and stopping conditions are what decide survival.",
usage:"Written once, followed mechanically, and revised only at scheduled reviews with the log open \u2014 never mid-session. The journal's follow-the-plan column measures the plan's real-world existence.",
see:["Discipline", "Pre-commitment", "Trading journal", "Process vs outcome"]},

"Trading journal":{
long:"A trading journal is the per-trade record that makes improvement possible: for each trade, the setup, the reason, the planned entry, stop and target, the actual fills, the R result, and \u2014 the field that pays for all the others \u2014 whether the plan was followed. Screenshots of the chart at entry and exit turn arguments with memory into evidence.\n\nThe journal exists because memory is an advocate, not an archivist. Untracked, winners inflate, losses acquire excuses, chased entries get reclassified as intuition, and the trader's self-model drifts steadily away from the account's reality. Thirty honest entries usually contain an unwelcome discovery \u2014 most commonly that two or three specific behaviours account for the bulk of the losses, and that they were invisible from inside.\n\nIts second function is sample-building: expectancy, drawdown and every statistic worth having are computed from the log, and without one there is nothing to compute \u2014 only impressions.\n\nWhere people get fooled: journaling outcomes instead of decisions. A record of profits and losses is an accounting document; the leverage is in recording why, and grading the why against what was written before the trade.",
usage:"Filled in at entry and exit while the reasons are still true, reviewed weekly for behaviour and monthly for statistics. This app's strategy log, MAE/MFE fields and notes timeline exist to make the habit cheap.",
see:["Process vs outcome", "MAE / MFE", "Trading plan", "Expectancy"]},

"Discipline":{
long:"Discipline in trading is doing what you decided when calm, at the moment you no longer feel like it. Every part of a plan is easy to follow while it is working; discipline is the bridge across the stretches when it is not.\n\nThe folk model treats it as a character trait \u2014 some people have it. The evidence of every blown account argues otherwise: discipline behaves like a consumable resource that depletes under stress, fatigue and loss, and the trader relying on willpower at 2am after three stop-outs is relying on the emptiest tank they own. The traders who look disciplined from outside are usually the ones who arranged not to need it \u2014 hard stops instead of intentions, size computed instead of chosen, sessions with fixed cut-offs, platforms that close at the daily limit.\n\nThat reframe is the practical insight: discipline is an engineering problem. Every decision moved out of the moment and into a rule is a decision that no longer requires character to get right.\n\nWhere people get fooled: responding to a discipline failure with resolutions rather than mechanisms. The next lapse arrives under the same conditions as the last one; only the system can be different by then.",
usage:"Built as infrastructure: resting stops, mechanical sizing, pre-committed limits with automatic consequences. The journal's plan-followed column is its measurement, and drift in that column is the earliest warning the system gives.",
see:["Pre-commitment", "Trading plan", "Tilt", "Mental stop"]},

"Loss aversion":{
long:"Loss aversion is the asymmetry Kahneman and Tversky documented at the heart of prospect theory: losses hurt roughly twice as much as equivalent gains satisfy. A fifty-point loss and a fifty-point win are arithmetic twins and emotional strangers, and decision-making bends around the heavier one.\n\nIn trading the bend has a signature shape. Open losses get held \u2014 closing makes the loss real, and holding preserves the possibility of not having to feel it \u2014 while open gains get snatched, because banked pleasure now beats risking the small pain of watching it retrace. The result is the exact inversion of every profitable system's requirement: losses run, winners are cut. This pattern is measurable at scale in brokerage records, where it appears as the disposition effect.\n\nNo amount of knowing this dissolves it; the asymmetry sits below argument. What changes outcomes is removing the moment of choice \u2014 resting stops that execute the loss without a decision, targets and trailing rules that let winners breathe without consulting the feeling.\n\nWhere people get fooled: interpreting the discomfort of closing a loser as information about the trade. It is information about being human; the chart has not changed.",
usage:"Neutralised by automation at the exits: the stop rests at the exchange from entry, and profit-taking follows a written rule, so neither outcome routes through the asymmetry.",
see:["Disposition effect", "Stop loss", "Sunk cost fallacy", "Pre-commitment"]},

"Sunk cost fallacy":{
long:"The sunk cost fallacy is letting what you have already spent decide what you do next \u2014 staying in a trade because of how much it has cost, holding a strategy because of how long you have worked on it, defending an analysis because of how publicly you made it. The spent portion is gone identically in every future; only the next decision differs.\n\nIn a position, the fallacy speaks fluent trader: I've held it this far; it owes me; I'll leave when I'm back to even. Each phrase treats the entry price as a fact about the market, when the market has never met your entry. The stock does not know where you bought it, and breakeven is a coordinate of your psychology, not of the chart.\n\nThe cleanest test is the fresh-eyes question: with no position, would you open this trade here, at this price, at this size? If not, the only thing keeping you in it is the cost of having been in it \u2014 which is the fallacy stated as a position.\n\nWhere people get fooled: applying it in one direction only. Sunk costs also trap people in strategies, tools and beliefs; the trade version is just the one with a ticker attached.",
usage:"Countered with the fresh-eyes test at every review, and structurally by invalidation levels set at entry \u2014 a pre-committed exit does not care what has been spent since.",
see:["Loss aversion", "Anchoring", "Invalidation", "Quitting well"]},

"Gambler's fallacy":{
