{t:"Leveraged ETF",c:"etf",lvl:2,d:"A fund targeting a multiple of the daily index return, rebalanced every day.",e:"The daily reset means it does not deliver 3x over any period longer than a day. In a choppy sideways market it bleeds even if the index ends flat.",rel:["Volatility decay","Compounding"],warn:true},
{t:"Volatility decay",c:"etf",lvl:2,d:"The erosion in a daily-rebalanced leveraged product caused by compounding across up and down days.",e:"Index +10% then −9.09% ends flat. A 3x fund on those days ends down about 8%. The maths, not the fees, is the problem.",rel:["Leveraged ETF","Recovery maths"],warn:true},
{t:"Inverse ETF",c:"etf",lvl:2,d:"A fund designed to return the opposite of an index, daily.",e:"Same decay problem, plus you are short an asset that drifts up over time. A hedging tool for days, not a position for months.",rel:["Volatility decay"],warn:true},
{t:"Closed-end fund",c:"etf",lvl:3,d:"A fund with a fixed share count that trades independently of NAV, often at a persistent discount.",e:"No creation/redemption to enforce the link, so the discount can widen for years.",rel:["Premium / discount to NAV"]},
{t:"Managed fund",c:"etf",lvl:2,d:"An actively managed pooled vehicle, priced once daily rather than traded intraday.",e:"Most fail to beat their index after fees over long horizons. That is the base rate the whole indexing argument rests on.",rel:["Alpha","Index fund"]},
{t:"Smart beta",c:"etf",lvl:3,d:"Index funds weighted by a factor — value, quality, momentum, low volatility — rather than by market cap.",e:"A packaged factor tilt. Reasonable in principle; the factor's live performance after fees is the question.",rel:["Factor investing"]},
{t:"Cash drag",c:"etf",lvl:3,d:"Uninvested cash held for redemptions, which underperforms in a rising market.",e:"A small, permanent contributor to tracking error.",rel:["Tracking error"]},
{t:"Factor investing",c:"factor",lvl:2,d:"Building portfolios around characteristics with documented long-run return premia rather than around individual forecasts.",e:"The academically respectable version of systematic trading. Decades of data, and still substantial disagreement about which factors survive.",rel:["Value","Momentum factor"]},
{t:"CAPM",c:"factor",lvl:2,d:"The model saying expected return is the risk-free rate plus beta times the market premium.",e:"Empirically incomplete, conceptually foundational. It gave us alpha and beta as concepts.",rel:["Beta","Alpha"]},
{t:"Efficient frontier",c:"factor",lvl:3,d:"The set of portfolios offering the best expected return for each level of risk.",e:"Beautiful in theory. In practice it is extremely sensitive to the expected-return inputs, which nobody knows.",rel:["Markowitz","Correlation matrix"],warn:true},
{t:"Markowitz optimisation",c:"factor",lvl:3,d:"Choosing weights to maximise return per unit of variance given expected returns and covariances.",e:"Known as an error-maximiser: it allocates most heavily to whichever asset's return you overestimated.",rel:["Efficient frontier","Risk parity"],warn:true},
{t:"Fama-French",c:"factor",lvl:3,d:"The models extending CAPM with size and value factors, later profitability and investment.",e:"The reference point for the whole factor literature, and the reason 'the market' is no longer accepted as the only source of return.",rel:["Value","Size factor"]},
{t:"Value",c:"factor",lvl:2,d:"The tendency for cheap-looking assets to outperform expensive ones over long horizons.",e:"Endured a decade of underperformance after 2010. A factor can be real and still fail for longer than you can hold it.",rel:["Factor investing","P/E ratio"],warn:true},
{t:"Momentum factor",c:"factor",lvl:2,d:"The tendency for recent winners to keep outperforming over 3–12 month horizons.",e:"The most robust anomaly across markets and eras. It also crashes violently at sharp reversals.",rel:["Cross-sectional momentum","Momentum crash"]},
{t:"Cross-sectional momentum",c:"factor",lvl:2,d:"Ranking a universe by trailing return — typically 12 months excluding the most recent one — and holding the top slice.",e:"The strongest surviving academic support of any technical idea. Tested here on a 65-asset universe and failed 4 of 4.",rel:["Momentum factor","Time-series momentum"]},
{t:"Time-series momentum",c:"factor",lvl:3,d:"Judging each asset against its own history rather than against peers. The basis of trend-following.",e:"Different mechanism from cross-sectional, despite the shared name.",rel:["Cross-sectional momentum","Trend following"]},
{t:"Momentum crash",c:"factor",lvl:3,d:"The sharp losses momentum takes at violent market reversals, when yesterday's losers rip higher.",e:"March 2009 and November 2020 both did it. The premium is compensation for exactly this.",rel:["Momentum factor"],warn:true},
{t:"Size factor",c:"factor",lvl:3,d:"The historical tendency for smaller companies to outperform larger ones.",e:"Much weaker since it was published, which is the usual fate of a documented anomaly.",rel:["Factor decay"]},
{t:"Quality factor",c:"factor",lvl:3,d:"Profitable, stable, low-debt companies outperforming on a risk-adjusted basis.",e:"One of the better-behaved factors, partly because 'quality' has many definitions and the good ones agree.",rel:["Factor investing"]},
{t:"Low volatility anomaly",c:"factor",lvl:3,d:"Lower-volatility stocks historically delivering better risk-adjusted returns than theory predicts.",e:"Contradicts the idea that risk is always compensated. The leading explanation is that leverage constraints push investors into risky assets instead.",rel:["Factor investing"]},
{t:"Factor decay",c:"factor",lvl:2,d:"The tendency for a published anomaly to weaken once it is widely known and traded.",e:"Measured across dozens of published factors: returns roughly halve post-publication. Assume it applies to anything you read about.",rel:["Regime change","Multiple testing"],warn:true},
{t:"Factor zoo",c:"factor",lvl:3,d:"The several hundred published 'factors', most of which are products of mining the same dataset.",e:"The literature's own multiple-testing problem, at industrial scale. Very few survive an honest correction.",rel:["Multiple testing","Deflated Sharpe ratio"],warn:true},
{t:"Diversification across strategies",c:"factor",lvl:3,d:"Combining approaches whose drawdowns arrive at different times.",e:"Only helps if the return streams are genuinely uncorrelated. Check the correlation before assuming it.",rel:["Correlation matrix","Ensemble"]},
{t:"CAGR",c:"perf",lvl:1,d:"Compound Annual Growth Rate — the smooth annual rate that would take you from start to finish.",e:"It hides everything about the path. Two strategies with identical CAGR can have 10% and 60% maximum drawdowns.",rel:["Drawdown","Total return"]},
{t:"Total return",c:"perf",lvl:1,d:"Price change plus income, which for equities means dividends reinvested.",e:"Comparing a price index to a total-return strategy understates the benchmark by a few percent a year. Match like with like.",rel:["Benchmark","Dividend"],warn:true},
{t:"MAR ratio",c:"perf",lvl:3,d:"CAGR divided by maximum drawdown. The managed-futures industry's blunt instrument.",e:"Same idea as Calmar. Above 0.5 is respectable; above 1 over a long live record is rare.",rel:["Calmar ratio"]},
{t:"Ulcer index",c:"perf",lvl:3,d:"A measure weighting both the depth and the duration of drawdowns.",e:"Closer to what being invested actually feels like than a single max-drawdown number.",rel:["Drawdown","Time under water"]},
{t:"Time under water",c:"perf",lvl:2,d:"How long the equity curve spends below its previous peak.",e:"Often the number that ends a strategy. A 20% drawdown lasting three years breaks more people than a 40% one lasting three months.",rel:["Drawdown","Ulcer index"]},
{t:"Omega ratio",c:"perf",lvl:3,d:"The probability-weighted ratio of gains to losses above a threshold return.",e:"Uses the whole distribution rather than just its mean and variance, which matters for skewed strategies.",rel:["Sortino ratio"]},

{t:"Skew",c:"perf",lvl:2,d:"The asymmetry of the return distribution. Negative skew means many small gains and rare large losses.",e:"Most strategies that feel comfortable are negatively skewed. Trend following is one of the few that is positively skewed, which is why it feels awful to trade.",rel:["Short volatility","Kurtosis"]},
{t:"Kurtosis",c:"perf",lvl:3,d:"How fat the distribution's tails are relative to a normal one.",e:"High kurtosis means extreme outcomes are far more likely than a standard risk model assumes.",rel:["Fat tails"]},
{t:"Rolling returns",c:"perf",lvl:2,d:"Returns measured over every possible window of a given length, rather than from one fixed start date.",e:"Kills the start-date cherry-pick. A strategy that only works from one particular January is not a strategy.",rel:["Selection bias"]},

{t:"Underwater curve",c:"perf",lvl:2,d:"A plot of the distance below the running peak at every point.",e:"More honest than the equity curve, because it shows how long you would have spent losing.",rel:["Time under water"]},
{t:"Annualisation",c:"perf",lvl:2,d:"Scaling a shorter-period figure up to a yearly one, usually by multiplying volatility by the square root of periods.",e:"Annualising a Sharpe from three months of data is arithmetic, not evidence. The confidence interval is enormous.",rel:["Sharpe ratio","Sample size"],warn:true},
{t:"Value at Risk",c:"perf",alt:"VaR",lvl:3,d:"The loss threshold expected to be exceeded only X% of the time over a given horizon.",e:"Tells you nothing about how bad it gets past that point. Famously comforting right up until it is not.",rel:["Expected shortfall","Fat tails"],warn:true},
{t:"Expected shortfall",c:"perf",alt:"CVaR",lvl:3,d:"The average loss in the cases where VaR is breached.",e:"The question VaR should have answered: not 'how often', but 'how bad when it happens'.",rel:["Value at Risk"]},
{t:"Stress testing",c:"perf",lvl:2,d:"Replaying a portfolio through historical crises or hypothetical shocks.",e:"'What does this do in a 2008, a 2020, and an overnight 5% gap?' If you cannot answer, size is guesswork.",rel:["Scenario analysis","Gap risk"]},
{t:"Scenario analysis",c:"perf",lvl:2,d:"Modelling specific plausible futures rather than sampling from history.",e:"Useful precisely where the backtest is silent — regimes that have not happened yet.",rel:["Stress testing","Regime change"]},
{t:"Benchmark-relative",c:"perf",lvl:2,d:"Reporting performance as the difference from a benchmark rather than in absolute terms.",e:"The only framing that survives a bull market honestly. +30% is bad if the index made +40%.",rel:["Benchmark","Alpha"]},
{t:"Cherry-picked period",c:"perf",lvl:1,d:"Choosing start and end dates that flatter the result.",e:"The most common form of dishonesty in retail track records, and usually not deliberate — people simply start measuring when things went well.",rel:["Rolling returns","Selection bias"],warn:true},
{t:"Survivor track record",c:"perf",lvl:2,d:"Performance shown only for strategies or accounts that lasted.",e:"The blown-up accounts are not in the average. This is why published composites look better than individual experience.",rel:["Survivorship bias"],warn:true},

{t:"Institutional investor",c:"part",lvl:1,d:"Pension funds, insurers, sovereign funds — large, slow, mandate-constrained pools of capital.",e:"Their constraints create some of the few genuinely structural opportunities, because they must trade at certain times regardless of price.",rel:["Forced seller","Index inclusion"]},

{t:"Managed futures / CTA",c:"part",lvl:2,d:"Funds trading futures systematically, historically dominated by trend following.",e:"The closest institutional analogue to what a systematic retail trader is attempting, and a sobering benchmark.",rel:["Trend following"]},

{t:"Segregated client money",c:"reg",lvl:2,d:"A requirement that client funds be held apart from the firm's own money.",e:"The difference between an inconvenience and a total loss when a broker collapses.",rel:["Broker insolvency","Custodian"]},
{t:"Best execution",c:"reg",lvl:3,d:"An obligation to seek the most favourable terms reasonably available for a client order.",e:"Defined loosely enough that it coexists with payment for order flow.",rel:["Payment for order flow"]},
{t:"Market manipulation",c:"reg",lvl:2,d:"Conduct intended to create a false impression of price or volume — spoofing, layering, wash trading, ramping.",e:"Prosecuted in regulated markets. Common and largely unpoliced in unregulated ones.",rel:["Spoofing","Wash trading"]},
{t:"Insider trading",c:"reg",lvl:1,d:"Trading on material non-public information.",e:"Criminal. Also worth noting that most 'insider' tips circulating in chat groups are neither inside information nor true.",rel:["Signal group"]},
{t:"T+1 settlement",c:"reg",lvl:3,d:"Trades settling one business day after execution, following the 2024 move from T+2 in the US.",e:"Affects when cash is genuinely available and how currency conversion is timed for cross-border trades.",rel:["Settlement"]},
{t:"KYC / AML",c:"reg",lvl:2,d:"Know Your Customer and anti-money-laundering identity checks required to open an account.",e:"A venue that does not ask is not protecting your privacy, it is telling you it has no regulator.",rel:["Regulation"],warn:true},
{t:"Compensation scheme",c:"reg",lvl:2,d:"A statutory fund covering client losses when a licensed firm fails, capped and varying by jurisdiction.",e:"Australia has no broad retail equivalent of the US SIPC or UK FSCS for all products. Check what actually covers your account.",rel:["Broker insolvency"],warn:true},
{t:"ASX",c:"au",lvl:1,d:"The Australian Securities Exchange. Continuous trading roughly 10:00–16:00 AEST, with opening and closing auctions.",e:"Small relative to the US, heavily concentrated in banks and miners, and thinner outside the top 100.",rel:["Auction (open / close)","Liquidity"]},
{t:"ASX 200",c:"au",lvl:1,d:"The benchmark index of the 200 largest ASX-listed companies by float-adjusted market cap.",e:"Dominated by financials and materials, so it behaves differently from a tech-heavy index like the Nasdaq.",rel:["Index fund","Concentration risk"]},
{t:"CHESS / HIN",c:"au",lvl:2,d:"The ASX settlement system, and the Holder Identification Number tying shares directly to you rather than to a broker pool.",e:"CHESS-sponsored holdings are in your name. Custodial models are not, which matters if the broker fails.",rel:["Custody","Broker insolvency"]},
{t:"Franking credit",c:"au",lvl:1,d:"A credit for company tax already paid, attached to Australian dividends, offsetting the shareholder's own tax.",e:"Makes fully franked dividends worth more after tax than the headline yield suggests. General information, not tax advice.",rel:["Dividend","CGT"]},
{t:"SMSF",c:"au",lvl:2,d:"Self-Managed Super Fund — a private superannuation fund you run yourself, with strict compliance obligations.",e:"Different tax treatment and heavy restrictions on borrowing and related-party dealings. Accountant territory.",rel:["Trader vs investor status"]},
{t:"AEST / AWST",c:"au",lvl:1,d:"Australian Eastern and Western Standard Time. Perth is AWST, two or three hours behind the east depending on daylight saving.",e:"Western Australia does not observe daylight saving, so the offset to both Sydney and New York changes twice a year. Timezone bugs in backtests start here.",rel:["Timezone alignment","Session"],warn:true},
{t:"Trading US hours from Perth",c:"au",lvl:1,d:"The New York session runs roughly 22:30–05:00 AWST in northern winter, and an hour earlier in summer.",e:"The highest-liquidity window is the middle of your night. Sleep loss degrades decisions faster than screen time improves them — this is a real constraint, not a soft one.",rel:["Screen time","Overnight risk"],warn:true},
{t:"Australian brokerage",c:"au",lvl:2,d:"Local brokers charge a flat fee per trade, often $5–$20, unlike US zero-commission models.",e:"A $10 round trip on a $500 position is 4% before you are right about anything. Position size has to clear the fee.",rel:["Cost drag","Round turn"],warn:true},
{t:"Currency exposure",c:"au",lvl:1,d:"Holding US assets from Australia means holding US dollars, so AUDUSD moves your return independently of the asset.",e:"US index up 10% while AUD strengthens 10% leaves an unhedged Australian investor roughly flat.",rel:["Currency pair","Hedged ETF"]},
{t:"Hedged ETF",c:"au",lvl:2,d:"A fund that removes the currency effect, so you get the underlying asset's local return.",e:"Hedging costs money and removes a diversifier — AUD typically falls in a global crisis, cushioning unhedged holdings.",rel:["Currency exposure","Correlation breakdown"]},
{t:"Calendar spread",c:"opt",lvl:3,d:"Selling a near-dated option and buying a longer-dated one at the same strike, profiting from faster near-term decay.",e:"A bet on time and volatility rather than direction. Vulnerable to a large move either way.",rel:["Theta","Term structure"]},
{t:"Diagonal spread",c:"opt",lvl:3,d:"A calendar spread with different strikes as well as different expiries.",e:"Adds a directional tilt to a time trade. More moving parts, more ways to be wrong.",rel:["Calendar spread"]},
{t:"Butterfly",c:"opt",lvl:3,d:"Buying one option either side of two sold at a middle strike. A tight bet on price finishing near that middle.",e:"Cheap, low probability, large payoff if pinned. Effectively a lottery ticket on a specific price.",rel:["Iron condor","Pin risk"]},
{t:"Ratio spread",c:"opt",lvl:3,d:"Selling more contracts than you buy, leaving naked exposure beyond a point.",e:"Collects premium and hides an unbounded tail past the short strikes. Check the payoff at extremes before assuming it is defined risk.",rel:["Short volatility","Defined risk"],warn:true},
{t:"Collar",c:"opt",lvl:2,d:"Holding stock, buying a protective put and selling a call to fund it.",e:"Caps both ends for little or no cash. The standard way concentrated shareholders hedge without selling.",rel:["Protective put","Covered call"]},
{t:"Synthetic position",c:"opt",lvl:3,d:"Combining options to replicate another instrument's payoff — long call plus short put equals long stock.",e:"Put-call parity means these must price consistently, or an arbitrage exists.",rel:["Put-call parity"]},
{t:"Put-call parity",c:"opt",lvl:3,d:"The fixed relationship between a call, a put, the underlying and the risk-free rate at the same strike and expiry.",e:"A pricing identity, not a strategy. Violations get arbitraged away in seconds.",rel:["Synthetic position","Arbitrage"]},
{t:"Poor man's covered call",c:"opt",lvl:3,d:"Selling a short-dated call against a long-dated deep in-the-money call instead of against shares.",e:"Cheaper than owning the stock, and it introduces expiry risk the stock version does not have.",rel:["Covered call"]},
{t:"Box spread",c:"opt",lvl:3,d:"A combination that locks in a fixed payoff, effectively a synthetic loan.",e:"Famous for a retail trader losing far more than his account on short boxes in 2019. 'Riskless' assumes European exercise and no assignment.",rel:["Assignment"],warn:true},
{t:"Wheel strategy",c:"opt",lvl:2,d:"Selling cash-secured puts until assigned, then selling covered calls until called away, repeating.",e:"Marketed as income. It is a short-volatility strategy that quietly buys more of an asset while it is falling.",rel:["Short volatility","Assignment"],warn:true},
{t:"Cash-secured put",c:"opt",lvl:2,d:"Selling a put while holding enough cash to buy the shares if assigned.",e:"Honest version of a limit buy that pays you to wait. The risk is that you get filled in a crash.",rel:["Wheel strategy","Assignment"]},
{t:"Naked option selling",c:"opt",lvl:1,d:"Selling options without holding the underlying or a defining long leg.",e:"Uncapped loss on the call side. Broker margin requirements are the only thing standing between you and the tail.",rel:["Short volatility","Defined risk"],warn:true},
{t:"Expected move",c:"opt",lvl:2,d:"The move implied by the at-the-money straddle price for a given expiry.",e:"The market's own one-standard-deviation forecast, available for free. Compare your target against it before assuming your target is reasonable.",rel:["Implied volatility","Straddle / strangle"]},
{t:"Option chain",c:"opt",lvl:1,d:"The full grid of strikes and expiries with their prices, volumes and open interest.",e:"Reading where volume and open interest concentrate tells you where positioning sits.",rel:["Open interest (options)","Strike"]},
{t:"Layer 1 / Layer 2",c:"cry",lvl:2,d:"A base blockchain versus a network built on top of it to increase throughput and cut fees.",e:"Bridging between them adds a smart-contract risk that has repeatedly been the largest single loss vector in the space.",rel:["Bridge","Gas"]},
{t:"Bridge",c:"cry",lvl:2,d:"Infrastructure moving assets between chains, usually by locking on one side and issuing on the other.",e:"Billions have been stolen from bridges. Holding a bridged asset is holding a claim on a contract.",rel:["Layer 1 / Layer 2"],warn:true},
{t:"Staking",c:"cry",lvl:2,d:"Locking tokens to help secure a proof-of-stake network in exchange for issuance rewards.",e:"The yield is paid in the same token, so a 5% staking return on an asset down 60% is not a 5% return.",rel:["Yield farming"],warn:true},
{t:"Liquid staking",c:"cry",lvl:3,d:"Receiving a tradeable receipt token representing your staked position.",e:"Adds a peg risk between the receipt and the underlying, which has broken under stress before.",rel:["Staking","Depeg"]},
{t:"Slashing",c:"cry",lvl:3,d:"A protocol penalty destroying part of a validator's stake for misbehaviour or downtime.",e:"A real, if small, risk in delegated staking that yield advertisements rarely mention.",rel:["Staking"]},
{t:"Tokenomics",c:"cry",lvl:2,d:"A token's supply schedule, distribution and unlock timetable.",e:"A published cliff where insider tokens unlock is a known future sell pressure with a date attached. Check it before holding through one.",rel:["Vesting / unlock","Forced seller"]},
{t:"Vesting / unlock",c:"cry",lvl:2,d:"The schedule releasing tokens held by teams and early investors.",e:"One of the few genuinely predictable supply events in any market.",rel:["Tokenomics"]},
{t:"TVL",c:"cry",lvl:3,d:"Total Value Locked — assets deposited in a protocol, used as a size metric.",e:"Inflatable by recursive lending and by counting the same collateral repeatedly. Treat as marketing until verified.",rel:["Wash trading"],warn:true},
{t:"Oracle",c:"cry",lvl:3,d:"A service feeding external price data to a smart contract.",e:"Manipulating a thin oracle price is the mechanism behind many DeFi exploits — the contract does exactly what it was told.",rel:["MEV"],warn:true},
{t:"Open interest (crypto)",c:"cry",lvl:2,d:"Total value of outstanding perpetual and futures positions.",e:"Rising open interest with rising funding means leverage is building on one side. That is fuel for a liquidation cascade.",rel:["Funding rate","Liquidation cascade"]},
{t:"Basis / cash-and-carry",c:"cry",lvl:3,d:"Buying spot and shorting the perpetual or future to collect funding or the futures premium.",e:"A genuine carry trade. It pays until an exchange fails or funding flips hard.",rel:["Funding rate","Basis trade"]},
{t:"Proof of reserves",c:"cry",lvl:2,d:"An exchange publishing cryptographic evidence that it holds customer assets.",e:"Proves assets exist at a moment. It does not prove liabilities are smaller, which is where the failures happen.",rel:["Custody"],warn:true},
{t:"Cold vs hot wallet",c:"cry",lvl:1,d:"Offline storage versus keys held on an internet-connected system.",e:"Anything you are actively trading is hot by necessity. Size the hot balance accordingly.",rel:["Custody"]},
{t:"Seed phrase",c:"cry",lvl:1,d:"The recovery words that reconstruct a wallet's private keys. Whoever has them owns the funds.",e:"No legitimate service ever needs it. Every request for one is theft. Never type it into anything.",rel:["Rug pull"],warn:true},
{t:"Airdrop",c:"cry",lvl:2,d:"Free tokens distributed to early or active users, often to bootstrap a network.",e:"Also a common phishing vector — an unsolicited token in your wallet whose approval drains it.",rel:["Rug pull"],warn:true},
{t:"Memecoin",c:"cry",lvl:1,d:"A token with no claimed utility, valued purely on attention.",e:"Honest about being a game of musical chairs, which arguably makes it less misleading than tokens claiming a use case.",rel:["Exit liquidity","Degen"]},
{t:"Anchoring",c:"psy",lvl:1,d:"Fixing on an irrelevant reference number and judging everything relative to it.",e:"'I'll sell when it gets back to my entry.' The market has no knowledge of your entry and no obligation to it.",rel:["Sunk cost fallacy","Disposition effect"]},
{t:"Disposition effect",c:"psy",lvl:2,d:"The documented tendency to sell winners early and hold losers too long.",e:"Measurable in real brokerage data across millions of accounts. It is the single most consistent retail behavioural finding.",rel:["Loss aversion","MAE / MFE"]},
{t:"Availability heuristic",c:"psy",lvl:2,d:"Judging probability by how easily an example comes to mind.",e:"Everyone can picture a squeeze because they are memorable. Nobody pictures the thousands of shorts that worked quietly.",rel:["Survivor content"]},
{t:"Base rate neglect",c:"psy",lvl:1,d:"Ignoring how common something is in general when assessing a specific case.",e:"The base rate for a profitable-looking backtest at 58,700 trials is 'false positive'. Your specific result does not escape that unless it clears the bar.",rel:["Multiple testing","Noise floor"]},
{t:"Narrative fallacy",c:"psy",lvl:2,d:"Building a causal story from noise because stories are easier to hold than randomness.",e:"Every daily market summary is this. The move happened; the reason was retrofitted before the close.",rel:["HARKing","Hindsight bias"]},
{t:"Herding",c:"psy",lvl:2,d:"Copying the crowd's positioning because agreement feels like safety.",e:"Crowded trades unwind together, which is exactly when the crowd offers no exit.",rel:["Exit liquidity","Correlation breakdown"]},
{t:"Illusion of control",c:"psy",lvl:2,d:"Believing effort and attention influence an outcome that is largely random.",e:"More screen time, more indicators and more analysis do not improve a coin flip. They do increase trade count.",rel:["Overtrading","Indicator stacking"]}
);
D.push(
{t:"Dunning-Kruger in trading",c:"psy",lvl:2,d:"The period after early success where confidence outruns competence.",e:"Frequently coincides with the first size increase, which is why the first serious drawdown often follows the first good month.",rel:["Overconfidence after a win streak"],warn:true},
{t:"Fear of missing out",c:"psy",lvl:1,d:"Acting on the discomfort of watching a move without a position.",e:"The entry is late, the stop is far, and the size is usually wrong. See FOMO.",rel:["FOMO","Discipline"]},
{t:"Regret aversion",c:"psy",lvl:2,d:"Choosing to avoid the possibility of feeling foolish rather than to maximise expected outcome.",e:"Drives both not taking valid setups and refusing to cut losers. Two opposite errors, one root.",rel:["Loss aversion"]},
{t:"Mental accounting",c:"psy",lvl:2,d:"Treating money differently depending on where it came from.",e:"'Playing with the house's money' after a win is how a good month is given back. It is all just your capital.",rel:["Risk per trade"]},
{t:"Pre-commitment",c:"psy",lvl:1,d:"Binding your future self with rules made while calm — hard stops, daily loss limits, position caps.",e:"The only technique on this list with a reliable success rate, because it does not depend on being disciplined in the moment.",rel:["Discipline","Position limit"]},
{t:"Vectorised vs event-driven",c:"bt",lvl:3,d:"Vectorised backtests compute over whole arrays and are fast but sloppy about order state; event-driven ones simulate bar by bar and model execution properly.",e:"Vectorised is fine for screening ideas. Anything with stops, partial fills or position state needs event-driven before you believe it.",rel:["Fill rate","Intrabar ambiguity"]},
{t:"Warm-up period",c:"bt",lvl:2,d:"The initial bars needed before an indicator produces valid values.",e:"Trading during warm-up produces signals from partial data. Exclude it explicitly rather than assuming the library did.",rel:["Look-ahead bias"]},
{t:"Slippage model",c:"bt",lvl:2,d:"The assumption about how much worse than the signal price you actually fill.",e:"Fixed ticks, a fraction of spread, or volatility-scaled. The choice can flip a result, so state it and test the pessimistic version.",rel:["Brutal cost model","Slippage"]},
{t:"In-sample / out-of-sample split",c:"bt",lvl:1,d:"Reserving a portion of history the strategy is never fitted on.",e:"A single split is used up the first time you look at it. Every subsequent peek makes it in-sample again.",rel:["Out-of-sample","Data snooping"],warn:true},
{t:"Combinatorial purged CV",c:"bt",lvl:3,d:"Testing across many train/test splits with purging and embargo, producing a distribution of out-of-sample results rather than one number.",e:"The most rigorous practical option, and the basis of a credible PBO estimate.",rel:["Purged cross-validation","Probability of backtest overfitting"]},
{t:"Anchored vs rolling walk-forward",c:"bt",lvl:3,d:"Anchored keeps expanding the training window; rolling keeps it a fixed length and slides it.",e:"Rolling adapts to regime change and uses less data. Anchored is more stable and slower to react. Choose before you see results.",rel:["Walk-forward","Regime change"]},
{t:"Signal decay",c:"bt",lvl:3,d:"How quickly a signal's predictive value falls as the delay between signal and execution grows.",e:"If an edge disappears with a one-bar delay, it was an execution artefact, not a forecast.",rel:["Same-bar vs next-bar fill","Live decay"]},
{t:"Reproducibility",c:"bt",lvl:2,d:"Getting identical results from the same code and data on a later run.",e:"Requires fixed random seeds, versioned data and recorded parameters. Without it you cannot tell a fix from a fluke.",rel:["Logging","Trial ledger"]},
{t:"Sensitivity plateau",c:"bt",lvl:2,d:"A broad region of parameter space where performance stays acceptable.",e:"The shape you want. A single spiking parameter value is the shape of an overfit.",rel:["Parameter sensitivity","Overfitting"]},
{t:"Cost sensitivity",c:"bt",lvl:2,d:"How performance changes as assumed costs rise.",e:"Plot it. A strategy whose profit vanishes at 1.5x assumed costs has no margin for a bad fill week.",rel:["Cost drag","Brutal cost model"]},
{t:"Trade clustering",c:"bt",lvl:3,d:"Trades bunching in time or across correlated assets, so they are not independent observations.",e:"A hundred trades taken in the same fortnight across 60 correlated assets is closer to one bet.",rel:["Effective sample size","Correlation"]},
{t:"Regime split test",c:"bt",lvl:2,d:"Reporting performance separately across distinct regimes — high and low volatility, rising and falling rates, bull and bear.",e:"Most edges turn out to be one regime's behaviour averaged across everything else.",rel:["Regime change","Rolling returns"]},
{t:"Paper-to-live gap",c:"bt",lvl:1,d:"The performance drop between simulated and real results.",e:"Costs, latency, missed fills, and behaviour. Budget for it in advance rather than discovering it.",rel:["Live decay","Implementation shortfall"]},
{t:"Strategy capacity check",c:"bt",lvl:3,d:"Testing whether the edge survives at the size you would actually trade.",e:"Cheap for one MNQ contract, decisive for anything larger or in thinner instruments.",rel:["Capacity","Market impact"]},
{t:"Session routine",c:"ops",lvl:2,d:"A fixed sequence before and after trading: calendar check, levels marked, risk set, journal written.",e:"Removes decisions from the moment you are least able to make them well.",rel:["Economic calendar","Trading journal"]},
{t:"Trade log fields",c:"ops",lvl:1,d:"The minimum useful record: date, instrument, direction, size, entry, stop, target, exit, R multiple, setup name, rationale, and whether you followed the plan.",e:"The last field is the one that changes behaviour. Everything else is bookkeeping.",rel:["Trading journal","Process vs outcome"]},
{t:"Review cadence",c:"ops",lvl:2,d:"A fixed schedule for reviewing results — weekly for behaviour, monthly or quarterly for whether the edge still exists.",e:"Reviewing after every trade produces noise-driven changes. Reviewing never produces nothing.",rel:["Sample size","Regression to the mean"]},
{t:"Strategy retirement",c:"ops",lvl:2,d:"Predefined conditions under which you stop trading a system — drawdown depth, time under water, or drift past a threshold.",e:"Decide it before the drawdown, because during one you will find reasons to continue.",rel:["Pre-commitment","Time under water"]},
{t:"Position reconciliation",c:"ops",lvl:2,d:"Checking daily that your records match the broker's.",e:"Catches missed fills, partials and duplicated orders while they are still small.",rel:["Reconciliation","Logging"]},
{t:"Backup and redundancy",c:"ops",lvl:2,d:"A second route to close a position — phone app, broker phone line, a second internet connection.",e:"Your platform will fail at some point, and it will not be on a quiet day.",rel:["Kill switch","Fail-safe default"],warn:true},
{t:"Capital allocation",c:"ops",lvl:1,d:"Deciding how much of your total net worth is in the trading account at all.",e:"The most important sizing decision, and it happens before any trade. Money you cannot lose does not belong here.",rel:["Risk per trade","Risk of ruin"]},
{t:"Withdrawal policy",c:"ops",lvl:2,d:"A rule for taking profits out of the account.",e:"Converts paper gains into realised ones and caps how much the account can give back. Decide the rule in advance.",rel:["Capital allocation"]},
{t:"Drawdown protocol",c:"ops",lvl:1,d:"Predefined actions at set drawdown depths — reduce size at one level, stop and review at another.",e:"Halving size at −10% mechanically slows the bleed while you work out whether the edge is gone or you are.",rel:["Position limit","Strategy retirement"]},
{t:"Journaling the near-misses",c:"ops",lvl:3,d:"Recording setups you saw and did not take, and what happened next.",e:"The only way to find out whether your filtering is skill or fear. Nobody does it, which is why it is informative.",rel:["Trading journal","Analysis paralysis"]},
{t:"Version control for strategies",c:"ops",lvl:3,d:"Tracking changes to strategy code and parameters over time.",e:"Without it you cannot tell whether last quarter's results came from the code you are running now.",rel:["Reproducibility","Logging"]},
{t:"Market-on-close",c:"orders",alt:"MOC",lvl:2,d:"An order executing in the closing auction at the official close price.",e:"The way to guarantee the closing print rather than a price near it. Cut-off times apply.",rel:["Auction (open / close)"]},
{t:"Limit-on-close",c:"orders",alt:"LOC",lvl:3,d:"A close-auction order with a price limit — it participates only if the close is at least as good.",e:"Protects against a runaway auction print at the cost of possibly not filling.",rel:["Market-on-close"]},
{t:"Midpoint / pegged order",c:"orders",lvl:3,d:"An order resting at the midpoint of the spread, or pegged to follow the bid or offer.",e:"Splits the spread when it fills. It also signals nothing to the book, which is the point.",rel:["Spread","Dark pool"]},
{t:"Hidden / reserve order",c:"orders",lvl:3,d:"An order not displayed in the book, or displaying only part of its size.",e:"The mechanism behind iceberg orders.",rel:["Iceberg order"]},
{t:"Time in force",c:"orders",lvl:2,d:"How long an order stays live — day, GTC, IOC, FOK, or good-til-date.",e:"A forgotten GTC order filling weeks later, on a thesis you no longer hold, is a genuinely common and avoidable loss.",rel:["GTC","IOC / FOK"],warn:true},
{t:"Stop-market vs stop-limit trade-off",c:"orders",lvl:1,d:"A stop-market guarantees an exit at an uncertain price; a stop-limit guarantees a price but not an exit.",e:"In a fast market the stop-limit is the one that leaves you still holding the position. For risk control, prefer certainty of exit.",rel:["Stop order (stop market)","Stop-limit"],warn:true},
{t:"Bracket on entry",c:"orders",lvl:1,d:"Submitting the stop and target at the same moment as the entry, as one package.",e:"Removes the window where you are in a position with no protection because you got distracted.",rel:["Bracket order","OCO (one-cancels-other)"]},
{t:"Partial fill",c:"orders",lvl:2,d:"Only part of your order executing, leaving the rest working or cancelled.",e:"Your risk calculation assumed the whole size. A half-filled entry with a full-size stop is a different trade.",rel:["Fill rate","Position sizing"],warn:true},
{t:"Order rejection",c:"orders",lvl:2,d:"The venue refusing an order — insufficient margin, bad price, outside session, or a risk limit.",e:"An automated system must handle rejections explicitly. Silently ignoring them is how a bot ends up unhedged.",rel:["Fail-safe default","Logging"],warn:true},
{t:"Support / resistance",c:"pa",lvl:1,d:"Price areas where advances have previously stalled or declines have found buyers.",e:"Best treated as zones rather than lines, and as places where something might happen rather than where something must.",rel:["Retest","Rejection"]},
{t:"Standard deviation",c:"stat",lvl:1,d:"A measure of how spread out a set of values is around their mean.",e:"The unit behind Bollinger Bands, volatility and most risk models. It assumes a distribution that markets do not have.",rel:["Fat tails","Volatility"]},
{t:"Commodity",c:"comm",lvl:1,d:"A standardised physical good traded on an exchange — energy, metals, grains, softs, livestock.",e:"Unlike a share, it has storage costs, a harvest or extraction cycle, and it can be consumed. Those facts drive its curve.",rel:["Contango / backwardation","Storage cost"]},
{t:"Storage cost",c:"comm",lvl:2,d:"The cost of holding a physical commodity — warehousing, insurance, spoilage, financing.",e:"The main reason futures further out cost more. It is a real, calculable number, not a sentiment reading.",rel:["Contango / backwardation","Roll yield"]},
{t:"Convenience yield",c:"comm",lvl:3,d:"The benefit of physically holding a commodity rather than a claim on it, such as being able to keep a refinery running.",e:"When it exceeds storage costs the curve inverts into backwardation. That inversion signals genuine physical scarcity.",rel:["Contango / backwardation","Storage cost"]},
{t:"Crude oil grades",c:"comm",lvl:2,d:"WTI and Brent are different crudes with different delivery points and sulphur content, so they trade at a spread.",e:"WTI is landlocked in Cushing, Oklahoma; Brent is seaborne. That geography is why the spread moves.",rel:["Spread trade"]},
{t:"Crack spread",c:"comm",lvl:3,d:"The margin between crude oil and the refined products made from it.",e:"A refiner's actual profit margin, tradeable directly. One of the few spreads with a genuine industrial hedger on the other side.",rel:["Spread trade","Hedger"]},
{t:"OPEC",c:"comm",lvl:2,d:"The oil producers' cartel, whose production decisions move crude directly.",e:"A supply shock decided by committee, announced on a schedule. Positioning into those meetings is a volatility bet.",rel:["Data-day volatility"]},
{t:"Precious vs industrial metals",c:"comm",lvl:2,d:"Gold and silver are held partly as monetary assets; copper and aluminium are consumed by industry.",e:"Copper tracks global growth. Gold tracks real yields and fear. Grouping them as 'metals' hides opposite drivers.",rel:["Real yield","Risk-on / risk-off"]},
{t:"Gold as a hedge",c:"comm",lvl:2,d:"Gold's reputation as a store of value during inflation and crisis.",e:"The relationship is with real yields more than with inflation itself. It went nowhere for two decades after 1980.",rel:["Real yield"],warn:true},
{t:"Agricultural seasonality",c:"comm",lvl:3,d:"Crops have planting, growing and harvest windows that shape supply and volatility predictably.",e:"One of the few places seasonality has a physical mechanism rather than a data-mined one.",rel:["Seasonality","Economic rationale"]},
{t:"WASDE",c:"comm",lvl:3,d:"The USDA's monthly world supply and demand estimates. The scheduled shock for grain markets.",e:"Grain futures can move limit-up or limit-down on it, which is when a stop finds no market.",rel:["Limit up / limit down"]},
{t:"Hedger",c:"comm",lvl:1,d:"A commercial participant using futures to lock in a price for something they actually produce or consume.",e:"The reason commodity futures exist. Hedgers are willing to lose money on the future to make their business predictable — that is a genuine risk premium being paid.",rel:["Speculator","Economic rationale"]},
{t:"Speculator",c:"comm",lvl:1,d:"A participant taking price risk with no underlying commercial exposure, providing liquidity to hedgers.",e:"Not a slur. The whole market design depends on someone taking the other side of the hedge.",rel:["Hedger","COT report"]},
{t:"COT report",c:"comm",lvl:2,d:"Commitments of Traders — the CFTC's weekly breakdown of positioning by participant category.",e:"Genuinely different information from price. Also delayed by three days and widely misread as a timing signal.",rel:["Alternative data","Speculator"]},
{t:"Physical delivery risk",c:"comm",lvl:2,d:"The risk of being obliged to take or make delivery of the actual commodity.",e:"Retail brokers usually force-close before first notice day. Usually is not a risk policy — know the dates yourself.",rel:["Settlement","Expiry"],warn:true},
{t:"Negative prices",c:"comm",lvl:3,d:"A price below zero, where holders pay to be relieved of the commodity.",e:"WTI printed −$37 in April 2020 because storage was full. Any model or stop assuming prices stay positive broke that day.",rel:["Physical delivery risk","Fat tails"],warn:true},
{t:"Derivative",c:"deriv",lvl:1,d:"A contract whose value is derived from an underlying asset, rate or index.",e:"Futures, options, swaps and CFDs. Leverage is usually built in, which is the appeal and the danger.",rel:["Futures","Option"]},

{t:"Structured product",c:"deriv",lvl:2,d:"A packaged combination of a bond and derivatives sold with a headline feature like capital protection or enhanced yield.",e:"You can usually build the same payoff yourself for less. The gap is the fee, and it is rarely disclosed as one.",rel:["Fee opacity"],warn:true},
{t:"Fee opacity",c:"deriv",lvl:2,d:"Costs embedded in a product's pricing rather than charged visibly.",e:"If you cannot find the fee, you are the fee. Ask what the same exposure costs assembled from components.",rel:["Structured product","Payment for order flow"],warn:true},
{t:"Capital protection",c:"deriv",lvl:2,d:"A structure promising return of principal at maturity, usually by holding a zero-coupon bond and buying options with the rest.",e:"Protection is only as good as the issuer, it applies only at maturity, and it costs you the dividends and most of the upside.",rel:["Structured product"],warn:true},
{t:"Knock-in / knock-out",c:"deriv",lvl:3,d:"Barrier features that activate or cancel a payoff when price touches a level.",e:"Creates a discontinuous payoff — a tiny move through the barrier changes everything. Hedging it produces violent flows near the level.",rel:["Pin risk"]},
{t:"Counterparty risk",c:"deriv",lvl:1,d:"The risk that the other side of your contract fails to pay.",e:"Cleared futures largely remove it. OTC contracts, CFDs and unregulated crypto venues do not.",rel:["Clearing house","Broker insolvency"],warn:true},
{t:"Notional vs premium",c:"deriv",lvl:2,d:"The exposure a contract controls versus the cash you paid for it.",e:"Confusing the two is how people discover their 'small' options position was a large directional bet.",rel:["Notional value","Premium"],warn:true},
{t:"Margin lending",c:"deriv",lvl:2,d:"Borrowing from a broker against your portfolio to buy more.",e:"Interest accrues daily and the broker can force liquidation at the worst possible moment, without asking.",rel:["Margin call","Leverage"],warn:true},
{t:"Market risk",c:"riskt",lvl:1,d:"The risk of loss from price moving against you. The one everybody thinks about.",e:"Manageable with sizing and stops. It is also the least likely thing to actually ruin you.",rel:["Position sizing","Tail risk"]},
{t:"Liquidity risk",c:"riskt",lvl:1,d:"The risk you cannot exit at a reasonable price because there is nobody on the other side.",e:"Invisible in normal conditions and decisive in bad ones. Position size should be set against thin-market liquidity, not average liquidity.",rel:["Liquidity","Market impact"],warn:true},
{t:"Gap and overnight risk",c:"riskt",lvl:1,d:"The risk of price jumping while you cannot act.",e:"For an Australian holding US index futures this is the dominant risk, not intraday volatility.",rel:["Gap risk","Overnight risk"],warn:true},
{t:"Correlation risk",c:"riskt",lvl:2,d:"The risk that positions you believed were independent move together.",e:"Five 1% positions that turn out to be one trade is a 5% position you never agreed to take.",rel:["Correlation breakdown","Portfolio heat"],warn:true},
{t:"Basis risk",c:"riskt",lvl:3,d:"The risk that a hedge and the thing it hedges do not move together as expected.",e:"Hedging an ASX portfolio with US index futures leaves you exposed to the difference between the two markets — and to the currency.",rel:["Hedge","Basis"]},
{t:"Model risk",c:"riskt",lvl:2,d:"The risk that your model is wrong in a way the backtest cannot reveal.",e:"Every assumption — normal returns, stable correlations, fills at the touch — is a place this hides.",rel:["Fat tails","Overfitting"],warn:true},
{t:"Operational risk",c:"riskt",lvl:1,d:"Loss from process, system or human failure rather than from the market — a fat-finger order, a crashed bot, a missed rollover.",e:"Boring, common, and entirely preventable with checklists and a kill switch.",rel:["Kill switch","Reconciliation"]},
{t:"Concentration",c:"riskt",lvl:1,d:"Too much of the outcome depending on one position, sector, strategy or venue.",e:"Includes venue concentration: everything on one exchange is a single point of failure regardless of how diversified the positions look.",rel:["Concentration risk","Diversification"]},
{t:"Sequence-of-returns risk",c:"riskt",lvl:2,d:"The risk that the order of returns, not their average, determines the outcome.",e:"Decisive when you are adding or withdrawing capital. Same average return, different order, very different ending balance.",rel:["Sequence risk","Withdrawal policy"]},
{t:"Regulatory risk",c:"riskt",lvl:2,d:"The risk that a rule change alters what you can trade, at what leverage, or with what tax treatment.",e:"ASIC's CFD intervention changed retail leverage overnight. Strategies built on the old limits stopped being possible.",rel:["Retail leverage cap","Regulation"]},
{t:"Platform risk",c:"riskt",lvl:1,d:"The risk your broker, exchange or data feed fails when you need it.",e:"Outages cluster on the most volatile days, which is exactly when you need to act. Have a second route.",rel:["Backup and redundancy","Broker insolvency"],warn:true},
{t:"Key person risk",c:"riskt",lvl:3,d:"When a system depends on one individual's judgement, availability or undocumented knowledge.",e:"In a one-person trading operation this is you. Illness, travel and sleep are risk factors with real P&L consequences.",rel:["Trading US hours from Perth"]},
{t:"Risk budgeting",c:"riskt",lvl:2,d:"Allocating a fixed total amount of risk across positions and strategies, rather than sizing each in isolation.",e:"Forces the trade-off to be explicit: a new position must displace risk from an existing one.",rel:["Portfolio heat","Position limit"]},
{t:"Unknown unknowns",c:"riskt",lvl:2,d:"Risks not on any list because nobody has thought of them yet.",e:"The reason position limits exist at all. You cannot model this one, only survive it by not being maximally exposed.",rel:["Tail risk","Risk of ruin"]},
{t:"Business cycle",c:"cycle",lvl:1,d:"The recurring expansion and contraction of economic activity.",e:"Different assets lead at different phases. The cycle is real; timing it reliably is not.",rel:["Recession","Leading indicator"]},
{t:"Recession",c:"cycle",lvl:1,d:"A sustained contraction in economic activity, formally dated well after it begins.",e:"You find out you were in one months later. Equities usually bottom before it is announced.",rel:["Business cycle","Yield curve"]},
{t:"Soft landing",c:"cycle",lvl:2,d:"Inflation falling back to target without a recession.",e:"Rare historically, and priced as the base case almost every tightening cycle.",rel:["Central bank","Rate expectations"]},
{t:"Stagflation",c:"cycle",lvl:2,d:"High inflation alongside weak growth — the combination policy tools handle worst.",e:"The 1970s scenario. Bad for both equities and bonds at once, which breaks the standard balanced portfolio.",rel:["Correlation breakdown"]},
{t:"Credit cycle",c:"cycle",lvl:2,d:"The expansion and contraction of lending appetite, usually leading the business cycle.",e:"Credit spreads widen before equities fall. It is one of the more reliable sequences in macro.",rel:["Credit spread"]},
{t:"Volatility regime",c:"cycle",lvl:2,d:"Extended periods of persistently high or low volatility. Volatility clusters strongly.",e:"A strategy tuned in a low-vol regime will size wrongly in a high-vol one unless it scales with ATR.",rel:["Volatility targeting","Autocorrelation"]},
{t:"Bull market",c:"cycle",lvl:1,d:"A sustained rising market, conventionally a 20% advance from a low.",e:"Makes almost every long strategy look skilful. This is why benchmark-relative reporting matters.",rel:["Benchmark","Beta"]},
{t:"Bear market",c:"cycle",lvl:1,d:"A sustained decline, conventionally 20% from a high.",e:"Contains the sharpest rallies. Bear market rallies exist to make shorts cover and dip-buyers hopeful.",rel:["Bear market rally"]},
{t:"Bear market rally",c:"cycle",lvl:2,d:"A strong advance within an ongoing downtrend.",e:"Frequently larger and faster than rallies in bull markets, which is exactly what makes it convincing.",rel:["Bear market","Retracement vs reversal"],warn:true},
{t:"Melt-up risk",c:"cycle",lvl:2,d:"The risk of being out of a market that keeps rising without pullbacks.",e:"Being flat has an opportunity cost. It is a real risk, just not one that can bankrupt you.",rel:["Melt-up","FOMO"]},
{t:"Rotation",c:"cycle",lvl:2,d:"Capital moving between sectors or styles without leaving the market.",e:"The index can be flat while everything underneath it moves violently. Index-level analysis misses this entirely.",rel:["Sector","Factor investing"]},
{t:"Sector",c:"cycle",lvl:1,d:"A grouping of companies by business type — technology, financials, energy, healthcare.",e:"Sector correlation is high within and lower across. It is the first useful diversification axis in equities.",rel:["Correlation matrix","Rotation"]},
{t:"Structural break",c:"cycle",lvl:3,d:"A permanent change in how a market behaves — a rule change, a new participant class, a technology shift.",e:"Distinct from a regime cycle because it does not revert. Decimalisation and the rise of HFT were both structural breaks.",rel:["Regime change","Factor decay"]},
{t:"API",c:"tech",lvl:1,d:"The programmatic interface a broker or data provider exposes for placing orders and pulling data.",e:"Read the rate limits and the error codes before writing anything. Both will matter at the worst moment.",rel:["Rate limit","REST vs WebSocket"]},
{t:"REST vs WebSocket",c:"tech",lvl:2,d:"REST is request-and-response, one call at a time. A WebSocket holds an open connection and pushes updates as they happen.",e:"Polling REST for live prices is slow and burns your rate limit. Streaming is the correct tool for market data.",rel:["API","Rate limit"]},
{t:"Rate limit",c:"tech",lvl:2,d:"A cap on how many requests you may make in a period. Exceeding it gets you throttled or banned.",e:"Handle the 429 response explicitly with backoff. A retry loop without backoff turns a hiccup into a lockout.",rel:["API","Idempotency"],warn:true},
{t:"FIX protocol",c:"tech",lvl:3,d:"The messaging standard institutions use for order routing.",e:"Rarely available to retail, and the vocabulary leaks into broker documentation regardless.",rel:["Smart order routing"]},
{t:"Data feed",c:"tech",lvl:1,d:"The source of your prices, and whether it is real-time, delayed, consolidated or from a single venue.",e:"A free delayed feed is fine for research and useless for execution. Know which one your chart is showing.",rel:["Data quality","Latency"]},
{t:"Backfill",c:"tech",lvl:2,d:"Retrieving historical data to fill gaps in a stored series.",e:"Backfilled bars may come from a different source than your live ones, which quietly creates two datasets in one table.",rel:["Data quality","Bad tick"],warn:true},
{t:"VPS",c:"tech",lvl:2,d:"A rented virtual server, used to run automation continuously without depending on your own machine.",e:"Solves the 3am power cut and the accidental laptop lid. It does not solve a bug.",rel:["Kill switch","Latency to broker"]},
{t:"Heartbeat",c:"tech",lvl:2,d:"A periodic signal confirming a connection or process is alive.",e:"Without one, a silently dead feed looks identical to a quiet market. That distinction has cost people real money.",rel:["Fail-safe default","Monitoring"],warn:true},
{t:"Monitoring and alerting",c:"tech",lvl:2,d:"Automated checks that tell you when something has broken, rather than you noticing later.",e:"Alert on staleness, on rejected orders, and on position mismatch. Alerting on profit is noise.",rel:["Heartbeat","Reconciliation"]},
{t:"Time synchronisation",c:"tech",lvl:3,d:"Keeping your system clock accurate against a reference.",e:"Clock drift corrupts bar alignment and makes latency measurements meaningless.",rel:["Timezone alignment"]},
{t:"Database vs flat files",c:"tech",lvl:3,d:"Where market data lives — a proper database, or Parquet and CSV on disk.",e:"Columnar files are fast and simple for research. A database earns its keep once you need concurrent writes and integrity guarantees.",rel:["Reproducibility"]},
{t:"Survivorship-free dataset",c:"tech",lvl:3,d:"Historical data including delisted and dead instruments.",e:"Almost never free. Its absence is the single most common quiet defect in a retail equity backtest.",rel:["Survivorship bias","Data quality"],warn:true},
{t:"Corporate action adjustment",c:"tech",lvl:3,d:"Applying splits and dividends consistently across a stored history.",e:"Do it once, at ingest, and record which convention you used. Mixing adjusted and unadjusted series is a silent disaster.",rel:["Adjusted price","Corporate action"],warn:true},
{t:"Dry run mode",c:"tech",lvl:2,d:"Running the full system with order submission disabled, logging what it would have done.",e:"Catches the plumbing failures without risking money, and it is the last gate before going live.",rel:["Paper trading a bot","Kill switch"]},
{t:"Fixed dollar risk",c:"money",lvl:1,d:"Risking the same cash amount on every trade regardless of account size.",e:"Simple and it does not compound. After a run of losses you are risking a larger share of a smaller account.",rel:["Fixed fractional sizing"],warn:true},
{t:"Percent volatility sizing",c:"money",lvl:2,d:"Sizing so each position's expected daily move is a fixed share of the account, using ATR.",e:"Puts unlike instruments on comparable footing. Gold and MNQ get different contract counts for the same risk.",rel:["ATR","Volatility targeting"]},
{t:"Fixed ratio",c:"money",lvl:3,d:"Increasing size by one unit after each fixed increment of profit, rather than by a percentage.",e:"Designed for small futures accounts. Grows more slowly than fixed fractional early and faster later.",rel:["Fixed fractional sizing"]},
{t:"Pyramiding",c:"money",lvl:2,d:"Adding to a winning position as it moves in your favour.",e:"Raises the average entry and can turn a winner into a loser if the last tranche is the biggest. Add in decreasing size, not increasing.",rel:["Scaling in","Averaging down"],warn:true},
{t:"Scaling out rules",c:"money",lvl:2,d:"Predefined points for taking partial profits.",e:"Reduces variance and reduces expectancy. Whether that trade is worth it depends on your MFE data, not on how it feels.",rel:["Scaling out","MAE / MFE"]},
{t:"Risk parity across strategies",c:"money",lvl:3,d:"Allocating so each strategy contributes equal risk rather than equal capital.",e:"Prevents one high-volatility system dominating the combined equity curve.",rel:["Risk parity","Ensemble"]},
{t:"Anti-martingale in practice",c:"money",lvl:2,d:"Increasing exposure after gains and cutting after losses, so drawdowns shrink your risk automatically.",e:"What fixed fractional sizing does without you deciding anything. That automaticity is the point.",rel:["Anti-martingale","Fixed fractional sizing"]},
{t:"Grid trading",c:"money",lvl:2,d:"Placing a ladder of orders at intervals, adding as price moves against you.",e:"Produces a smooth curve and hides a martingale. It works until a trend does not come back, which is the one scenario it cannot survive.",rel:["Martingale","Short volatility"],warn:true},
{t:"Averaging in vs averaging down",c:"money",lvl:1,d:"Planned staged entry at predetermined levels, versus unplanned adding because you are losing.",e:"Same mechanics, opposite discipline. If the second entry was not written down before the first, it is averaging down.",rel:["Averaging down","Scaling in"],warn:true},
{t:"Maximum position count",c:"money",lvl:2,d:"A cap on simultaneous open positions, independent of individual sizing.",e:"Stops a correlated cluster forming while each individual trade looks reasonable.",rel:["Portfolio heat","Position limit"]},
{t:"Risk per setup type",c:"money",lvl:3,d:"Allocating different risk to different setups based on their measured historical edge.",e:"Only defensible once you have enough trades per setup to distinguish them. Below that it is a story about which setup you like.",rel:["Sample size","Expectancy"],warn:true},
{t:"Capital preservation mode",c:"money",lvl:2,d:"A predefined reduced-risk state entered after a drawdown threshold.",e:"Halve size at −10%, halve again at −15%, stop at −20%. The numbers matter less than deciding them in advance.",rel:["Drawdown protocol","Pre-commitment"]}

{t:"Swing high / swing low",c:"pa",lvl:1,d:"A local extreme with lower highs either side, or higher lows either side. The building block of structure.",e:"The lookback that defines 'local' is a parameter. Change it and the structure on your chart changes with it.",rel:["Market structure","Parameter choice"]},
{t:"Market structure",c:"pa",lvl:1,d:"The sequence of swing highs and lows that defines trend direction objectively.",e:"Its value is that it is codeable. Once you fix the swing lookback, two people get the same answer.",rel:["Swing high / swing low","Break of structure"]},
{t:"Break of structure",c:"pa",lvl:2,d:"Price closing beyond the prior swing point in the direction of trend, confirming continuation.",e:"Objective once the swing definition is fixed. Most disagreement about it is disagreement about the lookback.",rel:["Market structure","Change of character"]},
{t:"Change of character",c:"pa",lvl:2,d:"The first break against the prevailing structure, read as the earliest sign of a turn.",e:"Also the most common false signal in a strong trend, because every pullback produces one at some timeframe.",rel:["Break of structure","Retracement vs reversal"],warn:true},
{t:"Higher timeframe bias",c:"pa",lvl:1,d:"Deciding direction on a slower chart before looking for entries on a faster one.",e:"Reduces the number of setups you take, which is usually the point.",rel:["Top-down analysis","Timeframe"]},
{t:"Fractal nature of price",c:"pa",lvl:2,d:"The observation that charts look structurally similar across timeframes.",e:"True visually and often overstated. Costs do not scale down with the timeframe, which is why the same pattern is not equally tradeable on every chart.",rel:["Cost drag","Sub-daily frequency"],warn:true},
{t:"Volume at price",c:"pa",lvl:2,d:"How much traded at each level, rather than in each time period.",e:"Low-volume areas get traversed quickly; high-volume areas act as magnets and as friction.",rel:["Point of Control","Value area"]},
{t:"Imbalance",c:"pa",lvl:2,d:"A price area traversed with one-sided aggression, leaving little two-way trade behind.",e:"The general concept underneath fair value gaps. The name changes by community; the observation does not.",rel:["Liquidity void","Expansion"]},
{t:"Wick fill",c:"pa",lvl:3,d:"Price returning to trade through the area a long wick covered.",e:"Common enough to notice, unreliable enough to need a stop. Test the base rate before treating it as a target.",rel:["Pattern base rate","Gap fill"]},
{t:"Round numbers",c:"pa",lvl:1,d:"Whole figures like 23,000 or 100 that attract orders and stops for no reason beyond being memorable.",e:"A genuine behavioural mechanism — people place orders at round numbers, so liquidity genuinely concentrates there.",rel:["Economic rationale","Equal highs / equal lows"]},
{t:"Session open reaction",c:"pa",lvl:2,d:"The volatility burst as a major session opens and overnight orders execute.",e:"The New York open is the most consistent volatility event of the day for index futures. Whether it is tradeable is a separate question.",rel:["Opening range","Session"]},
{t:"Overnight range",c:"pa",lvl:2,d:"The high and low set outside the main session, often used as reference levels for the day.",e:"Thinner liquidity means these extremes are set by fewer participants, which is why they get swept so often.",rel:["Asian range","Liquidity sweep"]},
{t:"Failed auction",c:"pa",lvl:3,d:"Price probing beyond a range extreme and being rejected, indicating no acceptance at the new level.",e:"The auction-theory description of the same event ICT calls a sweep and Wyckoff calls a spring.",rel:["Spring","Liquidity sweep"]},
{t:"Trend day vs balance day",c:"pa",lvl:2,d:"A day that trends persistently in one direction versus one that rotates around a central value.",e:"Different strategies work on each, and you usually know which it is only after the first hour or two.",rel:["Initial balance","Open drive"]},
{t:"Diamond hands / paper hands",c:"slang",lvl:1,d:"Holding through volatility versus selling early. Used as praise and insult respectively.",e:"Both are marketing for someone else's exit. Neither is a risk framework.",rel:["Exit liquidity"],warn:true},
{t:"Catching a falling knife",c:"slang",lvl:1,d:"Buying an asset in freefall on the assumption it is cheap.",e:"There is no level at which a decline must stop. 'It cannot go lower' is a statement about your imagination.",rel:["Mean reversion","Averaging down"],warn:true},
{t:"Stop hunt",c:"slang",lvl:1,d:"The belief that price moved specifically to trigger your stop.",e:"Nobody is targeting you. Stops cluster at obvious levels, and price moving to where the orders are is the market working, not a conspiracy.",rel:["Liquidity sweep","Round numbers"],warn:true},
{t:"Revenge on the market",c:"slang",lvl:1,d:"Treating losses as a personal affront to be answered.",e:"The market has no memory of you and no opinion about your account.",rel:["Revenge trading","Tilt"]},
{t:"Buy the dip",c:"slang",lvl:1,d:"Adding on weakness within an assumed uptrend.",e:"Works brilliantly in a bull market and is indistinguishable from averaging down in a bear one. The distinction is the trend, which you learn afterwards.",rel:["Averaging down","Bull market"],warn:true},
{t:"To the moon",c:"slang",lvl:1,d:"Expectation of a large advance, usually stated without a mechanism or a target.",e:"A sentiment reading, not a thesis.",rel:["Economic rationale"]},
{t:"Alpha decay in public",c:"slang",lvl:2,d:"A shared edge stopping working once enough people trade it.",e:"A real mechanism for capacity-constrained strategies, and also a convenient excuse for something that never worked.",rel:["Factor decay","Capacity"]},
{t:"Backtest hero",c:"slang",lvl:2,d:"Someone with spectacular historical results and no live record.",e:"The gap between the two is the entire subject of the statistics section.",rel:["Paper-to-live gap","Overfitting"],warn:true},
{t:"Blown up",c:"slang",lvl:1,d:"Losing an account, usually through leverage rather than through being wrong.",e:"Almost always survivable as a lesson and almost never survivable as a position.",rel:["Risk of ruin","Position limit"]},
{t:"Boredom trading",c:"psy",lvl:1,d:"Entering because nothing is happening and watching is uncomfortable.",e:"The setup did not appear; the discomfort did. Those are different signals.",rel:["Overtrading","Discipline"]},
{t:"Sleep and decision quality",c:"psy",lvl:1,d:"The measurable degradation in judgement, risk perception and impulse control from poor sleep.",e:"Directly relevant if you trade the New York session from Perth. Trading tired is a sizing decision you did not know you were making.",rel:["Trading US hours from Perth","Screen time"],warn:true},
{t:"Identity and trading",c:"psy",lvl:2,d:"Attaching self-worth to trade outcomes, so a loss becomes a verdict on you.",e:"Makes it nearly impossible to cut losers, because closing the trade makes the judgement final.",rel:["Loss aversion","Process vs outcome"]},
{t:"Isolation",c:"psy",lvl:2,d:"Trading alone with no colleague to challenge a thesis.",e:"Nobody says 'that is your third revenge trade'. A written journal is the substitute, and a weak one.",rel:["Trading journal","Key person risk"]},
{t:"Expectation setting",c:"psy",lvl:1,d:"Having a realistic view of achievable returns before starting.",e:"Consistent 10% a month is not a benchmark, it is a marketing claim. Professional managers celebrate a good year at 15–20%.",rel:["Benchmark","Guaranteed returns"],warn:true},
{t:"Variance tolerance",c:"psy",lvl:2,d:"How much swing you can experience without abandoning the plan.",e:"The real constraint on position size, and it is personal. Size to what you can sit through, not to what the maths permits.",rel:["Drawdown","Position sizing"]},
{t:"Detachment from money",c:"psy",lvl:3,d:"Thinking in R multiples and percentages rather than dollars.",e:"Helps with execution and can hide how large a position actually is. Check the dollar figure periodically anyway.",rel:["R","Notional value"]},
{t:"The first big win problem",c:"psy",lvl:2,d:"An early outsized gain teaching the wrong lesson about what works.",e:"A lucky win reinforces whatever you happened to do, which is how bad habits get installed with confidence.",rel:["Overconfidence after a win streak","Sample size"],warn:true},
{t:"Quitting well",c:"psy",lvl:2,d:"Deciding in advance what evidence would make you stop trading altogether.",e:"A legitimate and underrated outcome. If a documented process shows no edge after a fair trial, stopping is the correct result, not a failure.",rel:["Null result","Strategy retirement"]},
{t:"Wyckoff method",c:"wyc",lvl:2,d:"Richard Wyckoff's framework reading price and volume as the footprint of a large operator accumulating and distributing stock.",e:"Published in the 1930s. Almost every 'smart money' concept circulating today is a renamed piece of it.",rel:["Accumulation","Composite operator"]},
{t:"Composite operator",c:"wyc",lvl:2,d:"Wyckoff's device of treating all large buyers as one rational actor, to reason about intent.",e:"A thinking tool, not a claim that a single entity exists. Modern retail content frequently forgets that distinction.",rel:["Smart money","Wyckoff method"],warn:true},
{t:"Selling climax",c:"wyc",lvl:2,d:"Panic selling on enormous volume that marks the end of a decline as large buyers absorb supply.",e:"Wide range, huge volume, close well off the low. The volume is the evidence, not the candle shape.",rel:["Capitulation","Automatic rally"]},
{t:"Automatic rally",c:"wyc",lvl:3,d:"The sharp bounce after a selling climax, once aggressive selling exhausts and supply thins.",e:"It defines the upper boundary of the trading range that follows.",rel:["Selling climax","Trading range"]},
{t:"Secondary test",c:"wyc",lvl:3,d:"A return toward the climax low on reduced volume and a narrower range, confirming supply has dried up.",e:"Lower volume on the retest is the actual signal. Same price, less selling.",rel:["Selling climax"]},
{t:"Trading range",c:"wyc",lvl:2,d:"The sideways band where accumulation or distribution takes place, bounded by the climax and the automatic reaction.",e:"Wyckoff's whole method is about determining which of the two is happening inside it.",rel:["Accumulation","Distribution"]},
{t:"Sign of strength",c:"wyc",lvl:3,d:"A wide-range advance on expanding volume through range resistance, indicating demand has taken control.",e:"Paired with a 'last point of support' pullback, it is Wyckoff's entry trigger.",rel:["Last point of support","Markup / markdown"]},
{t:"Last point of support",c:"wyc",lvl:3,d:"The final higher low after a sign of strength, before markup begins.",e:"Structurally identical to what modern content calls a bullish order block retest.",rel:["Sign of strength","Order block"]},
{t:"Effort vs result",c:"wyc",lvl:2,d:"Comparing volume (effort) against the price move it produced (result). A mismatch signals absorption.",e:"Huge volume with a small range means someone large is taking the other side. This is the most transferable idea in the whole method.",rel:["Absorption","Volume confirmation"]},
{t:"Supply and demand zones",c:"wyc",lvl:1,d:"Areas where one side previously overwhelmed the other, expected to matter again.",e:"The modern retail repackaging of Wyckoff's ranges. Same observation, newer vocabulary, no new evidence.",rel:["Support / resistance","Order block"]},
{t:"Phases A to E",c:"wyc",lvl:3,d:"Wyckoff's labelling of a range: stopping the trend, building the cause, testing, breaking out, and trending away.",e:"Like Elliott's counts, the labels are applied confidently in hindsight and argued about in real time.",rel:["Wave count","Pattern subjectivity"],warn:true},
{t:"Cause and effect",c:"wyc",lvl:3,d:"Wyckoff's idea that the time spent building a range determines the size of the move out of it.",e:"An appealing proportionality claim that is rarely stated precisely enough to test.",rel:["Falsifiability","Measured move"],warn:true},
{t:"Internal vs external liquidity",c:"ict",lvl:3,d:"Liquidity resting inside a range versus beyond its extremes.",e:"A framework for sequencing targets: sweep the inside first, then run for the outside. Testable in principle, rarely tested in practice.",rel:["Draw on liquidity","Liquidity pool"]},
{t:"Liquidity pool",c:"ict",lvl:2,d:"A concentration of resting stop and entry orders, typically just beyond an obvious high or low.",e:"The one genuinely mechanical idea in the framework: stops cluster where everyone can see the level.",rel:["Equal highs / equal lows","Round numbers"]},

{t:"Balanced price range",c:"ict",lvl:3,d:"An area where up and down imbalances overlap, considered rebalanced.",e:"An imbalance filled in both directions. Useful bookkeeping, not a signal.",rel:["Imbalance","Liquidity void"]},

{t:"Killzone",c:"ict",lvl:2,d:"Specific intraday windows the framework says produce the highest-quality setups — typically London and New York opens.",e:"Volatility genuinely concentrates at session opens. Whether the setups inside those windows have an edge is the untested part.",rel:["Session open reaction","Silver bullet"]},
{t:"Power of three",c:"ict",lvl:3,d:"The claim that a candle at any timeframe internally consists of accumulation, manipulation and distribution.",e:"An account of what happened inside a bar, constructed after seeing the bar. It forbids nothing in advance.",rel:["Quarterly Theory","Falsifiability"],warn:true},
{t:"Unicorn model",c:"ict",lvl:3,d:"A setup requiring a breaker block and a fair value gap to overlap.",e:"Adding conditions raises the apparent quality and shrinks the sample. Both effects are guaranteed; only one is useful.",rel:["Sample size","A+ setup"],warn:true},
{t:"Institutional order flow",c:"ict",lvl:2,d:"The framework's central claim: that large participants leave readable footprints in price.",e:"Real footprints exist in order flow data, which retail cannot see. Inferring them from candles alone is the leap the evidence does not support.",rel:["Order flow information","Smart money"],warn:true},
{t:"Framework vs strategy",c:"ict",lvl:1,d:"A framework describes markets; a strategy states entries, exits and size precisely enough to test.",e:"Most ICT material is the former sold as the latter. Converting it into a fully specified rule is where the claims usually dissolve.",rel:["Fully specified rule","Falsifiability"]},
{t:"Volatility clustering",c:"stat",lvl:2,d:"The tendency for volatile days to follow volatile days, and calm to follow calm.",e:"One of the most robust empirical facts in finance, and far more forecastable than direction.",rel:["Autocorrelation","Volatility regime"]},
{t:"Volatility smile",c:"opt",lvl:3,d:"The curved shape of implied volatility across strikes, dearer at both extremes.",e:"Appeared in equity index options after 1987, when the market learned crashes happen.",rel:["Volatility skew"]},

{t:"Delta hedging",c:"opt",lvl:3,d:"Continuously trading the underlying to keep an option position directionally neutral.",e:"The activity that converts options positioning into actual buying and selling of the underlying.",rel:["Option delta","Gamma exposure"]}
);

{t:"Queue position",c:"exec",lvl:3,d:"Where your resting limit order sits in the priority line at a price level.",e:"At the back of a long queue you get filled mainly when the level is about to break — which is adverse selection by construction.",rel:["Adverse selection","Fill rate"]},

{t:"Crossing the spread",c:"exec",lvl:1,d:"Paying the ask to buy or hitting the bid to sell, for immediate execution.",e:"The cost of certainty. On a one-tick MNQ spread it is $0.50 a contract each way, every time.",rel:["Spread","Round turn"]},
{t:"Flight to quality",c:"macro",lvl:2,d:"Capital moving into government bonds, the dollar and gold during stress.",e:"The mechanism behind the classic negative stock-bond correlation, which does not hold when inflation is the problem.",rel:["Risk-on / risk-off","Correlation breakdown"]},
{t:"Liquidity conditions",c:"macro",lvl:2,d:"How much cash is sloshing through the financial system, driven by central bank balance sheets and fiscal flows.",e:"A slow variable that explains multi-month trends better than any chart pattern does.",rel:["Quantitative easing","Repo"]},

{t:"Event risk",c:"macro",lvl:1,d:"Exposure to a scheduled or unscheduled announcement that can gap price.",e:"Scheduled event risk is a choice. Being in a position through CPI is a decision, whether or not you made it deliberately.",rel:["Economic calendar","Gap risk"],warn:true},

{t:"Consistent profitability",c:"prop",lvl:1,d:"Producing returns steadily rather than in lumps — an evaluation requirement, and a poor description of how real edges behave.",e:"Genuine strategies are lumpy. A rule demanding smoothness selects for short-volatility behaviour.",rel:["Consistency rule","Short volatility"],warn:true},

{t:"Power",c:"stat",lvl:3,d:"The probability a test detects an effect that is genuinely there.",e:"Retail samples are usually badly underpowered, meaning a null result is weak evidence of absence — and a positive one is likely to be inflated.",rel:["Sample effect size","Sample size"]},
{t:"Sample effect size",c:"stat",lvl:3,d:"The measured magnitude in your sample, which overstates the truth when power is low and you only report winners.",e:"Known as the winner's curse. The first estimate of a new edge is almost always too flattering.",rel:["Power","Regression to the mean"],warn:true},

{t:"Research backlog",c:"ops",lvl:3,d:"A queue of hypotheses waiting to be tested, prioritised by how strong the proposed mechanism is.",e:"Prioritising by mechanism rather than by chart appeal is what keeps a search from becoming a fishing trip.",rel:["Economic rationale","Pre-registration"]},

{t:"Trade thesis",c:"mgmt",lvl:1,d:"The one-sentence reason you are in the trade, written at entry.",e:"When it no longer applies, exit — regardless of whether the stop has been hit. That is a legitimate discretionary exit; a bad feeling is not.",rel:["Invalidation","Trading journal"]},
{t:"Holding period",c:"mgmt",lvl:1,d:"How long a trade is intended to stay open, decided in advance.",e:"Drifting from an intraday plan into an overnight hold is a different strategy with different risk. Name it when it happens.",rel:["Time stop","Overnight risk"],warn:true},

{t:"Exit on time",c:"mgmt",lvl:2,d:"Closing at a fixed point — session end, a set number of bars, or before a scheduled event.",e:"Removes overnight and event risk mechanically. Test what it costs; it is often less than people assume.",rel:["Time stop","Event risk"]},
