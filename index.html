{t:"Adverse selection",c:"exec",lvl:3,d:"Your resting order gets filled precisely when it was the wrong side to be on, because the person taking it knew something.",e:"Your limit buy fills instantly right before the drop. That is not bad luck, it is the structural cost of providing liquidity.",rel:["Limit order","Market maker"]},
{t:"Fill rate",c:"exec",lvl:2,d:"The proportion of your limit orders that actually execute. A backtest assuming every limit fills is describing a market that does not exist.",e:"Limit-entry backtests are optimistic by default: the fills you miss are the ones where price ran away in your favour.",rel:["Limit order","Backtest"],warn:true},
{t:"Same-bar vs next-bar fill",c:"exec",lvl:2,d:"Whether a backtest assumes you executed on the signal bar or the one after. A modelling choice that can change results several fold.",e:"In this project's own tests, switching convention moved breakout drawdowns by up to 2.7x. If a result only survives same-bar fills, it depends on fill timing rather than on the effect.",rel:["Look-ahead bias","Backtest"],warn:true},
{t:"Payment for order flow",c:"exec",alt:"PFOF",lvl:2,d:"A broker selling its retail orders to a wholesaler who executes them. Funds 'zero commission' trading.",e:"Zero commission does not mean zero cost — it means the cost moved somewhere you cannot see on the statement.",rel:["Costs","Price improvement"]},
{t:"Price improvement",c:"exec",lvl:3,d:"Getting filled slightly better than the quoted price, typically by a wholesaler internalising your order.",e:"Real, and usually smaller than the spread you would have crossed. It is the argument PFOF brokers make, and it is partially true.",rel:["Payment for order flow"]},
{t:"Dark pool",c:"exec",lvl:3,d:"A private venue where large orders trade without pre-trade display, to limit market impact.",e:"Prints appear afterwards on the tape. 'Dark pool data' sold as a retail signal is mostly delayed and mostly noise.",rel:["Market impact"],warn:true},
{t:"Smart order routing",c:"exec",lvl:3,d:"Software splitting an order across venues seeking the best combined execution.",e:"Standard at any decent broker. The quality of it is a real difference between brokers that nobody advertises."},
{t:"TWAP / VWAP execution",c:"exec",lvl:3,d:"Algorithms slicing a large order over time, or in proportion to volume, to reduce impact. Distinct from VWAP the indicator.",e:"An execution tool for size, not a signal. Confusing the two is common in retail content.",rel:["VWAP","Market impact"]},
{t:"Implementation shortfall",c:"exec",lvl:3,d:"The total gap between the price when you decided and the price you actually achieved, including impact, delay and unfilled quantity.",e:"The honest measure of execution cost. Almost nobody in retail tracks it, which is why backtest-to-live decay surprises people.",rel:["Live decay","Slippage"]},
{t:"Front running",c:"exec",lvl:2,d:"Trading ahead of a known incoming order. Illegal for brokers acting on client orders; a fact of life in a public mempool.",e:"On-chain it happens automatically and legally as MEV.",rel:["MEV"]},
{t:"High-frequency trading",c:"exec",lvl:2,d:"Automated strategies competing on speed, holding positions for milliseconds and relying on enormous trade counts.",e:"Not your competition on a daily chart. Very much your competition on a one-minute one.",rel:["Latency","Colocation"]},
{t:"Odd lot",c:"exec",lvl:3,d:"An equity order smaller than the standard 100-share round lot. Historically excluded from the consolidated tape.",e:"Means some historical volume and quote data is systematically incomplete for small trades.",rel:["Data quality"]},
{t:"Session",c:"exec",lvl:1,d:"A defined trading window with its own character — pre-market, regular hours, after hours, or the FX centre sessions.",e:"Liquidity, spread and typical range differ enormously between them. A strategy tested across all hours is averaging several different markets together.",rel:["FX session overlap","Globex hours"]},
{t:"Auction (open / close)",c:"exec",lvl:2,d:"The single-price matching events that begin and end an equity session, where a large share of daily volume executes.",e:"The closing auction is the highest-liquidity moment of the day and the reason index rebalances happen there.",rel:["Liquidity"]},
{t:"Halt",c:"exec",lvl:2,d:"Trading suspended in an instrument, for volatility or pending news.",e:"You cannot exit during a halt. It reopens wherever it reopens, which is the second reason a stop is not a guarantee.",rel:["Circuit breaker","Gap risk"],warn:true},
{t:"Effective sample size",c:"stat",lvl:2,d:"The number of genuinely independent observations, which is usually far below the raw count when trades overlap or share a driver.",e:"Two hundred trades across sixty correlated assets in one bull market is closer to a handful of independent bets. Raw counts overstate evidence here by five to ten times.",rel:["Sample size","Correlation","Overlapping returns"],warn:true},
{t:"Overlapping returns",c:"stat",lvl:3,d:"Forward returns measured over windows that share days are not independent, which inflates apparent significance.",e:"Twenty-day forward returns sampled daily share 19 of 20 days with their neighbour. An iid bootstrap on them understates variance by roughly half.",rel:["Block bootstrap","Effective sample size"],warn:true},
{t:"Block bootstrap",c:"stat",lvl:3,d:"Resampling in contiguous chunks rather than individual observations, preserving the autocorrelation that ordinary bootstrapping destroys.",e:"Block length should match your holding period. Using an iid bootstrap on overlapping returns produced the only apparent pass in ~58,700 trials in this project — and it was an error, not a discovery.",rel:["Bootstrap","Overlapping returns"]},
{t:"p-value",c:"stat",lvl:2,d:"The probability of seeing a result this good if the strategy had no edge at all. Low means surprising under the null, not 'probably true'.",e:"p = 0.05 means one in twenty no-edge strategies would look this good. Test a hundred and you expect five of these by luck alone.",rel:["Multiple testing","Bonferroni correction"]},
{t:"Multiple testing",c:"stat",lvl:1,d:"The more variants you try, the better the best one looks purely by chance. The dominant reason retail backtests do not survive contact with reality.",e:"At ~50,000 trials, noise alone is expected to throw up a best-of-search annualised Sharpe near 2.4 — at or above nearly every Sharpe this project has ever recorded.",rel:["Deflated Sharpe ratio","p-value","Trial ledger"],warn:true},
{t:"Trial ledger",c:"stat",lvl:1,d:"A permanent running count of every test ever run against a dataset. Without one, the multiple-testing correction is unknowable and every significance claim is decoration.",e:"Counting only the tests you remember is the same as not counting. Failed searches are logged, never deleted — a hidden failed search is a lie by omission.",rel:["Multiple testing","Pre-registration"]},
{t:"Pre-registration",c:"stat",lvl:1,d:"Writing down the hypothesis, the mechanism, the success criterion and the number of variants before running anything.",e:"It converts an unbounded search into a single stated test. It is the one procedure that actually prevents the story being rewritten to fit the result.",rel:["Trial ledger","HARKing"]},
{t:"HARKing",c:"stat",lvl:2,d:"Hypothesising After the Results are Known — finding a pattern, then inventing the reason it should exist and presenting it as a prediction.",e:"It feels exactly like insight. The tell is that the rationale arrives after the chart rather than before it.",rel:["Pre-registration","Data snooping"],warn:true},
{t:"Null result",c:"stat",lvl:1,d:"A finding that the effect is not there. The most common honest outcome, and a genuine product rather than a failure.",e:"'This does not work after costs' saves you the money you would have spent finding out live. That is the return on the research.",rel:["Pre-registration"]},
{t:"Out-of-sample",c:"stat",lvl:1,d:"Data the strategy was not built on. The only figures that carry any information about the future.",e:"In-sample results measure how well you fitted the past. They are a description of your search, not of the market.",rel:["Walk-forward","Purged cross-validation"]},
{t:"Purged cross-validation",c:"stat",lvl:3,d:"Cross-validation that removes training observations overlapping the test window, plus an embargo period after it, so information cannot leak backwards.",e:"Without purging, a twenty-day holding period leaks twenty days of the answer into the training set.",rel:["Embargo","Look-ahead bias"]},
{t:"Embargo",c:"stat",lvl:3,d:"A gap left after each test window before training resumes, blocking leakage through serial correlation.",e:"Small detail, large effect on whether a result is real.",rel:["Purged cross-validation"]},
{t:"Probability of backtest overfitting",c:"stat",alt:"PBO",lvl:3,d:"An estimate of how likely it is that the variant that won in-sample will underperform the median out-of-sample.",e:"Above 0.5 means your selection procedure is worse than picking at random. It is a test of your search, not of any single strategy.",rel:["Multiple testing","Overfitting"]},
{t:"White's Reality Check",c:"stat",lvl:3,d:"A test asking whether the best strategy from a whole search beats the benchmark by more than the best of an equivalent random search would.",e:"In this project, 0 of 134 strategy groups beat buy-and-hold under it.",rel:["Multiple testing","Benchmark"]},
{t:"Monte Carlo permutation",c:"stat",lvl:3,d:"Shuffling the data or the signal thousands of times to build the distribution of results a no-edge version would produce.",e:"If your real result sits comfortably inside that distribution, you have a normal-looking outcome and no evidence of skill.",rel:["Bootstrap","Random trader benchmark"]}
);
D.push(
{t:"Random trader benchmark",c:"stat",lvl:1,d:"A strategy taking entries at random with the same trade count, holding period and costs. The floor any real strategy must clear.",e:"In this project's database a random trader ranks third by deflated Sharpe out of everything ever tested. That is the calibration to keep in mind before celebrating a result.",rel:["Benchmark","Monte Carlo permutation"]},
{t:"Selection bias",c:"stat",lvl:2,d:"Choosing what to test, or what to report, in a way that is influenced by the answer.",e:"Showing the best asset out of sixty-five is a report about your selection process, not about the strategy.",rel:["Survivorship bias","Multiple testing"]},
{t:"Regression to the mean",c:"stat",lvl:1,d:"Extreme results tend to be followed by ordinary ones, with no cause required.",e:"The best-performing strategy of last quarter usually disappoints next quarter. That is arithmetic, not decay.",rel:["Multiple testing"]},
{t:"Law of large numbers",c:"stat",lvl:2,d:"Results converge on their true expectation only over many independent trials. Small samples wander enormously.",e:"It is why a 70% win rate over twenty trades and a 70% win rate over two thousand are completely different claims.",rel:["Sample size"]},
{t:"Fat tails",c:"stat",lvl:2,d:"Extreme moves happen far more often than a normal distribution predicts. Every risk model assuming normality understates disaster.",e:"'A twelve-sigma event' usually means the model was wrong, not that something impossible occurred.",rel:["Tail risk","Risk of ruin"],warn:true},
{t:"Tail risk",c:"stat",lvl:1,d:"The rare, large loss sitting at the end of the distribution. Strategies that look smooth are often just storing it up.",e:"A system with no losing month for three years may have a genuine edge, or may have a tail it has not met yet. The two look identical until the day they do not.",rel:["Short volatility","Fat tails"],warn:true},
{t:"Autocorrelation",c:"stat",lvl:3,d:"The degree to which a series is correlated with its own past. Its presence breaks the independence assumption most tests rely on.",e:"Volatility is strongly autocorrelated; returns barely are. That asymmetry is why volatility is forecastable and direction largely is not.",rel:["Stationarity","Block bootstrap"]},
{t:"Noise floor",c:"stat",lvl:2,d:"The performance level reachable by chance alone given your search size. Anything below it carries no information.",e:"Knowing yours turns 'is this good?' into an answerable question. Without it, every positive number looks like evidence.",rel:["Multiple testing","Random trader benchmark"]},
{t:"Confidence interval",c:"stat",lvl:2,d:"The range a statistic plausibly occupies given the sample. Point estimates without one are overstated by construction.",e:"A Sharpe of 1.2 with a confidence interval from −0.3 to 2.7 is not a Sharpe of 1.2, it is 'we do not know'.",rel:["Sample size"]},
{t:"Volatility targeting",c:"port",lvl:2,d:"Scaling position size inversely to recent volatility so each position contributes a similar amount of risk.",e:"Half size when the market is twice as wild. It reliably smooths drawdowns — the mechanical part is real. The claim that it improves Sharpe did not survive confirmation testing here.",rel:["Position sizing","Sharpe ratio"]},
{t:"Risk parity",c:"port",lvl:3,d:"Allocating so each asset contributes equally to portfolio risk, rather than equally by dollars.",e:"Bonds get a larger weight than intuition suggests because they move less. Works until the correlation you relied on changes.",rel:["Volatility targeting","Correlation"]},
{t:"Rebalancing",c:"port",lvl:2,d:"Periodically returning to target weights, which mechanically sells what rose and buys what fell.",e:"One of the few free-ish improvements available, requiring no forecast at all. Its benefit shrinks as costs and tax rise.",rel:["Rebalancing premium","Costs"]},
{t:"Rebalancing premium",c:"port",lvl:3,d:"The extra return from rebalancing a set of volatile, uncorrelated assets versus holding them fixed.",e:"Real, well documented, and small. It needs genuinely low correlation to appear at all.",rel:["Rebalancing","Correlation"]},
{t:"Correlation matrix",c:"port",lvl:2,d:"Every pair's correlation in one grid. The first thing to compute before assuming a set of positions is diversified.",e:"Combining zeros gives zero. Combining weak-but-real uncorrelated signals is worthwhile. Check which one you have before building the ensemble.",rel:["Correlation","Diversification"]},
{t:"Diversification",c:"port",lvl:1,d:"Holding things that do not move together, so no single event decides the outcome.",e:"Ten tech stocks is one position. Correlation, not count, is what diversifies.",rel:["Correlation matrix","Portfolio heat"]},
{t:"Correlation breakdown",c:"port",lvl:2,d:"Correlations converging toward one during a crisis, exactly when diversification was supposed to help.",e:"Everything falls together in a panic. Portfolio construction should assume this, not the calm-period matrix.",rel:["Correlation matrix","Tail risk"],warn:true},
{t:"Beta",c:"port",lvl:2,d:"How much a position moves relative to the broad market. Beta of 1 moves with it, 2 moves twice as hard.",e:"Most 'alpha' in retail portfolios is beta with extra steps — being right about direction in a rising market.",rel:["Alpha"]},
{t:"Alpha",c:"port",lvl:2,d:"Return above what your market exposure alone would have delivered. The part attributable to skill rather than to being long.",e:"Making 20% while the index made 24% is negative alpha, however good the year felt.",rel:["Beta","Benchmark"]},
{t:"Buy and hold",c:"port",lvl:1,d:"Owning the asset and doing nothing. The benchmark almost every active strategy fails to beat after costs.",e:"Across roughly 58,700 backtests in this project, buy-and-hold beats the active strategies on average. That is the standing result, not a defeatist framing.",rel:["Benchmark"]},
{t:"Dollar cost averaging",c:"port",lvl:1,d:"Investing a fixed amount at fixed intervals regardless of price.",e:"Removes timing decisions and the emotion attached to them. Slightly worse than lump sum on average, much easier to actually stick to.",rel:["Buy and hold"]},
{t:"Concentration risk",c:"port",lvl:1,d:"Too much of the outcome resting on one position, sector or idea.",e:"Eight MNQ contracts is not a portfolio. It is one leveraged bet on one index, sized as though it were several.",rel:["Portfolio heat","Diversification"],warn:true},
{t:"Capital efficiency",c:"port",lvl:3,d:"How much exposure you get per dollar of margin. Futures are extremely efficient, which is exactly why they are dangerous.",e:"Efficiency is not free capacity. The margin required does not tell you the risk taken.",rel:["Notional value","Leverage"],warn:true},
{t:"Ensemble",c:"port",lvl:3,d:"Combining several strategies so their independent errors partially cancel.",e:"Only helps if the components are genuinely uncorrelated and individually have some positive expectancy. Run the correlation check before building it.",rel:["Correlation matrix","Diversification"]},
{t:"Evaluation",c:"prop",alt:"challenge",lvl:1,d:"The paid test — hit a profit target without breaching drawdown rules — that qualifies you for a funded account.",e:"Pass rates are typically in the low single digits. The fee is the product; the funded account is the marketing.",rel:["Prop firm","Reset fee"],warn:true},
{t:"Profit target",c:"prop",lvl:1,d:"The gain required to pass, usually 8–10% of the notional account size.",e:"Reaching it within a drawdown limit that is smaller than the target forces a risk-to-reward profile most passing traders could not repeat.",rel:["Evaluation","Trailing drawdown"]},
{t:"Trailing drawdown",c:"prop",lvl:1,d:"A loss limit that follows your highest equity or balance upward, so profit permanently raises the floor you can be cut at.",e:"Up $2,000 on a $2,000 trailing limit and your effective stop-out is now your starting balance. Many traders fail after being profitable, not before.",rel:["Daily loss limit","Evaluation"],warn:true},
{t:"Intraday vs end-of-day drawdown",c:"prop",lvl:2,d:"Whether the trailing limit tracks your peak unrealised equity tick by tick, or only your closed balance at the session end.",e:"Intraday tracking means an unrealised spike you never took can raise your floor. This one clause changes the difficulty enormously — read it before paying.",rel:["Trailing drawdown"],warn:true},
{t:"Consistency rule",c:"prop",lvl:2,d:"A requirement that no single day contributes more than a set share of total profit.",e:"It exists to exclude one-lucky-trade passes. It also invalidates genuinely lumpy strategies, so check it against how your system actually distributes returns.",rel:["Payout split"]},
{t:"Payout split",c:"prop",lvl:1,d:"The share of profits you keep, commonly 80–90% after an initial threshold.",e:"Compare against the total cost of every evaluation attempt it took to get there. That is the real net figure.",rel:["Prop firm","Reset fee"]},
{t:"Reset fee",c:"prop",lvl:2,d:"The charge to restart a failed evaluation, typically discounted to encourage another attempt.",e:"The discount is the business model. The expected number of attempts, times the fee, is your actual entry cost.",rel:["Evaluation"],warn:true},
{t:"Scaling plan",c:"prop",lvl:2,d:"A schedule increasing your allocation as you hit profit milestones.",e:"Useful structure, and also a reason to check the firm's payout history before organising your trading around a promise.",rel:["Payout split"]},
{t:"News trading restriction",c:"prop",lvl:2,d:"Rules banning positions around high-impact scheduled releases.",e:"Reasonable risk control from the firm's side, and it removes an entire category of strategy from consideration.",rel:["Economic calendar"]},
{t:"Simulated funding",c:"prop",lvl:2,d:"An account that is a demo environment throughout, with payouts made from company revenue rather than trading profits.",e:"Legal and widely disclosed in the fine print. It means the firm's incentive is for you to keep paying fees, which is worth knowing.",rel:["Prop firm"],warn:true},
{t:"Copy trading a funded account",c:"prop",lvl:3,d:"Mirroring the same trades across several accounts to multiply the payout.",e:"Prohibited by most firms and a common reason payouts are refused after the fact. Read the clause before assuming it works.",rel:["Payout split"],warn:true},
{t:"Round turn",c:"cost",lvl:1,d:"The full cost of entering and exiting one contract — commission both ways, exchange and clearing fees, plus the spread you crossed.",e:"About $0.50–$1.20 per MNQ round turn in commissions, plus at least one tick of spread ($0.50). On a ten-point target that is roughly 8% of the gross.",rel:["Costs","Spread"]},
{t:"Cost drag",c:"cost",lvl:1,d:"The cumulative effect of costs on a strategy's returns, which scales with how often you trade rather than how much you make.",e:"An edge of two ticks per trade is entirely consumed by a one-tick spread and commission. Most retail strategies die here, not on the signal.",rel:["Round turn","Turnover"],warn:true},
{t:"Turnover",c:"cost",lvl:2,d:"How much you trade relative to capital. The multiplier on every cost you pay.",e:"It is why slow strategies survive costs and scalping strategies mostly do not. Halving turnover is often worth more than improving the signal.",rel:["Cost drag"]},
{t:"Financing / carry cost",c:"cost",lvl:2,d:"What you pay to hold a leveraged position over time — margin interest, FX swap, or crypto funding.",e:"Invisible in a backtest that ignores it, and frequently the largest single line in a live account's P&L.",rel:["Swap / rollover fee","Funding rate"],warn:true},
{t:"Brutal cost model",c:"cost",lvl:2,d:"Deliberately pessimistic cost assumptions in a backtest — wide spreads, full commission, generous slippage.",e:"If a result only survives optimistic costs, it is a result about your assumptions. Never mix cost models within one comparison.",rel:["Cost drag","Backtest"]},
{t:"CGT",c:"cost",alt:"capital gains tax Australia",lvl:1,d:"Capital gains tax. In Australia, gains on assets held as investments are taxed as capital gains, with a 50% discount for individuals on assets held over twelve months.",e:"The discount does not apply to assets held under a year, and generally not to gains treated as trading income. General information only — not tax advice.",rel:["Trader vs investor status"]},
{t:"Trader vs investor status",c:"cost",lvl:2,d:"In Australia the ATO distinguishes carrying on a business of trading from investing. It changes whether profits are ordinary income or capital gains, and whether losses are deductible against other income.",e:"Frequency, volume, organisation and intent all feed into it. This one is genuinely worth an accountant rather than a forum post — general information only.",rel:["CGT"]},
{t:"Wash sale",c:"cost",lvl:2,d:"Selling to realise a loss and buying back almost immediately. Anti-avoidance rules can deny the deduction.",e:"The ATO has specific guidance on this. Assuming the US rules apply here is a common and expensive mistake.",rel:["CGT"],warn:true},
{t:"Record keeping",c:"cost",lvl:1,d:"A complete trade log with dates, prices, sizes, fees and rationale. Required for tax and the only route to knowing what your strategy actually does.",e:"Exchange statements cover the tax side. The rationale column is what makes the log useful for improving anything.",rel:["Trading journal"]},
{t:"Broker insolvency",c:"cost",lvl:2,d:"The risk the broker fails. Client money segregation and the jurisdiction's compensation scheme decide what you recover.",e:"A regulated broker in a strong jurisdiction is not paranoia, it is the cheapest risk reduction available.",rel:["Custody","Regulation"]},
{t:"Regulation",c:"cost",lvl:1,d:"Which authority oversees your broker and what protections come with it. ASIC in Australia; offshore licences are often decorative.",e:"ASIC caps CFD leverage for retail clients at 30:1 on major FX and 20:1 on indices. Offshore brokers offering 500:1 to Australians are avoiding that cap, not solving a problem.",rel:["CFD","Broker insolvency"],warn:true},
{t:"OHLCV",c:"data",lvl:1,d:"Open, high, low, close, volume — the five numbers per bar that nearly all retail analysis is built from.",e:"Every indicator you have ever seen is a transformation of these. It is also the most thoroughly mined dataset in existence.",rel:["Candlestick","Feature engineering"]},
{t:"Tick data",c:"data",lvl:2,d:"Every individual trade or quote update, rather than a summary per bar. Orders of magnitude larger and the only way to model execution honestly.",e:"You cannot tell from a daily bar whether the high came before the low, which decides whether your stop or target hit first.",rel:["OHLCV","Intrabar ambiguity"]},
{t:"Intrabar ambiguity",c:"data",lvl:2,d:"Within one bar you cannot know the order in which the high and low occurred, so a backtest has to guess which of your stop and target triggered.",e:"Backtests usually assume the pessimistic order, or silently assume the favourable one. Check which yours does — it can flip a result.",rel:["Tick data","Look-ahead bias"],warn:true},
{t:"Adjusted price",c:"data",lvl:2,d:"Historical equity prices restated for splits and dividends so returns stay continuous.",e:"Unadjusted history shows a 50% 'crash' on a two-for-one split day. Adjusted history shows prices nothing ever traded at.",rel:["Back-adjustment","Corporate action"]},
{t:"Corporate action",c:"data",lvl:2,d:"Splits, dividends, mergers, spin-offs and delistings — events that change a security outside of trading.",e:"Backtests that ignore them generate false signals on the adjustment day, every time.",rel:["Adjusted price","Survivorship bias"]},
{t:"Data quality",c:"data",lvl:1,d:"Gaps, bad ticks, duplicated bars, wrong timezones and holiday handling. Unglamorous and responsible for a large share of impossible-looking backtests.",e:"Run an integrity check before believing any result: missing bars, impossible returns, NaNs, and timestamps that drift with daylight saving.",rel:["Bad tick","Look-ahead bias"]},
{t:"Bad tick",c:"data",lvl:2,d:"A single erroneous price in the feed, often a fat-finger print or a feed glitch.",e:"One bad tick can trigger every stop in a backtest and produce a beautiful, entirely fictional result.",rel:["Data quality"],warn:true},
{t:"Timezone alignment",c:"data",lvl:2,d:"Making sure bars, sessions and event timestamps all sit in one consistent frame, including daylight saving shifts.",e:"US daylight saving moves the New York open by an hour relative to Perth twice a year. A session-based strategy that ignores it is testing two different windows.",rel:["Session","Data quality"],warn:true},
{t:"Alternative data",c:"data",lvl:3,d:"Anything not derived from price — positioning, flows, on-chain activity, satellite imagery, card spending.",e:"The one genuinely promising direction left, because it carries information OHLCV does not. Also expensive, short-history and easy to overfit.",rel:["On-chain metrics","Feature engineering"]},
{t:"Feature engineering",c:"data",lvl:3,d:"Constructing inputs for a model from raw data. On price alone it mostly manufactures researcher degrees of freedom rather than information.",e:"A thousand features from one price series is still one price series. More transformations of the same information do not add information.",rel:["OHLCV","Overfitting"],warn:true},
{t:"Universe",c:"data",lvl:2,d:"The set of instruments a test runs across, and the rules deciding membership.",e:"Choosing the universe after seeing results is selection bias. Fix it in the pre-registration.",rel:["Selection bias","Pre-registration"]},
{t:"Discretionary vs systematic",c:"auto",lvl:1,d:"Discretionary means you decide in the moment; systematic means the rules decide and you execute them.",e:"Only systematic rules can be backtested. 'I use discretion within a system' usually means the results cannot be measured.",rel:["Model","Backtest"]},
{t:"Fully specified rule",c:"auto",lvl:1,d:"A rule with no remaining judgement — every term is a number or a condition a computer could evaluate identically twice.",e:"'Enter on a strong rejection' is not a rule. 'Enter when the close is back above the prior swing high after a wick beyond it' is.",rel:["Discretionary vs systematic"]},
{t:"Signal vs execution",c:"auto",lvl:2,d:"The decision to trade and the mechanics of getting filled are separate problems with separate failure modes.",e:"A good signal with careless execution loses. Test them separately or you cannot tell which one is broken.",rel:["Implementation shortfall"]},
{t:"State machine",c:"auto",lvl:3,d:"Modelling the bot as a set of defined states with legal transitions — flat, pending, in position, closing.",e:"Prevents the classic bug where a restart leaves the bot believing it is flat while a position sits open at the broker.",rel:["Reconciliation"]}
);
D.push(
{t:"Reconciliation",c:"auto",lvl:2,d:"Checking the bot's belief about its positions against what the broker actually holds, continuously.",e:"The single most important safety routine in any automated system. Disagreement should halt trading, not be papered over.",rel:["State machine","Kill switch"],warn:true},
{t:"Kill switch",c:"auto",lvl:1,d:"A single control that flattens everything and stops the system, working independently of the strategy code.",e:"It must work when the main logic is the thing that is broken. If it lives inside the same process, it is not a kill switch.",rel:["Reconciliation"],warn:true},
{t:"Idempotency",c:"auto",lvl:3,d:"Ensuring a repeated instruction does not produce a repeated action, so a retry after a timeout does not double your position.",e:"Network timeouts are normal. Without unique order IDs, a retried submission is how one contract becomes two.",rel:["Reconciliation"],warn:true},
{t:"Paper trading a bot",c:"auto",lvl:1,d:"Running the automation live against simulated fills to test the plumbing rather than the edge.",e:"It validates connectivity, order handling and restarts. It cannot validate slippage or your behaviour.",rel:["Sim / paper","Forward test"]},
{t:"Machine learning on price",c:"auto",lvl:3,d:"Applying models to price-derived features. An efficient overfitting engine on the same information content.",e:"It vastly increases researcher degrees of freedom without adding data. Not a promising direction on OHLCV alone.",rel:["Feature engineering","Overfitting"],warn:true},
{t:"Logging",c:"auto",lvl:1,d:"Recording every signal, order, fill and rejection with timestamps, so a live discrepancy can be reconstructed afterwards.",e:"Without it, a bad day is a mystery. With it, it is a bug report.",rel:["Record keeping","Reconciliation"]},
{t:"Latency to broker",c:"auto",lvl:2,d:"The round trip between your machine and the broker, including your home connection.",e:"Running a bot on a residential Perth connection against a US venue is hundreds of milliseconds. Design strategies that do not care.",rel:["Latency"]},
{t:"Fail-safe default",c:"auto",lvl:2,d:"Deciding what the system does when something is wrong: flatten, or hold. Both are defensible; not choosing is not.",e:"Disconnection, bad data and unknown state all need an answer written before they happen, not during.",rel:["Kill switch"],warn:true},
{t:"Track record screenshot",c:"scam",lvl:1,d:"An image of an account balance, offered as evidence. It carries essentially no information — it can be a demo, a cherry-picked window, or edited.",e:"Ask for the full period, every trade, and the drawdown. The request is usually the end of the conversation.",rel:["Verified track record"],warn:true},
{t:"Verified track record",c:"scam",lvl:2,d:"A complete, third-party-verified history including every trade, all losing periods, and the maximum drawdown.",e:"Rare, boring, and the only version worth anything. Partial records are advertising.",rel:["Track record screenshot"]},
{t:"Signal group",c:"scam",lvl:1,d:"A paid channel posting entries to follow. The seller earns from subscriptions regardless of whether the calls work.",e:"The incentive is subscriber count, not your P&L. Ask what the business would look like if the signals were worthless — usually identical.",rel:["Exit liquidity"],warn:true},
{t:"Guaranteed returns",c:"scam",lvl:1,d:"Any promise of a fixed return from trading. There is no mechanism that produces one.",e:"'2% a week, capital protected' describes a Ponzi structure. The maths of that claim is the entire tell.",rel:["Ponzi"],warn:true},
{t:"Ponzi",c:"scam",lvl:1,d:"Paying earlier participants with later participants' deposits while showing fabricated returns.",e:"Identifiable by returns that are too smooth. Real trading returns are lumpy — implausible consistency is the warning, not the selling point.",rel:["Guaranteed returns","Short volatility"],warn:true},
{t:"Recovery scam",c:"scam",lvl:1,d:"Someone offering to recover funds you already lost, for a fee. Targets people who have just been defrauded.",e:"Effectively always a second fraud on the same victim. No legitimate recovery service cold-contacts you.",warn:true},
{t:"Affiliate funnel",c:"scam",lvl:2,d:"An educator paid a commission for every broker signup or evaluation fee they refer.",e:"It explains why a particular broker or prop firm is recommended so strongly. Check for a disclosure before weighting the advice.",rel:["Prop firm"],warn:true},
{t:"Survivor content",c:"scam",lvl:2,d:"Only successful traders make content, so the entire visible population is the winners of a large random draw.",e:"Ten thousand people flipping coins produce a dozen with ten heads in a row, and every one of them will have a method to explain it.",rel:["Survivorship bias","Multiple testing"]},
{t:"Complexity as authority",c:"scam",lvl:2,d:"Dense private vocabulary used to make an unfalsifiable framework feel rigorous.",e:"If a framework explains every outcome after the fact and forbids none in advance, it is not making predictions.",rel:["Falsifiability","HARKing"],warn:true},
{t:"Falsifiability",c:"scam",lvl:1,d:"Whether a claim can be shown wrong. A framework compatible with every outcome tells you nothing about the next one.",e:"'The sweep failed because it was a higher-timeframe manipulation leg' after the fact means no result could have counted against it.",rel:["Complexity as authority","Pre-registration"]},
{t:"Credential over mechanism",c:"scam",lvl:1,d:"Supporting an idea with who uses it rather than why it should work.",e:"'A profitable trader uses this' is not a mechanism. A risk premium being compensated, a behavioural bias, or a structural constraint on some participant — those are mechanisms.",rel:["Economic rationale","Falsifiability"]},
{t:"Economic rationale",c:"scam",lvl:1,d:"The reason an effect should exist at all: someone is being paid to take a risk, someone is systematically making an error, or someone is forced to trade badly by a rule.",e:"Without one of those three, a pattern is noise by default and does not earn a trial.",rel:["Credential over mechanism","Pre-registration"]},
{t:"Copy trading",c:"scam",lvl:2,d:"Automatically mirroring another account's trades.",e:"You inherit their leverage and their tail risk while having no idea what their actual rules are. Leaderboards select for the luckiest recent gambler.",rel:["Survivor content"],warn:true},
{t:"Course arbitrage",c:"scam",lvl:2,d:"Selling education about a method the seller does not trade at meaningful size.",e:"The question that settles it: is the income from trading, or from teaching? Both answers are fine, but the honest ones say which.",rel:["Affiliate funnel"]},
{t:"Discipline",c:"psy",lvl:1,d:"Doing the thing you decided when calm, at the moment you no longer feel like it.",e:"Mostly an engineering problem rather than a character one: hard stops, position limits, and a daily loss limit that closes the platform for you.",rel:["Tilt","Process vs outcome"]},
{t:"Overconfidence after a win streak",c:"psy",lvl:2,d:"Recent success reading as skill, followed by size increases the edge does not justify.",e:"Statistically, a streak is what a positive expectancy looks like some of the time. It is not new information about your ability.",rel:["Gambler's fallacy","Regression to the mean"],warn:true},
{t:"Analysis paralysis",c:"psy",lvl:2,d:"Adding conditions until no trade ever qualifies, usually after a painful loss.",e:"Manifests as twelve indicators and no trades. The underlying issue is size, not confirmation — the correct fix is trading smaller.",rel:["A+ setup"]},
{t:"Screen time",c:"psy",lvl:2,d:"Hours spent watching live price. Genuinely builds pattern recognition, and also builds boredom trades.",e:"For an Australian on US hours, more screen time means less sleep, which degrades decisions faster than the experience improves them.",rel:["Overnight risk"]},
{t:"Defined risk",c:"risk",lvl:1,d:"A position whose maximum loss is known and capped at entry, structurally rather than by intention.",e:"A long option is defined risk. A short future with a mental stop is not — the cap depends on you being present and the market being open.",rel:["Stop loss (SL)","Gap risk"]},
{t:"Mental stop",c:"risk",lvl:1,d:"A stop you intend to honour rather than one resting at the exchange.",e:"It fails in exactly the conditions it is for: fast moves, and while you are asleep. On an overnight index position from Perth it provides nothing.",rel:["Stop loss (SL)","Overnight risk"],warn:true},
{t:"Hedge",c:"risk",lvl:2,d:"A position taken to offset risk in another, accepting a cost to reduce a range of outcomes.",e:"A hedge that makes money on average is not a hedge, it is a second bet. Hedges are supposed to cost something.",rel:["Protective put","Correlation"]},
{t:"Position limit",c:"risk",lvl:1,d:"A hard ceiling on size or open positions, set when calm and enforced mechanically.",e:"The most effective single control available, because it works even when your judgement does not.",rel:["Portfolio heat","Kill switch"]},
{t:"Break-even stop",c:"risk",lvl:2,d:"Moving the stop to entry once a trade is sufficiently in profit.",e:"Feels risk-free and measurably increases the number of scratched trades that would have worked. Test it before adopting it — it is not free.",rel:["Trailing stop","MAE / MFE"]},
{t:"Time stop",c:"risk",lvl:2,d:"Exiting after a fixed period regardless of price, on the basis that a thesis that has not worked yet probably will not.",e:"Underused, easy to test, and it cuts the long tail of dead capital sitting in positions going nowhere.",rel:["Stop loss (SL)"]},
{t:"Economic calendar",c:"macro",lvl:1,d:"The schedule of data releases and central bank events, with expected impact.",e:"Checking it takes ten seconds and prevents the most avoidable losses there are. CPI, FOMC and NFP move index futures more than any chart pattern.",rel:["NFP","FOMC"]},
{t:"Central bank speak",c:"macro",lvl:2,d:"Officials' speeches and testimony between meetings, which move rate expectations without any policy change.",e:"Frequently a larger intraday mover than the scheduled decision, because the decision was already priced.",rel:["FOMC","Dot plot"]},
{t:"Kelly fraction in practice",c:"risk",lvl:3,d:"The fraction of full Kelly actually used, because full Kelly assumes you know your edge exactly and produces unbearable swings.",e:"Quarter-Kelly is the common choice. Since your edge estimate is uncertain and probably overstated, the conservative fraction is doing real work.",rel:["Kelly criterion","Risk of ruin"]},
{t:"Long-legged doji",c:"cpat",lvl:2,d:"A doji with long wicks both sides. Price travelled a long way in both directions and settled where it started.",e:"Maximum disagreement, zero resolution. Often marks a volatility spike rather than a turn.",rel:["Doji"]},
{t:"Dragonfly doji",c:"cpat",lvl:2,d:"A doji with a long lower wick and no upper wick. Sellers pushed down hard and were completely rejected.",e:"At the bottom of a decline it is the same information as a hammer. In isolation it is one bar.",rel:["Hammer","Doji"]},
{t:"Gravestone doji",c:"cpat",lvl:2,d:"A doji with a long upper wick and no lower wick — the mirror of a dragonfly.",e:"Buyers took control and gave every point back before the close.",rel:["Shooting star","Doji"]},
{t:"Marubozu",c:"cpat",lvl:2,d:"A candle with a full body and effectively no wicks. One side controlled the entire period.",e:"A large bullish marubozu on volume is what displacement looks like at the bar level.",rel:["Displacement","Expansion"]},
{t:"Hanging man",c:"cpat",lvl:2,d:"The same shape as a hammer but appearing after an advance. Same candle, opposite context, opposite reading.",e:"Identical bar, different location. The pattern is the context, not the shape — which is a hint about how much the shapes are worth alone.",rel:["Hammer"]},
{t:"Shooting star",c:"cpat",lvl:1,d:"A small body at the bottom of the range with a long upper wick, after an advance. Buyers pushed up and were rejected.",e:"The bearish mirror of a hammer. Strongest when the wick pokes through an obvious level first.",rel:["Gravestone doji","Liquidity sweep"]},
{t:"Inverted hammer",c:"cpat",lvl:2,d:"A shooting-star shape appearing after a decline rather than an advance, read as a potential bottom.",e:"The taxonomy here is four names for two shapes distinguished only by what came before. Worth knowing, not worth trading blind.",rel:["Shooting star"]},
{t:"Pin bar",c:"cpat",lvl:1,d:"Any candle with a dominant wick and a small body at the opposite end. The general case that hammer and shooting star are specific instances of.",e:"The useful version is a pin bar rejecting a level that mattered before. A pin bar in open space is noise with a name.",rel:["Hammer","Rejection"]},
{t:"Bullish engulfing",c:"cpat",lvl:1,d:"A green candle whose body completely covers the prior red candle's body. One period undid the last one entirely.",e:"On a 5-minute chart this happens dozens of times a day. On a daily chart at a major low it is worth noticing.",rel:["Bearish engulfing","Timeframe"]},
{t:"Bearish engulfing",c:"cpat",lvl:1,d:"A red candle whose body swallows the prior green one.",e:"The tell that matters is whether it engulfed at a level and on volume, not that it engulfed.",rel:["Bullish engulfing"]},
{t:"Harami",c:"cpat",lvl:2,d:"A small candle contained entirely within the prior candle's body. Japanese for 'pregnant'. Momentum pausing rather than reversing.",e:"An inside bar with a stricter definition. Usually a continuation more often than a reversal, contrary to how it is taught.",rel:["Inside bar"]},
{t:"Inside bar",c:"cpat",lvl:1,d:"A bar whose entire range sits within the previous bar's range. Volatility contracting.",e:"Traded as a breakout of the mother bar in either direction. It is one of the few patterns with a clean, testable definition.",rel:["Outside bar","Consolidation"]},
{t:"Outside bar",c:"cpat",lvl:2,d:"A bar whose range fully covers the previous bar's range, taking out both the prior high and low.",e:"Both sides of stops got hit in one bar. The close tells you who won.",rel:["Inside bar","Liquidity sweep"]},
{t:"Morning star",c:"cpat",lvl:2,d:"A three-bar bottom: a long red bar, a small indecisive bar, then a long green bar closing well into the first.",e:"One of the more structurally sensible patterns — it encodes a genuine sequence of capitulation, pause and reclaim.",rel:["Evening star"]},
{t:"Evening star",c:"cpat",lvl:2,d:"The three-bar top: long green, small indecisive bar, long red closing back into the first.",e:"The mirror of the morning star.",rel:["Morning star"]},
{t:"Three white soldiers",c:"cpat",lvl:3,d:"Three consecutive strong green candles, each opening within the prior body and closing near its high.",e:"Describes momentum that has already happened. By the third soldier the good entry is behind you.",rel:["Three black crows"]},
{t:"Three black crows",c:"cpat",lvl:3,d:"Three consecutive strong red candles in the same stair-step pattern.",e:"Same caveat inverted — it names a move rather than predicting one.",rel:["Three white soldiers"]},
{t:"Tweezer top / bottom",c:"cpat",lvl:3,d:"Two or more adjacent candles with matching highs or matching lows.",e:"Structurally the same information as equal highs and equal lows: a shelf of stops sitting at one price.",rel:["Equal highs / equal lows"]},
{t:"Piercing line",c:"cpat",lvl:3,d:"A green candle opening below the prior red candle's low and closing above its midpoint.",e:"A weaker bullish engulfing. Every candle pattern taxonomy has three or four grades of the same idea.",rel:["Bullish engulfing"]},
{t:"Dark cloud cover",c:"cpat",lvl:3,d:"The bearish counterpart to a piercing line — opens above the prior high, closes below the prior midpoint.",e:"Named in the 1700s, still on every course slide, still one bar of information.",rel:["Piercing line"]},
{t:"Spinning top",c:"cpat",lvl:2,d:"A small body with wicks on both sides. Indecision without the strictness of a doji.",e:"Clusters of them mark balance, which is more useful than any single one.",rel:["Doji","Consolidation"]},
{t:"Rejection",c:"cpat",lvl:1,d:"Price trading into an area and being pushed straight back out, leaving a wick behind.",e:"The general concept underneath most single-bar patterns. What matters is the level it happened at.",rel:["Pin bar","Support / resistance"]},
{t:"Indecision",c:"cpat",lvl:1,d:"Price action with small bodies and overlapping ranges — neither side committing.",e:"Trading it is optional. Sitting out indecision costs nothing and saves the two-way stop-outs.",rel:["Chop","Doji"]},
{t:"Volume confirmation",c:"cpat",lvl:2,d:"Checking whether a pattern formed on meaningful volume or on nothing.",e:"A daily engulfing bar on a third of average volume is a rounding error wearing a pattern's name.",rel:["Volume","Candlestick"]},
{t:"Pattern base rate",c:"cpat",lvl:1,d:"How often a pattern is followed by the outcome it supposedly predicts, measured across a large sample rather than recalled from charts.",e:"Almost every candlestick pattern tested in isolation lands close to a coin flip once costs are applied. Test before you trust.",rel:["Sample size","Hindsight bias"],warn:true}
);
D.push(
{t:"Head and shoulders",c:"chpat",lvl:1,d:"Three peaks with the middle highest, sharing a neckline. Read as a topping formation, with a measured target of the head-to-neckline distance projected down.",e:"The most famous pattern in charting. Its measured-move target is the testable part; the shape recognition is the subjective part.",rel:["Neckline","Measured move"]},
{t:"Inverse head and shoulders",c:"chpat",lvl:1,d:"The same formation upside down, read as a bottom.",e:"Same measured move, projected upward from the neckline break.",rel:["Head and shoulders"]},
{t:"Neckline",c:"chpat",lvl:2,d:"The line joining the reaction lows (or highs) of a head-and-shoulders. The break of it is the trigger.",e:"Where you draw it changes the trigger and the target, which is exactly the discretion that makes these hard to test.",rel:["Head and shoulders"],warn:true},
{t:"Double top",c:"chpat",lvl:1,d:"Two peaks at a similar price with a trough between. A failure to make a higher high.",e:"Mechanically identical to equal highs — a shelf of stops above two matched peaks.",rel:["Equal highs / equal lows","Double bottom"]},
{t:"Double bottom",c:"chpat",lvl:1,d:"Two troughs at a similar price, read as a base.",e:"The second low holding is the information. The second low being swept and reclaimed is stronger information.",rel:["Double top","Spring"]},
{t:"Triple top / bottom",c:"chpat",lvl:2,d:"Three attempts at the same level that fail.",e:"By the third touch the level is the most-watched price on the chart, which is precisely why it often breaks.",rel:["Double top"]},
{t:"Ascending triangle",c:"chpat",lvl:1,d:"A flat resistance level with rising lows beneath it. Buyers paying up while sellers hold one price.",e:"Usually taught as bullish. What it actually encodes is a coil, and coils resolve violently in either direction.",rel:["Consolidation","Descending triangle"]},
{t:"Descending triangle",c:"chpat",lvl:1,d:"A flat support level with falling highs above it.",e:"The bearish mirror, with the same caveat about assumed direction.",rel:["Ascending triangle"]},
{t:"Symmetrical triangle",c:"chpat",lvl:2,d:"Converging highs and lows with no directional bias.",e:"The honest version of the triangle family: it says volatility is compressing and nothing about which way.",rel:["Consolidation","Expansion"]},
{t:"Bull flag",c:"chpat",lvl:1,d:"A sharp advance followed by a shallow, orderly pullback in a tight channel, then continuation.",e:"The pole sets the measured target. The flag's tightness is the quality filter — a sloppy, deep pullback is not a flag.",rel:["Measured move","Pennant"]},
{t:"Bear flag",c:"chpat",lvl:1,d:"The same structure after a sharp decline.",e:"Counter-trend drift on falling volume, then resumption.",rel:["Bull flag"]},
{t:"Pennant",c:"chpat",lvl:2,d:"Like a flag but the consolidation converges to a point instead of channelling.",e:"A flag and a pennant differ only in the shape of the pause. Treat them as one idea.",rel:["Bull flag"]},
{t:"Rising wedge",c:"chpat",lvl:2,d:"Both boundaries sloping up, with the lower one steeper, so the range narrows as price rises.",e:"Rising price on shrinking range and usually falling volume — an advance running out of fuel.",rel:["Falling wedge"]},
{t:"Falling wedge",c:"chpat",lvl:2,d:"Both boundaries sloping down and converging.",e:"The bullish counterpart. Wedges are the one pattern family where the volume behaviour genuinely adds information.",rel:["Rising wedge"]},
{t:"Cup and handle",c:"chpat",lvl:2,d:"A rounded base followed by a small pullback near the rim, then a breakout.",e:"Popularised by O'Neil for equities on weekly charts. Its usefulness drops sharply on intraday timeframes.",rel:["Rounding bottom","Breakout"]},
{t:"Rounding bottom",c:"chpat",lvl:3,d:"A slow, curved base with no sharp low — accumulation showing up as shape.",e:"Takes months to form. Invisible until it is nearly complete, which limits how tradeable it is.",rel:["Accumulation","Cup and handle"]},
{t:"Channel",c:"chpat",lvl:1,d:"Price moving between two parallel boundaries, ascending, descending or horizontal.",e:"The most useful of the pattern family because it is objective: two touches each side and you have a testable rule.",rel:["Trendline","Range"]},
{t:"Broadening formation",c:"chpat",lvl:3,d:"Diverging boundaries — each swing larger than the last. Expanding volatility and expanding disagreement.",e:"Brutal to trade. Every breakout fails and every reversal overshoots.",rel:["Expansion"],warn:true},
{t:"Measured move",c:"chpat",lvl:1,d:"Projecting the size of a prior leg from the breakout point to set a target.",e:"The genuinely testable part of pattern trading: the target rule is objective even when the pattern identification is not.",rel:["Risk:reward","Take profit (TP)"]},
{t:"Throwback / pullback to the breakout",c:"chpat",lvl:2,d:"Price returning to retest the level it just broke before continuing.",e:"Waiting for it gives a tighter stop and misses the moves that never come back. That trade-off is measurable — measure it.",rel:["Retest","Breakout"]},
{t:"Retest",c:"chpat",lvl:1,d:"Price returning to a broken level to see whether it now holds from the other side.",e:"Support becoming resistance is the cleanest version. A failed retest is often a better signal than the original break.",rel:["Support / resistance","Throwback / pullback to the breakout"]},
{t:"False breakout",c:"chpat",lvl:1,d:"Price clearing a level, failing to hold, and closing back inside.",e:"Far more common than clean breakouts on retail timeframes. Fading them is a whole strategy family — and one this project has already tested and failed.",rel:["Turtle soup","Liquidity sweep"]},
{t:"Trendline",c:"chpat",lvl:1,d:"A line joining successive highs or lows to describe a trend's slope.",e:"Two points define a line, three points define a trendline, and any chart contains a hundred plausible ones. The subjectivity is the problem.",rel:["Channel","Support / resistance"],warn:true},
{t:"Pattern subjectivity",c:"chpat",lvl:1,d:"The degree to which two competent people would identify the same pattern on the same chart.",e:"If a rule cannot be coded, it cannot be tested, and if it cannot be tested you are trusting recall over evidence. That is the core problem with the whole pattern literature.",rel:["Fully specified rule","Falsifiability"],warn:true},
{t:"Golden ratio",c:"fib",lvl:2,d:"1.618, and its inverse 0.618. The ratio the whole framework is named after.",e:"Genuinely appears in biology and geometry. Its appearance in price is asserted rather than demonstrated.",rel:["Fibonacci retracement"],warn:true},
{t:"Fibonacci extension",c:"fib",lvl:2,d:"Projections beyond 100% of a leg — 1.272, 1.618, 2.618 — used as targets.",e:"Functionally a measured move with different multipliers. Test the multipliers rather than assuming them.",rel:["Measured move"]},
{t:"Equilibrium / 50% level",c:"fib",lvl:2,d:"The midpoint of a range or leg. Premium above, discount below.",e:"The single most-used level in ICT material, and the one with the most obvious justification — it is just the mean of the leg.",rel:["Premium / discount"]},
{t:"Elliott Wave",c:"fib",lvl:2,d:"A framework describing trends as five impulse waves followed by three corrective waves, nesting fractally at every degree.",e:"Extremely flexible — which is the criticism. A framework that can relabel the count after the fact forbids no outcome in advance.",rel:["Falsifiability","Wave count"],warn:true},
{t:"Wave count",c:"fib",lvl:3,d:"The specific labelling of an Elliott sequence on a chart.",e:"Two experienced practitioners routinely produce different counts on the same chart, and both revise after the move. That is the whole problem in one sentence.",rel:["Elliott Wave","Pattern subjectivity"],warn:true},
{t:"Impulse vs corrective",c:"fib",lvl:3,d:"Elliott's distinction between motive waves that travel with the trend and corrective ones that fight it.",e:"The underlying observation — trends move in bursts and pauses — is real and predates the labelling.",rel:["Elliott Wave","Retracement vs reversal"]},
{t:"ABCD pattern",c:"fib",lvl:3,d:"A four-point structure where the CD leg mirrors the AB leg in length and often in time.",e:"The simplest harmonic. Its virtue is that it is objectively measurable, unlike most of the family.",rel:["Harmonic patterns","Measured move"]},
{t:"Harmonic patterns",c:"fib",lvl:3,d:"Named five-point structures — Gartley, Bat, Butterfly, Crab, Shark — each defined by a specific set of Fibonacci ratios between legs.",e:"Precisely defined, which makes them testable. When they are tested with tolerance bands and costs, the results have not supported the enthusiasm.",rel:["ABCD pattern","Pattern base rate"],warn:true},
{t:"Gartley",c:"fib",lvl:3,d:"The original harmonic: a 61.8% B-point retracement and a 78.6% D-point completion of the XA leg.",e:"Described by H.M. Gartley in 1935. The Fibonacci ratios were added by later authors, not by Gartley.",rel:["Harmonic patterns"]},
{t:"Gann",c:"fib",lvl:3,d:"W.D. Gann's framework of angles, squares and time-price geometry.",e:"Historically influential, almost entirely unfalsifiable, and the claims about Gann's own returns have never been substantiated.",rel:["Falsifiability","Credential over mechanism"],warn:true},
{t:"Time cycles",c:"fib",lvl:3,d:"The idea that turning points recur on fixed time intervals.",e:"Some genuine seasonality exists. Most cycle claims are found by searching many periods and reporting the one that fitted.",rel:["Seasonality","Multiple testing"],warn:true},
{t:"Simple moving average",c:"ind2",alt:"SMA",lvl:1,d:"The mean close over the last N bars, replotted each bar. The oldest input drops out entirely when it leaves the window.",e:"A 200-day SMA is a slow reference for trend direction. It cannot lead price — it is an average of price.",rel:["Exponential moving average","Lag"]},
{t:"Exponential moving average",c:"ind2",alt:"EMA",lvl:1,d:"A moving average weighting recent bars more heavily, so it reacts faster and never fully forgets old data.",e:"Faster response, more whipsaw. The choice between SMA and EMA is a lag-versus-noise trade-off, not a right answer.",rel:["Simple moving average","Lag"]},
{t:"Lag",c:"ind2",lvl:1,d:"The delay built into any indicator computed from past bars. Every smoothing method trades responsiveness against stability.",e:"There is no setting that removes it. An indicator that appears to lead price is usually repainting.",rel:["Repainting"],warn:true},
{t:"Repainting",c:"ind2",lvl:1,d:"An indicator that changes its historical values as new data arrives, so the chart you review is not what you would have seen live.",e:"The single biggest source of fake backtest results in retail scripting. If a signal moves after the bar closes, the backtest is fiction.",rel:["Look-ahead bias"],warn:true},
{t:"Golden cross / death cross",c:"ind2",lvl:1,d:"The 50-period average crossing above (golden) or below (death) the 200-period one.",e:"Enormous media attention, mediocre tested performance, and by definition it triggers well after the move started.",rel:["Simple moving average","Lag"]},
{t:"Overbought / oversold",c:"ind2",lvl:1,d:"Labels for an oscillator sitting at an extreme. They describe the indicator's state, not a market obligation.",e:"'Overbought' means the recent gains outnumbered the losses. It does not mean price is due to fall.",rel:["RSI","Stochastic oscillator"],warn:true},
{t:"Stochastic oscillator",c:"ind2",lvl:2,d:"Where the close sits within the high–low range of the last N bars, expressed 0–100.",e:"Fast, noisy, and mostly a range-market tool. In a trend it pins at an extreme and stays there.",rel:["Overbought / oversold"]},
{t:"Bollinger squeeze",c:"ind2",lvl:2,d:"Band width contracting to a multi-period low, indicating compressed volatility.",e:"Signals that an expansion is likely, and says nothing about direction. Pairing it with a directional filter is the usual approach.",rel:["Consolidation","Expansion"]},
{t:"Keltner Channel",c:"ind2",lvl:2,d:"Bands set at a multiple of ATR around an EMA, rather than standard deviations around an SMA.",e:"Smoother than Bollinger because ATR is less jumpy than standard deviation. Used together, the squeeze of one inside the other is a common setup.",rel:["ATR","Bollinger Bands"]},
{t:"ADX",c:"ind2",lvl:2,d:"Average Directional Index — measures trend strength from 0 to 100 without saying which way.",e:"Below 20 is usually chop, above 25 is a trend worth following. Used as a filter rather than a signal.",rel:["Chop","Trend"]},
{t:"Ichimoku",c:"ind2",lvl:3,d:"A Japanese system plotting five lines including a forward-projected 'cloud' of support and resistance.",e:"The cloud is displaced forward in time, which looks predictive and is simply a shifted average of past prices.",rel:["Lag"]},
{t:"Donchian Channel",c:"ind2",lvl:2,d:"The highest high and lowest low of the last N bars. The basis of the original Turtle system.",e:"The most honest indicator on this list: it is literally the N-bar range, with no smoothing and no parameters beyond N.",rel:["Breakout","Turtle"]},
{t:"OBV",c:"ind2",lvl:3,d:"On-Balance Volume — a running total adding volume on up bars and subtracting it on down bars.",e:"A crude cumulative delta built from bar closes rather than actual aggressor data.",rel:["Delta","Volume"]},
{t:"CCI",c:"ind2",lvl:3,d:"Commodity Channel Index — how far price sits from its moving average in units of mean deviation.",e:"Another normalised distance-from-average measure. Most oscillators are variations on this idea.",rel:["Overbought / oversold"]},
{t:"Williams %R",c:"ind2",lvl:3,d:"Effectively an inverted stochastic, scaled −100 to 0.",e:"Same computation, different sign convention. The indicator list is shorter than it looks.",rel:["Stochastic oscillator"]},
{t:"SuperTrend",c:"ind2",lvl:2,d:"An ATR-based trailing line that flips between long and short bias.",e:"Popular because it produces a clean binary signal. It is a trailing stop drawn on a chart, and it whipsaws in ranges exactly as one would.",rel:["ATR","Trailing stop"]},
{t:"Parabolic SAR",c:"ind2",lvl:3,d:"Dots that trail price and accelerate, flipping side when touched.",e:"Designed as a stop-and-reverse system for trends. In chop it reverses you repeatedly at the worst prices.",rel:["Trailing stop"],warn:true},
{t:"Pivot points",c:"ind2",lvl:2,d:"Levels computed arithmetically from the prior session's high, low and close.",e:"Objective, widely watched, and computed identically by everyone — which is the actual mechanism behind whatever effect they have.",rel:["Support / resistance","Previous day high / low"]},
{t:"Heikin Ashi",c:"ind2",lvl:2,d:"Candles built from averaged open/close values, smoothing the visual trend.",e:"The prices shown are not real prices. Backtesting entries at Heikin Ashi opens produces fills that never existed.",rel:["Candlestick"],warn:true},
{t:"Renko",c:"ind2",lvl:3,d:"Bricks drawn only when price moves a fixed amount, removing time from the chart entirely.",e:"Looks beautifully clean because it discards information. The last brick is always incomplete, which is where backtests cheat.",rel:["Repainting"],warn:true},
{t:"Market profile",c:"ind2",lvl:3,d:"A distribution of time spent at each price, drawn as a histogram on its side.",e:"The ancestor of volume profile, using time rather than volume. Both express the same auction idea.",rel:["Point of Control","Value area"]},
{t:"Indicator stacking",c:"ind2",lvl:1,d:"Adding more indicators in the hope that agreement means confirmation.",e:"Nearly all of them are transformations of the same price series, so they agree by construction. Twelve indicators is one indicator with extra colours.",rel:["Confluence","Degrees of freedom"],warn:true},
{t:"Parameter choice",c:"ind2",lvl:1,d:"The period settings on an indicator — 14, 20, 50, 200 — almost all inherited by convention rather than derived.",e:"14 for RSI came from Wilder's book, not from evidence. If your result depends on 14 and dies at 13 and 15, it is noise.",rel:["Parameter sensitivity","Overfitting"]},
{t:"Share",c:"eq",alt:"stock equity",lvl:1,d:"A unit of ownership in a company, carrying a claim on its assets and earnings and usually a vote.",e:"Owning one CBA share makes you an owner of a bank, entitled to dividends and a vote nobody casts.",rel:["Dividend","Market capitalisation"]},
{t:"Market capitalisation",c:"eq",lvl:1,d:"Share price multiplied by shares outstanding — the market's price for the whole company.",e:"Comparing share prices across companies is meaningless. A $2 stock is not cheaper than a $200 one.",rel:["Free float","Enterprise value"],warn:true}
);
D.push(
{t:"Free float",c:"eq",lvl:2,d:"The shares actually available to trade, excluding those locked up with insiders, governments or strategic holders.",e:"A small float makes a stock far easier to move, which is why low-float names dominate squeeze stories.",rel:["Short squeeze","Liquidity"]},
{t:"Enterprise value",c:"eq",lvl:3,d:"Market cap plus debt minus cash — what it would cost to buy the whole business outright.",e:"The fairer comparison between companies with different capital structures.",rel:["Market capitalisation"]},
{t:"Dividend",c:"eq",lvl:1,d:"A cash distribution to shareholders out of profits.",e:"The share price drops by roughly the dividend on the ex-date. It is not free money — it is your own capital being returned.",rel:["Ex-dividend date","Franking credit"],warn:true},
{t:"Ex-dividend date",c:"eq",lvl:2,d:"The first day a buyer no longer receives the upcoming dividend. The price gaps down by approximately the dividend amount.",e:"A backtest that ignores ex-dates will read these gaps as crashes and 'discover' a strategy that shorts them.",rel:["Corporate action","Adjusted price"],warn:true},
{t:"Dividend yield",c:"eq",lvl:1,d:"Annual dividend divided by share price.",e:"A very high yield usually means the price fell, not that the payout rose. It is often a warning rather than a bargain.",rel:["Dividend"],warn:true},
{t:"Buyback",c:"eq",lvl:2,d:"A company purchasing its own shares, reducing the count and lifting per-share figures.",e:"A large, persistent, price-insensitive buyer. Buyback blackout periods around earnings remove that support temporarily.",rel:["Earnings"]},
{t:"Stock split",c:"eq",lvl:1,d:"Dividing existing shares into more units at a proportionally lower price. Economically nothing changes.",e:"A 10-for-1 split turns one $500 share into ten $50 shares. Unadjusted price history shows a 90% crash that never happened.",rel:["Adjusted price","Corporate action"]},
{t:"Short selling",c:"eq",lvl:1,d:"Borrowing shares, selling them, and buying them back later to return. You profit if the price falls.",e:"Losses are unbounded — a share can rise without limit, and your obligation rises with it.",rel:["Short squeeze","Borrow fee"],warn:true},
{t:"Borrow fee",c:"eq",lvl:2,d:"The interest paid to the lender of shares you have shorted. Rises sharply when a stock is hard to borrow.",e:"Annualised rates above 100% happen on squeeze candidates. Being right on direction and wrong on timing still loses.",rel:["Short selling","Hard to borrow"]},
{t:"Hard to borrow",c:"eq",lvl:2,d:"A stock with limited shares available to lend, making shorting expensive or impossible.",e:"Also means an existing short can be recalled and force-closed at the worst moment.",rel:["Borrow fee","Buy-in"],warn:true},
{t:"Buy-in",c:"eq",lvl:3,d:"A forced closure of a short when the lender recalls the shares.",e:"You do not choose the timing or the price. It is a margin call by another name.",rel:["Hard to borrow"],warn:true},
{t:"Short interest",c:"eq",lvl:2,d:"The proportion of a company's float currently sold short.",e:"High short interest is fuel, not a signal. It says a squeeze is possible, not that one is coming.",rel:["Short squeeze","Days to cover"]},
{t:"Days to cover",c:"eq",lvl:3,d:"Short interest divided by average daily volume — how long it would take shorts to exit.",e:"The higher it is, the more violent a squeeze can be, because the exit is narrow.",rel:["Short interest"]},
{t:"Penny stock",c:"eq",lvl:1,d:"A very low-priced, low-liquidity share, often on a secondary board with minimal disclosure.",e:"The natural habitat of pump-and-dump schemes. Wide spreads mean you can be down 20% the instant you fill.",rel:["Pump and dump","Liquidity"],warn:true},
{t:"Index inclusion",c:"eq",lvl:2,d:"A stock being added to a major index, forcing every tracking fund to buy it.",e:"A large, price-insensitive, date-certain flow. One of the few genuinely predictable order-flow events.",rel:["Rebalancing","Index fund"]},
{t:"ADR",c:"eq",lvl:3,d:"American Depositary Receipt — a US-listed instrument representing shares in a foreign company.",e:"Trades in US hours in US dollars, so it carries currency exposure the underlying does not.",rel:["Currency pair"]},
{t:"Float rotation",c:"eq",lvl:3,d:"Daily volume divided by free float. Above 1 means the entire tradeable supply changed hands in a day.",e:"Characteristic of squeeze days in small caps. Nothing about the business changed; the ownership churned completely.",rel:["Free float","Short squeeze"]},
{t:"Earnings per share",c:"eq",alt:"EPS",lvl:2,d:"Net profit divided by shares outstanding.",e:"Buybacks raise it without the business improving, because the denominator shrank.",rel:["P/E ratio","Buyback"]},
{t:"P/E ratio",c:"eq",lvl:1,d:"Share price divided by earnings per share — years of current earnings to pay for the share.",e:"Useful within an industry, misleading across industries, and meaningless for a company with no earnings.",rel:["Earnings per share","Valuation"]},
{t:"Valuation",c:"eq",lvl:2,d:"Estimating what a business is worth, as distinct from what it currently trades at.",e:"A cheap company can stay cheap for a decade. Valuation is a statement about value, not about timing.",rel:["P/E ratio","Value"]},
{t:"Guidance",c:"eq",lvl:2,d:"A company's own forecast for coming quarters, issued alongside results.",e:"Frequently moves the price more than the reported numbers, because the report is history and guidance is not.",rel:["Earnings"]},
{t:"Halt on news",c:"eq",lvl:2,d:"An exchange pausing trading pending a material announcement.",e:"It reopens via an auction at whatever price clears. Stops do not protect you across it.",rel:["Halt","Gap risk"],warn:true},
{t:"Bond",c:"rates",lvl:1,d:"A loan to a government or company that pays periodic interest and returns the principal at maturity.",e:"The price moves inversely to yield. Buying a bond is lending; the risk is that rates rise or the borrower fails.",rel:["Yield","Coupon"]},
{t:"Coupon",c:"rates",lvl:1,d:"The fixed interest rate a bond pays on its face value.",e:"A 3% coupon on $1,000 face pays $30 a year regardless of what the bond now trades for.",rel:["Yield","Bond"]},
{t:"Yield",c:"rates",lvl:1,d:"The return you earn buying at today's price and holding to maturity. Moves opposite to price by arithmetic, not by sentiment.",e:"If a bond's price falls, its yield rises — the same fixed payments now cost less to buy.",rel:["Bond","Yield curve"]},
{t:"Duration",c:"rates",lvl:2,d:"How sensitive a bond's price is to a change in rates, expressed in years.",e:"Duration 8 means roughly an 8% price fall for a 1% rate rise. It is the bond world's leverage measure.",rel:["Convexity","Interest rate risk"]},
{t:"Convexity",c:"rates",lvl:3,d:"The curvature in that relationship — duration itself changes as rates move.",e:"Positive convexity means you lose less than duration predicts when rates rise and gain more when they fall.",rel:["Duration"]},
{t:"Interest rate risk",c:"rates",lvl:2,d:"The risk that rising rates reduce the value of existing fixed-rate holdings.",e:"2022 demonstrated it at scale: 'safe' long bonds fell more than 30%. Safe from default is not safe from rates.",rel:["Duration"],warn:true},
{t:"Credit spread",c:"rates",lvl:2,d:"The extra yield a corporate borrower pays over the government rate, compensating for default risk.",e:"Widening spreads are one of the better early warnings of stress, and they usually move before equities do.",rel:["Default risk","Risk-on / risk-off"]},
{t:"Default risk",c:"rates",lvl:2,d:"The chance the borrower does not pay.",e:"Priced continuously in the spread. A high yield is a quoted probability of not being repaid.",rel:["Credit spread","Credit rating"]},
{t:"Credit rating",c:"rates",lvl:2,d:"An agency's assessment of a borrower's creditworthiness, from AAA down to junk.",e:"Agencies are paid by the issuers they rate. That conflict was central to 2008 and has not been removed.",rel:["Default risk"],warn:true},
{t:"Treasury / government bond",c:"rates",lvl:1,d:"Debt issued by a national government, treated as the local risk-free benchmark.",e:"The US 10-year is the reference rate for global asset pricing. Its move explains more cross-asset days than any chart pattern.",rel:["Yield curve","Risk-free rate"]},
{t:"Risk-free rate",c:"rates",lvl:2,d:"The return available with no credit risk, used as the baseline every other return is measured against.",e:"When cash pays 5%, a strategy returning 6% with large drawdowns is doing almost nothing for you.",rel:["Sharpe ratio","Benchmark"]},
{t:"TIPS / inflation-linked",c:"rates",lvl:3,d:"Bonds whose principal adjusts with inflation, so the return is real rather than nominal.",e:"The gap between nominal and inflation-linked yields is the market's inflation expectation — a genuine forward-looking number.",rel:["Breakeven inflation"]},
{t:"Breakeven inflation",c:"rates",lvl:3,d:"The inflation rate at which nominal and inflation-linked bonds return the same.",e:"One of the cleanest market-implied expectations available, and free to observe.",rel:["TIPS / inflation-linked"]},
{t:"Repo",c:"rates",lvl:3,d:"A short-term loan collateralised by securities — sell now, agree to buy back tomorrow.",e:"The plumbing of the financial system. When repo rates spike, something is broken, and equities usually find out later.",rel:["Liquidity"]},
{t:"Central bank",c:"rates",lvl:1,d:"The institution setting policy rates and managing the money supply.",e:"The Fed, ECB, BOJ and RBA. Their rate path is the dominant macro driver for index futures.",rel:["FOMC","RBA"]},
{t:"RBA",c:"rates",lvl:1,d:"The Reserve Bank of Australia. Sets the cash rate and meets several times a year.",e:"Moves AUD and the ASX directly. For a Perth trader it is the one central bank meeting in convenient hours.",rel:["Central bank","Cash rate"]},
{t:"Cash rate",c:"rates",lvl:2,d:"The policy interest rate a central bank targets for overnight lending between banks.",e:"Every other rate in the economy — mortgages, deposits, margin loans — is priced off it.",rel:["RBA","Central bank"]},
{t:"Quantitative easing",c:"rates",alt:"QE",lvl:2,d:"A central bank buying bonds with newly created reserves to push long rates down when policy rates are already near zero.",e:"A large, price-insensitive buyer entering the largest market in the world. Its effect on risk assets is hard to overstate.",rel:["Quantitative tightening"]},
{t:"Quantitative tightening",c:"rates",alt:"QT",lvl:2,d:"The reverse — the balance sheet shrinking as holdings mature and are not replaced.",e:"A steady withdrawal of that buyer. Slow, mechanical, and usually underweighted in retail analysis.",rel:["Quantitative easing"]},
{t:"Forward guidance",c:"rates",lvl:2,d:"A central bank signalling its likely future path to shape expectations without acting today.",e:"Markets price the path, not the meeting. This is why a rate cut can be followed by a selloff.",rel:["Dot plot","Central bank speak"]},
{t:"Rate expectations",c:"rates",lvl:1,d:"What the market currently prices for future policy, readable from interest rate futures.",e:"The number that actually moves on data day. CPI matters because it changes this, not because of the print itself.",rel:["Forward guidance","CPI"]},
{t:"Inversion",c:"rates",lvl:2,d:"Short-term yields exceeding long-term ones — the market pricing cuts because it expects weakness.",e:"Has preceded recessions with a long and variable lead. Useless as a timing tool, meaningful as context.",rel:["Yield curve"]},
{t:"Real yield",c:"rates",lvl:3,d:"Nominal yield minus expected inflation. What you actually earn in purchasing power.",e:"Rising real yields are historically the most reliable headwind for long-duration equities and gold.",rel:["Breakeven inflation","Yield"]},
{t:"Carry",c:"rates",lvl:2,d:"The return earned simply from holding a position — the yield, minus the funding cost.",e:"Positive carry pays you to wait. Negative carry means time is working against you regardless of direction.",rel:["Carry trade","Financing / carry cost"]},
{t:"Core vs headline",c:"econ",lvl:2,d:"Core strips out food and energy, which are volatile and largely supply-driven; headline includes everything.",e:"Central banks watch core; households feel headline. A hot headline with soft core often fades within the hour.",rel:["CPI","PPI / PCE"]},
{t:"Unemployment rate",c:"econ",lvl:1,d:"The share of the labour force actively seeking work and not finding it.",e:"Can fall for a bad reason — people leaving the workforce entirely. Always read it beside participation.",rel:["Participation rate","NFP"]},
{t:"Participation rate",c:"econ",lvl:2,d:"The proportion of working-age people in the labour force at all.",e:"The context that makes the unemployment rate interpretable rather than misleading.",rel:["Unemployment rate"]},
{t:"Jobless claims",c:"econ",lvl:2,d:"Weekly count of new unemployment benefit filings. Higher frequency than monthly payrolls, so it turns first.",e:"Noisy week to week; the four-week average is the version worth watching.",rel:["NFP"]},
{t:"ISM / PMI",c:"econ",lvl:2,d:"Survey indices of business activity. Above 50 means expansion, below 50 contraction.",e:"Diffusion indices — they measure the share of firms reporting improvement, not the size of it.",rel:["Leading indicator"]},
{t:"Retail sales",c:"econ",lvl:2,d:"Monthly consumer spending. In a consumption-driven economy it is close to a growth reading.",e:"Reported in nominal terms, so in a high-inflation period a 'strong' number can be flat in real volume.",rel:["GDP"]},
{t:"Consumer confidence",c:"econ",lvl:3,d:"Survey measures of how households feel about conditions and the outlook.",e:"Sentiment tracks the petrol price and the stock market more than it predicts either.",rel:["Leading indicator"]},
{t:"Housing starts",c:"econ",lvl:3,d:"New residential construction begun in a month. Rate-sensitive and therefore early-cycle.",e:"One of the more genuinely leading series, because building responds quickly to financing costs.",rel:["Leading indicator"]},
{t:"Leading indicator",c:"econ",lvl:2,d:"A series that historically turns before the broad economy does.",e:"'Historically' is doing a lot of work. Most leading indicators are identified after the fact from a large search.",rel:["Multiple testing"],warn:true},
{t:"Revisions",c:"econ",lvl:2,d:"Official statistics restated in later releases, sometimes substantially.",e:"The number that moved the market is often not the number that ends up in the history. This is why point-in-time data matters.",rel:["Point-in-time data"],warn:true},
{t:"Consensus / expected",c:"econ",lvl:1,d:"The surveyed forecast for a release. The market prices this in advance.",e:"Price reacts to the surprise, not the level. A 3% print is bullish or bearish entirely depending on whether 2.8% or 3.2% was expected.",rel:["Economic calendar","Rate expectations"]},
{t:"Whisper number",c:"econ",lvl:3,d:"The informal expectation circulating among traders, which can differ from the published consensus.",e:"Explains the occasional counterintuitive reaction to a print that 'beat'.",rel:["Consensus / expected"]},
{t:"Data-day volatility",c:"econ",lvl:1,d:"The volatility spike around a scheduled release, typically the first few minutes.",e:"Spreads widen, stops fill badly, and the first move reverses often enough to be a trap. Being flat into it is a legitimate strategy.",rel:["Slippage","Economic calendar"],warn:true},
{t:"ETF",c:"etf",lvl:1,d:"Exchange Traded Fund — a fund trading like a share, usually tracking an index.",e:"Buying one ASX-listed ETF can give diversified exposure to 500 US companies in a single trade.",rel:["Index fund","NAV"]}
);
D.push(
{t:"NAV",c:"etf",lvl:2,d:"Net Asset Value — the per-unit value of what the fund actually holds.",e:"An ETF's price can trade above or below NAV. Big gaps signal stress in the underlying market.",rel:["Premium / discount to NAV"]},
{t:"Premium / discount to NAV",c:"etf",lvl:3,d:"An ETF trading above or below the value of its holdings.",e:"Usually tiny for liquid ETFs. Large and persistent in illiquid or closed-end products, where it is a real cost.",rel:["NAV","Creation / redemption"]},
{t:"Creation / redemption",c:"etf",lvl:3,d:"The mechanism where authorised participants exchange baskets of underlying assets for ETF units, keeping price near NAV.",e:"The arbitrage that makes ETFs work. When it breaks, so does the tracking.",rel:["NAV","Arbitrage"]},
{t:"Tracking error",c:"etf",lvl:2,d:"How far a fund's return deviates from the index it aims to follow.",e:"Caused by fees, cash drag, sampling and taxes. Small annually, meaningful over decades.",rel:["Expense ratio","Index fund"]},
{t:"Expense ratio",c:"etf",lvl:1,d:"The annual percentage the fund takes from assets.",e:"0.04% versus 1.00% compounds to an enormous difference over thirty years. It is the one variable you fully control.",rel:["Tracking error","Cost drag"]},
{t:"Index fund",c:"etf",lvl:1,d:"A fund replicating an index rather than trying to beat it.",e:"The default sensible answer for most people, and the benchmark this entire project keeps failing to beat.",rel:["Buy and hold","Benchmark"]},
