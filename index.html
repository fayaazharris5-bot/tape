{t:"Consolidation",c:"pa",d:"Price coiling into a progressively tighter range as buyers and sellers reach agreement. Different from a plain range: a range has flat boundaries, consolidation narrows.",e:"Each swing gets smaller and each candle's range shrinks. Volatility contracting like this usually resolves with an expansion — it just doesn't tell you which way.",v:{k:"c",d:[[100,110,92,108],[108,109,94,96],[96,106,95,104],[104,105,98,99],[99,103.5,98.5,102.5],[102.5,103,100,100.5],[100.5,102,100,101],[101,101.6,100.2,100.8],[100.8,109,100.5,108]],pl:[{pts:[[0,110],[1,109],[2,106],[3,105],[4,103.5],[5,103],[6,102],[7,101.6]],c:"a"},{pts:[[0,92],[1,94],[2,95],[3,98],[4,98.5],[5,100],[6,100],[7,100.2]],c:"a"}],mk:[{i:8,p:109,t:"expansion",c:"u",left:true}]},cap:"The two lines converging is the tell. Tight coils resolve violently."},
{t:"Accumulation",c:"pa",d:"A period where large buyers build positions quietly at low prices, absorbing supply without pushing price up. From Wyckoff. The base that forms before an uptrend.",e:"After a long decline price stops making lower lows and goes sideways for weeks on steady volume. Nothing looks exciting — that's the point.",v:{k:"c",d:[[112,113,104,105],[105,106,96,97],[97,99,92,93],[93,98,91,97],[97,99,93,94],[94,98,90,96],[96,99,94,98],[98,100,95,99],[99,105,98,104],[104,110,103,109]],bx:[{i0:2,i1:7,p0:90,p1:99,c:"a",t:"accumulation range"}],mk:[{i:9,p:110,t:"markup",c:"u",left:true}]},cap:"Selling gets absorbed sideways. The trend that follows starts here, not at the breakout."},
{t:"Distribution",c:"pa",d:"The mirror of accumulation — large holders offloading into strength near highs while price goes sideways. The ceiling that forms before a downtrend.",e:"Price stops making higher highs, chops in a range, and every rally gets sold. Retail is usually most bullish here.",v:{k:"c",d:[[90,98,89,97],[97,106,96,105],[105,112,104,111],[111,113,106,107],[107,112,105,111],[111,112.5,106,107],[107,111,104,105],[105,109,103,104],[104,105,98,99],[99,100,92,93]],bx:[{i0:3,i1:7,p0:103,p1:113,c:"d",t:"distribution range"}],mk:[{i:9,p:92,t:"markdown",below:true,c:"d",left:true}]}},
{t:"Markup / markdown",c:"pa",d:"The trending phases either side of accumulation and distribution. Markup is the rally out of a base; markdown is the decline out of a top. The four together are Wyckoff's cycle.",e:"Accumulation → markup → distribution → markdown, then it repeats. It's the same idea ICT repackages as accumulation, manipulation, distribution."},
{t:"Spring",c:"pa",d:"A dip below an accumulation range's low that immediately reclaims it. Wyckoff's term for the shakeout that clears out weak holders before markup.",e:"Structurally identical to what ICT calls a liquidity sweep — the concept predates it by about a century.",v:{k:"c",d:[[100,101,96.2,97],[97,101,96.1,100],[100,101,97,98],[98,99,92,96.5],[96.5,101,96,100],[100,104,99,103],[103,108,102,107]],hl:[{p:96.1,t:"range low",c:"a",la:true}],mk:[{i:3,p:92,t:"spring",below:true,c:"s"}]},cap:"Down through the floor, then straight back above it. The reclaim is the signal, not the dip."},
{t:"Upthrust",c:"pa",d:"The opposite of a spring — a poke above a distribution range's high that fails and closes back inside. Wyckoff called the version at the very top a UTAD.",e:"The last trap before markdown begins."},
{t:"Expansion",c:"pa",d:"A sharp increase in range and volatility, usually out of consolidation. One of the four things price can do: expand, retrace, reverse, or consolidate.",e:"Candle ranges triple and the wicks disappear. ICT calls the same thing displacement."},
{t:"Equal highs / equal lows",c:"pa",d:"Two or more swing points finishing at almost exactly the same price. They look like strong levels and function as magnets, because stops pile up just beyond them.",e:"Three touches within a couple of points at 23,600. Everyone's stop is in the same five-point band.",v:{k:"c",d:[[94,100.3,93,99],[99,100.2,96,97],[97,100.4,96,99],[99,100,95,96],[96,100.3,95,99],[99,104,98,103]],hl:[{p:100.4,t:"equal highs",c:"s"}],mk:[{i:5,p:104,t:"taken",c:"d",left:true}]}},
{t:"Retracement vs reversal",c:"pa",d:"A retracement is a pause inside the trend; a reversal is the trend ending. The distinction is only confirmable after the fact, which is why structure rules exist.",e:"Rule of thumb: until a higher low breaks, it's a retracement. Once it breaks, treat it as a reversal until proven otherwise."},
{t:"Previous day high / low",c:"pa",d:"PDH and PDL. Yesterday's extremes, carried onto today's chart. Among the most watched intraday levels precisely because everyone can see them.",e:"Price runs to PDH at 10am, sweeps it by four points, and reverses. That's a liquidity sweep of an obvious level.",v:{k:"c",d:[[97,99,95,98],[98,100,96,99],[99,102.4,98,101],[101,102,99,100],[100,102.6,99,100],[100,101,97,98],[98,99,95.2,96]],hl:[{p:102.4,t:"PDH",c:"a"},{p:95,t:"PDL",c:"a",la:true,below:true}],mk:[{i:4,p:102.6,t:"swept",c:"d"}]}},
{t:"Opening range",c:"pa",d:"The high and low of the first N minutes of a session — usually 5, 15 or 30. A reference box for the rest of the day.",e:"Trade the break of the 15-minute opening range, or fade the failed break of it. Both are real strategies with the same box.",v:{k:"c",d:[[100,102.2,99,101],[101,102,99.1,100],[100,102,99.5,101.5],[101.5,104,101,103.5],[103.5,106,103,105],[105,108,104,107]],bx:[{i0:0,i1:2,p0:99.1,p1:102.2,c:"a",t:"opening range"}],mk:[{i:3,p:104,t:"break",c:"u"}]}},
{t:"Gap fill",c:"pa",d:"Price returning to trade through a gap it previously jumped over. Common enough to be a strategy, unreliable enough to need a stop.",e:"Nasdaq gaps up 150 points and grinds back to the Friday close by midday."},
{t:"Chop",c:"pa",d:"Directionless, overlapping price action that stops out both sides. Not a phase you trade — a phase you sit out.",e:"Overlapping candles, no follow-through, ATR falling. The correct trade is usually none."},
{t:"Top-down analysis",c:"pa",d:"Reading the highest timeframe first for bias, then stepping down for the level, then down again for the entry trigger.",e:"Daily for direction, 15m for the zone, 5m for the trigger — three nested views, not three opinions."},
{t:"Anchored VWAP",c:"ind",d:"VWAP calculated from a specific event you choose rather than the session open.",e:"Anchor it to an earnings gap or a major swing low and it becomes a reference for everyone who bought after that event."}
);
D.push(
{t:"Order flow",c:"flow",d:"The actual sequence of buy and sell orders hitting the book. Everything on a candlestick chart is a summary of it after the fact.",e:"Candles tell you price moved. Order flow tells you whether it moved because buyers were aggressive or sellers just stepped away."},
{t:"Aggressor",c:"flow",d:"Whoever crosses the spread to get filled — the market order, not the resting limit order. Trades are classified by which side was aggressive.",e:"A trade at the ask is a buy aggressor; at the bid, a sell aggressor."},
{t:"Absorption",c:"flow",d:"Heavy aggressive buying or selling that fails to move price, because a large resting order is soaking it all up.",e:"Thousands of contracts hit the bid at 23,400 and price doesn't budge. Someone big is buying everything offered."},
{t:"Delta",c:"flow",d:"Buy-aggressor volume minus sell-aggressor volume. Cumulative delta sums it over time.",e:"Price makes a new high but cumulative delta doesn't — buyers are getting less aggressive, and the move is running on fumes.",v:{k:"e",s:[{v:[0,1.2,0.5,2.1,1.3,2.9],c:"a",t:"price"},{v:[0,1.2,0.6,2.0,1.1,1.4],c:"s",t:"cum. delta",below:true}],mk:[{i:5,p:2.9,t:"new high"},{i:5,p:1.4,t:"delta doesn't follow",below:true,c:"d"}]}},
{t:"Footprint chart",c:"flow",d:"A candle drawn with the traded volume at each price level inside it, split by aggressor side.",e:"Lets you see that a candle closed green but the buying all happened at the low."},
{t:"Iceberg order",c:"flow",d:"A large order that only shows a small portion in the book, refreshing as it fills, so its true size stays hidden.",e:"The 20 contracts at 23,400 keep refilling no matter how many you sell into them. That's not 20, it's 2,000."},
{t:"Spoofing",c:"flow",d:"Placing large orders with no intention of filling them, to create a false impression of supply or demand, then pulling them.",e:"Illegal in regulated markets and prosecuted. Also a reason the book you're staring at may be lying to you."},
{t:"Time and sales",c:"flow",d:"The raw scrolling list of every executed trade with price, size and time. The tape.",e:"Reading it is a genuine skill and largely obsolete for retail, because the machines read it faster."},
{t:"Point of Control",c:"flow",d:"POC — the single price level with the most volume traded in a session or range. The market's centre of gravity.",e:"Price often returns to it. A POC from a prior day that has never been retouched is called a naked or virgin POC.",v:{k:"raw",svg:'<svg viewBox="0 0 320 150" role="img" aria-label="volume profile with value area"><rect x="8" y="46" width="200" height="54" fill="var(--accent)" opacity="0.08"/><text class="lba" x="212" y="52">VAH</text><text class="lba" x="212" y="99">VAL</text><text class="lb" x="212" y="72">70% of volume</text><g fill="var(--ink3)" opacity="0.75"><rect x="8" y="14" width="26" height="8"/><rect x="8" y="25" width="44" height="8"/><rect x="8" y="36" width="70" height="8"/></g><g fill="var(--accent)" opacity="0.55"><rect x="8" y="47" width="104" height="8"/><rect x="8" y="58" width="132" height="8"/></g><rect x="8" y="69" width="196" height="8" fill="var(--signal)"/><text class="lbs" x="212" y="76">POC</text><g fill="var(--accent)" opacity="0.55"><rect x="8" y="80" width="140" height="8"/><rect x="8" y="91" width="98" height="8"/></g><g fill="var(--ink3)" opacity="0.75"><rect x="8" y="102" width="62" height="8"/><rect x="8" y="113" width="38" height="8"/><rect x="8" y="124" width="20" height="8"/></g><text class="lb" x="8" y="145">Volume by price, not by time. Widest bar wins.</text></svg>'},cap:"Turn a volume profile on its side and the shape tells you where business got done."},
{t:"Value area",c:"flow",d:"The price band containing about 70% of a session's volume, bounded by the Value Area High and Low.",e:"Price accepted inside the value area means balance. Price rejecting outside it means the auction is searching for a new one."},
{t:"Initial balance",c:"flow",d:"The range of the first hour of a session, used as the day's reference frame in auction theory.",e:"A day that never leaves its initial balance is a balanced day. One that breaks and extends is a trend day."},
{t:"Auction market theory",c:"flow",d:"The idea that markets move to facilitate trade, advertising higher prices until buying dries up and lower prices until selling dries up.",e:"The intellectual ancestor of most 'liquidity' language in modern SMC content."},
{t:"Open drive",c:"flow",d:"A session that opens and immediately trends hard in one direction without returning to the open.",e:"The strongest trend-day signature there is, and also the day type that punishes fading."}
);

D.push(
{t:"Turtle soup",c:"ict",d:"Fading a false breakout of a prior high or low. Originally a rule from Connors and Raschke's Street Smarts — fade the 20-day breakout the Turtle traders were buying — later adopted into ICT material.",e:"Price breaks a 20-day high, fails to hold, and closes back below it. You short the failure, not the breakout.",v:{k:"c",d:[[95,99,94,98],[98,101.8,97,100],[100,101,97,98],[98,102,97,101],[101,105,100,101.5],[101.5,102,97,98],[98,99,93,94],[94,95,90,91]],hl:[{p:101.8,t:"prior high",c:"a",la:true}],mk:[{i:4,p:105,t:"failed break",c:"d"}]}},
{t:"Silver bullet",c:"ict",d:"An ICT setup restricted to specific one-hour windows — most commonly 10:00–11:00 New York — where you take the first fair value gap that forms after a liquidity sweep.",e:"Narrow by design: one hour, one pattern, one entry. The narrowness is also what makes the sample size small when you go to test it."},
{t:"Consequent encroachment",c:"ict",d:"The 50% level of a fair value gap, used as a more precise entry than the gap's edge.",e:"Instead of entering at the top of the FVG, you wait for the midpoint."},
{t:"Liquidity void",c:"ict",d:"A larger area of the chart price moved through in one shot, leaving very little trading in between. Broader than a single FVG.",e:"Often revisited later — the market 'rebalancing' an area it skipped."},
{t:"Draw on liquidity",c:"ict",d:"The pool the framework says price is currently heading toward — the objective, rather than the entry.",e:"\"Bearish, drawing on the sell-side liquidity below Tuesday's low.\" It's a directional target, stated as a destination."},
{t:"Daily bias",c:"ict",d:"Your one-line directional call for the session, decided before the session opens.",e:"Written down in advance, it stops you rewriting the story mid-move. Decided during the session, it's just following price."},
{t:"Asian range",c:"ict",d:"The high and low of the Asian session, used as a reference box for London and New York.",e:"For you in Perth the Asian session is your afternoon and evening — the one window that's actually convenient."},
{t:"True open",c:"ict",d:"A specific opening price used as the reference for premium and discount within a cycle, rather than the calendar open.",e:"Midnight New York for the day, Monday's 18:00 for the week. Above it is premium, below it is discount."},
{t:"Quarterly Theory",c:"ict",d:"A time-based framework popularised by Trader Daye, built on ICT's AMD idea. Every cycle is split into four quarters running Accumulation, Manipulation, Distribution, then Continuation or Reversal — and the same pattern is claimed to repeat fractally from yearly cycles down to 90-minute and 22.5-minute ones.",e:"Daily cycle: Asia accumulates, London manipulates from the true open, New York AM distributes, New York PM continues or reverses.",v:{k:"c",d:[[100,101,99,100],[100,101,99.3,100.4],[100.4,101,96,97],[97,98,95.5,96],[96,102,95.8,101],[101,107,100,106],[106,110,105,109],[109,110,106,107]],bx:[{i0:0,i1:1,p0:99,p1:101,c:"g",t:"Q1 accum"},{i0:2,i1:3,p0:95.5,p1:98,c:"d",t:"Q2 manip",below:true},{i0:4,i1:5,p0:95.8,p1:107,c:"u",t:"Q3 distrib"},{i0:6,i1:7,p0:105,p1:110,c:"a",t:"Q4"}]},cap:"One cycle, four quarters. The claim is that this nests inside itself at every timescale."},
{t:"90-minute cycle",c:"ict",d:"The execution-level layer of Quarterly Theory — each six-hour session split into four 90-minute blocks, each itself split into 22.5-minute quarters.",e:"Used to time entries within a session you already have a bias on."},
{t:"NDOG / NWOG",c:"ict",d:"New Day Opening Gap and New Week Opening Gap — the gap between one session's close and the next one's open.",e:"The Friday-close-to-Sunday-open gap is the one that catches weekend positions."},
{t:"Standard deviation projections",c:"ict",d:"Projecting targets as multiples of a measured leg — 1x, 2x, 2.5x the distance of the initial move.",e:"A way of setting targets without a level to aim at. Test whether the multiples actually hold before trusting them."},
{t:"Model",c:"style",d:"A single, fully specified setup you trade repeatedly — one bias rule, one entry trigger, one invalidation, one target.",e:"Having one model you've logged 100 trades on beats knowing twelve you've logged none on."},
{t:"A+ setup",c:"style",d:"A trade where every one of your conditions is met, rather than most of them.",e:"Useful as a filter, dangerous as an excuse — 'it was A+' is not a reason to size up beyond your risk rule."}
);
D.push(
{t:"MAE / MFE",c:"risk",d:"Maximum Adverse Excursion is how far a trade went against you before it resolved; Maximum Favourable Excursion is how far it went your way.",e:"If your winners rarely go more than 0.3R against you, your stop is wider than it needs to be. If your losers routinely hit 2R in your favour first, your targets are too far.",v:{k:"c",d:[[100,100.5,99,99.4],[99.4,100,97.2,97.6],[97.6,98,96,97],[97,97.5,94.6,95],[95,95.5,93.8,94]],hl:[{p:100,t:"entry (short)",c:"k",solid:true,la:true}],mk:[{i:0,p:100.5,t:"MAE 0.5",c:"d"},{i:4,p:93.8,t:"MFE 6.2",below:true,c:"u"}]},cap:"Logging both for every trade tells you whether your stop and target are in the right places."},
{t:"Fixed fractional sizing",c:"risk",d:"Always risking the same percentage of the current account, so size grows as the account grows and shrinks as it falls.",e:"The default for good reason: it makes ruin mathematically much harder than fixed-dollar sizing."},
{t:"Martingale",c:"risk",d:"Doubling size after a loss to recover it. Produces a smooth equity curve punctuated by total account destruction.",e:"Any strategy that 'has never had a losing month' is worth checking for this.",warn:true},
{t:"Anti-martingale",c:"risk",d:"Increasing size after wins and cutting it after losses. The sane direction to scale.",e:"What fixed fractional sizing does automatically, without you deciding anything."},
{t:"Sequence risk",c:"risk",d:"The order your wins and losses arrive in matters, even when the total is identical.",e:"Ten losses first can end the account before the winners show up. Same edge, different order, different outcome."},
{t:"Sortino ratio",c:"risk",d:"Like Sharpe, but only penalising downside volatility. Upside swings shouldn't count against you.",e:"Usually the fairer measure for strategies with big asymmetric winners, like trend following."},
{t:"Calmar ratio",c:"risk",d:"Annual return divided by maximum drawdown. Answers 'what did I earn per unit of worst pain?'",e:"A 40% return with a 40% drawdown scores 1.0 — the same as 10% return with a 10% drawdown, and far easier to sit through in the second case."},
{t:"Compounding",c:"risk",d:"Gains earning gains. Works powerfully in your favour on the way up and against you on the way down.",e:"The reason a 50% drawdown needs a 100% gain to recover — see the recovery maths entry."}
);
D.push(
{t:"Data snooping",c:"bt",d:"Building a rule using knowledge of what already happened in the test period. Different from look-ahead bias, which is a code bug — this one is in your head.",e:"Everybody 'predicts' the March 2020 crash when they design a strategy in 2026."},
{t:"Regime change",c:"bt",d:"The market's underlying behaviour shifting — volatility, correlation or trend character changing enough that a strategy built on the old regime stops working.",e:"A strategy tuned on 2021's low-rate melt-up has no reason to work in a high-rate chop."},
{t:"Stationarity",c:"bt",d:"Whether a series' statistical properties stay constant over time. Most price series aren't stationary, which is why most statistical tests borrowed from other fields don't apply cleanly.",e:"Returns are closer to stationary than prices, which is why models work on returns."},
{t:"Bootstrap",c:"bt",d:"Resampling your own trades thousands of times with replacement to build a distribution and see whether the result could have come from chance.",e:"Cheap, assumption-light, and far more honest than a single backtest number."},
{t:"Bonferroni correction",c:"bt",d:"Dividing your significance threshold by the number of tests you ran, to stop luck passing as discovery.",e:"1,000 strategies at p<0.05 gives 50 false positives. Corrected, the bar becomes p<0.00005 — and almost nothing clears it."},
{t:"Deflated Sharpe ratio",c:"bt",d:"A Sharpe ratio adjusted for how many strategy variations you tried before finding this one.",e:"Formalises the intuition that the hundredth strategy you tested needs to look much better than the first to mean the same thing."},
{t:"Point-in-time data",c:"bt",d:"Data as it actually appeared on the day, including values later revised. Most free data is revised.",e:"GDP and earnings get restated. Backtesting on the revised figures means trading on information nobody had."},
{t:"Parameter sensitivity",c:"bt",d:"Whether performance holds up when you nudge the settings. A real edge sits on a plateau; an overfit one sits on a spike.",e:"If a 14-period lookback prints money and 13 and 15 both lose, you've found noise.",v:{k:"raw",svg:'<svg viewBox="0 0 320 150" role="img" aria-label="parameter plateau versus spike"><line x1="12" y1="118" x2="308" y2="118" stroke="var(--rule2)" stroke-width="0.7"/><polyline points="16,96 46,88 76,80 106,76 136,74 166,76 196,80 226,88 256,96 286,104" fill="none" stroke="var(--up)" stroke-width="1.6" stroke-linejoin="round"/><text class="lbu" x="150" y="66" text-anchor="middle">plateau — robust</text><polyline points="16,112 46,110 76,113 106,111 136,30 166,110 196,112 226,109 256,113 286,111" fill="none" stroke="var(--down)" stroke-width="1.6" stroke-linejoin="round"/><text class="lbd" x="140" y="26" text-anchor="middle">spike — overfit</text><text class="lb" x="12" y="132">parameter value \u2192</text><text class="lb" x="308" y="132" text-anchor="end">return \u2191</text></svg>'},cap:"Same test, two shapes. Only one of them survives contact with new data."},
{t:"Live decay",c:"bt",d:"The gap between backtested performance and live results, caused by costs, latency, slippage and regime drift.",e:"Assume some decay always. If the strategy only works with zero decay, it doesn't work."}
);
D.push(
{t:"Loss aversion",c:"psy",d:"Losses feeling roughly twice as bad as equivalent gains feel good. Drives cutting winners early and holding losers long.",e:"Taking +0.5R because it's green, then letting a −1R run to −3R because closing it makes it real."},
{t:"Sunk cost fallacy",c:"psy",d:"Staying in a trade because of what you've already lost rather than what it's likely to do next.",e:"\"I've held it this long\" is not information about the next candle."},
{t:"Gambler's fallacy",c:"psy",d:"Believing a run of losses makes a win more likely. Independent trades have no memory.",e:"Five losses in a row does not mean the sixth is due. Sizing up on that logic is how streaks end accounts."},
{t:"Hindsight bias",c:"psy",d:"A move looking obvious once it's finished. The core reason chart-based frameworks feel more predictive than they test.",e:"Scroll back and every sweep looks perfect. Scroll forward one candle at a time and it doesn't."},
{t:"Process vs outcome",c:"psy",d:"Judging yourself on whether you followed the plan, not on whether the trade won.",e:"Four buckets: followed the plan and won, followed and lost, broke it and won, broke it and lost. The third is the most dangerous one."}
);
D.push(
{t:"PPI / PCE",c:"macro",d:"Producer Price Index and Personal Consumption Expenditures — two more US inflation readings. PCE is the Fed's preferred measure.",e:"PCE surprises can move rate expectations more than CPI does, despite getting less attention."},
{t:"GDP",c:"macro",d:"Total economic output, released quarterly in advance, second and third estimates.",e:"Each revision is tradeable, which is why point-in-time data matters when backtesting it."},
{t:"Yield curve",c:"macro",d:"Government bond yields plotted across maturities. When short-term yields exceed long-term ones it's inverted — historically a recession signal, with long and variable lead times.",e:"An inversion has preceded recessions, but sometimes by two years. Useless as a trade timer."},
{t:"DXY",c:"macro",d:"The US dollar index, measuring the dollar against a basket of currencies.",e:"A strong dollar generally pressures commodities, emerging markets and gold."},
{t:"Quad witching",c:"macro",d:"The quarterly simultaneous expiry of index futures, index options, stock futures and stock options — third Friday of March, June, September and December.",e:"Volume spikes and price action gets erratic. Not a normal session to judge a strategy on."},
{t:"Dot plot",c:"macro",d:"The Fed's chart of where each official expects rates to go. Released quarterly with the FOMC statement.",e:"Frequently moves markets more than the rate decision itself, because the decision is usually priced in."},
{t:"Seasonality",c:"macro",d:"Recurring calendar tendencies — the September weakness, the Santa rally, sell-in-May.",e:"Most are computed from small samples of non-independent years. Treat as trivia until you've tested the sample size."}
);
D.push(
{t:"Chop",c:"slang",d:"Directionless price action that stops out both directions.",e:"\"Absolute chop today\" — usually the correct read, usually said after taking four trades in it."},
{t:"Fade",c:"slang",d:"Taking the opposite side of a move, betting it fails.",e:"\"Fading the open\" means shorting a strong open."},
{t:"Printing",c:"slang",d:"Making money easily, usually said just before it stops.",e:"\"This model is printing\" is almost always a sample-size statement in disguise."},
{t:"Melt-up",c:"slang",d:"A relentless grind higher with no meaningful pullbacks, often late in a trend.",e:"Punishes anyone waiting for a clean retracement to enter."},
{t:"Exit liquidity",c:"slang",d:"Being the buyer someone else needed in order to sell.",e:"If you found the trade in a Telegram group with no verifiable track record, this is the role on offer."},
{t:"Degen",c:"slang",d:"Self-applied label for deliberately reckless position sizing.",e:"Worn as a joke, priced as a fee."},
{t:"Send it",c:"slang",d:"Entering with no plan and full size.",e:"The opposite of everything in the risk section."},
{t:"Sim / paper",c:"slang",d:"Simulated trading with no real money at stake.",e:"Useful for testing mechanics and building the logging habit. It does not test how you behave when the money is real, which is the part that usually breaks."}
);

<script>
(function(){

  function starSave(){try{localStorage.setItem(SKEY,JSON.stringify(STAR));}catch(e){}}
  var SYN={
    "stop hunt":"liquidity sweep","stophunt":"liquidity sweep","raid":"liquidity sweep",

    "poc":"point of control","va":"value area","ib":"initial balance",
    "pdh":"previous day","pdl":"previous day","amd":"power of 3","choch":"change of character",
    "bos":"break of structure","mss":"market structure","ote":"optimal trade entry",
    "dd":"drawdown","pf":"profit factor","ev":"expectancy","edge":"edge",
    "curve fitting":"overfitting","curvefit":"overfitting","p hacking":"p-hacking",

  };
  function expand(t){
    if(!t)return t;
    if(SYN[t])return SYN[t];
    var k;
    for(k in SYN){if(SYN.hasOwnProperty(k)&&k.length>2&&t.indexOf(k)>-1)return SYN[k];}
    return t;
  }
  function hl(el,term){
    if(!term||term.length<2)return;
    var rx=new RegExp("("+term.replace(/[-.*+?^${}()|[\]\\]/g,String.fromCharCode(92,92)+"$&")+")","ig");
    ["h3","p"].forEach(function(sel){
      Array.prototype.forEach.call(el.querySelectorAll(sel),function(n){
        if(n.querySelector("mark"))return;
        Array.prototype.forEach.call(n.childNodes,function(c){
          if(c.nodeType!==3||!rx.test(c.nodeValue))return;
          rx.lastIndex=0;
          var span=document.createElement("span");
          span.innerHTML=esc(c.nodeValue).replace(rx,"<mark>$1</mark>");
          n.replaceChild(span,c);
        });
      });
    });
  }
  function unhl(el){
    Array.prototype.forEach.call(el.querySelectorAll("mark"),function(m){
      var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();
    });
  }

  CAT.forEach(function(c){
    var s=document.createElement("section");
    s.id="sec-"+c[0];
    var n=D.filter(function(x){return x.c===c[0];}).length;
    s.innerHTML='<div class="sechead"><h2>'+c[1]+'</h2><span class="n">'+n+' terms</span></div><p class="secnote">'+c[2]+'</p>';
    D.filter(function(x){return x.c===c[0];}).forEach(function(x){
      var e=document.createElement("article");
      e.className="entry"+(x.v?" haschart":"");
      var tslug=x.t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      var txt='<div><h3 class="term"><button class="star" data-star="'+tslug+'" title="Save this term" aria-label="Save '+esc(x.t)+'">\u2605</button>'+esc(x.t)+'<button class="lnk" data-slug="'+tslug+'" title="Copy a link to this term" aria-label="Copy link to '+esc(x.t)+'">link</button></h3><p class="def">'+esc(x.d)+'</p>'+
              '<p class="ex'+(x.warn?" warn":"")+'"><b>'+(x.warn?"Careful":"Example")+'</b> · '+esc(x.e)+'</p></div>';
      var fig=x.v?'<figure>'+svgFor(x.v)+(x.cap?'<figcaption>'+esc(x.cap)+'</figcaption>':'')+'</figure>':'';
      e.innerHTML=txt+fig;
      e.dataset.hay=(x.t+" "+x.d+" "+x.e).toLowerCase();
      e.dataset.slug=tslug;
      s.appendChild(e);
    });
    grid.appendChild(s);
  });

  var PREFERS_MOTION = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function mkchip(id,label){
    var b=document.createElement("button");
    b.className="chip";b.textContent=label;b.dataset.id=id;
    b.setAttribute("aria-pressed",id===active?"true":"false");
    b.onclick=function(){ setActive(id); };
    chips.appendChild(b);
  }
  mkchip("all","All");
  mkchip("charts","Has a chart");
  mkchip("starred","\u2605 Saved");

  /* 48 sections as 48 chips was an eight-row wall. The three filters above are
     the ones used constantly; the sections live in a drawer that remembers
     nothing and costs one tap. setActive() keeps both surfaces in sync. */
  function setActive(id){
    active=id;
    Array.prototype.forEach.call(chips.children,function(c){
      if(c.dataset.id) c.setAttribute("aria-pressed",c.dataset.id===id?"true":"false");
    });
    Array.prototype.forEach.call(document.querySelectorAll("#secgrid [data-sec]"),function(b){
      b.setAttribute("aria-pressed",b.dataset.sec===id?"true":"false");
    });
    var cur=document.getElementById("seccur");
    if(cur){
      var name="All sections";
      CAT.forEach(function(c){if(c[0]===id)name=c[1];});
      if(id==="charts")name="Has a chart";
      if(id==="starred")name="\u2605 Saved";
      cur.textContent=name;
    }
    apply();
  }
  window.__setSection=setActive;

  var drawerBtn=document.createElement("button");
  drawerBtn.className="chip secbtn";
  drawerBtn.id="secopen";
  drawerBtn.setAttribute("aria-expanded","false");
  drawerBtn.innerHTML='Sections <span id="seccur">All sections</span> <span class="caret">\u25be</span>';
  chips.appendChild(drawerBtn);

  var drawer=document.createElement("div");
  drawer.id="secdrawer";
  drawer.hidden=true;
  drawer.innerHTML='<input id="secq" type="search" placeholder="Filter sections\u2026" aria-label="Filter sections">'+
                   '<div id="secgrid"></div>';
  chips.parentNode.appendChild(drawer);

  var sg=drawer.querySelector("#secgrid");
  function secRow(id,label,n){
    var b=document.createElement("button");
    b.className="secitem";b.dataset.sec=id;
    b.setAttribute("aria-pressed",id===active?"true":"false");
    b.innerHTML='<span>'+label.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span><span class="secn">'+n+'</span>';
    b.onclick=function(){
      setActive(id);
      closeDrawer();
      var sec=document.getElementById("sec-"+id);
      if(sec&&id!=="all") sec.scrollIntoView({block:"start",behavior:PREFERS_MOTION?"smooth":"auto"});
      else window.scrollTo({top:0,behavior:PREFERS_MOTION?"smooth":"auto"});
    };
    sg.appendChild(b);
  }
  secRow("all","All sections",D.length);
  CAT.forEach(function(c){
    secRow(c[0],c[1],D.filter(function(x){return x.c===c[0];}).length);
  });

  function openDrawer(){
    drawer.hidden=false;drawerBtn.setAttribute("aria-expanded","true");
    drawer.classList.add("in");
    var f=document.getElementById("secq");if(f)f.focus();
  }
  function closeDrawer(){
    drawer.hidden=true;drawerBtn.setAttribute("aria-expanded","false");
    drawer.classList.remove("in");
  }
  drawerBtn.onclick=function(){ drawer.hidden?openDrawer():closeDrawer(); };
  document.getElementById("secq").addEventListener("input",function(){
    var v=this.value.trim().toLowerCase();
    Array.prototype.forEach.call(sg.children,function(b){
      b.style.display=(!v||b.textContent.toLowerCase().indexOf(v)>-1)?"":"none";
    });
  });
  document.addEventListener("click",function(e){
    if(drawer.hidden)return;
    if(!drawer.contains(e.target)&&e.target!==drawerBtn&&!drawerBtn.contains(e.target)) closeDrawer();
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&!drawer.hidden){closeDrawer();drawerBtn.focus();}
  });

  function apply(){
    var raw=q.value.trim().toLowerCase(),term=expand(raw),shown=0;
    CAT.forEach(function(c){
      var sec=document.getElementById("sec-"+c[0]),vis=0;
      Array.prototype.forEach.call(sec.querySelectorAll(".entry"),function(e){
        var ok=true;
        if(active!=="all"){
          ok = active==="charts" ? e.classList.contains("haschart")
             : active==="starred" ? STAR[e.dataset.slug]===1
             : c[0]===active;
        }
        if(ok&&term) ok=e.dataset.hay.indexOf(term)>-1||(raw!==term&&raw.length>2&&e.dataset.hay.indexOf(raw)>-1);
        e.style.display=ok?"":"none";
        unhl(e);
        if(ok){vis++;shown++;if(raw)hl(e,e.dataset.hay.indexOf(raw)>-1?raw:term);}
      });
      sec.style.display=vis?"":"none";
    });
    var ns=Object.keys(STAR).length;
    countEl.textContent=shown+" / "+D.length+(ns?" \u00b7 \u2605"+ns:"")+(term!==raw&&raw?" \u00b7 "+raw+" \u2192 "+term:"");
    var old=document.getElementById("noresult");
    if(old) old.remove();
    if(!shown){
      var p=document.createElement("p");
      p.id="noresult";p.className="empty";
      p.textContent="No terms match \u201c"+q.value+"\u201d. Try a shorter word.";
      grid.appendChild(p);
    }
  }
  Array.prototype.forEach.call(grid.querySelectorAll(".star"),function(b){
    if(STAR[b.dataset.star]===1)b.classList.add("on");
    b.onclick=function(ev){
      ev.stopPropagation();
      if(STAR[b.dataset.star]===1){delete STAR[b.dataset.star];b.classList.remove("on");}
      else{STAR[b.dataset.star]=1;b.classList.add("on");}
      starSave();
      if(active==="starred")apply();
    };
  });
  Array.prototype.forEach.call(grid.querySelectorAll(".lnk"),function(b){
    b.onclick=function(ev){
      ev.stopPropagation();
      var url=location.href.split("#")[0]+"#t="+b.dataset.slug;
      var done=function(){var o=b.textContent;b.textContent="copied";setTimeout(function(){b.textContent=o;},1400);};
      if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(done,function(){window.prompt("Copy:",url);});
      else window.prompt("Copy this link:",url);
    };
  });
  q.addEventListener("input",apply);
  q.addEventListener("keydown",function(e){if(e.key==="Escape"){q.value="";apply();}});
  apply();

  document.getElementById("foot").innerHTML=
    D.length+" terms across "+CAT.length+" sections · "+
    D.filter(function(x){return !!x.v;}).length+" drawn as charts<br>"+
    "Charts are schematic — drawn to show the shape of each concept clearly, not taken from live market data.<br>"+
    "Educational reference only. Nothing here is financial advice.";
})();
</script>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var KEY="tg.strats.v1", MEMO=null, pending=null, editing=null, tools=false;
var EV=[["untested","Untested","ev-untested"],["backtested","Backtested","ev-backtested"],
        ["forward-tested","Forward-tested","ev-forward"],["live","Live","ev-live"]];
var EVRANK={untested:0,backtested:1,"forward-tested":2,live:3};

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}

/* ---------- storage ---------- */
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return MEMO;}}
function save(a){MEMO=a;try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
var SEED=[{name:"Example — delete me",source:"nobody, this is a template",sourceUrl:"",
  market:"MNQ",timeframe:"5m",session:"09:30–11:00 New York",
  bias:"Daily is in a downtrend (lower highs, lower lows), so shorts only.",
  entry:"1. Price rallies into a level that was support last week.\n2. It wicks above the prior high and closes back below it.\n3. Enter short on the close of that candle.",
  invalidation:"A 5m candle closes back above the swept high. That's the idea being wrong, not a scary moment.",
  target:"Prior swing low. Partial at 2R, stop to breakeven, runner to the low.",
  riskNote:"1% of account. Stop distance sets the size, not confidence. Skip if the maths says under 1 contract.",
  tags:["session","liquidity","short"],evidence:"untested",sampleSize:0,
  results:"none yet — no backtest, no forward test",
  notes:"Replace this with a real strategy. Every field here is optional except the name.",
  added:new Date().toISOString().slice(0,10)}];
var STRATS=load();
if(!STRATS){STRATS=SEED.slice();save(STRATS);}
function cur(){return pending||STRATS;}

/* ---------- share encoding ---------- */
function b64u(u8){var s="",i;for(i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function ub64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
  var b=atob(s),u=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function encodeLib(arr){
  var bytes=new TextEncoder().encode(JSON.stringify(arr));
  if(typeof CompressionStream!=="undefined"){
    try{
      var st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
      return new Response(st).arrayBuffer().then(function(b){return "g"+b64u(new Uint8Array(b));});
    }catch(e){}
  }
  return Promise.resolve("p"+b64u(bytes));
}
function decodeLib(s){
  var mode=s.charAt(0),data=ub64u(s.slice(1));
  if(mode==="g"&&typeof DecompressionStream!=="undefined"){
    var st=new Blob([data]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(st).arrayBuffer().then(function(b){return JSON.parse(new TextDecoder().decode(new Uint8Array(b)));});
  }
  return Promise.resolve(JSON.parse(new TextDecoder().decode(data)));
}

/* ---------- routing ---------- */
function parseHash(){
  var h=location.hash.replace(/^#/,""),out={};
  h.split("&").forEach(function(p){
    if(!p)return;
    var i=p.indexOf("=");
    if(i<0){out.tab=p;return;}
    out[p.slice(0,i)]=p.slice(i+1);
  });
  return out;
}
function setTab(t,push){
  if(t!=="strategies"&&t!=="quiz"&&t!=="live")t="terms";
  [["terms","tab-terms","panel-terms"],["strategies","tab-strats","panel-strats"],["quiz","tab-quiz","panel-quiz"],["live","tab-live","panel-live"]]
    .forEach(function(x){
      var on=x[0]===t;
      $(x[1]).setAttribute("aria-selected",on?"true":"false");
      $(x[2]).hidden=!on;
    });
  if(t==="quiz")quizRender();
  if(t==="live")liveRender();
  if(push!==false&&history.replaceState)history.replaceState(null,"","#"+t);
}
$("tab-terms").onclick=function(){setTab("terms");};
$("tab-strats").onclick=function(){setTab("strategies");};
$("tab-quiz").onclick=function(){setTab("quiz");};
$("tab-live").onclick=function(){setTab("live");};

/* ---------- glossary cross-links ---------- */
var TERMIDX=[];
Array.prototype.forEach.call(document.querySelectorAll("#grid .entry"),function(e){
  var h=e.querySelector(".term");if(!h)return;
  /* The heading contains the star and copy-link buttons, so its textContent is
     "★Instrumentlink" and slugging it produced term-instrumentlink — which meant
     every copied deep link (built from data-slug) pointed at nothing. Use the
     slug the entry already carries. */
  var id="term-"+(e.dataset.slug||slug(h.textContent));
  e.id=id;
  var nameNode=h.cloneNode(true);
  Array.prototype.forEach.call(nameNode.querySelectorAll("button"),function(b){b.remove();});
  TERMIDX.push({name:nameNode.textContent.trim(),id:id});
});
TERMIDX.sort(function(a,b){return b.name.length-a.name.length;});
function relatedTerms(s){
  var hay=[s.name,s.bias,s.entry,s.invalidation,s.target,s.riskNote,s.notes,(s.tags||[]).join(" ")].join(" ").toLowerCase();
  var hits=[],seen={};
  TERMIDX.forEach(function(t){
    if(hits.length>=6)return;
    var n=t.name.toLowerCase();
    if(n.length<4||seen[t.id])return;
    if(new RegExp("(^|[^a-z])"+n.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+"([^a-z]|$)").test(hay)){seen[t.id]=1;hits.push(t);}
  });
  return hits;
}
window.__goTerm=function(id){
  setTab("terms");
  var el=$(id);if(!el)return;
  var q=$("q");if(q){q.value="";}
  var chip=document.querySelector('#chips .chip[data-id="all"]');if(chip)chip.click();
  setTimeout(function(){
    el.scrollIntoView({block:"center",behavior:"smooth"});
    el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
  },40);
};

/* ---------- filters ---------- */
var filt={ev:"all",market:"all",tag:"all"};
function buildChips(){
  var wrap=$("schips");wrap.innerHTML="";
  var mk=function(group,val,label){
    var b=document.createElement("button");
    b.className="chip";b.textContent=label;b.dataset.g=group;b.dataset.v=val;
    b.setAttribute("aria-pressed",filt[group]===val?"true":"false");
    b.onclick=function(){filt[group]=val;buildChips();render();};
    wrap.appendChild(b);
  };
  mk("ev","all","All");
  EV.forEach(function(e){
    if(cur().some(function(s){return s.evidence===e[0];}))mk("ev",e[0],e[1]);
  });
  var mkts={},tags={};
  cur().forEach(function(s){
    if(s.market)mkts[s.market]=1;
    (s.tags||[]).forEach(function(t){tags[t]=1;});
  });
  var mk2=Object.keys(mkts).sort();
  if(mk2.length>1){
    var sep=document.createElement("span");sep.style.cssText="width:1px;height:20px;background:var(--rule2);margin:0 4px";wrap.appendChild(sep);
    mk("market","all","Any market");
    mk2.forEach(function(m){mk("market",m,m);});
  }
  var tg=Object.keys(tags).sort();
  if(tg.length){
    var sep2=document.createElement("span");sep2.style.cssText="width:1px;height:20px;background:var(--rule2);margin:0 4px";wrap.appendChild(sep2);
    mk("tag","all","Any tag");
    tg.slice(0,10).forEach(function(t){mk("tag",t,"#"+t);});
  }
}

/* ---------- toolbar ---------- */
function buildTools(){
  var t=$("stools");
  t.innerHTML=
    '<button class="btn pri" id="b-add">+ Add strategy</button>'+
    '<button class="btn" id="b-tools">Calculators</button>'+
    '<span class="sep"></span>'+
    '<button class="btn" id="b-share">Copy share link</button>'+
    '<button class="btn" id="b-exp">Export .json</button>'+
    '<button class="btn" id="b-imp">Import .json</button>'+
    '<input type="file" id="b-file" accept="application/json,.json" class="sr-only">';
  $("b-add").onclick=function(){openForm(null);};
  $("b-tools").onclick=function(){tools=!tools;render();};
  $("b-share").onclick=function(){doShare(this);};
  $("b-exp").onclick=doExport;
  $("b-imp").onclick=function(){$("b-file").click();};
  $("b-file").onchange=doImport;
}

/* ---------- share / export / import ---------- */
function note(html,bad){
  var n=document.createElement("p");
  n.className="note"+(bad?" bad":"");n.innerHTML=html;
  var old=$("stools").parentNode.querySelector(".note");if(old)old.remove();
  $("stools").insertAdjacentElement("afterend",n);
}
function doShare(btn){
  if(!STRATS.length){note("Nothing to share yet — add a strategy first.",true);return;}
  encodeLib(STRATS).then(function(p){
    var url=location.href.split("#")[0]+"#lib="+p;
    if(url.length>8000){
      note("That library is too big for a link ("+url.length.toLocaleString()+" characters). Use <b>Export .json</b> and send the file instead.",true);
      return;
    }
    var done=function(){btn.textContent="Link copied";setTimeout(function(){btn.textContent="Copy share link";},1800);
      note("Link copied — "+STRATS.length+" strategies, "+url.length.toLocaleString()+" characters. Anyone who opens it gets the whole library.");};
    var fb=function(){
      var ta=document.createElement("textarea");ta.value=url;ta.style.cssText="position:fixed;opacity:0";
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");done();}catch(e){window.prompt("Copy this link:",url);}
      ta.remove();
    };
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(done,fb);else fb();
  }).catch(function(){note("Couldn't build the link. Use Export .json instead.",true);});
}
function doExport(){
  var blob=new Blob([JSON.stringify(STRATS,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="strategies-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  note("Exported "+STRATS.length+" strategies.");
}
function doImport(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var arr;
    try{arr=JSON.parse(r.result);}catch(err){note("That file isn't valid JSON.",true);return;}
    if(!Array.isArray(arr)||!arr.length){note("That file has no strategies in it.",true);return;}
    askMerge(arr,"file");
  };
  r.readAsText(f);
  e.target.value="";
}
function dedupeMerge(base,add){
  var seen={},out=base.slice();
  out.forEach(function(s){seen[(s.name+"|"+(s.source||"")).toLowerCase()]=1;});
  var added=0;
  add.forEach(function(s){
    var k=(s.name+"|"+(s.source||"")).toLowerCase();
    if(seen[k])return;seen[k]=1;out.push(clean(s));added++;
  });
  return {list:out,added:added,skipped:add.length-added};
}
function askMerge(arr,how){
  var b=$("sbanner");
  b.innerHTML='<div class="banner"><p><b>'+arr.length+' strategies</b> from '+(how==="file"?"that file":"a shared link")+
    '. Merge keeps what you already have and skips duplicates. Replace wipes your list first.</p>'+
    '<button class="btn ok" id="m-merge">Merge</button>'+
    '<button class="btn dgr" id="m-repl">Replace</button>'+
    '<button class="btn" id="m-no">Cancel</button></div>';
  $("m-merge").onclick=function(){
    var r=dedupeMerge(STRATS,arr);STRATS=r.list;save(STRATS);pending=null;b.innerHTML="";
    buildChips();render();note("Merged. Added "+r.added+", skipped "+r.skipped+" duplicate"+(r.skipped===1?"":"s")+".");
  };
  $("m-repl").onclick=function(){
    STRATS=arr.map(clean);save(STRATS);pending=null;b.innerHTML="";
    buildChips();render();note("Replaced. You now have "+STRATS.length+" strategies.");
  };
  $("m-no").onclick=function(){pending=null;b.innerHTML="";buildChips();render();};
}
function clean(s){
  return {name:String(s.name||"Untitled").slice(0,120),source:String(s.source||"").slice(0,120),
    sourceUrl:/^https?:\/\//i.test(s.sourceUrl||"")?s.sourceUrl:"",
    market:String(s.market||"").slice(0,30),timeframe:String(s.timeframe||"").slice(0,30),
    session:String(s.session||"").slice(0,60),bias:String(s.bias||""),entry:String(s.entry||""),
    invalidation:String(s.invalidation||""),target:String(s.target||""),riskNote:String(s.riskNote||""),
    tags:Array.isArray(s.tags)?s.tags.slice(0,8).map(function(t){return String(t).slice(0,24);}):[],
    trades:Array.isArray(s.trades)?s.trades.slice(0,400).map(cleanTrade):[],
    evidence:EVRANK[s.evidence]!==undefined?s.evidence:"untested",
    sampleSize:Math.max(0,parseInt(s.sampleSize,10)||0),
    results:String(s.results||""),notes:String(s.notes||""),
    added:/^\d{4}-\d{2}-\d{2}$/.test(s.added||"")?s.added:new Date().toISOString().slice(0,10)};
}

/* ---------- add / edit form ---------- */
var F=[["name","Name","in","Short name you'll recognise"],
       ["source","Creator / source","in","Who it came from, or \u201cown idea\u201d"],
       ["sourceUrl","Link to source","in","https://…"],
       ["market","Market","in","MNQ, ES, BTC, EURUSD…"],
       ["timeframe","Timeframe","in","5m, 15m, daily…"],
       ["session","Session / time window","in","09:30\u201311:00 New York"],
       ["bias","How direction is decided","ta","What has to be true before you look for an entry"],
       ["entry","Entry trigger","ta","The exact steps, in order"],
       ["invalidation","Invalidation (stop logic)","ta","What proves the idea wrong"],
       ["target","Target / exit","ta","Where you take profit and how"],
       ["riskNote","Risk notes","ta","Sizing, conditions to avoid"],
       ["results","Results so far","ta","Win rate, expectancy in R, max drawdown \u2014 or \u201cnone yet\u201d"],
       ["notes","Other notes","ta",""]];
function openForm(s){
  editing=s?s:null;

  h+='</select></div>';
  h+='<div class="f"><label for="f-sampleSize">Sample size (trades or events behind that claim)</label><input id="f-sampleSize" type="number" min="0" step="1" value="'+(v.sampleSize||0)+'"></div>';
  h+='</div><p class="note">Evidence defaults to <b>Untested</b> with a sample of 0. Change it only when you\u2019ve actually run the numbers \u2014 that badge is the whole point of the library.</p>'+
     '<div class="acts"><button class="btn pri" id="f-save">'+(s?"Save changes":"Add strategy")+'</button>'+
     '<button class="btn" id="f-cancel">Cancel</button><span id="f-err" class="note bad"></span></div></div>';
  $("sformwrap").innerHTML=h;
  $("f-cancel").onclick=function(){editing=null;$("sformwrap").innerHTML="";};

    var o={};F.forEach(function(f){o[f[0]]=$("f-"+f[0]).value.trim();});

    save(STRATS);editing=null;$("sformwrap").innerHTML="";buildChips();render();

function wireCalc(){
  var ids=["c-acct","c-risk","c-stop","c-ppt","c-wr","c-rr"];
  function go(){
    var acct=+$("c-acct").value,risk=+$("c-risk").value,stop=+$("c-stop").value,ppt=+$("c-ppt").value;
    var budget=acct*risk/100, perC=stop*ppt, n=perC>0?budget/perC:0, size=Math.floor(n);
    $("c-out1").innerHTML= perC>0
      ? "Risk budget <b>$"+budget.toFixed(2)+"</b> &nbsp;·&nbsp; risk per contract <b>$"+perC.toFixed(2)+"</b> &nbsp;·&nbsp; size = "+
        n.toFixed(2)+" \u2192 <b>"+size+" contract"+(size===1?"":"s")+"</b>"+
        (size===0?" <span class=\"bad\">\u2014 too big for this account, skip the trade</span>":"")+
        "<br>Actual loss if stopped: <b>$"+(size*perC).toFixed(2)+"</b> ("+(acct?(size*perC/acct*100).toFixed(2):"0")+"% of account)"
      : "Enter a stop distance and a dollar value per point.";
    var wr=+$("c-wr").value/100, rr=+$("c-rr").value;
    var ex=wr*rr-(1-wr)*1, be=1/(1+rr)*100;
    $("c-out2").innerHTML="Expectancy <b>"+(ex>=0?"+":"")+ex.toFixed(2)+"R per trade</b> &nbsp;·&nbsp; over 100 trades: <b>"+
      (ex>=0?"+":"")+(ex*100).toFixed(0)+"R</b> = $"+(ex*100*budget).toFixed(0)+" at this risk size<br>"+
      "Breakeven win rate at "+rr+":1 is <b>"+be.toFixed(1)+"%</b>"+
      (ex<0?" <span class=\"bad\">\u2014 negative expectancy, this loses money over time</span>":"");
  }
  ids.forEach(function(i){$(i).addEventListener("input",go);});
  go();
}

/* ---------- trade log & derived stats ---------- */
function cleanTrade(t){
  t=t||{};
  return {d:/^\d{4}-\d{2}-\d{2}$/.test(t.d||"")?t.d:new Date().toISOString().slice(0,10),
          dir:t.dir==="short"?"short":"long",
          r:Math.round((parseFloat(t.r)||0)*100)/100,
          n:String(t.n||"").slice(0,140)};
}
function nOf(s){return (s.trades&&s.trades.length)?s.trades.length:(s.sampleSize||0);}
function wilson(w,n){
  if(!n)return [0,0];
  var z=1.96,p=w/n,dn=1+z*z/n,c=(p+z*z/(2*n))/dn,m=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/dn;
  return [Math.max(0,c-m),Math.min(1,c+m)];
}
function stats(s){
  var t=(s.trades||[]);if(!t.length)return null;
  var tot=0,peak=0,dd=0,eq=[0],gp=0,gl=0,w=0;
  t.forEach(function(x){
    tot+=x.r;eq.push(Math.round(tot*100)/100);
    if(tot>peak)peak=tot;
    if(peak-tot>dd)dd=peak-tot;
    if(x.r>0){gp+=x.r;w++;}else{gl+=-x.r;}
  });
  var n=t.length,l=n-w,aw=w?gp/w:0,al=l?gl/l:0;
  return {n:n,eq:eq,wins:w,losses:l,wr:w/n,ci:wilson(w,n),exp:tot/n,tot:tot,dd:dd,
          pf:gl>0?gp/gl:(gp>0?Infinity:0),aw:aw,al:al,be:(aw+al)>0?al/(aw+al):0};
}
function tradeBlock(s,key,st){
  var h='<p class="reltitle">Trade log \u2014 your own results</p>';
  if(st){
    h+='<div class="out">n=<b>'+st.n+'</b> &nbsp;\u00b7&nbsp; win rate <b>'+(st.wr*100).toFixed(0)+'%</b> '+
       '<span class="ci">(95% CI '+(st.ci[0]*100).toFixed(0)+'\u2013'+(st.ci[1]*100).toFixed(0)+'%)</span>'+
       ' &nbsp;\u00b7&nbsp; expectancy <b>'+(st.exp>=0?"+":"")+st.exp.toFixed(2)+'R</b>'+
       '<br>total <b>'+(st.tot>=0?"+":"")+st.tot.toFixed(1)+'R</b> &nbsp;\u00b7&nbsp; max drawdown <b>'+st.dd.toFixed(1)+'R</b>'+
       ' &nbsp;\u00b7&nbsp; profit factor <b>'+(isFinite(st.pf)?st.pf.toFixed(2):"\u221e")+'</b>'+
       ' &nbsp;\u00b7&nbsp; avg win '+st.aw.toFixed(2)+'R, avg loss '+st.al.toFixed(2)+'R';
    if(st.be>0&&st.ci[0]<=st.be&&st.be<=st.ci[1])
      h+='<br><span class="bad">Breakeven at this win/loss size is '+(st.be*100).toFixed(0)+
         '%, and that sits inside the confidence interval \u2014 '+st.n+' trades still can\u2019t rule out that this is breakeven.</span>';
    else if(st.n<30)
      h+='<br><span class="bad">'+st.n+' trades is a small sample. Treat these numbers as provisional.</span>';
    h+='</div>';
    h+='<figure style="margin-top:10px">'+svgFor({k:"e",base:0,s:[{v:st.eq,c:st.tot>=0?"u":"d",
        t:(st.tot>=0?"+":"")+st.tot.toFixed(1)+"R"}]})+
       '<figcaption>Cumulative R across '+st.n+' logged trades. Dashed line is breakeven.</figcaption></figure>';
    h+='<table class="stable"><thead><tr><th>Date</th><th>Dir</th><th>Result</th><th>Note</th><th><span class="sr-only">Remove</span></th></tr></thead><tbody>';
    s.trades.slice().reverse().forEach(function(t,i){
      var idx=s.trades.length-1-i;
      h+='<tr><td>'+esc(t.d)+'</td><td>'+esc(t.dir)+'</td>'+
         '<td style="color:'+(t.r>=0?"var(--up)":"var(--down)")+'">'+(t.r>=0?"+":"")+t.r+'R</td>'+
         '<td>'+esc(t.n)+'</td><td><button class="btn" data-rmtrade="'+key+':'+idx+'" title="Remove this trade" aria-label="Remove trade">\u00d7</button></td></tr>';
    });
    h+='</tbody></table>';
  }else{
    h+='<p class="note">Nothing logged yet. Log a few trades and the win rate, expectancy, drawdown and equity curve get computed from them \u2014 instead of typed in from memory.</p>';
  }
  if(!pending){
    h+='<div class="logrow">'+
      '<div class="f"><label for="t-d-'+key+'">Date</label><input id="t-d-'+key+'" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
      '<div class="f"><label for="t-dir-'+key+'">Direction</label><select id="t-dir-'+key+'"><option value="long">Long</option><option value="short">Short</option></select></div>'+
      '<div class="f"><label for="t-r-'+key+'">Result in R</label><input id="t-r-'+key+'" type="number" step="0.1" placeholder="e.g. -1 or 2.5"></div>'+
      '<div class="f grow"><label for="t-n-'+key+'">Note</label><input id="t-n-'+key+'" type="text" placeholder="optional"></div>'+
      '<button class="btn ok" data-addtrade="'+key+'">Log trade</button></div>';
  }
  return h;
}

/* ================= QUIZ ================= */
var QKEY="tg.quiz.v1", QMEM=null, QST=null, qmode="mixed", qcat="all", qcur=null, qans=null;
function qload(){try{var r=localStorage.getItem(QKEY);return r?JSON.parse(r):{};}catch(e){return QMEM||{};}}
function qsave(o){QMEM=o;try{localStorage.setItem(QKEY,JSON.stringify(o));}catch(e){}}
function qstats(){if(!QST)QST=qload();return QST;}
function qkey(t){return slug(t);}
function qpool(){
  var p=D.filter(function(x){return x.d&&x.t&&x.t.indexOf("Reality check")<0;});
  if(qcat!=="all")p=p.filter(function(x){return x.c===qcat;});
  if(qmode==="chart")p=p.filter(function(x){return !!x.v;});
  return p;
}
function qweight(x){
  var s=qstats()[qkey(x.t)];
  if(!s)return 3;                       /* unseen: moderately likely */
  var wrongRate=s.w/Math.max(1,s.n);
  return 1+wrongRate*8+(s.n<2?2:0);     /* missed often => comes up often */
}
function qpick(){
  var pool=qpool();
  if(pool.length<4)return null;
  var tot=0,i,ws=pool.map(function(x){var w=qweight(x);tot+=w;return w;});
  var r=Math.random()*tot,acc=0,chosen=pool[0];
  for(i=0;i<pool.length;i++){acc+=ws[i];if(r<=acc){chosen=pool[i];break;}}
  var mode=qmode==="mixed"?(chosen.v&&Math.random()<0.5?"chart":"def"):qmode;
  if(mode==="chart"&&!chosen.v)mode="def";
  /* distractors: prefer same section, they're the confusable ones */
  var same=pool.filter(function(x){return x!==chosen&&x.c===chosen.c;});
  var other=pool.filter(function(x){return x!==chosen&&x.c!==chosen.c;});
  var opts=[chosen];
  function take(arr){
    while(arr.length&&opts.length<4){
      var k=Math.floor(Math.random()*arr.length);
      if(opts.indexOf(arr[k])<0)opts.push(arr[k]);
      arr.splice(k,1);
    }
  }
  take(same.slice());take(other.slice());
  for(i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=opts[i];opts[i]=opts[j];opts[j]=t;}
  return {item:chosen,mode:mode,opts:opts};
}
function quizTools(){
  var t=$("qtools");
  var cats='<option value="all">All sections</option>'+CAT.map(function(c){
    return '<option value="'+c[0]+'"'+(qcat===c[0]?" selected":"")+'>'+c[1]+'</option>';}).join("");
  t.innerHTML='<label class="qlab" for="q-mode">Mode</label>'+
    '<select id="q-mode">'+
      '<option value="mixed"'+(qmode==="mixed"?" selected":"")+'>Mixed</option>'+
      '<option value="chart"'+(qmode==="chart"?" selected":"")+'>Chart \u2192 term</option>'+
      '<option value="def"'+(qmode==="def"?" selected":"")+'>Definition \u2192 term</option>'+
    '</select>'+
    '<label class="qlab" for="q-cat">Section</label><select id="q-cat">'+cats+'</select>'+
    '<span class="sep"></span>'+
    '<button class="btn" id="q-skip">Skip</button>'+
    '<button class="btn" id="q-reset">Reset progress</button>';
  $("q-mode").onchange=function(){qmode=this.value;qcur=null;quizRender();};
  $("q-cat").onchange=function(){qcat=this.value;qcur=null;quizRender();};
  $("q-skip").onclick=function(){qcur=null;qans=null;quizRender();};
  $("q-reset").onclick=function(){
    if(this.dataset.armed){QST={};qsave(QST);qcur=null;quizRender();return;}
    this.dataset.armed="1";this.textContent="Tap again to reset";
    var b=this;setTimeout(function(){b.removeAttribute("data-armed");b.textContent="Reset progress";},3000);
  };
}
function quizRender(){
  quizTools();
  var st=qstats(),ks=Object.keys(st),seen=0,right=0,weak=[];
  ks.forEach(function(k){seen+=st[k].n;right+=st[k].n-st[k].w;
    if(st[k].w>0)weak.push({k:k,w:st[k].w,n:st[k].n});});
  weak.sort(function(a,b){return (b.w/b.n)-(a.w/a.n)||b.w-a.w;});
  $("cnt-quiz").textContent=ks.length?ks.length:"";
  $("qscore").innerHTML= seen
    ? "<b>"+seen+"</b> answered &nbsp;\u00b7&nbsp; <b>"+Math.round(right/seen*100)+"%</b> correct &nbsp;\u00b7&nbsp; "+
      ks.length+" of "+D.length+" terms seen"+
      (weak.length?" &nbsp;\u00b7&nbsp; weakest: "+weak.slice(0,3).map(function(x){
        return x.k.replace(/-/g," ");}).join(", "):"")
    : "Terms you get wrong come back more often. Nothing is timed.";

  if(!qcur)qcur=qpick();
  var body=$("qbody");
  if(!qcur){body.innerHTML='<p class="empty">Not enough terms in that filter to make a question. Pick another section.</p>';return;}
  var it=qcur.item;
  var prompt = qcur.mode==="chart"
    ? '<figure class="qfig">'+svgFor(it.v)+'</figure><p class="qask">Which term does this chart show?</p>'
    : '<p class="qdef">'+esc(it.d)+'</p><p class="qask">Which term is this?</p>';
  var opts=qcur.opts.map(function(o){
    var cls="qopt";
    if(qans){
      if(o===it)cls+=" ok";
      else if(o===qans)cls+=" no";
      else cls+=" dim";
    }
    return '<button class="'+cls+'" data-o="'+esc(o.t)+'"'+(qans?" disabled":"")+'>'+esc(o.t)+
           '<span class="qsec">'+catName(o.c)+'</span></button>';
  }).join("");
  var after="";
  if(qans){
    var ok=qans===it;
    after='<div class="qres '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite \u2014 that\u2019s <b>"+esc(it.t)+"</b>.")+'</div>'+
          '<div class="qexp"><p><b>'+esc(it.t)+'</b> \u2014 '+esc(it.d)+'</p>'+
          (it.e?'<p class="ex"><b>Example</b> \u00b7 '+esc(it.e)+'</p>':'')+
          (qcur.mode!=="chart"&&it.v?'<figure class="qfig">'+svgFor(it.v)+'</figure>':'')+
          '<div class="acts"><button class="btn pri" id="q-next">Next question</button>'+
          '<button class="btn" data-term="term-'+slug(it.t)+'">See the full entry</button></div></div>';
  }
  body.innerHTML='<div class="qcard">'+prompt+'<div class="qopts">'+opts+'</div>'+after+'</div>';
  Array.prototype.forEach.call(body.querySelectorAll("[data-o]"),function(b){
    b.onclick=function(){
      var picked=null;qcur.opts.forEach(function(o){if(o.t===b.dataset.o)picked=o;});
      qans=picked;
      var k=qkey(it.t),s=qstats();
      if(!s[k])s[k]={n:0,w:0};
      s[k].n++;if(picked!==it)s[k].w++;
      qsave(s);quizRender();
    };});
  if($("q-next"))$("q-next").onclick=function(){qcur=null;qans=null;quizRender();};
  Array.prototype.forEach.call(body.querySelectorAll("[data-term]"),function(b){
    b.onclick=function(){window.__goTerm(b.dataset.term);};});
}
function catName(c){for(var i=0;i<CAT.length;i++)if(CAT[i][0]===c)return CAT[i][1];return c;}

/* ================= LIVE CHART ================= */
var LSYM="OANDA:NAS100USD", LTF="15", LBUILT=false, LNETBOUND=false;
/* Every symbol here was opened in a real browser and confirmed to render.
   CME_MINI:MNQ1! and MES1! were the previous defaults and BOTH fail with
   "This symbol is only available on TradingView" — CME futures are not carried
   by the free widget embed. The Nasdaq and S&P entries below are index/CFD
   proxies, not the futures contracts: they track the same underlying but have
   different hours, no contract expiry and no tick value. Flagged as proxy so
   nobody reads a NAS100 chart as an MNQ chart. */
var LSYMS=[["OANDA:NAS100USD","Nasdaq 100  (proxy for MNQ)",1],
           ["PEPPERSTONE:NAS100","Nasdaq 100  alt feed",1],
           ["NASDAQ:QQQ","QQQ  Nasdaq 100 ETF"],
           ["PEPPERSTONE:US500","S&P 500  (proxy for MES)",1],
           ["FOREXCOM:SPXUSD","S&P 500  alt feed",1],
           ["BINANCE:BTCUSDT","BTC/USDT"],["BINANCE:ETHUSDT","ETH/USDT"],
           ["FX:EURUSD","EUR/USD"],["FX:AUDUSD","AUD/USD"],
           ["TVC:GOLD","Gold"],["NASDAQ:NVDA","NVDA"]];
var LTFS=[["1","1m"],["5","5m"],["15","15m"],["60","1h"],["240","4h"],["D","Daily"]];
function liveRender(){
  var t=$("ltools");
  t.innerHTML='<label class="qlab" for="l-sym">Market</label><select id="l-sym">'+
      LSYMS.map(function(s){return '<option value="'+s[0]+'"'+(LSYM===s[0]?" selected":"")+'>'+s[1]+'</option>';}).join("")+'</select>'+
    '<label class="qlab" for="l-tf">Timeframe</label><select id="l-tf">'+
      LTFS.map(function(s){return '<option value="'+s[0]+'"'+(LTF===s[0]?" selected":"")+'>'+s[1]+'</option>';}).join("")+'</select>'+
    '<span class="sep"></span><button class="btn" id="l-reload">Reload</button>';
  $("l-sym").onchange=function(){LSYM=this.value;LBUILT=false;liveRender();};
  $("l-tf").onchange=function(){LTF=this.value;LBUILT=false;liveRender();};
  $("l-reload").onclick=function(){LBUILT=false;liveRender();};
  var isProxy=false;
  LSYMS.forEach(function(s){if(s[0]===LSYM&&s[2])isProxy=true;});
  $("lnote").innerHTML=
    "Live data is embedded from TradingView and needs an internet connection \u2014 the rest of this app works offline, this tab doesn\u2019t. "+
    "Delayed quotes on most symbols. Nothing here places an order."+
    (isProxy?'<br><span class="proxywarn">Proxy feed: this is a spot/CFD index, not the futures contract. '+
      'It tracks the same underlying but has different trading hours, no expiry and no tick value \u2014 '+
      'read levels off it, not contract maths. CME futures aren\u2019t carried by the free embed.</span>':"");

  /* Offline: don't build a frame we already know cannot load. A failed embed
     renders as a blank box, which reads as a bug rather than as no signal. */
  if(navigator.onLine===false){
    LBUILT=false;
    $("lframe").innerHTML='<div class="offline"><p class="offhead">You\u2019re offline</p>'+
      '<p>The live chart streams from TradingView, so it needs a connection. '+
      'Everything else in this app \u2014 all '+D.length+' terms, the charts, the quiz and your strategies \u2014 works without one.</p>'+
      '<p><button class="btn" id="l-retry">Try again</button></p></div>';
    if($("l-retry"))$("l-retry").onclick=function(){LBUILT=false;liveRender();};
  } else if(!LBUILT){
    var theme=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    var src="https://s.tradingview.com/widgetembed/?symbol="+encodeURIComponent(LSYM)+
            "&interval="+encodeURIComponent(LTF)+"&theme="+theme+"&style=1&timezone=Australia/Perth"+
            "&withdateranges=1&hidesidetoolbar=0&allow_symbol_change=1&saveimage=0";
    /* sandbox: allow-scripts + allow-same-origin is the documented footgun only
       when the frame is SAME-origin with us — then it can reach parent.document
       and strip its own sandbox. This frame is cross-origin, so allow-same-origin
       just gives TradingView its own origin (which its widget needs for storage;
       without it the frame renders blank — verified in a browser). Deliberately
       NOT granted: allow-top-navigation, allow-modals, allow-downloads. */
    $("lframe").innerHTML='<iframe title="Live chart" src="'+src+'" loading="lazy" '+
      'sandbox="allow-scripts allow-same-origin allow-popups" referrerpolicy="no-referrer"></iframe>'+
      '<div class="offline framefail" hidden><p class="offhead">The chart didn\u2019t load</p>'+
      '<p>TradingView may be blocked, rate-limited, or your connection dropped. '+
      'The rest of the app is unaffected.</p>'+
      '<p><button class="btn" id="l-retry2">Try again</button></p></div>';
    LBUILT=true;
    /* If the embed hasn't reported a load shortly, surface the fallback. */
    (function(){
      var fr=$("lframe").querySelector("iframe"), fb=$("lframe").querySelector(".framefail"), done=false;
      if(!fr||!fb) return;
      function good(){done=true;if(fb)fb.hidden=true;}
      function bad(){if(done)return;if(fb){fb.hidden=false;}}
      fr.addEventListener("load",good);
      fr.addEventListener("error",bad);
      if(window.setTimeout) setTimeout(bad,8000);
      if($("l-retry2"))$("l-retry2").onclick=function(){LBUILT=false;liveRender();};
    })();
  }
  /* bind connectivity listeners once, not on every render */
  if(!LNETBOUND){
    LNETBOUND=true;
    var renet=function(){LBUILT=false;if(!$("panel-live").hidden)liveRender();};
    window.addEventListener("online",renet);
    window.addEventListener("offline",renet);
  }
  var picks=D.filter(function(x){return x.v&&x.v.k==="c";});
  var pick=picks[Math.floor(Math.random()*picks.length)];
  $("lhint").innerHTML='<div class="spotcard"><div class="spothead"><span class="qask">Spot this on the live chart</span>'+
    '<button class="btn" id="l-another">Another</button></div>'+
    '<div class="spotgrid"><figure class="qfig">'+svgFor(pick.v)+'</figure>'+
    '<div><h3 class="term">'+esc(pick.t)+'</h3><p class="def">'+esc(pick.d)+'</p>'+
    '<div class="acts"><button class="btn" data-term="term-'+slug(pick.t)+'">Full entry</button></div></div></div></div>';
  $("l-another").onclick=liveRender;
  if(!$("lread")){
    var lrhost=document.createElement("div");
    lrhost.id="lread";
    $("lhint").parentNode.appendChild(lrhost);
  }
  /* the live-read module is a later script block, so on a #live deep link
     liveRender() can run before it exists. Call it when it's there, and let
     the module re-render itself once it loads. */
  if(typeof lrRenderInto==="function") lrRenderInto($("lread"),LSYM,LTF);
  else window.__lrPending=function(){lrRenderInto($("lread"),LSYM,LTF);};
  Array.prototype.forEach.call($("lhint").querySelectorAll("[data-term]"),function(b){
    b.onclick=function(){window.__goTerm(b.dataset.term);};});
}

/* ---------- boot ---------- */
$("sq").addEventListener("input",render);
$("sq").addEventListener("keydown",function(e){if(e.key==="Escape"){this.value="";render();}});
$("ssort").addEventListener("change",render);
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault();
    ($("panel-strats").hidden?$("q"):$("sq")).focus();
  }
});
buildTools();buildChips();render();
$("cnt-terms").textContent=document.querySelectorAll("#grid .entry").length;

var hp=parseHash();
if(hp.lib){
  decodeLib(hp.lib).then(function(arr){
    if(!Array.isArray(arr)||!arr.length)throw 0;
    pending=arr.map(clean);
    setTab("strategies",false);
    if(history.replaceState)history.replaceState(null,"","#strategies");
    buildChips();render();askMerge(pending,"link");
  }).catch(function(){
    setTab("strategies",false);
    $("sbanner").innerHTML='<div class="banner"><p>That share link couldn\u2019t be read \u2014 it may have been cut short by the app you sent it through. Ask for the .json file instead.</p></div>';
  });
}else{
  setTab(["strategies","quiz","live"].indexOf(hp.tab)>-1?hp.tab:"terms",false);
  if(hp.q)$("sq").value=decodeURIComponent(hp.q);
  if(hp.ev)filt.ev=decodeURIComponent(hp.ev);
  if(hp.mk)filt.market=decodeURIComponent(hp.mk);
  if(hp.tg)filt.tag=decodeURIComponent(hp.tg);
  if(hp.sort)$("ssort").value=hp.sort;
  if(hp.q||hp.ev||hp.mk||hp.tg||hp.sort){buildChips();render();}
  if(hp.t)setTimeout(function(){window.__goTerm("term-"+hp.t);},60);
}

var f=$("foot");
f.innerHTML=f.innerHTML+
  "<br>Strategies are stored in this browser only. <b>Export .json</b> or <b>Copy share link</b> to move them between devices or send them to someone.";
})();
</script>

  --sh:0 1px 2px rgba(16,18,21,.05),0 8px 24px -14px rgba(16,18,21,.18);

}
@media (prefers-color-scheme:dark){
